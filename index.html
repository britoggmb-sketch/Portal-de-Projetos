DEEP["sp-leader-2"] = {
  ctx: ["A história da segurança de identidade é a história de um problema que se repete: toda vez que a tecnologia multiplica os sistemas e os usuários, o jeito antigo de cuidar dos acessos para de funcionar e surge um jeito novo. Entender essa linha do tempo ajuda a ver por que cada ferramenta existe e para onde o mercado caminha.", "Para quem lidera, o valor da história é prático: ela mostra que ferramentas isoladas resolvem um pedaço do problema, e que o ganho real vem de tratar identidade como uma disciplina contínua, e não como um projeto que termina."],
  teo: [["Da senha por sistema ao diretório central", "Nos anos 1960, os primeiros sistemas de tempo compartilhado, como o CTSS do MIT, já usavam senhas. Durante décadas, cada sistema manteve a sua própria tabela de usuários. O resultado era a proliferação de senhas e contas: a pessoa tinha um login para cada sistema, e a TI, uma lista para cada um.", "Os serviços de diretório responderam a isso com um repositório central de usuários. O protocolo LDAP, padronizado pela IETF a partir dos anos 1990, tornou-se a linguagem comum para consultar esses diretórios. Em muitas empresas, o diretório ainda é a base da autenticação interna."], ["Federação e login único", "Mesmo com diretório, entrar em aplicativos de outras organizações exigia novas contas. A federação resolveu isso permitindo que uma organização confie na autenticação feita por outra. O padrão SAML, publicado pela OASIS a partir de 2002 (versão 2.0 em 2005), permite que um provedor de identidade afirme quem é a pessoa para um aplicativo.", "Para aplicações modernas e APIs, vieram o OAuth 2.0 (RFC 6749, 2012) e o OpenID Connect (2014), que separam a ideia de autorizar um aplicativo a acessar dados da ideia de saber quem é o usuário."], ["Conformidade e o nascimento da governança", "No começo dos anos 2000, leis como a Sarbanes-Oxley, nos Estados Unidos (2002), passaram a exigir controles sobre quem pode alterar dados financeiros. Auditorias começaram a pedir provas de revisão de acessos. Surgiu a necessidade de ferramentas que fossem além de criar contas e ajudassem a decidir e comprovar quem deveria ter acesso.", "No Brasil, a LGPD (Lei nº 13.709/2018) reforçou a obrigação de proteger dados pessoais contra acessos não autorizados, e normas como a ISO/IEC 27001 trazem controles específicos de gestão de identidade e de direitos de acesso."]],
  mec: { t: "Como a evolução apareceu no processo de acesso", p: [["Etapa 1: manual", "A pessoa preenche um formulário, o gestor assina, a TI cria a conta à mão em cada sistema. Funciona com poucos sistemas e pouca rotatividade."], ["Etapa 2: diretório e scripts", "Um diretório central reduz as contas duplicadas e scripts automatizam partes do trabalho, mas continuam frágeis e dependentes de quem os escreveu."], ["Etapa 3: provisionamento", "Ferramentas passam a criar e remover contas em vários sistemas a partir de eventos do RH. A entrada e a saída ficam mais rápidas."], ["Etapa 4: governança contínua", "Além de criar contas, a plataforma passa a pedir revisões periódicas, aplicar regras de conflito e registrar tudo para auditoria."], ["Etapa 5: decisão por risco", "Os dados de comportamento e de contexto passam a influenciar as decisões, por exemplo destacando acessos que fogem do padrão do grupo."]] },
  caso: { t: "Caso (fictício): do formulário em papel ao acesso automático", p: ["Uma seguradora começou com um formulário em papel que circulava por três assinaturas. Um pedido levava em média 12 dias e, em alguns casos, a pessoa já tinha perdido o prazo do projeto para o qual precisava do acesso.", "Primeiro a empresa digitalizou o formulário, mas continuou dependendo de pessoas para criar as contas. Depois ligou o cadastro do RH a uma ferramenta de provisionamento. Só quando passou a revisar os acessos todo semestre, com registro das decisões, a auditoria deixou de apontar falhas recorrentes."], l: "Cada etapa resolveu um problema e revelou o seguinte: automatizar a criação de contas não substitui revisar o que foi concedido." },
  av: [["Acesso sem senha e padrões de autenticação", "Padrões como o FIDO2 e o WebAuthn, do W3C, permitem autenticar com chaves criptográficas no dispositivo, sem senha digitada. Isso reduz o risco de phishing, mas não elimina a necessidade de governar o que a identidade autenticada pode acessar."], ["Identidades de máquina", "Em muitas empresas, as identidades de programas, integrações e automações já superam as de pessoas. Elas raramente passam por revisão e muitas vezes têm acessos amplos. O futuro da área inclui tratá-las com a mesma disciplina de ciclo de vida e revisão."]],
  ref: ["OASIS, SAML 2.0 (2005)", "IETF, RFC 6749, The OAuth 2.0 Authorization Framework (2012)", "OpenID Foundation, OpenID Connect Core 1.0 (2014)", "ISO/IEC 27001:2022, Anexo A, controles de acesso e gestão de identidade", "Sarbanes-Oxley Act (2002) e Lei nº 13.709/2018 (LGPD)"],
  cp: [["Uma empresa precisa provar à auditoria que revisa acessos.", "Isso nasceu com as exigências de conformidade, que impulsionaram a governança", "Isso nasceu com os firewalls", "Isso nasceu com os antivírus", "Leis como a SOX levaram à exigência de controle e prova de acesso."], ["Um aplicativo precisa saber quem é o usuário, e não só acessar dados.", "O OpenID Connect acrescenta identidade ao OAuth", "O OAuth sozinho já entrega a identidade", "O LDAP entrega o token", "O OIDC é a camada de identidade sobre o OAuth."], ["Um sistema usa sempre a mesma automação com acesso amplo.", "É uma identidade de máquina e deve ser revisada como as demais", "Não precisa de revisão por não ser pessoa", "É um tipo de senha", "Máquinas também têm identidade, acesso e risco."]]
};
DEEP["sp-leader-3"] = {
  ctx: ["Estratégia, em identidade, não é um documento bonito: é a resposta honesta a três perguntas. Onde estamos hoje, qual risco queremos reduzir primeiro e o que vamos entregar em cada trimestre. Sem isso, o projeto vira uma lista de integrações sem fim.", "Os princípios que seguem existem há décadas, vêm da literatura clássica de segurança e continuam servindo de régua para qualquer decisão: se uma proposta viola esses princípios, provavelmente cria risco."],
  teo: [["Privilégio mínimo e necessidade de saber", "O princípio do privilégio mínimo, formulado por Saltzer e Schroeder em 1975, diz que cada pessoa ou programa deve ter apenas os acessos necessários para fazer o seu trabalho e só pelo tempo necessário. O conceito de necessidade de saber (need to know) é parente próximo: mesmo quem tem autorização geral só deve ver a informação de que precisa.", "Na prática, o privilégio mínimo reduz o dano de um erro ou de uma conta invadida: quanto menos a conta pode, menos o atacante consegue."], ["Separação de funções", "O princípio da separação de funções (separation of duties, SoD) nasceu na contabilidade: quem cadastra um fornecedor não deve aprovar o pagamento a ele. Clark e Wilson, em 1987, mostraram que esse tipo de controle é central para a integridade de sistemas comerciais, e não só para a confidencialidade.", "Em identidade, isso vira regras que impedem combinações de acessos perigosas. Quando a combinação é inevitável, exige-se um controle compensatório, como uma aprovação adicional."], ["Ciclo de vida e fonte confiável", "Quase todo acesso pertence a um ciclo: a pessoa entra (joiner), muda de função (mover) ou sai (leaver). A maior parte do acúmulo indevido acontece nas mudanças: a pessoa ganha acessos novos, mas ninguém retira os antigos. Por isso, o ciclo de vida é a espinha dorsal de uma estratégia de identidade.", "Para o ciclo funcionar, é preciso uma fonte confiável de quem é cada pessoa e em que fase está. Quase sempre é o RH. Se o dado do RH é ruim, tudo o que vem depois herda o problema."]],
  mec: { t: "Roteiro de uma estratégia em cinco etapas", p: [["Diagnóstico", "Levante os sistemas, as fontes de pessoas, os donos e os problemas conhecidos de auditoria. Meça um ponto de partida."], ["Priorização por risco", "Ordene por impacto: dados financeiros, dados pessoais e poderes administrativos primeiro."], ["Resultados rápidos", "Escolha entregas que mostrem valor em semanas, como automatizar o desligamento nos sistemas mais críticos."], ["Automação em ondas", "Amplie por grupos de sistemas, repetindo o que funcionou. Cada onda reaproveita regras e conectores das anteriores."], ["Governança contínua", "Transforme revisões, métricas e donos em rotina. Estratégia sem rotina volta ao estado inicial."]] },
  caso: { t: "Caso (fictício): o banco regional e as três ondas", p: ["Um banco regional queria integrar os 90 sistemas de uma só vez e previa 18 meses até o primeiro resultado. A nova gerência propôs três ondas. Na primeira, 8 sistemas ligados ao dinheiro dos clientes e ao acesso administrativo, com desligamento automático e revisão trimestral.", "A onda 1 levou quatro meses e eliminou as contas órfãs nesses sistemas. Isso trouxe confiança do comitê, que liberou orçamento para a onda 2, com os sistemas de atendimento, e para a onda 3, com os demais. Ao final, a cobertura foi maior do que o plano original, e o primeiro resultado veio em quatro meses, e não em dezoito."], l: "Entregar valor cedo gera patrocínio e aprendizado para as etapas seguintes." },
  av: [["Como medir o retorno", "Bons indicadores são simples e ligados a risco: tempo médio para conceder e remover acesso, percentual de acessos revisados no prazo, número de contas sem dono e de violações de separação de funções. Compare o antes e o depois, e relacione com horas economizadas pela TI e pelas áreas."], ["Quando o negócio resiste", "Revisar acessos dá trabalho para os gestores, e é comum que eles aprovem tudo sem ler (rubber stamping). Reduzir o volume de itens por revisor, explicar o que está sendo pedido e dar contexto sobre cada acesso melhora muito a qualidade das decisões."]],
  ref: ["Saltzer e Schroeder (1975), The Protection of Information in Computer Systems", "Clark e Wilson (1987), A Comparison of Commercial and Military Computer Security Policies", "NIST Cybersecurity Framework 2.0 (2024), categoria PR.AA, gestão de identidade, autenticação e controle de acesso", "ISO/IEC 27001:2022, Anexo A, controles 5.15 a 5.18"],
  cp: [["Uma pessoa trocou de área e manteve todos os acessos antigos.", "É o acúmulo de acessos, comum nas mudanças de função", "É o comportamento esperado", "É um problema só de senha", "A maior parte do acúmulo indevido ocorre nos movers."], ["Quem cadastra fornecedores também aprova os pagamentos.", "Viola a separação de funções", "Respeita o privilégio mínimo", "Respeita o ciclo de vida", "É a combinação que a SoD busca evitar."], ["O projeto precisa mostrar valor logo.", "Entregar primeiro nos sistemas mais críticos", "Integrar todos os sistemas antes de mostrar qualquer resultado", "Esperar o fim do ano", "Resultados rápidos geram patrocínio e aprendizado."]]
};
DEEP["sp-leader-4"] = {
  ctx: ["Uma plataforma de identidade não é um aplicativo único: é um conjunto de capacidades que trabalham em cadeia. Entender essa cadeia ajuda o líder a avaliar o que a ferramenta resolve, o que ela depende de outras áreas e onde projetos costumam tropeçar.", "O guia de fundação da própria SailPoint (Identity Foundations Milestone) reforça que o começo importa: integrar as fontes principais e garantir os mapeamentos mínimos para identificar as pessoas é o que sustenta tudo o que vem depois."],
  teo: [["Capacidades de uma plataforma de IGA", "Descrevendo de forma geral, uma plataforma de governança e administração de identidades reúne: ciclo de vida (entrada, mudança e saída), pedidos de acesso com aprovação, certificação periódica de acessos, políticas e regras de conflito, conectores com os sistemas e análises sobre os dados de acesso. Cada capacidade responde a uma pergunta diferente: como concedo, como confiro, como impeço, como conecto, como enxergo.", "Nenhuma capacidade funciona bem isolada: a certificação depende de dados corretos de gestor, o pedido depende de acessos bem descritos, e o ciclo de vida depende de uma fonte de RH confiável."], ["Fonte autoritativa e correlação", "A base de tudo é saber quem é cada pessoa. A fonte autoritativa, em geral o RH, é quem define a existência de uma identidade. As contas que existem nos sistemas são então associadas a essa identidade, um passo chamado correlação. Contas que não encontram uma identidade ficam sem dono e viram risco.", "Em termos de dados, é a resolução de identidade: unir registros de origens diferentes na mesma pessoa. Se os identificadores (como a matrícula ou o e-mail) não existirem ou forem inconsistentes, a correlação falha."], ["Plataforma em nuvem ou instalada na empresa", "A SailPoint oferece o Identity Security Cloud (ISC), entregue como serviço, e o IdentityIQ, instalado e administrado pela própria empresa. A escolha envolve quem opera a infraestrutura, quem aplica as atualizações e como cada organização quer tratar seus dados. As capacidades são parecidas, mas a responsabilidade operacional muda."]],
  mec: { t: "Como uma plataforma de IGA funciona por dentro", p: [["Coletar", "A plataforma lê contas e direitos de acesso de cada sistema por conectores, em um processo chamado agregação."], ["Correlacionar", "Cada conta é associada à identidade da pessoa, a partir da fonte autoritativa."], ["Modelar", "Direitos de acesso são agrupados em pacotes e roles, e regras de conflito são definidas."], ["Decidir", "Pedidos são aprovados, e revisões periódicas confirmam ou revogam acessos."], ["Aplicar", "As decisões viram ações nos sistemas, por provisionamento, e tudo é registrado para auditoria."]] },
  caso: { t: "Caso (fictício): os primeiros 90 dias", p: ["Uma indústria contratou uma plataforma de identidade e, nos primeiros 30 dias, fez só duas coisas: ligou o cadastro de RH como fonte autoritativa e conectou o diretório principal. Foi frustrante para quem esperava ver painéis prontos.", "Mas, com os dados de pessoas e contas já correlacionados, nos 60 dias seguintes a empresa ativou o desligamento automático e a primeira revisão de acessos dos sistemas críticos. Quando a auditoria chegou, o resultado foi comprovado com relatórios gerados pela própria plataforma."], l: "Dados de pessoas e contas confiáveis vêm antes das funções avançadas." },
  av: [["Escolhendo o escopo do projeto", "Defina o que está dentro e o que está fora em termos de sistemas, tipos de identidade (funcionários, terceiros, máquinas) e funções (ciclo de vida, pedidos, certificação). Escopo grande demais atrasa, e pequeno demais não resolve o risco."], ["Fatores críticos de sucesso", "Projetos de identidade falham menos por tecnologia e mais por patrocínio fraco, dados de RH ruins e falta de donos de aplicação. O líder atua exatamente nesses três pontos."]],
  ref: ["SailPoint, Identity Foundations Milestone (SailPoint Community)", "SailPoint, Identity Security Leader: guia de preparação da credencial", "NIST SP 800-63, Digital Identity Guidelines, conceitos de identidade e resolução"],
  cp: [["As contas de um sistema chegaram à plataforma, mas várias ficaram sem pessoa associada.", "O passo que falhou foi a correlação", "O passo que falhou foi a certificação", "O passo que falhou foi o backup", "Contas sem identidade indicam falha na correlação."], ["Uma empresa quer que a própria equipe opere a infraestrutura e as atualizações.", "O IdentityIQ, instalado na empresa", "O ISC, entregue como serviço", "Nenhum dos dois", "No IdentityIQ a empresa administra a plataforma."], ["O projeto vai começar.", "Ligar a fonte de RH e as fontes principais", "Ativar painéis avançados primeiro", "Criar muitas roles", "Os dados confiáveis vêm antes das funções avançadas."]]
};
DEEP["sp-prof-1"] = {
  ctx: ["Este módulo é o alicerce de tudo no Identity Security Cloud: como o sistema enxerga as pessoas, as contas e os acessos, e como esses dados chegam até ele. Quase todo problema que aparece nos módulos seguintes (uma role que não atribui, uma certificação com itens estranhos, um acesso que não foi retirado) começa aqui, em um dado mal carregado ou mal associado.", "Se você entender bem a diferença entre fonte, conta, identidade e acesso, o resto da trilha fica muito mais simples."],
  teo: [["O modelo de dados do IGA: identidade, conta e direito", "Um modelo simples descreve o que o ISC guarda: a identidade (a pessoa), as contas (uma pessoa pode ter várias, uma em cada sistema) e os direitos de acesso (entitlements), que dizem o que cada conta pode fazer. A relação é de um para muitos: uma identidade tem várias contas, e uma conta tem vários direitos.", "Esse desenho explica por que o ISC precisa correlacionar: o sistema de destino só conhece contas, e quem quer governar acessos precisa falar de pessoas."], ["Leitura e escrita: agregação e provisionamento", "As duas direções do fluxo são distintas. Na leitura (agregação), o ISC traz os dados das fontes para si. Na escrita (provisionamento), o ISC envia mudanças para as fontes. Nem toda fonte permite as duas: uma fonte configurada por arquivo, por exemplo, só lê.", "Essa distinção evita um erro comum de projeto: prometer ao negócio que o acesso será removido automaticamente em um sistema que só permite leitura."], ["Fonte autoritativa e resolução de identidade", "A fonte autoritativa diz quem existe e quais são os atributos oficiais (nome, cargo, gestor). O identity profile transforma os atributos dessa fonte em atributos de identidade. A correlação então associa cada conta de cada sistema a uma identidade, por meio de um atributo em comum, como matrícula ou e-mail.", "Na teoria de dados, isso é resolução de identidade (identity resolution). A qualidade do identificador decide a qualidade de tudo: se dois sistemas usam formatos diferentes de e-mail, a correlação precisa de tratamento."]],
  mec: { t: "Como uma fonte entra em funcionamento", p: [["Conectar", "Crie a source e escolha o tipo de conexão: direta, por meio de um cluster de VAs, ou por arquivo quando não há conector. A conexão direta permite atualizações em tempo real, segundo a SailPoint."], ["Definir o schema", "Escolha quais atributos de conta e de direito a source vai compartilhar. Traga só o necessário."], ["Agregar", "Execute a agregação para trazer contas e entitlements. Agende as próximas cargas para manter os dados atualizados."], ["Correlacionar", "Configure como cada conta encontra a sua identidade. Revise as contas que ficaram sem dono."], ["Mapear e provisionar", "Com o identity profile, mapeie os atributos da fonte autoritativa. Defina, nas sources que permitem escrita, como o provisionamento deve ocorrer."]] },
  caso: { t: "Caso (fictício): RH e diretório", p: ["Uma empresa ligou primeiro o sistema de RH como fonte autoritativa e depois o diretório de usuários. A agregação do diretório trouxe 4.100 contas, mas só 3.800 foram correlacionadas. As 300 restantes estavam sem dono.", "A equipe investigou e viu que 220 contas eram de terceiros, que não existiam no RH, e 80 tinham o e-mail digitado de outro jeito. Para as primeiras, criou uma segunda fonte de terceiros. Para as outras, ajustou a regra de correlação. A lição foi que o número de contas sem dono é um termômetro direto da qualidade dos dados."], l: "Contas não correlacionadas quase sempre apontam para dados ou para uma fonte que falta." },
  av: [["Agregação completa e delta", "A agregação completa lê tudo de novo, o que é caro em sistemas grandes. A delta lê apenas o que mudou desde a última carga, quando a fonte suporta. Em geral usa-se a completa de tempos em tempos e a delta no dia a dia."], ["Defasagem entre o sistema real e o ISC", "O ISC mostra o que a última agregação trouxe. Se alguém muda um acesso direto no sistema de destino, o ISC só saberá na próxima carga. Por isso a frequência das agregações é uma decisão de risco, e não só de desempenho."]],
  ref: ["SailPoint, Identity Security Professional: guia de preparação, domínio 1", "SailPoint, documentação de sources (Configuring sources)", "Conceito de resolução de identidade (identity resolution) em gestão de dados"],
  cp: [["O ISC mostra uma conta, mas não diz de qual pessoa ela é.", "A conta não foi correlacionada a uma identidade", "A conta não foi agregada", "A conta foi provisionada", "Falta a correlação, que liga conta e identidade."], ["Uma fonte só permite leitura por arquivo.", "O provisionamento não será possível nela", "A agregação não funcionará", "A correlação não funcionará", "Fontes por arquivo servem para ler e agregar."], ["Alguém alterou um acesso direto no sistema de destino.", "O ISC só saberá na próxima agregação", "O ISC sabe na hora, sempre", "O ISC nunca saberá", "O ISC mostra o que a última carga trouxe."]]
};
DEEP["sp-prof-2"] = {
  ctx: ["A pesquisa é a ferramenta mais usada por quem administra o ISC. Ela responde a perguntas do dia a dia (quem tem esse acesso? quantas contas estão desativadas? quais identidades mudaram?) e alimenta relatórios, certificações e políticas. Quem domina a pesquisa resolve em minutos o que, de outro jeito, levaria horas de planilha.", "Este módulo trata a pesquisa como uma habilidade: saber o que perguntar, como refinar e como confiar no resultado."],
  teo: [["Como funciona uma busca em um índice", "Sistemas de pesquisa não percorrem os dados um por um: eles mantêm um índice, uma estrutura que permite achar rapidamente onde cada valor aparece, de forma parecida com o índice remissivo de um livro. Por isso consultas grandes respondem em segundos.", "Consequência importante: a pesquisa enxerga o que já foi carregado e indexado. Se um dado mudou no sistema de origem mas ainda não foi agregado, a pesquisa ainda não o verá."], ["Abrangência e precisão", "Em recuperação de informação, dois conceitos se opõem: abrangência (recall), que é trazer tudo o que interessa, e precisão (precision), que é trazer só o que interessa. Uma pesquisa de uma palavra solta tende a ter alta abrangência e baixa precisão. Uma pesquisa com vários filtros tem o contrário.", "A boa prática é começar ampla, olhar os resultados e ir fechando com filtros até ficar com o conjunto certo."], ["Lógica booleana", "Combinar condições com E, OU e NÃO é a base de qualquer consulta estruturada. E reduz o resultado (as duas condições precisam valer), OU amplia (basta uma) e NÃO exclui. Entender isso evita o erro clássico de montar uma consulta que parece certa, mas devolve um conjunto diferente do esperado.", "Dica: quando misturar E e OU, pense no agrupamento. 'Vendas E (ativo OU afastado)' não é o mesmo que '(Vendas E ativo) OU afastado'."]],
  mec: { t: "Como construir uma boa pesquisa", p: [["Defina a pergunta", "Escreva em uma frase o que quer saber. 'Quais pessoas do departamento de Vendas estão ativas?' já indica os dois filtros."], ["Comece ampla", "Digite um termo e veja o que aparece. Isso ajuda a descobrir os nomes de campos e valores que existem."], ["Feche com filtros", "Acrescente campo e valor, combinados por E, OU e NÃO, até o resultado bater com a pergunta."], ["Verifique", "Confira alguns resultados à mão. Cheque se há itens que não deveriam estar e se faltam itens esperados."], ["Salve ou transforme", "Se vai usar de novo, salve a pesquisa. Se precisa que chegue por rotina, ela pode virar um relatório agendado."]] },
  caso: { t: "Caso (fictício): a lista das contas desativadas", p: ["Uma analista precisava listar todas as pessoas desligadas que ainda tinham contas ativas em um sistema crítico. A primeira pesquisa, só com o termo 'desligado', trouxe 1.900 resultados, incluindo pessoas que nunca tiveram conta no sistema.", "Ela acrescentou o filtro do sistema e a condição de conta ativa, e o resultado caiu para 14. Conferindo à mão, notou que duas pessoas estavam em um estado de ciclo de vida parecido, mas diferente, e ajustou a consulta. Salvou a pesquisa e a transformou em relatório semanal."], l: "Uma pesquisa boa nasce de uma pergunta clara, é refinada em etapas e sempre conferida." },
  av: [["Onde a pesquisa é usada", "Além da tela de pesquisa, o mesmo mecanismo alimenta relatórios, campanhas de certificação baseadas em pesquisa e políticas gerais, em que uma pesquisa define as condições a serem sinalizadas. Aprender bem a consulta rende em várias áreas do produto."], ["Pesquisas sugeridas e salvas", "O ISC oferece pesquisas sugeridas e preenchimento automático, que ajudam a descobrir campos e valores válidos. Em equipe, nomear as pesquisas salvas de forma clara evita duplicações e dúvidas."]],
  ref: ["SailPoint, Identity Security Professional: guia de preparação, domínio 2", "SailPoint, documentação de pesquisa no Identity Security Cloud", "Conceitos de recuperação de informação: abrangência (recall) e precisão (precision)"],
  cp: [["Uma pesquisa de uma palavra devolve milhares de resultados.", "Ela tem alta abrangência e baixa precisão", "Ela tem alta precisão", "Ela está errada", "Uma palavra solta tende a trazer demais."], ["Você quer 'Vendas, ativas ou afastadas'.", "Vendas E (ativa OU afastada)", "Vendas OU ativa E afastada", "Vendas NÃO ativa", "O agrupamento define o resultado."], ["Uma pessoa mudou no sistema de origem, mas a pesquisa ainda mostra o dado antigo.", "A agregação ainda não trouxe a mudança", "A pesquisa quebrou", "A pessoa foi excluída", "A pesquisa vê o que já foi carregado."]]
};
DEEP["sp-prof-3"] = {
  ctx: ["Modelar acesso é transformar uma montanha de permissões soltas em um conjunto pequeno de pacotes que fazem sentido para o negócio. Uma boa modelagem torna pedidos mais simples, certificações mais rápidas e auditorias menos dolorosas. Uma modelagem ruim cria a proliferação de roles, que consome mais tempo do que resolve.", "Aqui, o mais importante não é decorar telas, e sim entender a lógica por trás das roles, que vem de um modelo teórico bem conhecido."],
  teo: [["RBAC: controle de acesso baseado em papéis", "O modelo de controle de acesso baseado em papéis (RBAC, role-based access control) foi formalizado por Ferraiolo e Kuhn em 1992 e padronizado pelo ANSI/INCITS 359-2004. A ideia central é indireta: em vez de dar permissões diretamente às pessoas, você associa permissões a papéis (roles) e associa pessoas a esses papéis.", "Isso reduz o trabalho e o erro: ao mudar de função, a pessoa troca de papel, em vez de ter dezenas de permissões ajustadas uma a uma."], ["Engenharia de roles: de cima para baixo e de baixo para cima", "Há duas formas de construir um modelo de roles. De cima para baixo (top-down), você parte do negócio: quais funções existem e do que cada uma precisa. De baixo para cima (bottom-up), também chamada mineração de roles, você parte dos acessos que as pessoas realmente têm e procura padrões.", "A abordagem de baixo para cima é rápida, mas pode consagrar acessos indevidos que já existiam. A de cima para baixo é mais limpa, mas demanda tempo do negócio. Na prática, combinam-se as duas, e o ISC apoia isso ao sugerir roles a partir de grupos de pares."], ["Explosão de roles", "Quando o modelo cresce sem cuidado, surgem roles quase iguais, com nomes confusos e sem dono. É a explosão (ou proliferação) de roles, que anula o ganho do RBAC: revisar milhares de roles é tão difícil quanto revisar milhares de acessos.", "Para evitar, mantenha poucas roles bem definidas, com dono, descrição e revisão periódica, e prefira critérios claros de atribuição a exceções individuais."]],
  mec: { t: "Como se chega a uma role útil", p: [["Reunir os dados", "Garanta que os atributos das identidades (departamento, cargo, localidade) estejam preenchidos, porque a análise depende deles."], ["Encontrar padrões", "Use a análise de grupos de pares e os role insights para ver quais pessoas têm acessos parecidos."], ["Validar com o dono do negócio", "Mostre ao responsável da função o que a análise sugeriu e confirme o que deve estar na role."], ["Criar a role", "Reúna os access profiles na role, defina a forma de atribuição (automática por critérios ou manual) e descreva em linguagem clara."], ["Manter", "Revise as roles com os insights, ajuste o que mudou e remova as que perderam sentido."]] },
  caso: { t: "Caso (fictício): a role do analista financeiro", p: ["A análise do ISC mostrou 47 pessoas de Finanças com os mesmos 12 acessos. A equipe levou o resultado ao gerente da área, que reconheceu 10 como essenciais e 2 como herança de projetos antigos.", "Em vez de criar a role com os 12, a equipe criou com os 10 e abriu a revisão dos 2 restantes. A role foi atribuída por critérios (departamento e cargo), e quem mudava de área perdia a role sozinho. Na certificação seguinte, o gerente revisou uma role em vez de 47 conjuntos de acessos."], l: "A mineração mostra o que existe; o dono do negócio decide o que deve existir." },
  av: [["Roles comuns e especializadas", "Roles comuns atendem muita gente (por exemplo, todos os analistas de uma área). Roles especializadas atendem casos específicos, em geral menores. Misturar os dois tipos em uma única role costuma gerar acessos desnecessários para muita gente."], ["Role com escopo automático", "Uma role de atribuição automática aplica critérios sobre atributos das identidades. Isso reduz pedidos manuais, mas torna a qualidade dos dados ainda mais importante: um atributo errado atribui a role à pessoa errada."]],
  ref: ["Ferraiolo e Kuhn (1992), Role-Based Access Controls", "ANSI/INCITS 359-2004, Role Based Access Control", "SailPoint, Identity Security Professional: guia de preparação, domínio 3"],
  cp: [["Uma pessoa mudou de função e ganhou todos os acessos novos, mas os antigos ficaram.", "O RBAC reduz isso, pois a pessoa troca de papel", "O RBAC piora isso", "O RBAC não trata de mudanças", "No RBAC, as permissões vêm dos papéis."], ["A equipe parte dos acessos que as pessoas já têm para sugerir roles.", "Abordagem de baixo para cima (mineração de roles)", "Abordagem de cima para baixo", "Abordagem aleatória", "Mineração parte dos acessos reais."], ["Há 600 roles parecidas e sem dono.", "Explosão de roles", "Ciclo de vida", "Correlação", "É o problema que o RBAC mal conduzido pode criar."]]
};
DEEP["sp-prof-4"] = {
  ctx: ["Conformidade, em identidade, se resume a duas perguntas que um auditor sempre faz: quem tem acesso a quê e quem aprovou isso. As certificações respondem à primeira de forma periódica, e as políticas, em especial as de separação de funções, ajudam a evitar que acessos perigosos sequer sejam concedidos.", "O desafio é fazer isso sem sobrecarregar os revisores, porque uma revisão feita no automático não protege ninguém."],
  teo: [["Recertificação de acessos como controle", "A recertificação (ou certificação) periódica de acessos é um controle exigido ou recomendado por normas e leis de controle interno, como a Sarbanes-Oxley (seção 404, controles sobre relatórios financeiros) e a ISO/IEC 27001 (controle sobre direitos de acesso). O raciocínio é simples: permissões concedidas no passado podem não fazer sentido hoje, e alguém responsável precisa confirmar.", "Por isso o resultado de uma campanha não é só a decisão de cada item: é também a evidência registrada de quem decidiu e quando, que a auditoria vai pedir."], ["Controles preventivos e detectivos", "Controles preventivos impedem o problema antes de acontecer, como uma regra que bloqueia um pedido de acesso conflitante. Controles detectivos encontram o problema depois, como uma política que varre as identidades e sinaliza violações, ou uma certificação que revela acessos indevidos.", "Uma estratégia equilibrada usa os dois: prevenir o que é previsível e detectar o que escapa."], ["Separação de funções e combinações tóxicas", "A SoD parte de uma matriz de conflitos: pares de acessos que não deveriam coexistir na mesma pessoa, como criar um pagamento e aprová-lo. No ISC, uma política SoD usa duas listas de acessos conflitantes, e quem tem acesso a uma não deve ter ao outro.", "Quando o conflito é inevitável, por exemplo em equipes pequenas, usa-se um controle compensatório, como uma aprovação adicional, e a exceção é registrada com justificativa."]],
  mec: { t: "Como conduzir uma campanha de certificação", p: [["Escolher o tipo", "Defina quem precisa ser revisado e o que será revisado: identidades específicas, ou itens de acesso como roles e entitlements."], ["Delimitar o escopo", "Reduza o volume por revisor para algo viável. Muitos itens levam à aprovação automática."], ["Configurar e pré-visualizar", "Defina revisores, prazos e lembretes e confira a pré-visualização antes de lançar."], ["Acompanhar", "Veja o andamento nas páginas de administração e nos relatórios e cobre quem está atrasado."], ["Concluir e remediar", "Cada revisor faz o Sign Off. Os acessos revogados vão para a remediação, em que são removidos."]] },
  caso: { t: "Caso (fictício): a campanha que ninguém lia", p: ["Em uma empresa, os gestores recebiam, a cada semestre, uma campanha com 400 itens cada. O índice de aprovação era de 99%, e a auditoria questionou se alguém realmente analisava.", "A equipe passou a usar campanhas por pesquisa focadas em acessos de maior risco, com cerca de 40 itens por revisor, e acrescentou contexto sobre cada acesso. A taxa de revogação subiu para 11%, um sinal de que as pessoas estavam, de fato, decidindo."], l: "Menos itens e mais contexto melhoram a qualidade da revisão." },
  av: [["Campanhas por pesquisa: identidades e itens de acesso", "Em uma campanha baseada em pesquisa, é possível revisar identidades, em que o revisor vê todos os acessos de cada pessoa, ou itens de acesso, em que o revisor vê quem tem uma role, um access profile ou um entitlement. A primeira é boa para um perfil de pessoa; a segunda, para um acesso sensível."], ["Políticas gerais", "Uma política geral nasce de uma pesquisa e sinaliza situações inaceitáveis nos dados, como contas ativas de pessoas desligadas. Complementa a SoD, que trata de combinações de acessos."]],
  ref: ["Sarbanes-Oxley Act (2002), seção 404, controles internos", "ISO/IEC 27001:2022, Anexo A, controle 5.18, direitos de acesso", "SailPoint, documentação de campanhas de certificação e de políticas de Separation of Duties"],
  cp: [["Um sistema bloqueia o pedido de acesso conflitante antes de ser concedido.", "É um controle preventivo", "É um controle detectivo", "É um controle compensatório", "Impedir antes é prevenção."], ["Uma varredura periódica sinaliza acessos indevidos já existentes.", "É um controle detectivo", "É um controle preventivo", "Não é um controle", "Detectar depois é controle detectivo."], ["Os revisores aprovam 99% dos itens sem ler.", "O volume por revisor provavelmente é grande demais", "A campanha está perfeita", "Falta mais itens", "Muitos itens levam à aprovação automática."]]
};
DEEP["sp-prof-5"] = {
  ctx: ["Depois que o ISC reúne pessoas, contas e acessos em um só lugar, surge uma oportunidade: usar esses dados para enxergar padrões que nenhuma pessoa perceberia olhando uma lista. É aqui que entram os insights, a análise de grupos de pares e a detecção de acessos fora do padrão.", "A tecnologia ajuda, mas não decide sozinha: o valor está em usar a informação para agir mais cedo."],
  teo: [["Grupos de pares", "Um grupo de pares é um conjunto de pessoas parecidas entre si, por função, área ou local. A premissa é razoável: pessoas com funções semelhantes devem ter acessos semelhantes. Comparar cada pessoa com seu grupo é uma forma barata e eficaz de achar exceções.", "Essa comparação depende da qualidade dos atributos: se o cargo ou o departamento estão errados, os grupos ficam errados."], ["Detecção de anomalias e pontuação de risco", "Um outlier é um ponto que se afasta do padrão do conjunto. Em identidade, é uma pessoa com acessos que ninguém do grupo tem. A pontuação ajuda a ordenar os casos por distância ou risco, para a equipe tratar primeiro os mais relevantes.", "Importante: outlier não significa culpa. Pode ser um acesso legítimo e raro. O papel da pontuação é apontar para onde olhar, e a decisão continua sendo humana."], ["Qualidade de dados", "Existe um princípio conhecido em dados: lixo entra, lixo sai (garbage in, garbage out). Análises sofisticadas sobre dados incompletos produzem conclusões erradas com aparência de precisão.", "Por isso, antes de confiar em uma análise de acesso, verifique o preenchimento dos atributos, a correlação das contas e a atualização das fontes."]],
  mec: { t: "Como transformar dados em ação", p: [["Preparar os dados", "Revise atributos, correlações e agregações. É o passo menos vistoso e o mais importante."], ["Observar os padrões", "Use os insights e as análises de grupos de pares para ver a visão geral dos acessos."], ["Priorizar os outliers", "Ordene pela pontuação e comece pelos mais arriscados."], ["Investigar", "Veja o histórico de acesso de cada caso, para saber como e quando o acesso foi parar ali."], ["Agir e acompanhar", "Revogue, justifique ou abra uma certificação. Acompanhe os indicadores em painéis do AIC."]] },
  caso: { t: "Caso (fictício): o acesso de administrador no suporte", p: ["Ao olhar o painel de outliers, uma analista viu um colega de suporte com acessos de administrador que nenhum dos outros 30 colegas tinha. A pontuação era alta, e o caso subiu na lista.", "O histórico mostrou que o acesso tinha sido concedido para um projeto, dois anos antes, e nunca retirado. A analista confirmou com o gestor, revogou o acesso e criou um painel para acompanhar os acessos privilegiados fora do padrão."], l: "Outliers mostram onde olhar; o histórico explica como o acesso surgiu." },
  av: [["Access History", "O histórico de acesso mostra como o acesso de uma pessoa mudou ao longo do tempo. É útil para entender a origem de um acesso e para responder à auditoria sobre quando ele foi concedido."], ["Painéis no Access Intelligence Center", "O AIC permite criar planilhas e painéis com os dados do ISC. Bons painéis têm poucos indicadores, ligados a decisões, como contas sem dono, acessos privilegiados fora do padrão e revisões em atraso."]],
  ref: ["SailPoint, Identity Security Professional: guia de preparação, domínio 5", "Conceito de detecção de anomalias em análise de dados", "Princípio garbage in, garbage out em qualidade de dados"],
  cp: [["Duas pessoas com a mesma função têm acessos muito diferentes.", "A comparação com o grupo de pares destaca a diferença", "A diferença é sempre erro", "Não dá para comparar", "Grupos de pares servem para comparar."], ["Um outlier foi detectado.", "Significa que merece investigação, não que há culpa", "Significa culpa comprovada", "Significa que o acesso é ilegal", "A pontuação indica onde olhar."], ["As análises estão estranhas porque faltam atributos nas identidades.", "A qualidade dos dados precisa melhorar primeiro", "A ferramenta está com defeito", "Falta mais dashboards", "Lixo entra, lixo sai."]]
};
DEEP["sp-prof-6"] = {
  ctx: ["Em identidade, quase tudo depende de integrações entre sistemas. Por isso, quando algo falha, a causa pode estar em muitos lugares: no dado, na regra, na conexão, na credencial, na rede. Quem resolve problemas bem é quem segue um método, e não quem tem mais intuição.", "Este módulo apresenta um método simples de diagnóstico e as causas mais comuns de falha em integrações."],
  teo: [["O método científico aplicado ao suporte", "Resolver um problema técnico é aplicar, de forma enxuta, o método científico: observar o sintoma, formular hipóteses, testar uma hipótese por vez e registrar o resultado. Mudar várias coisas ao mesmo tempo impede saber o que resolveu.", "Esse cuidado também ajuda quem vier depois: um registro claro economiza horas de trabalho repetido."], ["Anatomia de uma falha de integração", "Uma chamada entre sistemas passa por camadas: a rede chega até o destino, a credencial é aceita, a permissão permite a operação e o dado tem o formato esperado. A falha pode ocorrer em qualquer uma. Ir camada a camada, da mais simples à mais complexa, costuma encontrar a causa mais depressa.", "Padrões comuns: credenciais vencidas ou alteradas, regras de rede bloqueando a comunicação, permissões insuficientes da conta de serviço e mudanças no sistema de destino."], ["Incidente e problema", "Na gestão de serviços de TI, distingue-se incidente (algo parou e precisa voltar a funcionar) de problema (a causa raiz que gera incidentes repetidos). Resolver o incidente é apagar o fogo; resolver o problema é evitar que ele volte.", "Ao escalar, deixe claro qual dos dois você está tratando e que evidências já levantou."]],
  mec: { t: "Um roteiro de diagnóstico", p: [["Descrever o sintoma", "O que acontece, com quem, em qual sistema e desde quando. Veja se afeta uma pessoa, um grupo ou toda uma source."], ["Levantar hipóteses", "Liste causas possíveis, das mais simples às mais raras."], ["Verificar logs e auditoria", "Consulte logs, trilhas de auditoria e mensagens de erro para ver o que o sistema tentou fazer."], ["Testar uma hipótese por vez", "Mude uma coisa, observe o efeito e registre."], ["Corrigir ou escalar", "Se resolveu, documente a causa. Se não, escale com sintoma, testes feitos e evidências."]] },
  caso: { t: "Caso (fictício): a source que parou", p: ["Em uma segunda-feira, as contas de um sistema de RH pararam de atualizar. A primeira reação foi suspeitar do ISC. A analista, porém, notou que outras sources do mesmo cluster funcionavam, o que afastava a hipótese de falha geral.", "Olhando os registros da source, viu um erro de autenticação. A conta de serviço usada na conexão tinha a senha expirada, por uma política de rotação. Atualizada a credencial, as agregações voltaram. Ela registrou a causa e pediu um alerta para a data de vencimento da próxima rotação."], l: "O escopo da falha aponta a camada provável, e o registro da causa evita repetição." },
  av: [["Logs em níveis de detalhe", "Níveis mais altos de log trazem mais informação e pesam mais. Ative o nível detalhado só pelo tempo necessário e desative depois."], ["APIs e monitoramento para diagnóstico", "As APIs do ISC e as ferramentas de monitoramento permitem consultar estados e eventos de forma programática, o que ajuda a confirmar hipóteses e a montar alertas."]],
  ref: ["SailPoint, Identity Security Professional: guia de preparação, domínio 6", "Conceitos de gestão de incidentes e de problemas em gestão de serviços de TI"],
  cp: [["Cinco sources do mesmo cluster falham ao mesmo tempo.", "A causa provável é comum a todas, como VA ou rede", "Cada source tem um erro diferente", "É problema de role", "Falhas simultâneas apontam para causa comum."], ["Você alterou três configurações ao mesmo tempo e o problema sumiu.", "Não dá para saber qual mudança resolveu", "Sabe-se a causa", "O problema não existia", "Mudanças em bloco escondem a causa."], ["O mesmo erro volta toda semana.", "É um problema, e é preciso tratar a causa raiz", "É um incidente isolado", "É um falso alarme", "Incidentes repetidos indicam um problema."]]
};

function amplia(id, o) {
  const d = DEEP[id]; if (!d) return;
  if (o.teo) d.teo.push(...o.teo); if (o.av) d.av.push(...o.av); if (o.mitos) d.mitos = o.mitos;
  d.ref = o.ref.map(r => Array.isArray(r) ? { ...REFS[r[0]], n: r[1] } : { ...REFS[r] });
}
amplia("sp-leader-1", {
  teo: [["Os sete princípios do NIST para a confiança zero", "O NIST define a confiança zero (zero trust) na seção 2.1 da publicação SP 800-207 por meio de sete princípios. O documento afirma que eles são metas ideais e que nem todos precisam estar implementados em sua forma pura em cada estratégia. Isso já desfaz a ideia de que confiança zero seja um produto: é um conjunto de orientações para o desenho de sistemas.", "Os quatro primeiros tratam de recursos e de acesso. Primeiro, toda fonte de dados e todo serviço de computação é um recurso a proteger. Segundo, toda comunicação é protegida, independentemente de onde está na rede: estar dentro do prédio não torna um pedido confiável. Terceiro, o acesso é concedido por sessão, com o mínimo de privilégio, e a autorização para um recurso não vale automaticamente para outro. Quarto, o acesso é decidido por uma política dinâmica, que considera o estado observável da identidade, do aplicativo e do dispositivo, e pode incluir comportamento e ambiente.", "Os três últimos tratam de monitoramento e melhoria contínua. Quinto, a organização mede a integridade e a postura de segurança de todos os seus ativos, e nenhum ativo é confiável por natureza. Sexto, autenticação e autorização são dinâmicas e rigorosamente aplicadas antes do acesso, em um ciclo constante de conceder, avaliar ameaças, adaptar e reavaliar a confiança. Sétimo, a organização coleta o máximo de informação sobre o estado de ativos, rede e comunicações e a usa para melhorar a própria segurança."],
    ["Quem decide e quem executa: motor de políticas, administrador e ponto de aplicação", "O NIST descreve uma arquitetura lógica com três componentes principais. O motor de políticas (policy engine, PE) toma a decisão final de conceder, negar ou revogar o acesso de um sujeito a um recurso. O administrador de políticas (policy administrator, PA) executa a decisão: abre ou encerra o caminho de comunicação e gera as credenciais ou tokens da sessão. O ponto de aplicação (policy enforcement point, PEP) fica na frente do recurso e habilita, monitora e termina as conexões. O PE e o PA juntos formam o ponto de decisão (PDP). Depois do PEP está a zona de confiança em que o recurso vive.", "Perceba como a identidade alimenta esse desenho. Entre as fontes de informação do motor de decisão, o documento lista o sistema de gestão de identidades, que cria e guarda as contas e os atributos dos usuários (citando como exemplo um servidor LDAP), além de dados de dispositivos, de inteligência sobre ameaças e dos registros de atividade. Sem identidades confiáveis, o motor não tem como decidir bem. É por isso que o NIST descreve uma das abordagens de confiança zero como baseada em governança de identidade aprimorada, em que as políticas de acesso partem da identidade e dos atributos atribuídos a ela."],
    ["O algoritmo de confiança: critérios, pontuação e contexto", "O documento chama de algoritmo de confiança o processo que o motor de políticas usa para decidir. Ele pode ser baseado em critérios, em que todos os atributos exigidos precisam ser satisfeitos, ou baseado em pontuação, em que cada fonte recebe um peso e o acesso só é concedido se o resultado passar de um limite configurado. Em caso de pontuação insuficiente, o pedido é negado ou os privilégios são reduzidos, como conceder leitura sem escrita.", "Há ainda a diferença entre algoritmo singular, que avalia cada pedido isoladamente, e contextual, que considera o histórico recente do sujeito. O NIST dá um exemplo claro: se uma pessoa do RH costuma acessar de 20 a 30 registros de funcionários por dia e, de repente, passa de 100, ou acessa fora do horário normal, um algoritmo contextual pode gerar alerta, enquanto um singular talvez não perceba. O documento também alerta que reautenticar a pessoa o tempo todo, mesmo quando o comportamento é normal, prejudica a usabilidade, e que a fase inicial costuma exigir ajustes, porque pedidos legítimos podem ser negados por configuração errada."]],
  av: [["Ameaças à própria arquitetura: credenciais roubadas e entidades não humanas", "O NIST dedica uma seção às ameaças que a confiança zero não elimina. Na de credenciais roubadas e ameaça interna, ele observa que o MFA reduz o risco de perda de informação, mas quem tem credenciais válidas, ou um insider mal-intencionado, ainda pode acessar o que aquela conta tem permissão de acessar. Por isso, privilégio mínimo e contas com escopo estreito seguem sendo decisivos.", "Outra seção trata das entidades não humanas, como automações e agentes de software que administram a segurança. O documento aponta o risco de elas autenticarem com um padrão mais baixo, como uma chave de API em vez de MFA, e de um atacante roubar essas credenciais e se passar pelo agente. É um bom argumento para que identidades de máquina entrem no programa de governança."]],
  mitos: [["Confiança zero é um produto que se compra.", "Segundo o NIST, é um conjunto de princípios, e não uma tecnologia única. A migração é uma jornada incremental, e a maioria das organizações opera em modo híbrido por muito tempo."], ["Com MFA, uma conta roubada não causa dano.", "O MFA reduz o risco, mas quem tem credenciais válidas ainda alcança o que aquela conta pode acessar. O privilégio mínimo continua essencial."], ["Governança de identidade só serve para auditoria.", "O NIST descreve uma abordagem de confiança zero baseada em governança de identidade, em que a identidade e seus atributos são a base das políticas de acesso."]],
  ref: [["nist207", "Leia as seções 2.1 (princípios), 3 (componentes), 3.3 (algoritmo de confiança) e 5 (ameaças)."], ["nist207pdf", "O mesmo documento em PDF, com as figuras de cada modelo de implantação."], "nist63", "saltzer", ["lgpd", "Art. 46: medidas de segurança contra acessos não autorizados."], ["dbir", "Relatório anual que ajuda a entender como as invasões acontecem."]]
});
amplia("sp-leader-2", {
  teo: [["SAML por dentro: asserções, perfis e metadados", "A visão técnica da OASIS descreve o SAML 2.0 como um conjunto de partes que se encaixam. As asserções são as declarações do provedor de identidade, de três tipos: de autenticação (a pessoa se autenticou de tal forma e em tal momento), de atributos (informações sobre ela, como e-mail e grupos) e de decisão de autorização. Os protocolos definem as mensagens trocadas, os bindings definem como elas viajam (por exemplo, pelo navegador, por redirecionamento ou por formulário) e os perfis combinam tudo para casos de uso, como o login único pelo navegador.", "No login único pelo navegador, o fluxo típico é: a pessoa abre o aplicativo (o provedor de serviço), que a redireciona ao provedor de identidade; depois de autenticada, o provedor de identidade devolve uma asserção assinada; o aplicativo valida a assinatura com o certificado do provedor de identidade e cria a sessão. A confiança entre os dois lados é configurada de antemão, em geral trocando metadados, arquivos que descrevem endereços e chaves. É por isso que a troca de certificados e metadados é um ponto crítico na operação."],
    ["OAuth 2.0 e OpenID Connect: papéis e fluxo", "A RFC 6749 define quatro papéis no OAuth 2.0: o dono do recurso (em geral a pessoa), o servidor de recursos (onde estão os dados, como uma API), o cliente (o aplicativo que quer acessar) e o servidor de autorização (que emite os tokens). No fluxo mais comum, o de código de autorização, o cliente redireciona a pessoa ao servidor de autorização, que a autentica e pede o consentimento. Em seguida, devolve um código, que o cliente troca por um token de acesso. O cliente usa esse token para chamar o servidor de recursos, dentro do escopo concedido.", "O OAuth foi desenhado para autorização, e não para dizer quem é a pessoa. O OpenID Connect, publicado em 2014, acrescenta essa camada: junto ao token de acesso, o servidor de autorização devolve um ID token, um documento assinado com informações (claims) como o emissor, o identificador do usuário, para quem o token foi emitido e até quando vale. Esse é o motivo da frase que se repete no mercado: OAuth autoriza, OpenID Connect autentica."]],
  av: [["LGPD, art. 46: o que a lei pede e como a identidade responde", "O art. 46 da LGPD determina que os agentes de tratamento adotem medidas de segurança, técnicas e administrativas, aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou tratamento inadequado. Controlar quem acessa dados pessoais, retirar acessos que não são mais necessários e registrar quem aprovou o quê são medidas administrativas e técnicas diretamente ligadas à governança de identidade. Este texto não é aconselhamento jurídico: para interpretar obrigações específicas, consulte o jurídico da sua organização.", "Do lado norte-americano, a seção 404 da Sarbanes-Oxley exige que a administração avalie e relate a eficácia dos controles internos sobre relatórios financeiros, o que, na prática, levou as empresas a revisar quem pode alterar dados e sistemas financeiros."]],
  mitos: [["SAML e OAuth são a mesma coisa.", "O SAML afirma quem é a pessoa a um aplicativo, muito usado em aplicações web corporativas. O OAuth delega permissão de acesso a dados e APIs. O OpenID Connect acrescenta identidade ao OAuth."], ["Login único significa compartilhar uma senha.", "No login único o aplicativo nunca vê a senha: ele confia em uma asserção ou token emitido pelo provedor de identidade."], ["Controle de acesso é uma preocupação nova.", "Senhas em sistemas de tempo compartilhado existem desde os anos 1960. O que mudou foi a escala: mais sistemas, mais usuários e mais máquinas."]],
  ref: [["saml", "Seções sobre asserções, protocolos, bindings e perfis."], ["rfc6749", "Seção 1.1 (papéis) e seção 4.1 (código de autorização)."], ["oidc", "Define o ID token e suas claims."], ["lgpd", "Art. 46."], "sox", "iso27001", "webauthn"]
});
amplia("sp-leader-3", {
  teo: [["Os princípios de projeto de Saltzer e Schroeder", "O artigo de 1975 de Jerome Saltzer e Michael Schroeder reuniu princípios de projeto de sistemas seguros que ainda orientam a área. Os principais são: economia de mecanismo (quanto mais simples o controle, menos falhas); padrões à prova de falha (fail-safe defaults: a decisão padrão é negar, e o acesso exige permissão explícita); mediação completa (cada acesso é verificado, sem atalhos); projeto aberto (a segurança não depende de segredo do desenho); separação de privilégio (ações críticas exigem mais de uma condição ou chave); privilégio mínimo; mecanismo menos comum (evitar compartilhar mecanismos entre usuários); e aceitabilidade psicológica (os controles precisam ser fáceis de usar, senão as pessoas os contornam).", "Dá para ler uma estratégia de identidade com essa régua. Negar por padrão e exigir pedido e aprovação é padrão à prova de falha. Revisar acessos de tempos em tempos é uma forma de manter a mediação completa ao longo do tempo. Separação de funções é a versão organizacional da separação de privilégio. E a aceitabilidade psicológica explica por que revisões com centenas de itens viram aprovações automáticas: o controle existe, mas é difícil demais para ser usado direito."],
    ["Clark-Wilson: integridade e separação de deveres", "Em 1987, David Clark e David Wilson argumentaram que os sistemas comerciais se preocupam mais com integridade (os dados estarem corretos) do que com sigilo, que era o foco dos modelos militares. O modelo deles divide os dados em itens controlados, que só podem ser alterados por procedimentos de transformação bem formados, e prevê procedimentos que verificam a integridade desses itens. Cada usuário só pode executar certos procedimentos sobre certos dados.", "A consequência central é a separação de deveres: quem certifica um procedimento não deve ser quem o executa, e quem cadastra um fornecedor não deve aprovar o pagamento a ele. É daí que vem a base conceitual das políticas de separação de funções em plataformas de identidade."]],
  av: [["Mapeando a estratégia ao NIST CSF 2.0 e à ISO 27001", "O NIST Cybersecurity Framework 2.0 organiza a gestão de identidade, autenticação e controle de acesso na categoria PR.AA, da função Proteger. A ISO/IEC 27001:2022 traz, no Anexo A, os controles 5.15 (controle de acesso), 5.16 (gestão de identidades), 5.17 (informação de autenticação) e 5.18 (direitos de acesso), este último cobrindo conceder, revisar, alterar e remover acessos. Usar esses itens como checklist ajuda a mostrar à diretoria e à auditoria que a estratégia tem respaldo em referências reconhecidas."]],
  mitos: [["Revisar acessos uma vez por ano basta.", "A frequência deveria acompanhar o risco. Acessos privilegiados e a sistemas críticos costumam merecer revisões mais frequentes que os demais."], ["Automação elimina a necessidade de donos de negócio.", "A automação executa regras, mas alguém precisa decidir o que cada acesso significa e quem deve tê-lo. Sem dono, a regra fica sem critério."], ["Privilégio mínimo atrapalha o trabalho.", "Mal aplicado, atrapalha. Por isso Saltzer e Schroeder incluem a aceitabilidade psicológica: o controle precisa ser usável, com processos de pedido simples e rápidos."]],
  ref: [["saltzer", "Seção sobre os princípios de projeto (design principles)."], ["cw", "Artigo original sobre integridade e separação de deveres."], ["csf2", "Categoria PR.AA."], ["iso27001", "Anexo A, controles 5.15 a 5.18."], "nist207"]
});
amplia("sp-leader-4", {
  teo: [["Das funções da plataforma aos controles da ISO 27001", "Uma forma útil de enxergar as capacidades de uma plataforma é relacioná-las aos controles que a auditoria cobra. O ciclo de vida das identidades, com entrada, mudança e saída, sustenta a gestão de identidades (5.16 da ISO/IEC 27001:2022). Os pedidos com aprovação sustentam a concessão de direitos de acesso. As certificações periódicas sustentam a revisão desses direitos, e as remoções por desligamento ou mudança sustentam a retirada. Esses três pontos formam o controle 5.18, que trata de conceder, revisar, alterar e remover acessos.", "Isso ajuda o líder a explicar a plataforma pela ótica da auditoria: cada função gera evidência de um controle. Os relatórios de campanha, os registros de aprovação e os históricos de provisionamento são as provas que a auditoria pede."],
    ["Responsabilidade compartilhada: nuvem e instalação própria", "Em um serviço em nuvem como o Identity Security Cloud, o fornecedor opera a plataforma, o que inclui infraestrutura e atualizações. Mesmo assim, algumas responsabilidades continuam com o cliente: a qualidade dos dados de RH, as regras de acesso, os donos das aplicações, as revisões e, quando há sistemas internos, a rede e a máquina virtual que liga o ISC a eles. No IdentityIQ, instalado na empresa, o cliente soma a operação da infraestrutura e das atualizações.", "A pergunta certa não é qual modelo é mais seguro, mas quem faz o quê em cada um e se a organização tem a capacidade de cumprir a sua parte."]],
  av: [["Perguntas para avaliar uma plataforma antes de contratar", "Boas perguntas incluem: quais são as nossas fontes autoritativas de pessoas e em que estado estão os dados? Quais sistemas têm conector pronto e quais exigirão trabalho extra? Quem será dono de cada sistema e de cada role? Como a plataforma gera evidência para a auditoria? Quem opera o quê, e quanto tempo temos para a primeira entrega? Respostas honestas a essas perguntas valem mais que uma lista de funções."], ["Definindo sucesso", "Defina antes do projeto o que significa dar certo: por exemplo, reduzir o tempo de concessão de acesso, zerar contas órfãs nos sistemas críticos e cumprir revisões no prazo. Sem essa definição, o projeto pode terminar tecnicamente pronto e sem convencer ninguém."]],
  mitos: [["A plataforma resolve sozinha os problemas de acesso.", "Ela depende de dados de RH confiáveis, donos definidos e processos acordados. Sem isso, apenas automatiza a bagunça."], ["Instalar na própria empresa é sempre mais seguro.", "Segurança depende de quem opera e de como. A escolha troca responsabilidades, e não elimina riscos."], ["Conectar todos os sistemas no começo acelera o projeto.", "O guia de fundação da SailPoint recomenda começar pelas fontes principais e pelos mapeamentos mínimos, para entregar valor cedo."]],
  ref: [["fnd", "Guia de fundação: o que fazer no início do projeto."], ["gLdr", "Blueprint do exame de Leader."], ["iso27001", "Anexo A, controles 5.15 a 5.18."], "docs", "nist63"]
});
amplia("sp-prof-1", {
  teo: [["Defasagem entre o sistema real e o ISC", "O ISC mostra o que a última agregação trouxe. Entre duas cargas, o estado real do sistema de destino pode mudar: alguém recebe ou perde um acesso diretamente, uma conta é criada fora do processo. Essa janela de defasagem é o tempo em que o ISC e a realidade divergem. Quanto mais crítico o sistema, menor deve ser essa janela, e isso é uma decisão de risco, e não só de desempenho.", "Uma prática comum é combinar agregações completas, mais pesadas e menos frequentes, com agregações delta, mais leves e frequentes, quando a source permite. Em conexões diretas, a SailPoint indica que há atualizações em tempo real, o que reduz a janela em sistemas que suportam isso."],
    ["A conta usada pela source e o privilégio mínimo", "Toda conexão com um sistema usa uma conta de serviço, com credencial guardada na configuração da source. Essa conta é uma identidade de máquina e merece o mesmo cuidado que uma conta humana: deve ter só os direitos necessários (somente leitura, se a source apenas agrega), uma credencial rotacionada com aviso prévio e um dono responsável.", "O NIST, ao falar de entidades não humanas, destaca o risco de elas usarem credenciais mais fracas, como chaves de API, e de essas credenciais serem roubadas para se passar pelo agente. Credenciais vencidas, por outro lado, são uma das causas mais comuns de falha de agregação, o que mostra que cuidar delas é segurança e também disponibilidade."]],
  av: [["Conexão direta, VA e arquivo: o que muda na prática", "Na conexão direta, o ISC fala com o sistema por meio de um conector, e, para sistemas internos, por um cluster de VAs. Isso permite ler e, quando o conector suporta, provisionar. Na conexão por arquivo, alguém ou algum processo exporta os dados, e o ISC apenas lê e agrega. Escolher entre os dois é equilibrar esforço de integração, atualização e a necessidade de provisionar."]],
  mitos: [["Contas correlacionadas significam dados perfeitos.", "A correlação só liga conta e identidade. Atributos errados ou desatualizados continuam errados."], ["Flat file e conexão direta são equivalentes.", "O flat file só lê e agrega. O provisionamento exige conexão e conector que o suportem."], ["Quanto mais atributos na source, melhor.", "Trazer só o necessário reduz exposição de dados e ruído nas análises."]],
  ref: [["gProf", "Domínio 1 do blueprint."], ["src", "Documentação de configuração de sources."], ["api", "API de sources."], ["nist207", "Seção 5.7, entidades não humanas."], "nist63"]
});
amplia("sp-prof-2", {
  teo: [["Operadores, agrupamento e leitura de uma consulta", "Uma consulta estruturada junta condições com operadores lógicos. E exige que as duas condições valham, OU exige que ao menos uma valha, e NÃO exclui um conjunto. Em exemplos ilustrativos (a sintaxe exata está na documentação do produto), 'Vendas E ativo' traz quem está nos dois grupos; 'Vendas OU Marketing' traz quem está em qualquer um; 'ativo E NÃO afastado' traz ativos que não estão afastados.", "O cuidado maior é com o agrupamento. 'Vendas E (ativo OU afastado)' devolve pessoas de Vendas que estão ativas ou afastadas. Já '(Vendas E ativo) OU afastado' devolve também todos os afastados de qualquer área, o que é um conjunto bem maior. Quando uma pesquisa devolve mais ou menos do que o esperado, o agrupamento é o primeiro suspeito."],
    ["A pesquisa como evidência de auditoria", "Em auditorias, não basta mostrar o resultado: é preciso explicar como ele foi obtido. Pesquisas salvas com nomes claros, documentadas e usadas de forma repetida funcionam como evidência reproduzível: qualquer pessoa pode rodá-las de novo e chegar ao mesmo critério. Já uma consulta feita à mão, sem registro, é difícil de defender.", "Adote nomes que indiquem o objetivo e o escopo, como 'Contas ativas de pessoas desligadas, sistemas críticos', e registre quem criou, para quê e quando foi revista."]],
  av: [["Armadilhas comuns", "Campos vazios podem excluir pessoas sem você perceber, porque uma condição sobre um campo preenchido não alcança quem está em branco. Valores parecidos, como 'Vendas' e 'vendas internas', podem exigir condições diferentes. E resultados muito pequenos também merecem conferência: às vezes o filtro ficou estreito demais."]],
  mitos: [["A pesquisa sempre mostra o estado atual do sistema de origem.", "Ela mostra o que o ISC já carregou. Mudanças ainda não agregadas não aparecem."], ["Quanto mais filtros, melhor a pesquisa.", "Filtros demais podem excluir itens relevantes. A medida certa é a que responde à pergunta."], ["Salvar a pesquisa é só uma comodidade.", "Também ajuda a documentar o critério e a repetir o procedimento com o mesmo resultado."]],
  ref: [["gProf", "Domínio 2 do blueprint."], ["docs", "Documentação do produto, seção de pesquisa."]]
});
amplia("sp-prof-3", {
  teo: [["O modelo RBAC do NIST: núcleo, hierarquias e restrições", "O modelo RBAC adotado pelo NIST e padronizado pelo ANSI/INCITS 359 se organiza em componentes. O núcleo (core RBAC) define usuários, papéis, permissões e sessões, com as relações entre eles. O RBAC hierárquico acrescenta a herança entre papéis, em que um papel sênior herda as permissões de um júnior. O RBAC com restrições acrescenta a separação de deveres, em duas formas: estática, em que um usuário não pode receber papéis conflitantes, e dinâmica, em que o usuário pode ter os dois papéis, mas não pode ativá-los na mesma sessão.", "Essa estrutura é útil para ler produtos reais: uma política que impede que alguém tenha dois acessos conflitantes é, conceitualmente, uma restrição estática de separação de deveres."],
    ["Papéis e atributos: quando combinar", "O RBAC é simples de explicar, mas tem limites: quando as decisões dependem de contexto (departamento, localidade, horário, sensibilidade do dado), o número de papéis explode. O controle baseado em atributos (ABAC, descrito na NIST SP 800-162) decide com base em atributos do sujeito, do recurso e do ambiente. Na prática, muitas organizações combinam os dois: papéis para o grosso do acesso e atributos para refinar ou atribuir automaticamente.", "O NIST, em seu documento de confiança zero, faz uma ressalva interessante: um conjunto de privilégios dado a vários sujeitos pode ser visto como um papel, mas os privilégios deveriam ser atribuídos a cada sujeito individualmente, e não só porque ele se encaixa em determinada função. É um lembrete de que a atribuição automática por critérios deve ser validada, e não aceita sem revisão."]],
  av: [["Role com escopo automático: o cuidado com os dados", "Quando a role é atribuída por critérios, como departamento e cargo, o resultado depende de atributos corretos. Um erro de digitação no cadastro pode atribuir, ou deixar de atribuir, uma role à pessoa errada. Por isso, antes de ativar a atribuição automática, simule o resultado, confira uma amostra e defina quem acompanha as exceções."]],
  mitos: [["Mais roles significam acesso mais organizado.", "Roles demais anulam o ganho do RBAC. Poucas roles bem descritas, com dono, são o objetivo."], ["Mineração de roles descobre o modelo ideal.", "Ela mostra o que as pessoas têm hoje, inclusive acessos indevidos acumulados. O dono do negócio precisa validar."], ["RBAC e ABAC são concorrentes.", "Costumam ser combinados: papéis para o conjunto básico e atributos para refinar e automatizar."]],
  ref: [["rbac", "Visão geral do modelo RBAC do NIST."], ["abac", "Guia de controle de acesso baseado em atributos."], ["nist207", "Seção 3.3, sobre atribuição de privilégios."], ["gProf", "Domínio 3 do blueprint."], ["acc", "Documentação de acesso no ISC."]]
});
amplia("sp-prof-4", {
  teo: [["Matriz de conflitos e controles compensatórios", "Uma política de separação de funções começa com uma matriz de conflitos, uma tabela que cruza ações e aponta as combinações que não podem ficar com a mesma pessoa. Exemplos clássicos: cadastrar fornecedor e aprovar pagamento; desenvolver uma alteração e publicá-la em produção; criar um usuário e aprovar o seu acesso privilegiado. Cada par precisa de uma justificativa de risco, para que a política seja defendida diante da auditoria e dos gestores.", "Quando o conflito é inevitável, por exemplo em uma equipe de duas pessoas, entra o controle compensatório: uma aprovação adicional, uma revisão independente periódica ou um monitoramento reforçado. A exceção deve ser registrada, ter dono, prazo e revisão."],
    ["Fadiga do revisor e desenho de campanhas", "Revisores que recebem listas longas, sem contexto e com prazos curtos tendem a aprovar tudo. Esse comportamento, conhecido como rubber stamping, transforma um controle em formalidade. O princípio da aceitabilidade psicológica, de Saltzer e Schroeder, dá a lição: o controle precisa ser usável para funcionar.", "Medidas práticas: reduzir o número de itens por revisor, priorizar acessos de maior risco, mostrar o contexto de cada acesso (o que é, por que existe, desde quando), acompanhar o andamento e comparar as taxas de revogação ao longo do tempo. Uma taxa de revogação próxima de zero, de forma recorrente, é um sinal de alerta."]],
  av: [["Evidência para a auditoria: o que guardar", "Uma campanha gera evidências importantes: o escopo, os revisores, as decisões item a item, as datas, os Sign Offs e as remediações. Guarde também a configuração usada, para mostrar como o escopo foi definido, e o registro das exceções aceitas, com justificativa e prazo. É esse conjunto, e não só o resultado final, que sustenta a resposta à auditoria."]],
  mitos: [["Se todos os revisores concluíram, a campanha foi um sucesso.", "Concluir não é revisar bem. A qualidade se mede também pela taxa de revogação e pela evidência das decisões."], ["Política de SoD resolve tudo com uma única regra.", "Ela exige uma matriz de conflitos baseada em risco e controles compensatórios para os casos inevitáveis."], ["Certificação é uma tarefa só da TI.", "Quem decide é o negócio: gestores e donos de acesso. A TI conduz o processo."]],
  ref: [["sox", "Seção 404, controles internos sobre relatórios financeiros."], ["iso27001", "Anexo A, controle 5.18, direitos de acesso."], ["sod", "Visão geral de Separation of Duties no ISC."], ["pol", "Gerenciamento de políticas SoD."], ["cert", "API de campanhas de certificação."], "saltzer", ["gProf", "Domínio 4 do blueprint."]]
});
amplia("sp-prof-5", {
  teo: [["Do outlier ao algoritmo contextual: o paralelo com o NIST", "A lógica de achar acessos fora do padrão do grupo tem paralelo direto com o algoritmo de confiança contextual descrito na NIST SP 800-207. Nesse documento, um algoritmo singular avalia cada pedido isoladamente, e um contextual considera o histórico do sujeito. O exemplo do NIST é o de uma pessoa do RH que costuma acessar de 20 a 30 registros por dia e passa a acessar mais de 100: o comportamento foge do padrão e merece alerta.", "Na análise de acessos, o padrão de comparação é o grupo de pares, em vez do histórico individual, mas a ideia é a mesma: o que é normal para pessoas parecidas serve de régua para sinalizar exceções. O resultado não é uma sentença: é uma pista para investigar."],
    ["Falsos positivos e falsos negativos", "Todo mecanismo de detecção erra de dois modos. O falso positivo sinaliza algo normal como suspeito, o que gera trabalho desnecessário. O falso negativo deixa passar algo que era problema. O NIST observa, ao tratar de automação em segurança, que o ajuste regular dos critérios é o que reduz esses erros.", "Na prática, comece por limites que gerem uma quantidade de casos que a equipe consiga investigar, registre o resultado de cada investigação e use esse histórico para ajustar. Um painel de outliers que ninguém consegue acompanhar não protege ninguém."]],
  av: [["Qualidade de dados: o que medir", "Antes de confiar nas análises, meça: percentual de identidades com atributos-chave preenchidos (departamento, cargo, gestor), percentual de contas correlacionadas, idade da última agregação de cada source e número de identidades duplicadas. Esses indicadores mostram se a análise está apoiada em dados confiáveis ou em suposições."]],
  mitos: [["Outlier é igual a culpado.", "É um ponto de investigação. Pode ser um acesso legítimo e raro, como o de um especialista."], ["Análises com IA dispensam dados de qualidade.", "Dados ruins geram conclusões erradas com aparência de precisão."], ["Painéis bonitos são o objetivo.", "O objetivo é decidir e agir. Poucos indicadores, ligados a ações, valem mais."]],
  ref: [["nist207", "Seção 3.3.1, algoritmos de confiança contextuais, e seção 5.7."], ["gProf", "Domínio 5 do blueprint."], ["docs", "Documentação do produto."]]
});
amplia("sp-prof-6", {
  teo: [["Credenciais de máquina: o ponto fraco recorrente", "Boa parte das falhas de integração se resume a credenciais: senha ou token expirado, rotação feita sem avisar a integração, permissão reduzida na conta de serviço. Do lado da segurança, o NIST alerta que entidades não humanas podem usar autenticação mais fraca, como uma chave de API em vez de MFA, e que o roubo dessas credenciais permite a um atacante se passar pelo agente.", "O caminho é inventariar as credenciais de integração, atribuir donos, rotacionar com aviso e monitorar o vencimento. Assim, uma causa comum de incidente vira um evento planejado."],
    ["Observabilidade: logs, métricas e trilhas", "Para diagnosticar bem, é preciso conseguir observar o sistema. Logs registram o que aconteceu, em níveis de detalhe diferentes: o nível padrão serve para o dia a dia, e o detalhado, para investigação pontual. Métricas mostram tendências, como a taxa de falhas de agregação por source. Trilhas de auditoria registram quem fez o quê e quando.", "A combinação responde às perguntas que importam em um incidente: o que falhou, desde quando, o que mudou antes e quem foi afetado. Sem esses três registros, o diagnóstico vira adivinhação."]],
  av: [["Depois do incidente: documentar e aprender", "Resolver não termina o trabalho. Registre o sintoma, a causa, a correção e o que será feito para evitar a repetição. Uma cultura em que a análise busca entender como o sistema permitiu o erro, em vez de procurar culpados, costuma produzir correções mais duradouras. Se o mesmo incidente voltar, trate-o como um problema de causa raiz."]],
  mitos: [["Se o erro sumiu sozinho, não precisa investigar.", "Falhas intermitentes costumam ter causa real, como credencial prestes a vencer ou limite de capacidade."], ["Quanto mais logs detalhados, melhor.", "Logs detalhados pesam e geram ruído. Use o nível necessário, pelo tempo necessário."], ["Escalar é sinal de fraqueza.", "Escalar com evidências acelera a solução. O erro é escalar sem informação."]],
  ref: [["nist207", "Seção 5.7, entidades não humanas."], ["gProf", "Domínio 6 do blueprint."], ["docs", "Documentação do produto."]]
});
