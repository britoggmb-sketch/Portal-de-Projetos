<style>
:root {
  color-scheme: dark;
  --black: #0E1726; --anth: #1A2536; --accent: #5EC8F2; --white: #FFFFFF;
  --gray: #5B6678; --gray-l: #A3AEBF; --yellow: #F5C542; --orange: #FF8A3D; --red: #EF4444;
  --accent-d: #1F8FBF; --accent-l: #9BE3FF;
  --glass: rgba(26, 37, 54, 0.72); --line: rgba(91, 102, 120, 0.6);
  --glow-sm: 0 0 8px rgba(94, 200, 242, 0.35);
  --glow-md: 0 0 16px rgba(94, 200, 242, 0.30), inset 0 0 1px rgba(94, 200, 242, 0.6);
  --glow-lg: 0 0 32px rgba(94, 200, 242, 0.25);
  --f-display: "Space Grotesk", "Inter", Arial, sans-serif;
  --f-body: "Inter", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --d-fast: 180ms; --d-base: 280ms; --d-slow: 480ms;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root[data-theme="dark"] { color-scheme: dark; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 18px; height: 18px; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%; background: var(--black); color: var(--white);
  font: 400 16px/26px var(--f-body); -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--black); z-index: 60; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 34px; line-height: 40px; } h2 { font-size: 22px; line-height: 28px; } h3 { font: 600 16px/22px var(--f-body); }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mut { color: var(--gray-l); } .tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* textura de círculos tangentes (grafismo da marca) */
.tex { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: opacity var(--d-slow) var(--ease); }
.tex svg { position: absolute; inset: 0; transform: translate(var(--px, 0px), var(--py, 0px)); transition: transform 240ms linear; }
.tex circle { fill: none; stroke: var(--accent); stroke-opacity: 0.2; stroke-width: 1; vector-effect: non-scaling-stroke; }
body[data-layer="read"] .tex { opacity: 0; }

/* shell */
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: 64px 1fr; min-height: 100dvh; }
.top {
  grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: 64px;
  display: flex; align-items: center; gap: 16px; padding: 0 20px; background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; width: 170px; flex: none; }
.brand img { height: 30px; width: auto; display: block; } .brand .li { display: none; }
.sel, .inp, select, textarea {
  background: var(--black); color: var(--white); border: 1px solid var(--gray); border-radius: 6px;
  font: 400 15px/22px var(--f-body); padding: 8px 12px; min-height: 40px;
}
.sel { max-width: 320px; }
.search { position: relative; flex: 1; max-width: 340px; }
.search .inp { width: 100%; }
.search-res { position: absolute; top: 46px; left: 0; right: 0; background: var(--anth); border: 1px solid var(--line); border-radius: 12px; padding: 6px; z-index: 40; display: none; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
.search-res.on { display: block; }
.search-res button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.search-res button:hover, .search-res button:focus-visible { background: rgba(94, 200, 242, 0.1); }
.right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.pill { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; background: none; cursor: pointer; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 999px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; position: relative; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.badge-n { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--yellow); color: var(--black); font: 700 11px/18px var(--f-body); text-align: center; }
.menu { position: absolute; right: 20px; top: 60px; background: var(--anth); border: 1px solid var(--line); border-radius: 12px; padding: 8px; width: 270px; z-index: 50; display: none; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
.menu.on { display: block; }
.menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu button, .menu label { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: none; border: 0; padding: 9px 10px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 15px; }
.menu button:hover { background: rgba(94, 200, 242, 0.1); }

.side { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); height: calc(100dvh - 64px - env(safe-area-inset-top, 0px)); padding: 16px 12px; border-right: 1px solid var(--line); background: rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.nav { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; color: var(--gray-l); text-decoration: none; border: 1px solid transparent; font-size: 15px; transition: color var(--d-fast), background var(--d-fast); }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav:hover { color: var(--white); background: rgba(255, 255, 255, 0.05); }
.nav.on { color: var(--white); background: rgba(94, 200, 242, 0.12); border-color: var(--accent); font-weight: 600; }
.nav.on svg { color: var(--accent); }
.side .foot { margin-top: auto; padding: 12px; font-size: 13px; line-height: 18px; color: var(--gray-l); }

.main { padding: 28px 32px 64px; min-width: 0; outline: none; }
.page { max-width: 1160px; margin: 0 auto; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.sub { color: var(--gray-l); margin-top: 4px; }
body[data-layer="read"] .main { background: var(--black); }

/* componentes */
.glass { background: var(--glass); backdrop-filter: blur(16px) saturate(120%); -webkit-backdrop-filter: blur(16px) saturate(120%); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.solid { background: var(--anth); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card-i { transition: border-color var(--d-fast), box-shadow var(--d-fast), transform var(--d-fast) var(--ease); cursor: pointer; }
.card-i:hover, .card-i:focus-visible { border-color: var(--accent); box-shadow: var(--glow-md); transform: translateY(-1px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 4px; border: 1px solid transparent; font: 600 15px/1 var(--f-body); cursor: pointer; text-decoration: none; transition: box-shadow var(--d-fast), transform var(--d-fast) var(--ease), background var(--d-fast); }
.btn.pri { background: var(--accent); color: var(--black); }
.btn.pri:hover { box-shadow: var(--glow-sm); transform: translateY(-1px); }
.btn.sec { border-color: var(--accent); color: var(--accent); background: none; }
.btn.sec:hover { background: rgba(94, 200, 242, 0.08); box-shadow: var(--glow-sm); }
.btn.gho { background: none; color: var(--white); border-color: var(--line); }
.btn.gho:hover { border-color: var(--gray-l); }
.btn.dan { background: none; color: var(--white); border-color: var(--red); }
.btn.dan:hover { background: rgba(239, 68, 68, 0.12); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 13px; line-height: 20px; color: var(--white); white-space: nowrap; }
.chip.ok { border-color: var(--accent); color: var(--accent); } .chip.warn { border-color: var(--yellow); color: var(--yellow); }
.chip.bad { border-color: var(--red); } .chip.mut { color: var(--gray-l); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--gray); }
.dot.ok { background: var(--accent); } .dot.warn { background: var(--yellow); } .dot.mut { background: var(--gray); } .dot.bad { background: var(--red); } .dot.risk { background: var(--orange); }
.row { display: flex; align-items: center; gap: 12px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hr { height: 1px; background: var(--line); border: 0; margin: 16px 0; }
.lbl { font-size: 14px; color: var(--gray-l); }
.num { font: 600 44px/48px var(--f-display); font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.bar { height: 8px; border-radius: 4px; background: rgba(91, 102, 120, 0.45); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(135deg, var(--accent-d), var(--accent) 50%, var(--accent-l)); width: 0; transition: width 900ms var(--ease); }

/* anel de progresso */
.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.rg-track { fill: none; stroke: rgba(91, 102, 120, 0.5); }
.rg-bar { fill: none; stroke: url(#g-brand); stroke-linecap: round; transition: stroke-dashoffset 1100ms var(--ease); }
.ring .rg-v { position: absolute; font: 600 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }

/* dashboard */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c-continue { grid-column: span 8; border-color: var(--accent); background: linear-gradient(180deg, rgba(94, 200, 242, 0.08), var(--glass)); }
.c-pront { grid-column: span 4; } .c-radar { grid-column: span 6; } .c-ind { grid-column: span 6; }
.c-tri { grid-column: span 7; } .c-sim { grid-column: span 5; } .c-aviso { grid-column: span 12; border-color: var(--yellow); }
.mod-num { font: 500 72px/72px var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.ind-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 8px 0 14px; }
.lacuna { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.slogan { text-align: center; margin: 40px 0 0; font: 500 12px/16px var(--f-display); letter-spacing: 0.6em; color: var(--accent); }

/* radar */
.radar { display: block; width: 100%; max-width: 420px; margin: 0 auto; }
.radar text { fill: var(--white); font: 400 13px var(--f-body); }
.radar .g { fill: none; stroke: rgba(91, 102, 120, 0.55); }
.radar .meta { fill: none; stroke: var(--yellow); stroke-dasharray: 4 4; stroke-opacity: 0.8; }
.radar .dat { fill: rgba(94, 200, 242, 0.14); stroke: var(--accent); stroke-width: 2; transform: scale(0.02); transition: transform 900ms var(--ease); }
.radar .dat.in { transform: none; }
.radar .pt { fill: var(--black); stroke: var(--accent); stroke-width: 2; cursor: pointer; }
.radar .pt:hover, .radar .pt:focus-visible { fill: var(--accent); }

/* constelação */
.tri { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.const { padding: 8px; }
.const svg { width: 100%; height: auto; display: block; }
.const .quad { fill: var(--gray-l); font: 600 14px var(--f-display); }
.const .lin { stroke: rgba(91, 102, 120, 0.7); stroke-width: 1.25; fill: none; }
.const .lin.on { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; filter: drop-shadow(0 0 4px rgba(94, 200, 242, 0.5)); }
@keyframes flow { to { stroke-dashoffset: -28; } }
.no { cursor: pointer; outline: none; }
.no circle.b { fill: var(--black); stroke: var(--gray-l); stroke-width: 1.5; transition: stroke var(--d-fast), filter var(--d-fast); }
.no text { fill: var(--white); font: 600 14px var(--f-display); text-anchor: middle; pointer-events: none; }
.no.st-done circle.b { stroke: var(--accent); stroke-width: 2.5; fill: rgba(94, 200, 242, 0.14); }
.no.st-going circle.b { stroke: var(--gray-l); }
.no.st-going .arc { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.no.st-lock circle.b { stroke: var(--gray); stroke-dasharray: 4 4; } .no.st-lock text { fill: var(--gray-l); }
.no:hover circle.b, .no:focus-visible circle.b, .no.sel circle.b { filter: drop-shadow(0 0 8px rgba(94, 200, 242, 0.7)); stroke: var(--accent); }
.no .halo { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 4; opacity: 0; }
.no.sel .halo { opacity: 1; }
.no.ign circle.b { animation: ignite 1.2s var(--ease); }
@keyframes ignite { 0% { filter: drop-shadow(0 0 0 rgba(94, 200, 242, 0)); transform: scale(1); } 40% { filter: drop-shadow(0 0 18px rgba(94, 200, 242, 0.95)); } 100% { filter: drop-shadow(0 0 0 rgba(94, 200, 242, 0)); } }
.root-no circle { fill: none; stroke: var(--gray); stroke-dasharray: 4 4; stroke-width: 1.5; }
.root-no.ready circle { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2.5; filter: drop-shadow(0 0 8px rgba(94, 200, 242, 0.6)); }
.root-no text { fill: var(--gray-l); font: 600 13px var(--f-display); text-anchor: middle; } .root-no.ready text { fill: var(--white); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 12px 4px; font-size: 13px; color: var(--gray-l); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--gray-l); display: inline-block; }
.legend i.d { border-color: var(--accent); background: rgba(94, 200, 242, 0.2); } .legend i.l { border-style: dashed; border-color: var(--gray); }
.legend i.g { border-color: var(--accent); border-right-color: var(--gray-l); border-bottom-color: var(--gray-l); }
.pn h2 { margin: 4px 0 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.seg-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg-tabs button { background: none; border: 0; padding: 6px 14px; cursor: pointer; color: var(--gray-l); font-size: 14px; }
.seg-tabs button.on { background: rgba(94, 200, 242, 0.14); color: var(--white); font-weight: 600; }
.lista-mod { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lista-mod li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass); }
.lista-mod .n { font: 600 18px var(--f-display); width: 32px; color: var(--accent); }

/* leitura */
.read-grid { display: grid; grid-template-columns: 220px minmax(0, 680px) 240px; gap: 32px; justify-content: center; }
.read-col { font-size: 18px; line-height: 30px; }
.read-col h1 { font-size: 30px; line-height: 36px; margin: 8px 0 12px; }
.read-col h2 { font-size: 22px; line-height: 28px; margin: 32px 0 8px; }
.read-col p { margin: 0 0 14px; font-weight: 400; }
.read-col .intro { color: var(--gray-l); font-size: 18px; }
.idx { position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 15px; line-height: 22px; }
.idx a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--gray-l); text-decoration: none; border-left: 2px solid transparent; }
.idx a:hover { color: var(--white); } .idx a.on { color: var(--white); border-left-color: var(--accent); background: rgba(94, 200, 242, 0.08); }
.marg { position: sticky; top: calc(88px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 14px; }
.marg a { word-break: break-word; }
.extra { border-left: 2px solid var(--yellow); padding-left: 16px; margin-top: 28px; }
.foot-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
.callout { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 14px; line-height: 20px; color: var(--gray-l); }
.codeb { font: 400 14px/22px var(--f-mono); background: var(--black); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; }

/* quiz e prova */
.qwrap { max-width: 760px; margin: 0 auto; }
.segs { display: flex; gap: 6px; } .segs i { flex: 1; height: 6px; border-radius: 3px; background: rgba(91, 102, 120, 0.5); } .segs i.d { background: var(--accent); } .segs i.c { background: none; border: 1.5px solid var(--accent); height: 6px; }
.cen { color: var(--gray-l); font-size: 17px; line-height: 28px; margin: 18px 0 10px; }
.qq { font: 500 22px/30px var(--f-display); margin-bottom: 18px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: flex-start; gap: 14px; text-align: left; width: 100%; padding: 14px 16px; background: var(--black); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 17px; line-height: 26px; transition: border-color var(--d-fast), background var(--d-fast); }
.opt:hover:not([disabled]) { border-color: var(--gray-l); }
.opt .lt { flex: none; width: 28px; height: 28px; border: 1px solid var(--gray-l); border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--f-display); }
.opt.sel { border-color: var(--accent); background: rgba(94, 200, 242, 0.1); } .opt.sel .lt { background: var(--accent); border-color: var(--accent); color: var(--black); }
.opt.ok { border-color: var(--accent); background: rgba(94, 200, 242, 0.12); animation: pop var(--d-base) var(--ease); } .opt.ok .lt { background: var(--accent); color: var(--black); border-color: var(--accent); }
.opt.bad { border-color: var(--red); } .opt.bad .lt { border-color: var(--red); }
.opt .tag { margin-left: auto; flex: none; font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
@keyframes pop { 0% { transform: scale(0.985); } 60% { transform: scale(1.008); } 100% { transform: scale(1); } }
.fbk { margin-top: 16px; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; animation: rise var(--d-base) var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.prova-top { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 20; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 12px 32px; margin: -28px -32px 24px; display: flex; align-items: center; gap: 16px; }
.timer { font: 600 22px var(--f-display); font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 6px; padding: 4px 14px; }
.timer.warn { border-color: var(--yellow); color: var(--yellow); }
.prova-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; max-width: 1060px; margin: 0 auto; }
.qnav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.qnav button { position: relative; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; font: 600 14px var(--f-display); }

  mods: [
    { d: "d1", t: "Configurar e administrar o Identity Security Cloud", rs: "Do tenant às fontes: o básico para o sistema funcionar e se manter saudável.",
      ob: ["Estabelecer conectividade e segurança do tenant", "Manter fontes autoritativas e perfis de identidade", "Agregar e correlacionar contas de usuário", "Configurar e monitorar o provisionamento", "Definir solicitações de acesso", "Usar a pesquisa para consultar, monitorar e capturar dados de relatório", "Monitorar certificações e políticas"],
      an: "Imagine montar uma central de atendimento: primeiro você liga as linhas telefônicas (conectividade), depois cadastra quem trabalha lá (identidades), e só então começa a atender (pedidos e revisões).",
      s: [["O tenant e a conexão com os sistemas", "O tenant é o seu ambiente privado no Identity Security Cloud (ISC). Para o ISC enxergar um sistema da empresa, você cria uma source (fonte). A conexão pode ser direta, por meio de um cluster de virtual appliances (VA), ou por arquivo .csv quando não há conector. A SailPoint indica que a conexão direta permite atualizações em tempo real."],
        ["Pessoas, contas e correlação", "Uma fonte autoritativa (authoritative source), em geral o RH, diz quem é quem. O identity profile mapeia os atributos dessa fonte para a identidade. A cada agregação (aggregation), o ISC traz contas e direitos de acesso; a correlação liga cada conta à pessoa certa."],
        ["Acesso, provisionamento e acompanhamento", "Quando alguém ganha ou perde acesso, o provisionamento aplica a mudança no sistema de destino. Os usuários podem pedir acessos marcados como solicitáveis (requestable). A pesquisa e os relatórios ajudam a acompanhar tudo, e as certificações e políticas mostram se as regras estão sendo cumpridas."]],
      pt: ["Source = sistema ligado ao ISC; direct connection usa VA, flat file só lê.", "Fonte autoritativa + identity profile definem as identidades.", "Agregação traz os dados e a correlação liga contas a pessoas."],
      er: ["Esquecer de marcar a fonte do RH como autoritativa.", "Usar flat file esperando provisionar: ele só lê e agrega."],
      g: [["tenant", "Seu ambiente privado no ISC."], ["source", "Sistema de onde o ISC coleta contas e direitos de acesso."], ["aggregation", "Carga que atualiza contas e entitlements de uma source."], ["correlação", "Associar cada conta encontrada a uma identidade."], ["provisionamento", "Aplicar no sistema de destino uma concessão ou remoção de acesso."]],
      f: { k: "fluxo", i: ["Conectar a source (VA ou .csv)", "Agregar contas e entitlements", "Correlacionar contas às identidades", "Provisionar e monitorar acessos"], c: "A ordem típica para colocar uma fonte em funcionamento no ISC." },
      q: [["A equipe liga um sistema legado que só exporta um arquivo .csv.", "O que não será possível nessa conexão?", ["Provisionamento, pois o flat file só lê e agrega", "Ler contas", "Agregar entitlements", "Usar Delimited File"], 0, "O flat file serve para ler e agregar, e não suporta provisionamento."],
        ["O ISC mostra contas sem dono, ou seja, sem pessoa associada.", "Qual etapa associa contas a identidades?", ["Correlação", "Certificação", "Provisionamento", "Busca salva"], 0, "A correlação liga cada conta à identidade correta."],
        ["A empresa quer que o RH seja a referência de nome e cargo.", "Como configurar?", ["Marcar a source de RH como authoritative source de um identity profile", "Criar uma role", "Criar uma política SoD", "Excluir a source"], 0, "A fonte autoritativa alimenta o identity profile."],
        ["Contas novas só aparecem quando alguém faz uma carga manual.", "O que reduz a defasagem?", ["Agendar as agregações", "Criar mais roles", "Remover o schema", "Assinar uma política"], 0, "Agregações agendadas mantêm os dados atualizados."]],
      u: ["gProf", "src", "api"] },
    { d: "d2", t: "Pesquisa no Identity Security Cloud", rs: "Como encontrar qualquer pessoa, conta ou acesso, do jeito simples ao jeito preciso.",
      ob: ["Descobrir onde a pesquisa é usada", "Criar pesquisas simples e amplas", "Criar pesquisas direcionadas", "Verificar e refinar os resultados", "Usar pesquisas salvas, sugeridas e o preenchimento automático"],
      an: "Pesquisar no ISC é como procurar um documento em um arquivo gigante: primeiro você pergunta de forma geral, depois vai fechando o cerco com filtros até achar o que quer.",
      s: [["Pesquisa ampla", "Você digita uma palavra, como um nome ou departamento, e o ISC procura em vários campos de uma vez. Serve para explorar, mas pode trazer resultado demais."],
        ["Pesquisa direcionada", "Para ser preciso, você combina campo e valor e usa conectores lógicos como E, OU e NÃO. A ideia é perguntar, por exemplo, 'pessoas do departamento X que estão ativas'. A sintaxe exata aparece na documentação do produto."],
        ["Conferir e reaproveitar", "Sempre confira o resultado: o filtro pode estar largo ou estreito demais. Pesquisas que você usa sempre podem ser salvas, e o preenchimento automático sugere campos e valores para evitar erro de digitação."]],
      pt: ["Comece ampla e feche o cerco com filtros.", "Combine campo e valor com E, OU e NÃO.", "Salve as pesquisas que você repete."],
      er: ["Confiar no primeiro resultado sem conferir o filtro.", "Criar a mesma pesquisa toda semana em vez de salvá-la."],
      g: [["pesquisa salva", "Consulta guardada para ser reaproveitada."], ["filtro", "Condição que reduz os resultados."], ["autocompletar", "Sugestões de campo e valor enquanto você digita."]],
      f: { k: "fluxo", i: ["Pesquisa ampla (uma palavra)", "Adicionar filtros (campo e valor)", "Verificar o resultado", "Salvar a pesquisa"], c: "Do resultado amplo ao resultado preciso e reutilizável." },
      q: [["Você precisa listar todas as pessoas ativas de um departamento.", "Qual abordagem é melhor?", ["Pesquisa direcionada com campo e valor", "Pesquisa de uma palavra solta", "Criar uma role", "Rodar uma agregação"], 0, "Filtros combinados dão resultado preciso."],
        ["Uma pesquisa retorna 8.000 resultados.", "O que fazer primeiro?", ["Adicionar filtros para refinar", "Aceitar o resultado como está", "Apagar a pesquisa", "Criar uma política"], 0, "Refinar é o passo natural quando o resultado é amplo demais."],
        ["Você faz a mesma pesquisa toda segunda-feira.", "O que ajuda?", ["Salvar a pesquisa", "Digitar de novo sempre", "Exportar para planilha todo dia", "Criar uma source"], 0, "Pesquisas salvas economizam tempo e evitam erros."],
        ["Você erra o nome de um campo ao digitar.", "Qual recurso ajuda a evitar isso?", ["Preenchimento automático", "Agregação", "Provisionamento", "Sign Off"], 0, "O autocompletar sugere campos e valores válidos."]],
      u: ["gProf", "docs"] },
    { d: "d3", t: "Modelagem de acesso e roles", rs: "Como agrupar acessos em roles, manter tudo organizado e evitar a explosão de roles.",
      ob: ["Definir tarefas do dono de negócio no modelo de roles", "Otimizar dados para modelagem com IA", "Descrever ciência de dados, entitlements, clusters e análise de grupos de pares", "Criar roles comuns e especializadas a partir de role insights", "Descobrir roles por pesquisa", "Criar roles com escopo automático", "Manter roles precisas", "Criar e manter roles manualmente", "Evitar a proliferação de roles"],
      an: "Pense em uniformes: em vez de entregar peça por peça a cada funcionário, você tem o 'kit do caixa', o 'kit do estoquista'. Uma role é o kit de acessos de uma função.",
      s: [["Entitlement, access profile e role", "O entitlement é um direito de acesso básico em um sistema. O access profile junta entitlements de uma única source. A role junta access profiles de várias sources e representa uma função de negócio, usada em provisionamento automático e em pedidos de acesso."],
        ["Descobrir roles com ajuda da IA", "O ISC analisa os acessos reais e agrupa pessoas parecidas (grupos de pares). Se 47 pessoas de Finanças têm os mesmos 12 acessos, isso sugere uma role. Roles comuns valem para muita gente; as especializadas, para casos específicos. Os 'role insights' ajudam a criar e a manter essas roles."],
        ["Manter organizado", "Sem cuidado, surgem roles demais, parecidas e esquecidas: é a proliferação de roles (role sprawl). Roles bem definidas deixam as certificações mais simples, pois revisar poucas roles é muito mais fácil do que revisar milhares de acessos soltos. O dono de negócio tem papel central em dizer o que cada role deve conter."]],
      pt: ["Entitlement < access profile < role.", "Grupos de pares ajudam a descobrir roles reais.", "Poucas roles bem cuidadas facilitam certificações."],
      er: ["Criar uma role para cada pessoa.", "Deixar roles antigas sem dono e sem revisão."],
      g: [["role", "Pacote de access profiles que representa uma função de negócio."], ["grupo de pares", "Pessoas com perfil e acessos parecidos."], ["role sprawl", "Proliferação de roles parecidas e esquecidas."], ["role insights", "Recomendações do ISC para criar e manter roles."]],
      f: { k: "camadas", i: ["Role (função de negócio)", "Access profiles (pacotes por sistema)", "Entitlements (direitos básicos)"], c: "Cada nível agrupa o de baixo: entitlements formam access profiles, e estes formam roles." },
      q: [["Um analista financeiro precisa de acesso a três sistemas diferentes.", "Qual é a forma mais escalável de modelar?", ["Access profile por sistema, reunidos em uma role", "Entitlements soltos para cada pessoa", "Uma source por analista", "Uma campanha de certificação"], 0, "A role agrupa access profiles de várias sources."],
        ["O ISC mostra 47 pessoas de Finanças com os mesmos 12 acessos.", "O que isso indica?", ["Uma boa candidata a role comum", "Um erro de agregação", "Um conflito de SoD", "Uma fonte duplicada"], 0, "A análise de grupos de pares sugere roles."],
        ["A empresa tem 600 roles parecidas e ninguém sabe qual usar.", "Qual é o problema?", ["Proliferação de roles", "Falta de correlação", "Falta de VA", "Excesso de pesquisas"], 0, "É o role sprawl, que deve ser evitado."],
        ["Quem define o que uma role de Vendas deve conter?", "Qual é o melhor responsável?", ["O dono de negócio da função, apoiado pela TI", "Qualquer pessoa aleatória", "Apenas o fornecedor da ferramenta", "O recém-contratado"], 0, "O dono de negócio tem papel central no modelo de roles."]],
      u: ["gProf", "acc"] },
    { d: "d4", t: "Gestão de conformidade: certificações e políticas", rs: "Como revisar acessos e definir o que é inaceitável.",
      ob: ["Escolher o melhor tipo de certificação", "Criar campanhas baseadas em pesquisa e em filtro", "Configurar e pré-visualizar campanhas", "Acompanhar campanhas ativas", "Criar políticas gerais a partir de pesquisas", "Configurar políticas de separação de funções"],
      an: "Uma campanha de certificação é como o inventário de fim de ano numa loja: alguém confere se tudo o que está registrado ainda existe e ainda faz sentido.",
      s: [["Campanhas de certificação", "É um processo de revisão em que revisores aprovam ou revogam acessos. Campanhas criadas por pesquisa podem ser de Identities (revisar acessos de pessoas específicas) ou de Access Items (revisar roles, access profiles ou entitlements nas pessoas que os têm). Também há campanhas por gerente e por dono de source."],
        ["Decisões e conclusão", "Cada revisor decide manter ou revogar, ou passar o item para outro revisor. Depois de decidir tudo, faz o Sign Off. Quando todos assinam, a campanha termina; se houve revogações, entra na fase de remediation, em que os acessos são removidos."],
        ["Políticas", "Uma política SoD usa duas listas de acessos conflitantes: quem tem acesso a uma lista não pode ter à outra, e cada lista aceita até 50 entitlements. A general policy nasce de uma pesquisa e serve para achar problemas de dados ou condições inaceitáveis."]],
      pt: ["Identities revisa pessoas; Access Items revisa o acesso em quem o tem.", "Sign Off conclui; revogação leva à remediação.", "SoD: duas listas conflitantes, máximo de 50 entitlements cada."],
      er: ["Esquecer o Sign Off e deixar a revisão pendente.", "Montar uma política SoD com uma lista só."],
      g: [["Sign Off", "Etapa em que o revisor conclui a revisão."], ["remediation", "Fase em que os acessos revogados são removidos."], ["SoD", "Separation of Duties: separação de funções."], ["general policy", "Política criada a partir de uma pesquisa."]],
      f: { k: "fluxo", i: ["Criar e configurar a campanha", "Revisores decidem item por item", "Sign Off de cada revisor", "Remediação dos acessos revogados"], c: "O ciclo de uma campanha de certificação." },
      q: [["A auditoria quer revisar todo acesso a uma role sensível, quem quer que a tenha.", "Qual tipo de campanha?", ["Access Items", "Identities", "General policy", "Agregação"], 0, "Access Items revisa roles, access profiles e entitlements nas pessoas que os têm."],
        ["O revisor decidiu todos os itens da sua certificação.", "O que falta para concluir?", ["Fazer o Sign Off", "Rodar agregação", "Excluir a campanha", "Criar uma role"], 0, "O Sign Off conclui a revisão do revisor."],
        ["Três acessos foram revogados na campanha.", "O que acontece quando todos assinam?", ["Ela entra na fase de remediation", "Ela é apagada", "Ela reinicia", "Nada, termina sem etapas"], 0, "Revogações levam à remediação."],
        ["Uma lista de uma política SoD teria 70 entitlements.", "O que fazer?", ["Reorganizar: o limite é de 50 por lista", "Nada, não há limite", "Usar só 5", "Usar uma lista só"], 0, "Cada lista aceita no máximo 50 entitlements."]],
      u: ["gProf", "cert", "sod", "pol"] },
    { d: "d5", t: "Aproveitar os dados do ISC: insights e anomalias", rs: "Como transformar dados de acesso em decisões, achando acessos fora do padrão.",
      ob: ["Descrever Access Insights e o modelo de IA da SailPoint", "Otimizar dados para entitlements, clusters e grupos de pares", "Usar Access History, painel de outliers e pontuação", "Ver riscos de outliers e automatizar correção", "Criar painéis do Access Intelligence Center (AIC)"],
      an: "É como um sistema de alerta de cartão de crédito: ele aprende seu padrão de compras e avisa quando aparece algo muito fora do comum.",
      s: [["Insights", "O ISC usa os dados de pessoas, contas e acessos para mostrar tendências e riscos. Quanto melhor a qualidade do dado (atributos preenchidos, fontes corretas), melhores os resultados da análise."],
        ["Outliers", "Um outlier é uma pessoa cujo acesso foge do padrão do grupo dela, por exemplo alguém com acessos que nenhum colega de mesma função tem. O painel de outliers mostra a pontuação de cada caso para você priorizar."],
        ["Painéis e histórico", "O histórico de acesso mostra como o acesso de alguém mudou no tempo. O Access Intelligence Center (AIC) permite criar planilhas e painéis para acompanhar indicadores e reagir mais cedo."]],
      pt: ["Dado bom gera análise boa.", "Outlier é acesso fora do padrão do grupo.", "Histórico e painéis ajudam a agir cedo."],
      er: ["Analisar com dados incompletos e confiar no resultado.", "Ignorar outliers de pontuação alta."],
      g: [["outlier", "Pessoa com acessos que fogem do padrão do grupo."], ["Access History", "Histórico de como o acesso mudou."], ["AIC", "Access Intelligence Center: painéis e planilhas de acompanhamento."]],
      f: { k: "comparar", a: ["Acesso típico do grupo", "Maioria tem 10 acessos iguais", "Pontuação baixa", "Sem ação"], b: ["Outlier", "Tem acessos que ninguém do grupo tem", "Pontuação alta", "Investigar e corrigir"], c: "Outliers se destacam pela diferença em relação aos pares." },
      q: [["Um colega de Suporte tem acessos de administrador que ninguém mais da área tem.", "Como o ISC classifica esse caso?", ["Um outlier", "Uma role comum", "Uma fonte autoritativa", "Uma política SoD"], 0, "É um acesso fora do padrão do grupo."],
        ["O painel mostra vários outliers.", "Como priorizar?", ["Pela pontuação de cada caso", "Pela ordem alfabética", "Ignorando todos", "Pelo tamanho do nome"], 0, "A pontuação ajuda a priorizar os casos mais arriscados."],
        ["A análise de grupos de pares está estranha por falta de atributos nas identidades.", "O que otimizar?", ["A qualidade e o preenchimento dos dados", "A cor do painel", "O número de pesquisas salvas", "O limite de 50 entitlements"], 0, "Dados melhores dão análise melhor."],
        ["Você quer ver como o acesso de uma pessoa mudou nos últimos meses.", "Qual recurso?", ["Access History", "Sign Off", "Flat file", "Search query vazia"], 0, "O histórico de acesso mostra as mudanças no tempo."]],
      u: ["gProf", "docs"] },
    { d: "d6", t: "Solução de problemas", rs: "Como diagnosticar, ler registros e escalar um incidente com método.",
      ob: ["Diagnosticar e resolver problemas de provisionamento e sincronização", "Interpretar logs, trilhas de auditoria e mensagens de erro", "Solucionar problemas de conectores (Azure AD, LDAP, Workday e genéricos)", "Usar APIs e ferramentas de monitoramento", "Documentar e escalar incidentes"],
      an: "É como um médico: ele não chuta o remédio, pergunta os sintomas, olha os exames e só depois decide o tratamento, anotando tudo no prontuário.",
      s: [["Comece pelo sintoma", "Descreva o que acontece, a quem e desde quando. Veja se o problema afeta uma pessoa, um grupo ou todas as contas de uma source: isso indica se a causa é um dado, uma regra ou a conexão."],
        ["Procure nos registros", "Logs, trilhas de auditoria e mensagens de erro mostram o que o sistema tentou fazer e onde falhou. Em conectores (como diretórios, RH ou nuvem), os erros mais comuns são credencial vencida, rede bloqueada e permissão insuficiente."],
        ["Use as ferramentas e escale bem", "Ferramentas de monitoramento e as APIs ajudam a conferir o estado das coisas. Se não resolver, escale com um relato claro: o que ocorre, o que você testou e as evidências, pois isso acelera o suporte."]],
      pt: ["Sintoma primeiro, hipótese depois.", "Logs e auditoria mostram onde falhou.", "Escale com relato claro e evidências."],
      er: ["Mudar várias coisas ao mesmo tempo e perder o rastro do que resolveu.", "Escalar sem anexar evidências."],
      g: [["log", "Registro do que o sistema fez."], ["trilha de auditoria", "Histórico de quem mudou o quê e quando."], ["escalar", "Passar o caso para um nível de suporte mais especializado."]],
      f: { k: "fluxo", i: ["Descrever o sintoma", "Levantar hipóteses", "Conferir logs e auditoria", "Corrigir ou escalar com evidências"], c: "Um método simples de diagnóstico." },
      q: [["Só as contas de uma source pararam de atualizar.", "Qual a primeira hipótese razoável?", ["Problema na conexão ou credencial dessa source", "Falha em todos os usuários do ISC", "Excesso de roles", "Erro de busca"], 0, "O escopo restrito aponta para a conexão da source."],
        ["Você precisa saber o que o sistema tentou fazer em uma operação com erro.", "Onde olhar?", ["Logs e trilhas de auditoria", "Na cor do painel", "Em uma campanha", "Em uma role"], 0, "Os registros mostram o que aconteceu."],
        ["Um conector com o diretório falha com 'credencial inválida'.", "Qual causa é mais provável?", ["Senha ou token da conta de serviço vencido", "Muitas pesquisas salvas", "Falta de Sign Off", "Excesso de roles"], 0, "Credenciais vencidas são causa comum."],
        ["Você vai abrir um chamado ao suporte.", "O que incluir?", ["O sintoma, o que já testou e as evidências", "Só 'não funciona'", "Nada, o suporte descobre", "Uma foto da tela do vizinho"], 0, "Um relato claro acelera a solução."]],

T({ id: "sp-admin", forn: "SailPoint", nome: "Identity Security Administrator", tipo: "Certificação",
  nivel: "Intermediário. Recomendado de 1 a 3 anos de prática, conhecimento básico de IGA e do ISC.",
  regras: { q: 74, min: 120, nota: null, fmt: "DOMC", voltar: false, fonte: "gAdm", nota_txt: "A SailPoint não publica a nota de corte. A prova é online e supervisionada, em formato DOMC (uma alternativa por vez, Sim ou Não), sem voltar nem marcar questões, e termina quando o resultado fica definido." },
  doms: [["d1", "Plataforma"], ["d2", "Virtual appliances"], ["d3", "Identidade e ciclo de vida"], ["d4", "Provisionamento"], ["d5", "Gestão de acesso"], ["d6", "Governança"], ["d7", "Sources"], ["d8", "Conhecimentos gerais"]],
  mods: [
    { d: "d1", t: "A plataforma: pesquisa, API, workflows e segurança", rs: "Os recursos comuns do ISC que um administrador usa todos os dias.",
      ob: ["Identificar pesquisas válidas e seus resultados", "Criar e agendar relatórios de pesquisa", "Saber autenticar na API REST", "Identificar formas de monitorar o provisionamento", "Conhecer as administrações de segurança", "Entender casos de uso de event triggers", "Configurar as opções de autenticação no tenant", "Reconhecer os componentes de um workflow", "Saber fazer backup e restauração de configurações"],
      an: "A plataforma é o painel de controle de um prédio: tem a busca para achar qualquer coisa, os relatórios que chegam todo dia, as regras de quem entra em cada sala e o botão de emergência para restaurar tudo.",
      s: [["Procurar, relatar e monitorar", "A pesquisa localiza identidades, contas e acessos. Uma pesquisa útil pode virar relatório agendado, que chega sempre no mesmo horário. Para acompanhar o que o sistema está aplicando nos sistemas de destino, você monitora a atividade de provisionamento."],
        ["API, event triggers e workflows", "Para automatizar, o ISC tem uma API REST: você se autentica (por exemplo, com um token pessoal que gera um token de acesso) e faz chamadas. Event triggers avisam um serviço externo quando algo acontece. Um workflow junta um gatilho (o que inicia), ações (o que fazer) e um final."],
        ["Quem pode o quê, e como proteger", "Os níveis de usuário dão capacidades diferentes: nem todo mundo deve administrar. O tenant também permite configurar como as pessoas se autenticam. E, antes de mudanças grandes, é boa prática exportar as configurações, para poder restaurá-las se algo der errado."]],
      pt: ["Pesquisa vira relatório agendado.", "Workflow = gatilho + ações + fim.", "Exporte as configurações antes de mudanças grandes."],
      er: ["Dar nível de administrador a quem só precisa consultar.", "Mudar muita coisa sem um backup da configuração."],
      g: [["event trigger", "Aviso que o ISC envia a um serviço externo quando algo acontece."], ["workflow", "Sequência automática: gatilho, ações e fim."], ["API REST", "Forma de o ISC conversar com outros programas."], ["token", "Chave temporária que prova quem está fazendo a chamada."]],
      f: { k: "fluxo", i: ["Gatilho (algo acontece)", "Ação 1 (por exemplo, enviar e-mail)", "Ação 2 (por exemplo, criar tarefa)", "Fim do workflow"], c: "Os componentes de um workflow, na ordem em que acontecem." },
      q: [["Você precisa enviar toda segunda um relatório de contas novas.", "O que faz?", ["Criar uma pesquisa e agendá-la como relatório", "Fazer uma agregação manual", "Criar uma role", "Rodar uma campanha"], 0, "Pesquisas podem virar relatórios agendados."],
        ["Um sistema externo precisa ser avisado quando uma conta é criada.", "Qual recurso usar?", ["Event trigger", "Sign Off", "Flat file", "General policy"], 0, "Event triggers notificam serviços externos."],
        ["Você vai refazer várias configurações do tenant.", "Qual cuidado é recomendado?", ["Exportar a configuração antes", "Apagar tudo e recomeçar", "Pedir senha a todos", "Desativar a API"], 0, "Ter backup permite restaurar em caso de erro."],
        ["Um fluxo automático inicia com um evento e executa duas ações.", "Quais são os componentes?", ["Gatilho, ações e fim", "Source, schema e conector", "Role, perfil e política", "VA, cluster e chave"], 0, "Um workflow tem gatilho, ações e final."]],
      u: ["gAdm", "docs"] },
    { d: "d2", t: "Virtual appliances (VA)", rs: "A pequena máquina que liga o ISC aos sistemas dentro da sua rede.",

        ["Primeiros passos para consertar", "Verifique se o VA aparece como saudável, se a rede permite a comunicação e se o problema afeta todas as sources do cluster ou só uma. Se todas falham, a causa provavelmente está no VA ou na rede, e não na source."]],
      pt: ["VA = ponte entre o ISC e a rede interna.", "VAs formam clusters usados pelas sources.", "Se todas as sources do cluster falham, olhe o VA e a rede."],

      g: [["VA", "Virtual appliance: máquina virtual que liga o ISC à sua rede."], ["cluster", "Grupo de VAs que trabalham juntos."], ["conexão direta", "Source que fala com o sistema por meio de um VA."]],
      f: { k: "fluxo", i: ["ISC na nuvem", "Cluster de VAs na sua rede", "Source (diretório, banco, app)"], c: "O VA fica entre a nuvem e os sistemas internos." },
      q: [["Cinco sources do mesmo cluster falham ao mesmo tempo.", "Onde investigar primeiro?", ["No VA ou na rede do cluster", "Em cada role", "Nas pesquisas salvas", "Nas campanhas"], 0, "Falha em todas indica causa comum: VA ou rede."],
        ["Você quer saber se o VA está funcionando.", "O que verificar?", ["O estado de saúde do VA no ISC", "A cor do painel", "Quantas roles existem", "O número de certificações"], 0, "A saúde do VA é acompanhada no ISC."],
        ["Uma source usa conexão direta.", "O que ela precisa de um VA?", ["Um cluster com conectividade até a source", "Um arquivo .csv", "Uma política SoD", "Um lifecycle state"], 0, "A direct connection usa o cluster de VA escolhido."],
        ["Alguém pergunta o que é um VA.", "Qual resposta está certa?", ["Uma máquina virtual na rede que liga o ISC a sistemas internos", "Um tipo de role", "Um relatório", "Uma campanha"], 0, "O VA é a ponte para os sistemas internos."]],
      u: ["gAdm", "src"] },
    { d: "d3", t: "Identidades e ciclo de vida", rs: "Identity profiles, mapeamentos e lifecycle states, que mudam acessos conforme a fase da pessoa.",

      an: "A identidade é a ficha da pessoa; o ciclo de vida é a etapa dela na empresa (candidato, ativo, afastado, desligado). Cada etapa libera ou retira chaves.",
      s: [["Identity profile e mapeamentos", "O identity profile define como os atributos da conta de uma source (em geral o RH) viram atributos da identidade: nome, cargo, gestor, departamento. Cada atributo tem um mapeamento: pode vir direto da fonte ou de uma regra. O perfil também influencia como as pessoas dele se autenticam."],
        ["Lifecycle states", "Um lifecycle state descreve a fase da identidade, como ativa ou inativa. Dentro de cada estado você pode definir o que acontece com acessos: conceder access profiles ou roles, habilitar ou desabilitar contas. Assim o acesso acompanha a fase da pessoa sem pedidos manuais."],
        ["O atributo do estado", "O estado atual da identidade fica guardado em um atributo próprio na nuvem. Ele é o que o sistema consulta para saber em qual fase a pessoa está e quais ações aplicar."]],
      pt: ["Identity profile mapeia a fonte para a identidade.", "Lifecycle state decide acessos por fase.", "O estado atual fica em um atributo da identidade."],
      er: ["Mapear atributos de menos e não conseguir identificar pessoas.", "Esquecer o que o estado 'inativo' deve remover."],
      g: [["identity profile", "Define como os atributos da fonte viram atributos da identidade."], ["lifecycle state", "Fase da identidade que dispara ações de acesso."], ["mapeamento", "Regra de qual dado alimenta qual atributo."]],
      f: { k: "fluxo", i: ["Pré-contratação", "Ativo", "Afastado", "Desligado"], c: "Exemplo de estados de ciclo de vida, cada um com suas ações de acesso." },
      q: [["Quando alguém é desligado, o acesso deve ser retirado automaticamente.", "O que usar?", ["Lifecycle state com ações de provisionamento", "Uma pesquisa salva", "Uma agregação manual", "Uma role vazia"], 0, "Cada estado pode conceder ou remover acessos."],
        ["O departamento da pessoa deve vir do RH.", "Onde configurar?", ["No mapeamento de atributos do identity profile", "Em uma campanha", "Em uma política SoD", "No VA"], 0, "Os mapeamentos ligam o dado da fonte ao atributo da identidade."],
        ["O sistema precisa saber em que fase a pessoa está.", "O que consulta?", ["O atributo de lifecycle state da identidade", "O log do VA", "O número de roles", "O relatório de auditoria"], 0, "O estado atual fica em um atributo da identidade."],
        ["O RH é a referência para nome e cargo.", "O que isso indica sobre a source de RH?", ["É a fonte autoritativa do identity profile", "É um flat file temporário", "É uma role", "É um VA"], 0, "A source autoritativa alimenta o identity profile."]],

    { d: "d4", t: "Provisionamento", rs: "Como o ISC aplica concessões e remoções de acesso nos sistemas de destino.",
      ob: ["Entender como o provisionamento é disparado", "Conhecer os componentes do provisionamento de uma source", "Entender os canais de provisionamento e seus usos", "Entender como habilitar logs e níveis de log de conectores", "Saber em quais objetos pesquisar para achar erros de provisionamento"],
      an: "É como um gerente que manda um recado ao sistema de destino: 'crie esta conta' ou 'remova aquele direito'. O provisionamento é o recado e a entrega.",
      s: [["O que dispara", "O provisionamento começa quando algo muda: a pessoa mudou de estado de ciclo de vida, uma role foi atribuída, um pedido de acesso foi aprovado ou uma remoção foi solicitada."],
        ["Como é feito", "Uma source tem componentes de provisionamento, como as políticas que definem quais atributos vão numa conta nova. O canal pode ser direto (o conector aplica a mudança), por ticket (um sistema de chamados cria uma tarefa) ou manual (alguém aplica e confirma). O flat file não suporta provisionamento."],
        ["Quando dá erro", "Para investigar, ative o log do conector no nível necessário (com cuidado, pois logs detalhados pesam) e procure na atividade de provisionamento os eventos da pessoa e da source afetadas."]],
      pt: ["Disparadores: mudança de estado, role, pedido, remoção.", "Canais: direto, ticket e manual.", "Logs detalhados ajudam, mas devem ser usados com cuidado."],
      er: ["Esperar provisionamento em uma source flat file.", "Deixar o log detalhado ligado para sempre."],
      g: [["política de provisionamento", "Define quais atributos vão na criação de uma conta."], ["canal", "A forma como a mudança chega ao destino."], ["disparador", "Evento que inicia o provisionamento."]],
      f: { k: "hub", m: "Provisionamento", i: ["Mudança de estado", "Role atribuída", "Pedido aprovado", "Remoção solicitada"], c: "Eventos que costumam disparar o provisionamento." },
      q: [["A pessoa mudou de ativa para inativa e o acesso deveria ter sido removido.", "O que pode ter disparado?", ["A mudança de lifecycle state", "Uma pesquisa salva", "Uma agregação de entitlements", "Um relatório"], 0, "Mudança de estado dispara ações de acesso."],
        ["Um sistema legado não tem conector.", "Qual canal seria mais apropriado para registrar o acesso?", ["Ticket ou ação manual com confirmação", "Provisionamento direto", "Uma role", "Um VA"], 0, "Sem conector, usa-se ticket ou manual."],
        ["Para entender por que a conta de uma pessoa não foi criada.", "O que fazer?", ["Ver os eventos de provisionamento dessa pessoa e source", "Excluir a source", "Criar outra campanha", "Fazer um backup"], 0, "A atividade de provisionamento mostra o que houve."],
        ["O que acontece se uma source é flat file?", "O provisionamento é...", ["Não suportado", "Suportado e em tempo real", "Obrigatório", "Feito por VA"], 0, "O flat file só lê e agrega."]],

    { d: "d5", t: "Gestão de acesso: entitlements, roles e atribuição automática", rs: "Tipos de acesso e como as roles podem ser atribuídas sozinhas.",
      ob: ["Reconhecer como os níveis de usuário concedem capacidades", "Entender o básico de entitlements", "Entender os tipos de acesso que a SailPoint suporta", "Saber como funcionam as atribuições automáticas de role", "Solucionar erros de gestão de acesso"],
      an: "Os acessos são como chaves: o entitlement é uma chave solta, o access profile é um chaveiro de um prédio, e a role é a bolsa com os chaveiros de todos os prédios que a função usa.",
      s: [["Tipos de acesso", "Entitlements são direitos básicos em uma source. Access profiles reúnem entitlements de uma só source. Roles reúnem access profiles de várias sources. Todos podem ser aprovados ou revogados em certificações."],
        ["Atribuição automática", "Em vez de conceder uma role a cada pessoa, você pode definir critérios: por exemplo, 'quem for do departamento Vendas e estiver ativo recebe a role Vendedor'. Se os dados mudarem, a atribuição acompanha."],
        ["Quando dá errado", "Se uma role não foi atribuída, confira os critérios, a qualidade dos atributos usados e se houve erro de provisionamento depois. A causa quase sempre está em um dado diferente do esperado."]],
      pt: ["Entitlement < access profile < role.", "Atribuição automática usa critérios e dados.", "Erros costumam vir de dados diferentes do esperado."],

      g: [["entitlement", "Direito de acesso básico em uma source."], ["atribuição automática", "Role concedida quando a pessoa cumpre critérios."], ["nível de usuário", "Define o que uma pessoa pode fazer no ISC."]],
      f: { k: "camadas", i: ["Role", "Access profile", "Entitlement"], c: "Três níveis de acesso, do mais amplo ao mais básico." },
      q: [["Todos os vendedores ativos devem receber a role Vendedor sozinhos.", "O que configurar?", ["Atribuição automática por critérios", "Uma campanha", "Um flat file", "Um VA"], 0, "Critérios concedem a role automaticamente."],
        ["Uma pessoa deveria ter recebido uma role automática e não recebeu.", "O que checar primeiro?", ["Os critérios e os atributos usados", "A cor do tema", "O número de VAs", "O relatório de auditoria de ontem"], 0, "A causa mais comum é o dado diferente do esperado."],
        ["Qual item reúne entitlements de uma só source?", "Qual é?", ["Access profile", "Role", "Identity profile", "Workflow"], 0, "Access profile é de uma única source."],
        ["Nem todo usuário deve administrar o ISC.", "O que controla isso?", ["Os níveis de usuário", "As pesquisas salvas", "Os VAs", "Os conectores"], 0, "Os níveis de usuário concedem capacidades diferentes."]],

      ob: ["Reconhecer as etapas básicas de pedidos de acesso", "Entender a reatribuição de trabalho", "Entender o fluxo de aprovação", "Conhecer o ciclo de vida de uma certificação", "Entender os tipos de certificação suportados", "Entender os tipos de política suportados"],
      an: "É o processo de uma biblioteca: você pede um livro, o bibliotecário aprova, e uma vez por ano conferem se todos os livros emprestados ainda estão com quem deveriam.",
      s: [["Pedido e aprovação", "Um pedido de acesso passa por aprovadores, que podem ser o gestor, o dono do item, um grupo de governança, entre outros. Se um aprovador não puder agir, o trabalho pode ser reatribuído a outra pessoa."],
        ["Ciclo de uma certificação", "A campanha é criada e fica ativa; os revisores decidem manter ou revogar cada item; cada um faz o Sign Off; se houve revogações, a campanha vai para a remediação. Os tipos incluem campanhas por gerente, por dono de source e por pesquisa."],

      q: [["O aprovador de um pedido está de férias.", "O que se faz?", ["Reatribuir o trabalho a outra pessoa", "Cancelar o pedido para sempre", "Excluir a source", "Mudar o VA"], 0, "A reatribuição evita que o pedido fique parado."],
        ["Uma campanha terminou com três revogações.", "Qual fase vem depois do Sign Off?", ["Remediação", "Criação", "Pesquisa", "Agregação"], 0, "Revogações vão para a remediação."],

      an: "Uma source é uma fonte de notícias. A agregação é o jornal que chega todo dia; a correlação é descobrir de quem é cada notícia (cada conta).",
      s: [["Tipos de agregação e o processo", "A agregação de contas traz as contas e a agregação de entitlements traz os direitos de acesso. Elas podem ser manuais ou agendadas. O schema da conta define quais atributos a source compartilha com o ISC, e a configuração de correlação liga cada conta a uma identidade."],
        ["Contas não correlacionadas e exclusão", "Se uma conta não encontra a identidade, ela fica não correlacionada e precisa ser tratada: corrigir dados ou ajustar a regra. Quando uma conta some da fonte, o ISC lida com a exclusão no processo de agregação, e isso afeta o que aparece nas identidades."],
        ["Conectores e erros", "Há conexão direta por conector (via VA), SaaS e arquivos; sem conector pronto, usa-se Delimited File ou Generic. Os erros de source aparecem nos registros da própria source, e a causa comum é credencial vencida ou rede bloqueada."]],
      pt: ["Duas agregações: contas e entitlements.", "Conta sem dono = não correlacionada.", "Sem conector pronto, use Delimited File ou Generic."],

      f: { k: "fluxo", i: ["Agregar contas e entitlements", "Aplicar schema e correlação", "Tratar contas não correlacionadas", "Monitorar erros da source"], c: "O caminho dos dados de uma source até uma identidade." },
      q: [["Muitas contas ficam sem identidade depois da carga.", "O que investigar?", ["A configuração de correlação e a qualidade dos atributos", "O limite de 50 entitlements", "O Sign Off", "O tipo de campanha"], 0, "A correlação depende de atributos mapeados corretos."],
        ["Você precisa trazer os direitos de acesso (grupos) de uma source.", "Qual agregação?", ["De entitlements", "De contas apenas", "De políticas", "De roles"], 0, "Há uma agregação específica de entitlements."],
        ["Um sistema não tem conector pronto.", "O que usar?", ["Delimited File ou Generic", "Uma role", "Uma campanha", "Um workflow"], 0, "Esses tipos servem quando não há conector predefinido."],

      u: ["gAdm", "api", "fnd"] },

      an: "Autenticação é mostrar o crachá na portaria ('sou eu'). Autorização é a lista de salas que o crachá abre ('posso entrar aqui'). Federação é um crachá aceito em vários prédios.",
      s: [["IGA e conformidade", "IGA (Identity Governance and Administration) é o conjunto de práticas e ferramentas para controlar quem tem acesso a quê. Conformidade é cumprir regras externas ou internas, como leis e normas, e poder provar isso com registros."],
        ["Autenticação e autorização", "Autenticar é provar quem você é (senha, biometria, código). Autorizar é decidir o que você pode fazer depois de provado. Um erro comum é achar que estar logado dá acesso a tudo."],
        ["Métodos e federação", "Os métodos incluem senha, códigos de uso único, aplicativos de aprovação e biometria; o uso de mais de um fator é a autenticação multifator (MFA). Na federação, uma organização confia na autenticação feita por outra, permitindo um login só para vários sistemas."]],
      pt: ["Autenticação = quem é você; autorização = o que pode fazer.", "MFA combina mais de um fator.", "Federação = confiar no login feito por outro."],

      g: [["IGA", "Governança e administração de identidades."], ["MFA", "Autenticação com mais de um fator."], ["federação", "Confiança entre organizações para o login."]],
      f: { k: "comparar", a: ["Autenticação", "Prova quem você é", "Exemplo: senha e código", "Vem primeiro"], b: ["Autorização", "Define o que você pode fazer", "Exemplo: ver, editar, aprovar", "Vem depois"], c: "Autenticação e autorização respondem perguntas diferentes." },
      q: [["Uma pessoa entra com senha e código no celular.", "O que isso exemplifica?", ["Autenticação multifator", "Autorização por role", "Federação sem login", "Agregação"], 0, "Senha mais código são dois fatores."],

        ["Um login único vale em vários sistemas de empresas parceiras.", "Qual conceito?", ["Federação", "Agregação", "Remediação", "Provisionamento"], 0, "Federação é confiança no login feito por outro."],

T({ id: "sp-eng", forn: "SailPoint", nome: "Identity Security Engineer", tipo: "Certificação",

  doms: [["d1", "Identidade e ciclo de vida"], ["d2", "Provisionamento"], ["d3", "Gestão de acesso"], ["d4", "Virtual appliances"], ["d5", "Sources"], ["d6", "Conhecimentos gerais"], ["d7", "Plataforma"], ["d8", "Governança"], ["d9", "Arquitetura"], ["d10", "Regras e transforms"]],
  mods: [
    { d: "d1", t: "Modelo de identidades e ciclo de vida", rs: "Como desenhar identity profiles e estados para funcionários e não funcionários.",
      ob: ["Ordenar os passos para implantar um modelo de identidades a partir de uma fonte de RH", "Determinar um desenho válido de ciclo de vida", "Definir quantos identity profiles e a prioridade entre eles", "Determinar quais atributos mapear, incluindo o mínimo", "Propor estados e ações para entradas e saídas", "Configurar a correlação de gestores", "Recomendar soluções para mudanças de estado", "Mapear regras em atributos de identidade"],
      an: "Projetar o modelo é como montar um organograma antes de contratar: você decide os tipos de crachá (funcionário, terceiro), quem é gestor de quem e o que cada fase libera.",
      s: [["Do RH ao modelo", "O passo a passo típico: ligar a fonte de RH como autoritativa, definir o identity profile, mapear os atributos mínimos (identificador único, nome, e-mail, gestor, departamento, datas) e só então aplicar o ciclo de vida. Pular o mínimo faz a correlação falhar depois."],
        ["Funcionários e não funcionários", "Quando há dois públicos com fontes diferentes (RH e um cadastro de terceiros), em geral há um identity profile para cada, com uma prioridade que decide qual vale se a mesma pessoa aparecer nos dois. Os atributos mínimos precisam existir em ambos."],
        ["Estados e gestores", "Para entradas e saídas, desenhe estados como pré-contratação, ativo, afastado, desligado e pós-desligamento, cada um com ações claras. A correlação de gestor liga a identidade ao gestor dela, o que alimenta aprovações e certificações. Regras em atributos devem ser o último recurso: prefira mapeamentos e transforms."]],
      pt: ["Atributos mínimos antes do ciclo de vida.", "Mais de uma fonte: um identity profile por público e prioridade.", "Gestor correlacionado alimenta aprovações."],
      er: ["Mapear poucos atributos e quebrar a correlação.", "Usar regra quando um mapeamento simples resolveria."],
      g: [["prioridade", "Define qual identity profile vence quando há conflito."], ["joiner/leaver", "Quem entra e quem sai da empresa."], ["correlação de gestor", "Ligação da identidade ao seu gestor."]],
      f: { k: "fluxo", i: ["Fonte de RH autoritativa", "Identity profile e atributos mínimos", "Estados de ciclo de vida", "Correlação de gestores"], c: "A ordem para construir o modelo de identidades." },
      q: [["Uma empresa tem RH para funcionários e um cadastro separado de terceiros.", "Qual abordagem é comum?", ["Um identity profile por público, com prioridade", "Apenas uma role", "Nenhum profile", "Um flat file único"], 0, "Públicos distintos costumam ter profiles distintos, com prioridade."],
        ["O gestor de cada pessoa precisa aprovar pedidos.", "O que configurar?", ["Correlação de gestor", "Um VA", "Uma política SoD", "Um workflow vazio"], 0, "A correlação liga a identidade ao gestor."],
        ["Alguém será contratado mês que vem e precisa de e-mail no dia 1.", "Qual estado ajuda?", ["Um estado de pré-contratação com ações específicas", "Desligado", "Afastado", "Nenhum"], 0, "Estados de pré-contratação permitem preparar acessos."],
        ["O que não pode faltar nos mapeamentos iniciais?", "Quais atributos?", ["Os mínimos para identificar e correlacionar", "Apenas a foto", "Só o departamento", "Nenhum"], 0, "Sem o mínimo a correlação falha."]],
      u: ["gEng", "acc"] },
    { d: "d2", t: "Provisionamento avançado", rs: "Resultados esperados, políticas, múltiplas contas e como testar.",
      ob: ["Deduzir o resultado do provisionamento a partir do estado atual", "Boas práticas para testar o provisionamento", "Boas práticas com várias contas", "Solucionar erros de provisionamento", "Criar políticas e contas em uma source", "Comportamento com diferentes atribuições de role", "Boas práticas gerais", "Requisitos de sincronização de atributos", "Opções de políticas de provisionamento"],
      an: "É como pedir um prato num restaurante: se o prato já está na mesa, não se pede de novo; se o pedido mudou, ajusta-se. O provisionamento compara o que existe com o que deveria existir.",
      s: [["Estado atual e resultado", "Antes de aplicar uma mudança, o ISC considera o que a pessoa já tem. Pedir um acesso que já existe não cria duplicata; retirar um acesso que vem de duas roles só o remove quando nenhuma delas o exige mais. Saber disso evita surpresas."],
        ["Políticas, contas e sincronização", "A política de provisionamento define quais atributos vão numa conta criada. Algumas sources permitem várias contas por pessoa, o que exige regras claras para não gerar bagunça. A sincronização de atributos atualiza dados nas contas quando a identidade muda, e depende de configuração e de dados corretos."],
        ["Testar e investigar", "Teste em ambiente separado, com poucas pessoas e casos de borda (quem tem duas roles, quem sai e volta). Em caso de erro, leia a mensagem, veja o evento da pessoa e a configuração da política antes de mexer em qualquer outra coisa."]],
      pt: ["O resultado depende do que já existe.", "Várias contas exigem regras claras.", "Teste com poucos casos e em ambiente separado."],
      er: ["Testar direto em produção com todos os usuários.", "Mexer em várias políticas ao mesmo tempo ao investigar."],
      g: [["sincronização de atributos", "Atualizar nas contas os dados que mudaram na identidade."], ["política de provisionamento", "Define atributos da conta ao criar."], ["caso de borda", "Situação rara que costuma revelar falhas."]],
      f: { k: "comparar", a: ["Tem hoje", "Role A dá o acesso X", "Role B dá o acesso X", "Estado atual: tem X"], b: ["Remover a role A", "Role B ainda exige X", "Resultado: X continua", "Só sai com a role B"], c: "O acesso só é removido quando nenhuma role o exige." },
      q: [["Uma pessoa recebe o acesso X por duas roles. Você remove uma delas.", "O que acontece com X?", ["Continua, pois a outra role ainda o exige", "É removido de imediato", "Duplica", "Vira outro acesso"], 0, "Acessos de várias origens só saem quando nenhuma os exige."],
        ["Você vai testar uma mudança na política de provisionamento.", "Qual prática é melhor?", ["Testar em ambiente separado, com poucos casos", "Aplicar em todos de uma vez", "Não testar", "Testar só depois do erro"], 0, "Testes pequenos e isolados reduzem risco."],
        ["O departamento mudou no RH e as contas precisam refletir.", "Qual mecanismo atualiza as contas?", ["Sincronização de atributos", "Uma campanha", "Um relatório", "Uma pesquisa"], 0, "A sincronização leva os dados da identidade às contas."],
        ["Um provisionamento deu erro.", "Qual é o melhor primeiro passo?", ["Ler a mensagem e o evento da pessoa", "Excluir a source", "Trocar o VA", "Criar nova role"], 0, "Comece pelas evidências."]],
      u: ["gEng", "src"] },
    { d: "d3", t: "Gestão de acesso: lembretes, escalonamento e segmentos", rs: "Como cobrar quem demora e como mostrar a cada grupo só os acessos que ele pode pedir.",
      ob: ["Boas práticas para testar a gestão de acesso", "Configurar lembretes e padrões de escalonamento", "Saber quais casos de uso aplicam segmentos"],
      an: "Lembretes são o colega que cutuca com educação; o escalonamento é avisar o chefe quando o prazo passa; segmentos são vitrines por público: cada grupo de pessoas só vê, na loja de acessos, as prateleiras que foram feitas para ele.",
      s: [["Lembretes", "Aprovações e revisões que ficam paradas atrapalham todo mundo. Você configura lembretes automáticos para quem não respondeu, em intervalos razoáveis, sem encher a caixa de e-mail."],
        ["Escalonamento", "Se o prazo passa, o item pode ser escalado a outra pessoa, como o gestor do aprovador. O padrão precisa ser claro para ninguém ser pego de surpresa."],
        ["Segmentos de pedido de acesso", "Na documentação do ISC, segmentos servem para limitar itens de acesso específicos a um conjunto de pessoas. Um segmento representa identidades agrupadas por atributos de identidade (por exemplo, país ou departamento). Você adiciona itens de acesso ao segmento, e esses itens passam a ficar visíveis, na Central de Pedidos, só para as pessoas do segmento. Quem está em um segmento vê os itens dele e também os itens que não pertencem a nenhum segmento. Se um item pode ser visto, quem o vê pode pedi-lo para quem estiver autorizado a pedir. Casos de uso típicos: acessos específicos de uma unidade ou país, e catálogos diferentes por público. Atenção às regras do recurso: cada atributo aceita um valor por segmento, e uma comparação do tipo OU exige criar dois segmentos."]],
      pt: ["Lembretes evitam pendências.", "Escalonamento define o que fazer depois do prazo.", "Segmentos limitam quais itens de acesso cada grupo vê para pedir."],
      er: ["Enviar lembretes demais e ser ignorado.", "Criar segmentos sem testar com uma conta de uma pessoa de cada público."],
      g: [["segmento", "Grupo de identidades, definido por atributos, que enxerga certos itens de acesso para pedir."], ["escalonamento", "Passar um item a outra pessoa quando o prazo vence."], ["lembrete", "Aviso automático para quem ainda não agiu."]],
      f: { k: "fluxo", i: ["Item pendente", "Lembrete ao responsável", "Prazo vence", "Escalonado ao gestor"], c: "Um padrão comum de lembretes e escalonamento." },
      q: [["Um aprovador não responde há dias.", "O que ajuda?", ["Lembretes e escalonamento", "Apagar o pedido", "Trocar a source", "Excluir a role"], 0, "Lembretes e escalonamento destravam pendências."],
        ["Acessos específicos do Brasil devem aparecer para pedido só para quem é do Brasil.", "Qual recurso aplica?", ["Segmentos de pedido de acesso", "Flat file", "General policy", "Event trigger"], 0, "Segmentos limitam quais itens cada grupo vê para pedir."],
        ["Você configurou um segmento novo.", "Como validar?", ["Entrar como uma pessoa do segmento e conferir o que aparece na Central de Pedidos", "Esperar reclamações", "Só olhar a tela de configuração", "Excluir e recriar"], 0, "Teste com a visão de uma pessoa real do público."],
        ["O prazo de uma revisão passou.", "O que define o padrão do que acontece depois?", ["A configuração de escalonamento", "A cor do tema", "O número de VAs", "O tamanho da role"], 0, "O escalonamento define o próximo passo."]],
      u: ["gEng", "docs"] },
    { d: "d4", t: "Virtual appliances: implantação e operação", rs: "Como instalar, proteger, monitorar e dar alta disponibilidade aos VAs.",
      ob: ["Funcionalidades comuns do VA", "Solucionar erros do VA", "Opções de implantação e configuração", "Melhor local para implantar VAs na rede", "Passos de configuração do VA", "Vantagens e desvantagens de HA/DR", "Finalidade e local dos arquivos de log", "Comandos comuns", "Chaves do VA e quando são geradas", "Configurações de rede", "Validar softwares instalados no VA"],
      an: "Se o VA é o carteiro do condomínio, você precisa decidir onde fica a portaria dele (rede), quantos carteiros ter (HA) e onde ele anota as entregas (logs).",
      s: [["Onde e quantos", "O VA deve ficar na rede que alcança as sources, com a comunicação de saída liberada para o ISC. Para não depender de uma única máquina, use mais de um VA por cluster. Distribuir VAs em locais diferentes ajuda na recuperação de desastres, ao custo de mais gestão."],
        ["Chaves, rede e o que instalar", "O VA tem chaves próprias, geradas durante a configuração do cluster, usadas para proteger a comunicação. Regras de rede mal configuradas são causa frequente de falha. Instalar softwares extras no VA só é válido se a documentação permitir, pois ele é um appliance gerenciado."],
        ["Operar e investigar", "Os arquivos de log do VA mostram o que ele fez e os erros recentes; comandos comuns de diagnóstico verificam rede e serviços. Em falha geral de um cluster, comece pela rede e pelo estado do VA antes de revisar as sources."]],
      pt: ["Mais de um VA por cluster.", "Rede e chaves são fontes comuns de erro.", "Não instale software extra sem a documentação permitir."],
      er: ["Instalar ferramentas aleatórias no VA.", "Bloquear a saída de rede do VA para o ISC."],
      g: [["HA", "Alta disponibilidade: continuar funcionando se uma peça falhar."], ["DR", "Recuperação de desastres."], ["appliance", "Máquina fechada e gerenciada pelo fabricante."]],
      f: { k: "camadas", i: ["Sources internas", "Cluster com 2 ou mais VAs", "Rede com saída liberada", "ISC na nuvem"], c: "Camadas entre as sources internas e o ISC." },
      q: [["Um único VA cai e várias sources falham.", "Qual boa prática teria evitado?", ["Mais de um VA no cluster", "Menos sources", "Mais roles", "Mais campanhas"], 0, "Redundância evita ponto único de falha."],
        ["O VA não consegue falar com o ISC.", "O que verificar primeiro?", ["As regras de rede de saída", "As roles", "A cor do painel", "O workflow"], 0, "A rede é causa frequente."],
        ["Alguém quer instalar um programa qualquer no VA.", "Como avaliar?", ["Conferir se a documentação permite, pois é um appliance gerenciado", "Instalar sem pensar", "Pedir senha ao vizinho", "Ignorar"], 0, "Um appliance gerenciado não deve receber software livremente."],
        ["Onde ver o que o VA fez e os erros recentes?", "Onde?", ["Nos arquivos de log do VA", "Na tela de campanhas", "No relatório de roles", "Na pesquisa salva"], 0, "Os logs registram a atividade do VA."]],
      u: ["gEng", "src"] },
    { d: "d5", t: "Sources avançadas: AD, JDBC e integrações", rs: "Como ligar diretórios e bancos, escolher conectores e controlar quais dados vão para a nuvem.",
      ob: ["Tipos de integração com service desk", "Opções para conectar ao Active Directory", "Opções para conectar a banco de dados com JDBC", "Tipos de conectores e quando usar cada um", "Fluxo recomendado de agregação", "Solucionar erros comuns de conectividade", "Controlar quais dados vão para a nuvem e onde ficam"],
      an: "Cada tipo de conector é um tipo de tomada: Active Directory usa uma, banco de dados usa outra. Escolher o plugue certo evita curto-circuito.",
      s: [["Escolher o conector", "Para o Active Directory e outros diretórios, há conectores próprios que falam com o servidor pela rede. Para bancos de dados, o conector JDBC conecta usando as tabelas e consultas que você configurar. Sistemas sem conector usam Delimited File ou Generic, e sistemas de chamados (service desk) podem receber os pedidos de provisionamento como tickets."],
        ["Fluxo de agregação", "Conecte e teste a conexão, defina o schema (quais atributos trazer), configure a correlação e execute a agregação de contas e, depois, de entitlements. Use delta e partição quando houver muito dado, e agende as cargas."],
        ["O que sobe para a nuvem", "Traga apenas os atributos necessários: o schema e os filtros controlam o que sobe. Menos dados significa menos exposição e menos ruído. Em erros de conectividade, comece por credenciais, rede e permissões da conta de serviço."]],
      pt: ["Conector certo para cada tipo de sistema.", "Teste a conexão antes de agregar.", "Traga só os atributos necessários."],
      er: ["Trazer todos os atributos 'por garantia'.", "Culpar o ISC antes de checar credenciais e rede."],
      g: [["JDBC", "Forma padrão de programas Java falarem com bancos de dados."], ["schema", "Lista de atributos da conta que a source traz."], ["service desk", "Sistema de chamados e tickets."]],
      f: { k: "fluxo", i: ["Criar a source e testar a conexão", "Definir schema e correlação", "Agregar contas", "Agregar entitlements e agendar"], c: "O fluxo recomendado para uma source nova." },
      q: [["Você precisa ler contas de um banco de dados relacional.", "Qual conector?", ["JDBC", "Delimited File sempre", "Workflow", "Role"], 0, "O conector JDBC conecta a bancos de dados."],
        ["A empresa quer que o ISC leve só alguns atributos.", "Onde controlar?", ["No schema e nos filtros da source", "Na pesquisa salva", "Na campanha", "No VA"], 0, "O schema define o que sobe à nuvem."],
        ["Uma conexão com o AD falha após mudar a senha da conta de serviço.", "Qual a causa mais provável?", ["Credencial desatualizada na source", "Falta de roles", "Excesso de campanhas", "Erro de busca"], 0, "Credenciais velhas são causa comum."],
        ["Pedidos de acesso devem virar tickets para equipes manuais.", "Que integração?", ["De service desk", "De agregação delta", "De general policy", "De event trigger vazio"], 0, "Integrações de service desk criam tickets."]],
      u: ["gEng", "src", "api"] },
    { d: "d6", t: "Conhecimentos gerais para engenheiros", rs: "IGA, conformidade, federação, microsserviços e APIs REST.",
      ob: ["Definir e entender IGA", "Entender conformidade", "Comparar autenticação e autorização", "Entender federação", "Métodos de autenticação", "Vantagens da arquitetura de microsserviços", "Saber usar APIs REST gerais"],
      an: "Microsserviços são uma cozinha com várias estações: se a do forno quebra, a de saladas continua. Uma API REST é o garçom: você faz o pedido no formato certo e recebe o prato.",
      s: [["Conceitos de base", "IGA controla quem tem acesso; conformidade é seguir regras e provar. Autenticação prova quem você é; autorização decide o que pode fazer. Federação é confiar no login feito em outra organização, e métodos de autenticação vão de senha a MFA e biometria."],
        ["Microsserviços", "Em vez de um programa único e gigante, a plataforma é dividida em serviços pequenos. Vantagens: cada parte pode crescer ou ser atualizada sozinha, uma falha fica isolada e novas funções chegam mais rápido."],
        ["APIs REST", "Uma API REST usa endereços (URLs) e verbos como GET (ler), POST (criar), PUT e PATCH (alterar) e DELETE (apagar). As respostas costumam vir em JSON. Para usá-la você se autentica, envia a requisição e interpreta o código de resposta."]],
      pt: ["Microsserviços isolam falhas e crescem por partes.", "REST usa URLs e verbos (GET, POST, PUT, PATCH, DELETE).", "Respostas em JSON e códigos de status."],
      er: ["Confundir PUT e POST.", "Ignorar o código de resposta da API."],
      g: [["API REST", "Interface que usa URLs e verbos para ler e alterar dados."], ["JSON", "Formato de texto para trocar dados."], ["microsserviço", "Pequeno serviço independente."]],
      f: { k: "tabela", h: ["Verbo", "Para que serve"], l: [["GET", "Ler informação"], ["POST", "Criar algo novo"], ["PUT/PATCH", "Alterar algo existente"], ["DELETE", "Remover"]], c: "Verbos HTTP comuns em APIs REST." },
      q: [["Um serviço de uma plataforma falha, mas o resto continua funcionando.", "Qual vantagem isso ilustra?", ["Isolamento de falhas dos microsserviços", "Mais senhas", "Menos usuários", "Mais VAs"], 0, "Microsserviços isolam falhas."],
        ["Você quer apenas ler dados por uma API.", "Qual verbo?", ["GET", "DELETE", "POST", "PUT"], 0, "GET lê informação."],
        ["Uma API responde em formato de texto estruturado com chaves e valores.", "Que formato é esse, comum em REST?", ["JSON", "PDF", "MP3", "BMP"], 0, "JSON é o formato mais comum."],
        ["Um login é aceito por empresas parceiras.", "Qual conceito?", ["Federação", "Correlação", "Agregação", "Remediação"], 0, "Federação é confiança entre organizações."]],
      u: ["gEng", "docs"] },
