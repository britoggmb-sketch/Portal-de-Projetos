      ob: ["Boas práticas para testar plataformas", "Solucionar erros de plataforma", "Componentes do API Gateway e autenticação", "Determinar critérios de pesquisa em um modelo de identidade", "Associar métodos de autenticação ao funcionamento", "Recomendar configurações de e-mail", "Boas práticas de monitoramento", "Ordenar passos de um workflow", "Determinar o acesso certo para uma tarefa", "Onde achar registros de atividade"],
      an: "É a oficina do carro: antes de entregar, você testa; ao ter defeito, lê os indicadores do painel; e dá a chave só do que o mecânico precisa.",
      s: [["Testar e dar o acesso certo", "Teste em ambientes separados antes de produção. Ao conceder acesso a alguém para uma tarefa, dê o menor nível que a resolve: quem só consulta não precisa administrar."],
        ["API Gateway e autenticação", "Chamadas à API passam por um gateway, que recebe a requisição e confere o token. Para obter o token você usa credenciais (por exemplo, um token pessoal ou um cliente de API) e pede um token de acesso, que vale por um tempo."],
        ["E-mail, monitoramento e registros", "Configure e-mails de notificação com remetente e modelos adequados, e monitore o ambiente com alertas para falhas e atrasos. Quando algo falha, os registros de atividade mostram quem fez o quê, quando e com que resultado."]],

      g: [["API Gateway", "Porta de entrada das chamadas de API."], ["token de acesso", "Chave temporária de acesso à API."], ["monitoramento", "Acompanhar o estado e alertar sobre falhas."]],
      f: { k: "fluxo", i: ["Credencial (token pessoal)", "Pedir token de acesso", "Chamar a API pelo gateway", "Receber a resposta"], c: "Como uma chamada de API é autenticada." },
      q: [["Alguém só precisa consultar relatórios.", "Qual acesso conceder?", ["O menor que permita consultar", "O de administrador", "Nenhum", "O de outro usuário"], 0, "Menor privilégio suficiente."],
        ["Você precisa chamar a API do ISC.", "Qual é a sequência correta?", ["Credencial, token de acesso, chamada, resposta", "Chamada, credencial, token", "Resposta, chamada, token", "Token, credencial, resposta"], 0, "Autentica-se antes de chamar."],
        ["Uma operação falhou e você quer saber quem fez o quê.", "Onde olhar?", ["Nos registros de atividade", "Na cor do tema", "Na role", "Na pesquisa vazia"], 0, "Os registros mostram a atividade."],
        ["Uma mudança vai afetar muita gente.", "Qual boa prática?", ["Testar antes em ambiente separado", "Aplicar direto em produção", "Esperar a falha", "Desligar alertas"], 0, "Teste antes de produção."]],
      u: ["gEng", "docs"] },
    { d: "d8", t: "Governança para engenheiros: preparar certificações, aprovadores e SoD", rs: "Como preparar dados antes das campanhas e escolher aprovadores.",
      ob: ["Boas práticas para preparar certificações", "Escolher o tipo de certificação para um requisito", "Identificar opções de aprovadores", "Conhecer SoD e quando aplicar", "Solucionar problemas de dados em certificações"],
      an: "Antes de um inventário você arruma a prateleira e etiqueta as caixas; antes de uma certificação, você limpa os dados e define os responsáveis.",
      s: [["Preparar antes de lançar", "Uma certificação só funciona se os dados estão bons: gestores corretos, donos de sources definidos e itens com nomes compreensíveis. Escolha o escopo e o tipo de campanha que combinam com a necessidade (por gerente, por dono de source, por pesquisa)."],
        ["Aprovadores", "Em pedidos de acesso, os aprovadores podem ser o gestor, o dono do item, um grupo de governança ou outras opções. Escolha quem tem contexto para decidir, evitando cadeias longas demais."],
        ["SoD e problemas de dados", "Use SoD onde a combinação de dois acessos cria risco, como cadastrar e aprovar o mesmo pagamento. Se uma certificação mostra itens estranhos ou revisores vazios, normalmente o problema está nos dados (gestor faltando, source sem dono)."]],
      pt: ["Dados bons antes de campanhas.", "Aprovador deve ter contexto.", "SoD para combinações arriscadas."],
      er: ["Lançar campanha com gestores desatualizados.", "Criar cadeias de aprovação longas demais."],
      g: [["grupo de governança", "Conjunto de pessoas responsáveis por decisões de acesso."], ["dono de source", "Pessoa responsável por um sistema."], ["escopo", "O que uma campanha inclui."]],
      f: { k: "fluxo", i: ["Limpar dados (gestores, donos)", "Escolher tipo e escopo", "Lançar a campanha", "Tratar problemas de dados"], c: "Preparar o terreno antes de uma certificação." },
      q: [["Uma campanha deve ir para os gestores, mas muitos não estão cadastrados.", "O que fazer antes?", ["Corrigir a correlação de gestores", "Lançar assim mesmo", "Excluir a campanha", "Trocar o VA"], 0, "Dados corretos de gestor são pré-requisito."],
        ["Duas permissões não devem coexistir na mesma pessoa.", "O que usar?", ["Política SoD", "Lembrete", "Segmento", "Flat file"], 0, "SoD trata acessos conflitantes."],
        ["Uma certificação mostra itens sem revisor.", "Qual causa provável?", ["Falha nos dados, como gestor ou dono ausente", "Excesso de roles", "Mais VAs", "Pesquisa mal salva"], 0, "Problemas de dados são a causa mais comum."],
        ["Você precisa escolher quem aprova um pedido de acesso.", "Quem escolher?", ["Quem tem contexto para decidir", "Qualquer pessoa", "Ninguém", "O fornecedor"], 0, "Contexto é o critério."]],
      u: ["gEng", "cert", "sod"] },
    { d: "d9", t: "Arquitetura do ISC: segurança, redundância e multi-tenant", rs: "Como a plataforma protege dados, evita falhas e atende muitos clientes.",
      ob: ["Segurança e criptografia de dados em repouso e em trânsito", "Componentes do ISC e suas redundâncias", "Recursos de comunicação entre sistemas", "Identificar URLs válidas", "Descrever o processamento multi-tenant"],
      an: "É um prédio com vários apartamentos: a estrutura é a mesma, mas cada morador tem a sua porta e ninguém entra no apartamento do outro.",
      s: [["Proteger os dados", "Dados em trânsito (de um ponto a outro) são protegidos por criptografia na comunicação, como o TLS. Dados em repouso (guardados) também são criptografados. Assim, mesmo que alguém intercepte ou acesse o armazenamento, não consegue ler o conteúdo."],
        ["Redundância e URLs", "Os componentes da plataforma têm redundância: se um falha, outro assume. Cada organização usa endereços próprios do seu ambiente; ao ver uma URL, confira se ela pertence ao domínio esperado e ao ambiente certo antes de usar."],
        ["Multi-tenant", "Em multi-tenant, vários clientes (tenants) usam a mesma infraestrutura, mas os dados de cada um ficam separados e isolados. Isso reduz custo e facilita atualizações, sem misturar informações entre clientes."]],
      pt: ["Criptografia em trânsito e em repouso.", "Componentes redundantes evitam parada.", "Multi-tenant: infraestrutura compartilhada, dados isolados."],
      er: ["Confiar em URLs que parecem corretas sem conferir.", "Achar que multi-tenant mistura os dados."],
      g: [["TLS", "Protocolo que criptografa a comunicação."], ["em repouso", "Dados guardados em disco ou banco."], ["multi-tenant", "Muitos clientes na mesma infraestrutura, com dados isolados."]],
      f: { k: "comparar", a: ["Em trânsito", "Dados viajando pela rede", "Protegidos por TLS"], b: ["Em repouso", "Dados guardados", "Protegidos por criptografia de armazenamento"], c: "Duas situações em que os dados devem estar criptografados." },
      q: [["Dados saem do ISC para um sistema pela internet.", "Como são protegidos?", ["Criptografia em trânsito, como TLS", "Sem proteção", "Só com senha curta", "Por e-mail"], 0, "TLS protege a comunicação."],
        ["Vários clientes usam a mesma plataforma.", "O que mantém os dados deles separados?", ["O isolamento do modelo multi-tenant", "Nada", "A cor do tema", "O número de VAs"], 0, "Cada tenant tem dados isolados."],
        ["Um componente falha e outro assume.", "Qual característica?", ["Redundância", "Correlação", "Remediação", "Agregação"], 0, "Redundância mantém o serviço."],
        ["Você recebe uma URL parecida com a do ISC.", "O que fazer?", ["Conferir se o domínio é o esperado antes de usar", "Clicar sem ver", "Digitar a senha", "Encaminhar a todos"], 0, "Confira o domínio, pois URLs falsas existem."]],
      u: ["gEng", "docs"] },
    { d: "d10", t: "Regras e transforms", rs: "Como transformar dados com transforms (JSON) e quando usar regras em BeanShell.",
      ob: ["Reconhecer o que é possível em um cenário de transformação e escolher transforms", "Identificar regras e personalizações disponíveis", "Desenvolver sintaxe e semântica de regras", "Boas práticas na escolha entre regras e transforms"],
      an: "Um transform é uma receita pronta de liquidificador (junte, corte, bata); uma regra é cozinhar de improviso. A receita pronta é mais segura e fácil de repetir.",
      s: [["Transforms: a primeira escolha", "Um transform é uma instrução em JSON que pega um valor e o modifica, por exemplo juntar nome e sobrenome, deixar tudo em minúsculas, pegar um pedaço do texto ou escolher o primeiro valor válido. Eles ficam ligados aos mapeamentos de atributos e são fáceis de ler e testar."],
        ["Regras: quando a receita não basta", "Regras (rules) são pequenos programas, escritos em BeanShell, uma linguagem parecida com Java, que personalizam comportamentos quando os transforms não bastam. Têm mais poder, mas são mais difíceis de manter e testar."],
        ["Qual escolher", "A boa prática é começar pelo transform e só recorrer à regra quando a lógica não couber nele. Nas regras, preste atenção à sintaxe e ao tratamento de casos vazios, pois um valor nulo inesperado é o erro mais comum."]],
      pt: ["Prefira transforms (JSON) a regras.", "Regras usam BeanShell e dão mais poder e mais manutenção.", "Trate valores vazios."],
      er: ["Escrever regra para algo que um transform resolve.", "Esquecer o caso de valor vazio."],
      g: [["transform", "Instrução em JSON que modifica um valor."], ["BeanShell", "Linguagem de script parecida com Java usada em regras."], ["nulo", "Valor ausente."]],
      f: { k: "tabela", h: ["Situação", "Melhor escolha"], l: [["Juntar nome e sobrenome", "Transform"], ["Deixar o e-mail em minúsculas", "Transform"], ["Lógica complexa com várias fontes", "Regra"], ["Formatar uma data", "Transform"]], c: "Regra geral para escolher entre transform e regra." },
      q: [["Você precisa deixar um e-mail em minúsculas.", "O que usar?", ["Um transform", "Uma regra em BeanShell", "Um VA", "Uma campanha"], 0, "É uma operação simples de transform."],
        ["A lógica exige consultar várias fontes e decidir de forma complexa.", "O que pode ser necessário?", ["Uma regra", "Um flat file", "Uma pesquisa salva", "Um segmento"], 0, "Quando o transform não basta, usa-se regra."],
        ["Em qual linguagem as regras do ISC são escritas?", "Qual?", ["BeanShell", "Python", "HTML", "SQL puro"], 0, "As regras usam BeanShell, parecida com Java."],
        ["Uma regra falha com um valor ausente.", "Qual cuidado faltou?", ["Tratar valores nulos", "Mais roles", "Mais VAs", "Mais campanhas"], 0, "Valores nulos inesperados são causa comum."]],
      u: ["gEng", "docs"] }
  ] });

T({ id: "sp-iiq", forn: "SailPoint", nome: "IdentityIQ Associate", tipo: "Certificação",
  nivel: "Iniciante no IdentityIQ (versão instalada na empresa). Cobre os cursos IdentityIQ Introduction e Essentials.",
  regras: { q: 43, min: 90, nota: null, fmt: "DOMC", voltar: false, fonte: "gIiq", nota_txt: "A SailPoint não publica a nota de corte. A prova é online e supervisionada, em formato DOMC (uma alternativa por vez, Sim ou Não), sem voltar nem marcar questões, e termina quando o resultado fica definido." },
  doms: [["d1", "Conceitos básicos"], ["d2", "Applications"], ["d3", "Modelagem de identidades"], ["d4", "Modelagem de acesso"], ["d5", "Governança"], ["d6", "Pedidos de usuários"], ["d7", "Provisionamento"]],
  mods: [
    { d: "d1", t: "Conceitos básicos do IdentityIQ", rs: "Termos, componentes, tarefas, workflows e regras, em linguagem simples.",
      ob: ["Explicar o propósito da segurança de identidade", "Definir termos comuns do IdentityIQ", "Associar objetos comuns ao seu uso", "Descrever os componentes", "Comparar tarefas e workflows", "Saber como a plataforma modela o negócio", "Identificar usos de regras nos processos"],
      an: "O IdentityIQ é como um escritório de contabilidade: tem arquivos (objetos), funcionários que fazem trabalhos agendados (tarefas), processos com várias etapas (workflows) e pequenas instruções especiais (regras).",
      s: [["O que é e para que serve", "O IdentityIQ (IIQ) é a plataforma de segurança de identidade da SailPoint que a própria empresa instala e administra. Ele reúne dados de pessoas e contas dos sistemas, controla o acesso, revisa permissões e aplica regras de conformidade."],
        ["Peças principais", "Applications representam os sistemas conectados. Identidades guardam o que se sabe de cada pessoa. Tarefas (tasks) são trabalhos que rodam sozinhos ou sob demanda, como carregar contas. Workflows são processos com várias etapas e decisões, como aprovar um pedido."],
        ["Regras", "Regras (rules) são pequenos trechos de código que ajustam o comportamento em pontos específicos do processo, quando a configuração normal não basta. Elas existem para casos especiais e devem ser usadas com moderação."]],
      pt: ["IIQ é instalado e administrado pela empresa.", "Tarefa = trabalho único; workflow = processo com etapas.", "Regras só para casos especiais."],
      er: ["Usar workflow quando uma tarefa simples resolveria.", "Usar regras para tudo."],
      g: [["application", "Sistema conectado ao IIQ."], ["task", "Trabalho que roda sozinho ou sob demanda."], ["workflow", "Processo com várias etapas e decisões."], ["rule", "Trecho de código para ajustes especiais."]],
      f: { k: "hub", m: "IdentityIQ", i: ["Applications", "Identidades", "Tarefas", "Workflows", "Regras"], c: "As peças principais do IdentityIQ." },
      q: [["Você precisa carregar as contas de um sistema toda noite.", "O que usa?", ["Uma tarefa agendada", "Um workflow de aprovação", "Uma role", "Uma política"], 0, "Tarefas executam trabalhos agendados."],
        ["Um pedido precisa passar por três aprovações em sequência.", "O que modela isso?", ["Um workflow", "Uma tarefa de agregação", "Um schema", "Uma identidade"], 0, "Workflows modelam processos com etapas."],
        ["O IIQ difere da versão em nuvem por...", "Qual diferença?", ["Ser instalado e administrado pela própria empresa", "Não ter identidades", "Não usar applications", "Não ter workflows"], 0, "O IIQ é gerenciado pelo cliente."],
        ["Um ajuste muito específico não cabe na configuração padrão.", "O que pode ser usado?", ["Uma regra", "Um logotipo", "Uma pesquisa vazia", "Um e-mail"], 0, "Regras tratam casos especiais."]],
      u: ["gIiq", "docs"] },
    { d: "d2", t: "Applications: conectar os sistemas", rs: "Schemas, correlação, agregação e contas sem dono.",
      ob: ["Descrever uso e atributos dos schemas de conta e de grupo", "Explicar as opções de correlação", "Identificar o propósito de uma application", "Identificar propriedades de atributos em um schema", "Identificar opções de tarefa de agregação e otimização", "Identificar configurações que dependem do conector", "Definir o propósito de regras comuns de application e conector", "Descrever como resolver contas não correlacionadas", "Descrever o propósito e os benefícios do Rapid Setup"],
      an: "Uma application é uma tomada na parede da empresa; o schema é o manual do que a tomada entrega (voltagem, formato); a agregação é ligar o aparelho e a correlação é descobrir de quem é.",
      s: [["O que é uma application", "É a definição de um sistema conectado ao IIQ, como o diretório de usuários, o RH ou um aplicativo de negócio. O conector é a peça que sabe falar com aquele tipo de sistema, e algumas configurações dependem do conector escolhido."],
        ["Schemas e correlação", "O schema de conta lista os atributos de cada conta; o schema de grupo lista os atributos dos grupos (direitos de acesso). Cada atributo tem propriedades, como se é obrigatório ou se é usado para identificar. A correlação liga cada conta a uma identidade, usando regras e atributos."],
        ["Agregação e contas sem dono", "A tarefa de agregação carrega contas e grupos. Há opções para torná-la mais eficiente. Contas que não acham a identidade ficam não correlacionadas e precisam ser resolvidas, manualmente ou ajustando a correlação. O Rapid Setup é um assistente que acelera a configuração inicial de applications e identidades."]],
      pt: ["Schema de conta e de grupo.", "Correlação liga conta e identidade.", "Conta sem dono precisa ser resolvida."],
      er: ["Ignorar contas não correlacionadas.", "Criar schemas com atributos desnecessários."],
      g: [["schema", "Lista de atributos que um sistema fornece."], ["correlação", "Ligar uma conta à identidade certa."], ["Rapid Setup", "Assistente de configuração rápida."], ["agregação", "Carga de contas e grupos."]],
      f: { k: "fluxo", i: ["Criar a application e o conector", "Definir schemas de conta e grupo", "Configurar a correlação", "Rodar a agregação"], c: "Os passos básicos para integrar um sistema." },
      q: [["Após uma agregação, várias contas estão sem identidade.", "O que são?", ["Contas não correlacionadas", "Roles", "Workflows", "Tarefas"], 0, "Contas sem identidade são não correlacionadas."],
        ["Você precisa saber quais atributos de grupo a application traz.", "Onde ver?", ["No schema de grupo", "Na tarefa de refresh", "Na certificação", "Na role"], 0, "O schema de grupo lista os atributos."],
        ["Uma empresa quer acelerar a configuração inicial.", "Qual recurso ajuda?", ["Rapid Setup", "Uma regra de BeanShell", "Um relatório", "Um fórum"], 0, "O Rapid Setup acelera a configuração."],
        ["Qual tarefa carrega contas e grupos de uma application?", "Qual?", ["Agregação", "Certificação", "Provisionamento", "Pedido"], 0, "A agregação carrega os dados."]],
      u: ["gIiq", "docs"] },
    { d: "d3", t: "Modelagem de identidades: IdentityCube", rs: "O que o IIQ guarda sobre cada pessoa e como mantém isso atualizado.",
      ob: ["Listar as informações contidas nos IdentityCubes", "Contrastar atributo de identidade e atributo de conta", "Descrever grupos e populações", "Entender como o acesso ao IIQ é concedido", "Explicar a correlação de gestor", "Descrever as opções comuns do Identity Refresh"],
      an: "O IdentityCube é o prontuário da pessoa: dados cadastrais, contas, permissões, histórico e quem é o chefe, tudo numa pasta só.",
      s: [["O IdentityCube", "É o registro completo de uma identidade: atributos, contas (links) nos sistemas, direitos de acesso, roles, gestor, e histórico de revisões. Ele reúne o que antes estava espalhado em vários sistemas."],
        ["Atributo de identidade e de conta", "O atributo de conta vive em um sistema (por exemplo, o departamento no RH). O atributo de identidade é o valor consolidado no IdentityCube, que pode vir de uma ou mais contas. Entender essa diferença evita erros de mapeamento."],
        ["Populações, gestor e refresh", "Grupos e populações juntam identidades por critério, úteis para aplicar regras. A correlação de gestor liga a pessoa ao seu chefe. A tarefa Identity Refresh recalcula os cubes: atualiza atributos, atribui roles, detecta violações. Ela tem várias opções, e rodar tudo sempre é caro."]],
      pt: ["IdentityCube = prontuário completo da pessoa.", "Atributo de conta ≠ atributo de identidade.", "Identity Refresh recalcula os cubes."],
      er: ["Confundir os dois tipos de atributo.", "Rodar um refresh completo sem necessidade."],
      g: [["IdentityCube", "Registro consolidado de uma identidade."], ["link", "Conta de uma identidade em um sistema."], ["população", "Grupo de identidades por critério."], ["Identity Refresh", "Tarefa que recalcula as identidades."]],
      f: { k: "hub", m: "IdentityCube", i: ["Atributos", "Contas (links)", "Roles", "Gestor", "Histórico"], c: "O que um IdentityCube reúne sobre uma pessoa." },
      q: [["O departamento aparece no RH e no IdentityCube.", "O do RH é qual tipo?", ["Atributo de conta", "Atributo de identidade", "Role", "Workflow"], 0, "O atributo de conta vive no sistema de origem."],
        ["Você mudou uma regra e quer reavaliar todas as identidades.", "Qual tarefa?", ["Identity Refresh", "Agregação de grupos", "Certificação", "Pedido"], 0, "O refresh recalcula as identidades."],
        ["O que um IdentityCube guarda?", "Qual?", ["Atributos, contas, roles e gestor da pessoa", "Só o nome", "Só a foto", "Somente senhas"], 0, "Reúne os dados consolidados."],
        ["Você quer aplicar uma regra apenas a quem é de Finanças.", "O que usar?", ["Uma população", "Um schema", "Uma agregação", "Um e-mail"], 0, "Populações agrupam por critério."]],
      u: ["gIiq", "docs"] },
    { d: "d4", t: "Modelagem de acesso: catálogo e roles", rs: "Entitlement catalog, roles de negócio e de TI e como as pessoas as obtêm.",
      ob: ["Entender como entitlements entram no catálogo", "Descrever o propósito do catálogo de entitlements", "Comparar roles de negócio e de TI", "Descrever como roles são usadas no IIQ", "Descrever como identidades obtêm roles"],
      an: "O catálogo de entitlements é o cardápio completo: cada prato tem nome, descrição e dono. As roles são combos: o de negócio é 'executivo' (o que a pessoa faz), o de TI é 'kit técnico' (as permissões).",
      s: [["Catálogo de entitlements", "Quando a agregação traz grupos e permissões, eles entram no catálogo. Ali você pode dar nomes claros, descrições e donos aos itens, o que ajuda quem pede e quem aprova a entender o que cada acesso significa."],
        ["Roles de negócio e de TI", "A role de negócio descreve uma função (por exemplo, Analista Financeiro) e junta o que a pessoa precisa para trabalhar. A role de TI agrupa permissões técnicas de sistemas. Uma role de negócio costuma conter roles de TI."],
        ["Como a pessoa obtém roles", "Roles podem ser atribuídas manualmente (alguém decide), automaticamente por regras e critérios, ou detectadas (a pessoa já tem as permissões que a role exige). O IIQ diferencia esses casos para saber o que provisionar."]],
      pt: ["Catálogo = nome, descrição e dono para cada acesso.", "Role de negócio contém roles de TI.", "Obtém-se roles por atribuição ou detecção."],
      er: ["Deixar entitlements sem descrição.", "Misturar o que é função de negócio e o que é técnico."],
      g: [["catálogo de entitlements", "Lista descritiva dos acessos."], ["role de negócio", "Role que descreve uma função."], ["role de TI", "Role com permissões técnicas."], ["atribuição", "Dar a role à pessoa."]],
      f: { k: "camadas", i: ["Role de negócio (função)", "Roles de TI (conjuntos técnicos)", "Entitlements (permissões no catálogo)"], c: "As roles de negócio contêm roles de TI, que contêm entitlements." },
      q: [["Quem aprova não entende o que 'GRP_FIN_01' significa.", "O que ajuda?", ["Dar nome e descrição no catálogo de entitlements", "Criar mais agregações", "Excluir o item", "Adicionar um workflow"], 0, "O catálogo explica o acesso."],
        ["'Analista Financeiro' descreve uma função.", "Qual tipo de role?", ["De negócio", "De TI", "De fornecedor", "De rede"], 0, "Funções de negócio são roles de negócio."],
        ["A pessoa já tem as permissões da role, sem receber a role.", "Como o IIQ classifica?", ["Role detectada", "Role atribuída manualmente", "Role excluída", "Role de teste"], 0, "Roles podem ser detectadas."],
        ["Por que separar role de negócio e de TI?", "Qual motivo?", ["Separar a função do conjunto técnico facilita a manutenção", "Para gastar mais tempo", "Para esconder dados", "Para duplicar acessos"], 0, "A separação organiza e facilita manutenção."]],
      u: ["gIiq", "docs"] },
    { d: "d5", t: "Governança: certificações e políticas", rs: "Fases de uma certificação, como iniciá-las e quais políticas existem.",
      ob: ["Identificar as fases da certificação e o que acontece em cada uma", "Descrever o propósito das certificações e como iniciá-las", "Identificar exemplos de políticas comuns", "Descrever o processo de detecção de políticas"],
      an: "A certificação é a conferência periódica de chaves: a empresa pergunta ao gestor 'esta pessoa ainda precisa destas chaves?'. A política é a regra da casa que diz o que nunca deve acontecer.",
      s: [["Para que servem e como começam", "Certificações são revisões em que os responsáveis confirmam ou revogam acessos. Podem ser agendadas (por exemplo, todo trimestre), iniciadas manualmente ou disparadas por eventos (como a mudança de função da pessoa)."],
        ["Fases", "Uma certificação passa por fases: preparação (staged), ativa (os revisores decidem), contestação (challenge, quando alguém pode contestar uma revogação), revogação (os acessos são removidos) e término. Nem todas são usadas em toda certificação."],
        ["Políticas e detecção", "Políticas definem condições proibidas, como a separação de funções (um mesmo usuário não pode ter dois acessos conflitantes) e outras políticas de conta e de risco. A detecção acontece ao reavaliar as identidades, e as violações podem ser corrigidas ou aceitas com exceção."]],
      pt: ["Certificação: agendada, manual ou por evento.", "Fases: preparação, ativa, contestação, revogação, fim.", "Violações podem ser corrigidas ou aceitas com exceção."],
      er: ["Esquecer a fase de revogação e deixar acessos revogados no sistema.", "Aceitar violações sem registro de justificativa."],
      g: [["staged", "Fase de preparação de uma certificação."], ["challenge", "Fase em que se pode contestar uma revogação."], ["violação", "Quando uma regra de política é descumprida."]],
      f: { k: "fluxo", i: ["Preparação (staged)", "Ativa (revisão)", "Contestação (challenge)", "Revogação", "Término"], c: "As fases de uma certificação no IdentityIQ." },
      q: [["A certificação precisa ocorrer todo trimestre sem intervenção.", "Como iniciar?", ["De forma agendada", "Só manualmente", "Nunca", "Por e-mail"], 0, "Certificações podem ser agendadas."],
        ["Um revisor revogou um acesso e o dono quer contestar.", "Qual fase permite?", ["Contestação (challenge)", "Preparação", "Término", "Agregação"], 0, "A fase de contestação trata disso."],
        ["Uma pessoa tem dois acessos que não podem coexistir.", "Que tipo de política?", ["Separação de funções", "Política de senha", "Política de e-mail", "Política de backup"], 0, "SoD cuida de acessos conflitantes."],
        ["Quando as violações de política são detectadas?", "Quando?", ["Ao reavaliar as identidades", "Só quando o servidor desliga", "Nunca", "Somente em dezembro"], 0, "A detecção ocorre na reavaliação."]],
      u: ["gIiq", "docs"] },
    { d: "d6", t: "Pedidos de usuários e QuickLinks", rs: "Quem pode pedir o quê para quem, e os tipos de pedido.",
      ob: ["Entender como populações de QuickLink controlam funções de pedido", "Entender tipos e operações de pedidos de conta", "Descrever o processo de pedido de acesso", "Entender pedidos de criar, editar e autosserviço de identidade"],
      an: "O QuickLink é um botão do menu de um site: você só vê os botões que a empresa liberou para o seu perfil, e cada botão leva a um tipo de pedido.",
      s: [["QuickLinks e populações", "Um QuickLink é uma ação disponível no portal, como 'Solicitar acesso' ou 'Gerenciar senhas'. A população do QuickLink define quem pode usá-lo, e para quem: só para si, para sua equipe ou para qualquer pessoa."],
        ["Tipos de pedido de conta", "Há pedidos para criar, alterar, bloquear, desbloquear, ativar ou excluir contas, além de redefinir senhas. Cada operação passa pelas regras e pelas aprovações configuradas."],
        ["O processo e o autosserviço", "No pedido de acesso, a pessoa escolhe o item, justifica, passa pelas aprovações e, se aprovado, o IIQ provisiona. O autosserviço também inclui criar e editar identidades, conforme o que a empresa permite."]],
      pt: ["QuickLink é um botão que a população libera.", "Há pedidos de criar, alterar e excluir contas.", "Pedido: escolher, justificar, aprovar, provisionar."],
      er: ["Liberar QuickLinks demais a todos.", "Esquecer a justificativa no pedido."],
      g: [["QuickLink", "Atalho de uma ação do portal."], ["população de QuickLink", "Quem pode usar o atalho e para quem."], ["autosserviço", "A própria pessoa faz o pedido."]],
      f: { k: "fluxo", i: ["Escolher o QuickLink", "Escolher o item e justificar", "Aprovações", "Provisionamento"], c: "O caminho de um pedido de acesso no IdentityIQ." },
      q: [["Gestores devem pedir acesso para sua equipe, mas não para toda a empresa.", "O que controla?", ["A população do QuickLink", "O schema", "A tarefa de refresh", "A role de TI"], 0, "Populações definem quem pede para quem."],
        ["A pessoa esqueceu a senha de um sistema.", "Qual tipo de pedido?", ["Redefinição de senha", "Criar identidade", "Certificação", "Agregação"], 0, "Há pedidos de gerenciar senhas."],
        ["Depois da aprovação, o acesso precisa existir no sistema.", "O que acontece?", ["Provisionamento", "Contestação", "Detecção", "Correlação"], 0, "O provisionamento aplica o acesso."],
        ["Um pedido sem justificativa é rejeitado.", "Qual passo faltou?", ["Justificar o pedido", "Criar um schema", "Rodar um refresh", "Instalar o IIQ"], 0, "A justificativa ajuda os aprovadores."]],
      u: ["gIiq", "docs"] },
    { d: "d7", t: "Provisionamento no IdentityIQ", rs: "O que dispara o provisionamento, políticas, eventos de ciclo de vida e sincronização.",
      ob: ["Listar as ações que disparam o provisionamento", "Descrever o propósito das políticas de provisionamento", "Resumir o processo de provisionamento", "Explicar propósito e configuração de Lifecycle Events", "Explicar propósito e processo de sincronização de atributos", "Definir provisionamento"],
      an: "Provisionar é entregar a mercadoria depois que o pedido foi aprovado: a política diz o que vai na caixa, e o evento de ciclo de vida diz quando enviar.",
      s: [["O que é e o que dispara", "Provisionamento é criar, alterar ou remover contas e acessos nos sistemas. Ele é disparado por pedidos aprovados, revogações em certificações, atribuição de roles, eventos de ciclo de vida e sincronização de atributos."],
        ["Políticas e processo", "A política de provisionamento define quais campos são necessários e como preenchê-los ao criar uma conta. O processo cria um plano com as mudanças, executa pelos conectores (ou gera tarefas manuais) e confere o resultado."],
        ["Eventos de ciclo de vida e sincronização", "Lifecycle Events reagem a mudanças da identidade, como entrada, mudança de área ou saída, e iniciam ações. A sincronização de atributos replica nas contas as mudanças de dados da identidade, por exemplo um novo departamento."]],
      pt: ["Disparadores: pedido, revogação, role, evento, sincronização.", "Política define campos da conta.", "Lifecycle Events reagem a mudanças da pessoa."],

        ["Console e runtime", "O servidor tem duas faces: o console administrativo, onde você configura (por padrão em uma porta própria), e o servidor de execução, que atende os logins. Muitas configurações dependem do endereço-base (base URL) correto, pois ele aparece nas mensagens enviadas aos parceiros."],

      s: [["Qual é qual", "No PingFederate, 'conexão de SP' é aquela em que o PingFederate atua como IdP e envia asserções ao parceiro. 'Conexão de IdP' é aquela em que o PingFederate atua como SP e recebe asserções de um parceiro. O nome indica o parceiro, não o papel do PingFederate: esse é um ponto que costuma confundir."],
        ["Atributos", "O contrato de atributos lista quais dados a asserção leva (e-mail, nome, grupos). Os mapeamentos dizem de onde vem cada valor (do login, de um diretório ou de um banco). Enviar só o necessário é boa prática."],

      s: [["O servidor de autorização", "Com OAuth 2.0 e OpenID Connect 1.0, o PingFederate atua como servidor de autorização (AS). Aplicativos clientes pedem tokens, e ele os emite depois de autenticar e, quando cabe, de obter o consentimento da pessoa."],

        ["Atributos do usuário chegam vazios à asserção.", "O que verificar?", ["A configuração da data store", "A cor do tema", "O tamanho do disco", "Uma role"], 0, "Uma data store com falha causa atributos vazios."],

    { d: "d1", t: "Fundamentos de diretórios e LDAP", rs: "Entries, DN, atributos e as operações básicas de um diretório.",
      ob: ["Entender a árvore de diretório (DIT)", "Reconhecer DN, atributos e classes de objeto", "Conhecer as operações LDAP", "Entender o schema"],
      an: "Um diretório LDAP é como uma lista telefônica organizada em pastas: cada pessoa é uma ficha (entry) com um endereço completo que a distingue (DN).",

        ["Quem define quais atributos uma entry pode ter?", "O que define?", ["O schema e as classes de objeto", "O cliente", "A impressora", "O firewall"], 0, "Schema e classes definem isso."]],

    { d: "d2", t: "Instalação e configuração inicial", rs: "Instalar o servidor, interativo ou não, e começar a configurar com o dsconfig.",
      ob: ["Instalar em modo interativo e não interativo", "Habilitar criptografia na instalação", "Usar o dsconfig", "Entender requisitos e decisões iniciais"],

      s: [["Modos de instalação", "O servidor pode ser instalado em modo interativo, respondendo a perguntas, ou não interativo, informando tudo por parâmetros, o que é melhor para automação. Antes de instalar, revise as considerações de pré-instalação da documentação."],
        ["Criptografia desde o início", "Habilitar a criptografia na instalação garante que os dados gravados nos backends, no changelog e no banco de replicação sejam criptografados. Dados que já existiam antes de habilitar a criptografia precisam ser exportados e importados de novo para serem protegidos."],
        ["O dsconfig", "O dsconfig é a ferramenta de configuração. Tem três modos: interativo (menus), não interativo (um comando) e em lote (vários comandos de um arquivo). O modo em lote reduz conexões e é útil para automação."]],
      pt: ["Interativo para aprender; não interativo para repetir.", "Criptografe desde a instalação.", "dsconfig: interativo, não interativo e em lote."],
      er: ["Habilitar a criptografia depois e esquecer dos dados antigos.", "Configurar à mão o que poderia estar em um lote."],
      g: [["dsconfig", "Ferramenta de configuração do servidor."], ["modo em lote", "Executar vários comandos de um arquivo."], ["changelog", "Registro das mudanças do diretório."]],

        ["Os dados já existentes não foram criptografados depois de habilitar a criptografia.", "O que fazer?", ["Exportar e importar de novo", "Nada", "Reiniciar", "Trocar a senha"], 0, "Dados antigos precisam ser reimportados."],
        ["O que é o dsconfig?", "O que é?", ["A ferramenta de configuração", "Um backup", "Um log", "Um cliente de e-mail"], 0, "É a ferramenta de configuração."]],
      u: ["pdCfg", "pdInst", "pingCert"] },
    { d: "d3", t: "Backends, índices e dados", rs: "Onde os dados ficam, como acelerar as buscas e como importar e exportar.",
      ob: ["Entender backends", "Criar e gerenciar índices", "Importar e exportar dados (LDIF)", "Evitar buscas lentas"],
      an: "Um backend é um armário com gavetas: guarda um ramo da árvore. Os índices são as etiquetas das gavetas: sem elas, você abre todas até achar.",
      s: [["Backends", "Um backend guarda os dados de uma parte da árvore (um base DN). Pode haver vários backends no mesmo servidor, o que organiza e isola os dados. O mais comum para usuários é um backend local do tipo banco de dados."],
        ["Índices", "Um índice acelera buscas por um atributo, como e-mail ou matrícula. Sem índice, o servidor varre muitas entries, o que é lento. Mas índices ocupam espaço e custam a cada escrita: indexe o que é buscado com frequência."],
        ["Importar, exportar e backup", "O formato LDIF é um texto que descreve entries, usado para importar e exportar dados. Ferramentas de backup e restauração protegem o conteúdo dos backends. Planeje as janelas de importação para não competir com o uso normal."]],
      pt: ["Backend guarda um ramo da árvore.", "Índice acelera buscas, mas custa espaço.", "LDIF importa e exporta; backup protege."],
      er: ["Buscar por atributos sem índice em muitas entries.", "Indexar atributos que ninguém busca."],
      g: [["backend", "Armazenamento de um ramo da árvore."], ["índice", "Estrutura que acelera buscas."], ["LDIF", "Formato de texto para entries."]],

      q: [["Buscas por 'matrícula' estão lentas.", "O que ajuda?", ["Criar um índice no atributo", "Apagar entries", "Trocar a senha", "Reiniciar o laptop"], 0, "Índices aceleram buscas."],
        ["Você precisa mover entries entre servidores.", "Qual formato é comum?", ["LDIF", "PNG", "MP3", "DOCX"], 0, "LDIF descreve entries em texto."],
        ["Qual é a função de um backend?", "Qual?", ["Guardar os dados de um ramo da árvore", "Enviar e-mails", "Aplicar senhas", "Medir o tempo"], 0, "Backends armazenam os dados."],
        ["O que é um custo de ter índices demais?", "Qual?", ["Espaço e escritas mais lentas", "Nenhum", "Menos segurança", "Menos entries"], 0, "Índices custam espaço e tempo de escrita."]],
      u: ["pdCfg", "pingCert"] },
    { d: "d4", t: "Segurança: ACIs, contas e políticas de senha", rs: "Quem pode ver e mudar o quê, e como proteger as conexões.",
      ob: ["Distinguir tipos de contas de administrador", "Usar instruções de controle de acesso (ACIs)", "Configurar políticas de senha", "Proteger conexões com TLS"],
      an: "O diretório é um prédio com várias portas: as ACIs dizem quem entra em cada sala, a política de senha é a regra das chaves, e o TLS é o corredor blindado.",
      s: [["Contas de administrador", "Há três classes: o root user, que tem privilégios amplos e não passa pelo controle de acesso; os administradores, com acesso limitado pelas ACIs; e os administradores globais, usados na topologia e espelhados entre servidores. A prática normal é usar administradores com direitos limitados no dia a dia."],
        ["Controle de acesso", "As ACIs (access control instructions) são regras que dizem quem pode ler, buscar, alterar ou apagar quais entries e atributos. Há regras novas que consideram, por exemplo, se a conexão é segura. Muitas regras demais podem prejudicar o desempenho."],
        ["Senhas e conexões", "Políticas de senha definem validade, complexidade e bloqueio. As conexões devem usar LDAPS ou StartTLS para que as senhas não trafeguem em texto claro."]],
      pt: ["Root user não passa pelas ACIs.", "ACIs limitam quem faz o quê.", "Use TLS para proteger as senhas em trânsito."],

      g: [["ACI", "Instrução de controle de acesso."], ["root user", "Conta de privilégios amplos, fora das ACIs."], ["StartTLS", "Passa uma conexão comum para criptografada."]],
      f: { k: "camadas", i: ["Root user (privilégios amplos)", "Administradores (limitados por ACIs)", "Usuários finais (acesso mínimo)"], c: "Quanto mais baixo o nível, menor o acesso." },
      q: [["Uma conta ignora completamente o controle de acesso.", "Qual é?", ["O root user", "Um usuário final", "Um cliente", "Um backend"], 0, "O root user não passa pelas ACIs."],
        ["Você quer que só o RH altere o telefone das pessoas.", "O que usar?", ["Uma ACI", "Um índice", "Um LDIF", "Um backup"], 0, "ACIs controlam acesso a atributos."],
        ["As senhas trafegam sem criptografia.", "O que adotar?", ["LDAPS ou StartTLS", "Mais usuários", "Menos entries", "Outra impressora"], 0, "TLS protege a conexão."],
        ["No dia a dia, que conta é recomendada?", "Qual?", ["Administradores com direitos limitados", "O root user sempre", "Contas anônimas", "Qualquer uma"], 0, "Prefira administradores limitados."]],
      u: ["pdAdm", "pdCfg", "pingCert"] },
    { d: "d5", t: "Replicação e topologia", rs: "Como vários servidores mantêm os mesmos dados e a mesma configuração.",
      ob: ["Entender replicação", "Habilitar replicação entre servidores", "Entender a topologia", "Conhecer administradores globais"],
      an: "Replicação é como vários escritórios com o mesmo arquivo: quando alguém atualiza em um, o sistema envia a mudança aos outros para ninguém ver dados diferentes.",
      s: [["Por que replicar", "Replicar mantém os mesmos dados em vários servidores. Isso dá alta disponibilidade (se um cai, outro atende), distribui a carga e aproxima os dados de quem os usa."],
        ["Habilitar", "A replicação é habilitada entre servidores (a ferramenta dsreplication tem a opção enable). Se um dos dois servidores já faz parte de uma topologia, ele deve ser informado como o primeiro. A topologia registra os componentes e é mantida por um registro."],
        ["Administração na topologia", "Os administradores globais ficam guardados em um local que é sempre espelhado entre os servidores, e servem para administrar a topologia. Assim, uma mudança de configuração pode ser aplicada a todos de uma vez."]],
      pt: ["Replicação dá disponibilidade e distribui carga.", "Servidor já em topologia entra como primeiro.", "Administradores globais são espelhados."],
      er: ["Habilitar replicação sem planejar a topologia.", "Esquecer a ordem ao incluir um servidor novo."],
      g: [["topologia", "O conjunto de servidores e suas relações."], ["replicação", "Cópia automática de mudanças entre servidores."], ["dsreplication", "Ferramenta para gerenciar a replicação."]],
      f: { k: "hub", m: "Replicação", i: ["Servidor A", "Servidor B", "Servidor C"], c: "Mudanças feitas em um servidor chegam aos outros." },
      q: [["Um servidor cai e o serviço precisa continuar.", "O que ajuda?", ["Replicação entre servidores", "Menos índices", "Mais senhas", "Mais ACIs"], 0, "Replicação dá alta disponibilidade."],
        ["Você adiciona um servidor novo a uma topologia existente.", "Qual cuidado?", ["Informar o servidor já na topologia como o primeiro", "Nenhum", "Apagar a topologia", "Reiniciar o laptop"], 0, "O servidor já existente deve ser o primeiro."],
        ["Para que servem os administradores globais?", "Para quê?", ["Administrar a topologia, espelhados entre os servidores", "Só para buscar", "Para imprimir", "Para excluir logs"], 0, "Eles são espelhados e administram a topologia."],
        ["Qual ferramenta gerencia a replicação?", "Qual?", ["dsreplication", "ldapsearch", "export-ldif", "dsconfig list"], 0, "dsreplication gerencia a replicação."]],
      u: ["pdCfg", "pdAdm", "pingCert"] },
    { d: "d6", t: "Operação e solução de problemas", rs: "Ferramentas do dia a dia, logs e primeiros diagnósticos.",
      ob: ["Usar ferramentas de linha de comando", "Fazer backup e restauração", "Ler logs", "Diagnosticar buscas lentas e acessos negados"],
      an: "É a rotina de um mecânico: ferramentas na bancada, revisão periódica e o hábito de olhar o painel e os registros antes de mexer no motor.",
      s: [["Ferramentas de uso comum", "A linha de comando traz ferramentas para configurar (dsconfig), consultar e alterar dados, importar e exportar, fazer backup e restaurar. Conhecer o --help de cada uma economiza tempo."],
        ["Backup e restauração", "Faça backups periódicos dos backends e teste a restauração, pois um backup que nunca foi testado pode não funcionar quando for preciso. Guarde cópias fora do servidor."],
        ["Diagnóstico", "Se a busca está lenta, verifique se há índice. Se o acesso é negado, olhe as ACIs e a conta usada. Se há falha de conexão, revise rede e TLS. Os logs mostram operações, erros e tempos de resposta."]],
      pt: ["Teste a restauração do backup.", "Busca lenta: confira índices.", "Acesso negado: confira ACIs e conta."],
      er: ["Guardar backups sem nunca restaurá-los em teste.", "Mudar configurações sem olhar o log."],
      g: [["backup", "Cópia de segurança dos dados."], ["restaurar", "Voltar os dados a partir do backup."], ["log", "Registro de operações e erros."]],
      f: { k: "fluxo", i: ["Observar o sintoma", "Ver os logs", "Verificar índices ou ACIs", "Corrigir e testar"], c: "Um roteiro simples de diagnóstico." },
      q: [["Uma busca antes rápida ficou lenta.", "O que verificar primeiro?", ["A existência de um índice para o atributo", "A cor do tema", "O horário", "O nome do servidor"], 0, "Falta de índice é causa comum de lentidão."],
        ["Um usuário não consegue alterar o próprio telefone.", "O que olhar?", ["As ACIs", "O LDIF", "O backup", "A replicação"], 0, "ACIs controlam permissões."],
        ["Você fez backups, mas nunca restaurou.", "Qual é o risco?", ["O backup pode não funcionar quando precisar", "Nenhum", "Menos espaço", "Mais ACIs"], 0, "Teste a restauração."],
        ["Onde ver erros e tempos de resposta?", "Onde?", ["Nos logs do servidor", "No schema", "Em uma ACI", "Em um LDIF"], 0, "Logs mostram operações e erros."]],

T({ id: "ping-p1", forn: "Ping Identity", nome: "PingOne", tipo: "Certified Professional",
  nivel: "Intermediário. Plataforma de identidade na nuvem da Ping.",
  regras: { q: 60, min: 90, nota: 70, fmt: "MC", voltar: true, fonte: "pingCert", nota_txt: "Nota de corte oficial: 70% (código POP-001). " + PING_AVISO },
  doms: [["d1", "Fundamentos"], ["d2", "Identidades"], ["d3", "Aplicações"], ["d4", "Autenticação e MFA"], ["d5", "Políticas de sign-on"], ["d6", "Administração"]],
  mods: [
    { d: "d1", t: "Fundamentos da plataforma PingOne", rs: "O que é a plataforma e como os ambientes separam os dados.",
      ob: ["Entender o que é o PingOne", "Entender ambientes e regiões", "Conhecer o console de administração"],
      an: "O PingOne é um condomínio de identidade na nuvem: cada ambiente é um apartamento separado, com seus moradores, regras e chaves.",
      s: [["Uma plataforma na nuvem", "O PingOne é uma plataforma de identidade entregue como serviço: você não instala servidores, e usa o console e as APIs para configurar login, usuários e aplicativos."],
        ["Ambientes", "Um ambiente é um espaço isolado, com seus próprios usuários, aplicativos e configurações. É comum ter ambientes separados, por exemplo um para testes e outro para produção, para mexer em um sem afetar o outro."],
        ["Regiões e identificador", "Cada ambiente tem um identificador (environment ID) e fica em uma região. Ao integrar outros sistemas, como o PingFederate, você informa o ambiente, a região e a aplicação a usar."]],
      pt: ["PingOne é serviço na nuvem.", "Ambiente = espaço isolado.", "Environment ID e região aparecem nas integrações."],
      er: ["Testar mudanças direto no ambiente de produção.", "Informar a região errada em uma integração."],
      g: [["ambiente", "Espaço isolado com usuários e aplicativos próprios."], ["environment ID", "Identificador do ambiente."], ["região", "Local da nuvem onde o ambiente fica."]],
      f: { k: "hub", m: "PingOne", i: ["Ambiente de teste", "Ambiente de produção"], c: "Cada ambiente é isolado." },
      q: [["Você quer testar uma mudança sem afetar os usuários reais.", "O que ajuda?", ["Um ambiente separado de teste", "Mudar direto em produção", "Apagar usuários", "Nada"], 0, "Ambientes são isolados."],
        ["Uma integração pede o 'environment ID'.", "O que é?", ["O identificador do ambiente", "A senha do usuário", "O nome da empresa", "Uma role"], 0, "É o identificador do ambiente."],
        ["O PingOne exige instalar servidores locais para funcionar?", "Qual é a resposta?", ["Não, é entregue como serviço na nuvem", "Sim sempre", "Só no Windows", "Só no Linux"], 0, "É uma plataforma na nuvem."],
        ["Duas equipes precisam de espaços independentes.", "Qual recurso usar?", ["Ambientes diferentes", "O mesmo ambiente sem controle", "Um flat file", "Um backend"], 0, "Ambientes separam dados e configurações."]],
      u: ["p1Env", "p1Sign", "pingCert"] },
    { d: "d2", t: "Identidades: populações, usuários e grupos", rs: "Como organizar as pessoas e aplicar regras por população.",
      ob: ["Criar usuários e populações", "Entender que um usuário pertence a uma só população", "Aplicar políticas por população", "Usar grupos"],
      an: "Uma população é uma turma de escola: cada aluno está em uma turma só, e a turma define o regulamento (por exemplo, a regra de senha).",
      s: [["Populações", "Uma população define um conjunto de usuários, como uma unidade organizacional. Você precisa criar pelo menos uma antes de criar usuários. Um usuário não pode estar em mais de uma população ao mesmo tempo, mas pode ser movido."],
        ["Regras por população", "Populações simplificam a gestão: você pode aplicar uma política de senha diferente a cada uma, e condições de login (como exigir MFA) podem considerar a população do usuário."],
        ["Usuários e grupos", "Usuários têm atributos, como nome e e-mail. Grupos reúnem usuários para facilitar permissões e regras. Quanto mais limpos os atributos, mais simples ficam as políticas."]],
      pt: ["Um usuário pertence a uma população só.", "Políticas de senha podem variar por população.", "Atributos limpos facilitam as regras."],
      er: ["Tentar colocar o mesmo usuário em duas populações.", "Misturar públicos diferentes na mesma população."],
      g: [["população", "Conjunto de usuários, como uma unidade organizacional."], ["grupo", "Conjunto de usuários para facilitar regras."], ["atributo", "Dado de um usuário."]],
      f: { k: "comparar", a: ["População Funcionários", "Política de senha forte", "MFA obrigatório"], b: ["População Clientes", "Política de senha padrão", "MFA conforme risco"], c: "Populações permitem regras diferentes para públicos diferentes." },
      q: [["Funcionários e clientes devem ter regras de senha diferentes.", "O que usar?", ["Populações distintas", "Um único grupo", "Dois ambientes", "Um flat file"], 0, "Políticas podem ser aplicadas por população."],
        ["Um usuário precisa ser movido de equipe.", "O que se faz?", ["Move-se para outra população", "Duplica-se o usuário", "Apaga-se o ambiente", "Nada"], 0, "Usuários podem ser movidos."],
        ["Você tenta criar um usuário e não existe nenhuma população.", "O que falta?", ["Criar ao menos uma população", "Reiniciar", "Escolher outra região", "Instalar um agente"], 0, "Uma população é necessária."],
        ["Um usuário pode pertencer a quantas populações?", "Quantas?", ["Apenas uma", "Duas", "Dez", "Nenhuma"], 0, "Um usuário pertence a uma população."]],
      u: ["p1Env", "p1Sign", "pingCert"] },
    { d: "d3", t: "Aplicações e conexões de SSO", rs: "Como cadastrar aplicativos OIDC e SAML e conectá-los ao PingOne.",
      ob: ["Criar aplicações OIDC e SAML", "Entender client ID e segredos", "Associar políticas de sign-on", "Usar o PingOne como provedor de identidade"],
      an: "Cadastrar uma aplicação é como cadastrar uma loja no shopping: ela ganha um número de identificação e regras de como os clientes entram.",
      s: [["Aplicação OIDC", "Uma aplicação OIDC (web, nativa ou de página única) recebe um client ID e, quando cabe, um segredo. Você registra os endereços de retorno (redirect URIs) permitidos, que evitam que os tokens sejam enviados para o lugar errado."],
        ["Aplicação SAML", "Para aplicativos que falam SAML, você configura endereços e certificados trocando metadados com o aplicativo. O PingOne age como provedor de identidade."],
        ["Fluxo de login por aplicação", "O fluxo de autenticação é configurado por aplicação, por meio de uma política de sign-on. Se você não associa uma, ela usa a política padrão do ambiente. Várias políticas podem ser associadas a aplicações diferentes."]],
      pt: ["OIDC usa client ID e redirect URIs.", "SAML usa metadados e certificados.", "A política de sign-on é por aplicação, com padrão do ambiente."],
      er: ["Permitir redirect URIs amplos demais.", "Expor o segredo do cliente em código público."],
      g: [["client ID", "Identificador da aplicação OIDC."], ["redirect URI", "Endereço permitido para o retorno do login."], ["segredo do cliente", "Senha da aplicação."]],
      f: { k: "fluxo", i: ["Criar a aplicação", "Definir redirect URIs", "Escolher a política de sign-on", "Testar o login"], c: "Passos para colocar uma aplicação em funcionamento." },
      q: [["Um aplicativo web precisa se autenticar via OIDC.", "O que ele recebe do PingOne?", ["Um client ID", "Um backup", "Um LDIF", "Uma população"], 0, "Aplicações OIDC têm client ID."],
        ["Uma aplicação não tem política de sign-on associada.", "O que acontece?", ["Usa a política padrão do ambiente", "Não funciona nunca", "Cria usuários", "Apaga o ambiente"], 0, "A política padrão do ambiente é usada."],
        ["Por que limitar os redirect URIs?", "Por quê?", ["Evitar enviar tokens para o lugar errado", "Deixar o login mais lento", "Cobrar mais", "Esconder logs"], 0, "Protegem o retorno do login."],
        ["Um aplicativo só fala SAML.", "O que configurar?", ["Uma aplicação SAML com metadados", "Uma aplicação OIDC sem metadados", "Uma população", "Um backend"], 0, "SAML usa metadados."]],
      u: ["p1Sign", "p1Env", "pingCert"] },
    { d: "d4", t: "Autenticação e MFA", rs: "Como o PingOne verifica quem é a pessoa e quando pede mais de um fator.",
      ob: ["Entender fatores de autenticação", "Configurar políticas de MFA", "Exigir MFA por população ou por tempo", "Tratar usuários sem dispositivo"],
      an: "MFA é usar chave e cartão para abrir o cofre: mesmo que alguém roube uma das duas coisas, não consegue abrir.",
      s: [["Fatores", "Um fator é algo que você sabe (senha), tem (celular, token) ou é (biometria). MFA combina mais de um, o que protege a conta mesmo se a senha vazar."],
        ["Políticas de MFA", "Uma política de MFA define quais métodos de autenticação são permitidos. A etapa de MFA é adicionada na política de sign-on, escolhendo a política de MFA apropriada."],
        ["Condições", "Para certas populações, a política pode exigir MFA em todo login; para outras, pode dispensar MFA se o último login recente ocorreu dentro de um limite de tempo. Se o usuário não tem dispositivo compatível, a etapa de MFA pode ser pulada, conforme a configuração."]],
      pt: ["Fatores: saber, ter e ser.", "A política de MFA define os métodos permitidos.", "Condições variam por população e por tempo."],
      er: ["Exigir MFA sem plano para quem não tem dispositivo.", "Permitir só um método fraco."],
      g: [["MFA", "Autenticação com mais de um fator."], ["fator", "Tipo de prova de identidade."], ["política de MFA", "Define os métodos permitidos."]],
      f: { k: "fluxo", i: ["Usuário informa a senha", "Política verifica as condições", "Etapa de MFA, se necessária", "Acesso liberado"], c: "O MFA como etapa condicional do login." },
      q: [["Funcionários devem usar MFA em todo login.", "Como configurar?", ["Condição de política por população exigindo MFA", "Remover a senha", "Criar um backup", "Excluir a população"], 0, "Condições podem exigir MFA por população."],
        ["Qual é um exemplo de algo que você 'tem'?", "Qual?", ["Um celular com aplicativo autenticador", "Sua senha", "Seu nome", "Sua mãe"], 0, "O dispositivo é fator 'ter'."],
        ["Quem tem MFA recente dispensa nova verificação por um tempo.", "O que define isso?", ["Uma condição de tempo na política", "Um LDIF", "Um índice", "Um certificado"], 0, "Há condição de recência de MFA."],
        ["O usuário não tem dispositivo compatível.", "O que pode ocorrer?", ["A etapa de MFA pode ser pulada, conforme a política", "O sistema é excluído", "A população some", "O ambiente trava"], 0, "A configuração define o comportamento."]],
      u: ["p1Sign", "p1SignApi", "pingCert"] },
    { d: "d5", t: "Políticas de sign-on e risco", rs: "Ações, condições e a ordem em que as políticas são avaliadas.",

DEEP["sp-leader-1"] = {
  ctx: ["Pense no número de sistemas que uma empresa média usa hoje: e-mail, folha de pagamento, CRM, repositórios de código, ferramentas em nuvem. Cada um tem seus próprios usuários e permissões. Quando uma pessoa entra, muda de área ou sai, alguém precisa acertar tudo isso em dezenas de lugares. Se isso falha, sobram acessos que ninguém lembra de ter dado.", "Os relatórios anuais de incidentes, como o Data Breach Investigations Report da Verizon, repetem ano após ano que o uso de credenciais roubadas está entre as formas mais comuns de invasão. Por isso identidade deixou de ser um assunto administrativo e virou parte central da segurança. O líder de identidade é quem faz a ponte entre esse risco técnico e as decisões do negócio."],
  teo: [["Os três A: autenticar, autorizar e auditar", "A segurança de acesso se apoia em três perguntas que se encadeiam. Autenticação: quem é você, e como provar? Autorização: o que você pode fazer? Auditoria (accounting): o que foi feito, quando e por quem? Esse modelo, conhecido como AAA, aparece em quase todo livro de segurança e organiza o que uma plataforma de identidade precisa entregar.", "Repare que a identidade participa das três: ela é o que se autentica, é a base de quem recebe permissões e é o nome que fica nos registros de auditoria. Se a identidade for ruim (duplicada, desatualizada ou compartilhada), as três perguntas ficam sem resposta confiável."],
    ["Identidade como o novo perímetro", "Por muito tempo a segurança foi pensada como um muro: o que estava dentro da rede da empresa era confiável. Com nuvem, aplicativos externos e trabalho remoto, esse muro deixou de existir na prática. A arquitetura de confiança zero (zero trust), descrita pelo NIST na publicação SP 800-207, parte do princípio contrário: nenhuma requisição é confiável só por vir de dentro da rede; cada acesso é avaliado com base em quem pede, de onde, com qual dispositivo e para qual recurso.", "Nessa lógica, a identidade é o ponto de decisão. Proteger a identidade e controlar o que ela pode acessar passa a ser tão importante quanto proteger a rede."],
    ["Governar é diferente de administrar", "Administrar identidades é executar: criar contas, redefinir senhas, conceder acessos. Governar é decidir e verificar: quem deve ter acesso a quê, por quê, quem aprovou e se isso continua fazendo sentido. A sigla IGA (Identity Governance and Administration) junta as duas coisas, e a segunda é o que costuma faltar em empresas que só automatizaram o cadastro.", "Uma empresa pode ter um cadastro perfeito e, mesmo assim, estar em risco, se nunca revisa o que cada pessoa acumulou ao longo dos anos. Esse acúmulo tem nome: privilege creep, o crescimento silencioso de permissões."]],
  mec: { t: "O ciclo de decisão do líder", p: [["Mapear", "Descubra onde estão as identidades e os acessos: quais sistemas existem, quem é dono de cada um e de onde vem a informação confiável sobre as pessoas (em geral o RH)."], ["Classificar o risco", "Nem todo sistema pesa igual. Separe os que guardam dados financeiros, dados pessoais protegidos pela LGPD ou poderes administrativos. É por eles que se começa."], ["Definir donos e regras", "Cada sistema e cada acesso precisa de um responsável que sabe decidir. Sem dono, ninguém aprova nem revoga."], ["Automatizar o repetitivo", "Entradas, mudanças e saídas de pessoas seguem padrões. Automatize esses padrões e deixe as decisões difíceis para as pessoas."], ["Medir e reportar", "Acompanhe indicadores simples: tempo para conceder um acesso, percentual de acessos revisados no prazo, número de contas sem dono. Eles mostram à diretoria que o risco está caindo."]] },
  caso: { t: "Caso (fictício): as contas que ninguém lembrava", p: ["Uma empresa de logística com 2.300 funcionários e 140 sistemas passou por uma auditoria. O relatório apontou 380 contas ativas de pessoas que já tinham deixado a empresa, algumas com acesso ao sistema financeiro. Ninguém tinha agido de má-fé: o RH avisava a TI por e-mail e, com 140 sistemas, parte dos avisos se perdia.", "A nova líder de identidade não tentou resolver os 140 sistemas de uma vez. Ela listou os seis sistemas mais críticos, ligou o cadastro do RH como fonte confiável e automatizou o desligamento nesses seis. Em três meses, as contas de ex-funcionários nesses sistemas caíram a zero, e ela apresentou o resultado à diretoria em dois números: contas órfãs e tempo médio de remoção de acesso."], l: "Começar pelos sistemas de maior risco, com uma fonte confiável de pessoas, entrega resultado mensurável antes de ampliar." },
  av: [["Contas órfãs, privilegiadas e de serviço", "Conta órfã é a que não tem mais um dono ativo. Conta privilegiada tem poderes administrativos e exige controles mais rígidos. Conta de serviço é usada por um programa, e costuma ser a mais esquecida, porque ninguém faz login com ela e ninguém a revisa. As três merecem atenção separada no plano do líder."], ["Falar com a diretoria", "Executivos decidem por risco e dinheiro, não por termos técnicos. Em vez de dizer que há mil entitlements sem dono, diga que há acessos ao sistema financeiro que ninguém aprovou, e o que isso pode custar em caso de fraude ou de multa. Traduzir o problema para o negócio é uma das habilidades centrais do papel."]],
  ref: ["NIST SP 800-207, Zero Trust Architecture (2020)", "NIST SP 800-63, Digital Identity Guidelines", "Saltzer e Schroeder (1975), The Protection of Information in Computer Systems, origem do princípio do privilégio mínimo", "Lei nº 13.709/2018 (LGPD), art. 46, medidas de segurança contra acessos não autorizados"],
  cp: [["Uma empresa tem cadastro automatizado, mas nunca revisa o que cada pessoa acumulou.", "Falta governança, a parte de decidir e verificar", "Falta mais automação de cadastro", "Falta trocar o firewall", "Administração é executar; governança é verificar se o acesso continua fazendo sentido."], ["Um acesso é feito de dentro da rede da empresa.", "Em zero trust, ele ainda precisa ser avaliado", "Ele é confiável por estar dentro da rede", "Ele dispensa autenticação", "Zero trust não confia só pela origem na rede."], ["A diretoria pergunta por que investir em identidade.", "Mostrar o risco em termos de negócio, como fraude e multas", "Listar todos os entitlements sem dono", "Explicar o protocolo de cada conector", "Executivos decidem por risco e impacto no negócio."]]
