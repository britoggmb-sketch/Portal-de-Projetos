const NOTA_PING = "Os objetivos oficiais do exame ficam no Training Portal da Ping (exige conta). Esta aula segue a documentação pública.";
DEEP["ping-pf-1"] = {
  ctx: ["O PingFederate é um servidor de federação: ele permite que uma organização autentique pessoas uma vez e as faça entrar em vários aplicativos, internos ou de parceiros, sem repetir o login. Para quem vai administrá-lo, o primeiro passo é dominar o vocabulário: IdP, SP, asserção, conexão e protocolo.", "A documentação oficial o descreve como um console integrado para configurar conexões com parceiros de federação, e o apresenta também como um hub entre IdPs e SPs."],
  teo: [["Papéis na federação: IdP, SP e a asserção", "O provedor de identidade (IdP) autentica a pessoa e emite uma afirmação sobre ela. O provedor de serviço (SP) é o aplicativo que confia nessa afirmação e libera o acesso. A afirmação, no SAML, chama-se asserção e é assinada: o SP confere a assinatura com o certificado do IdP. É isso que transforma um login em um acordo de confiança entre duas organizações."], ["O que o PingFederate oferece", "A documentação lista o login único pelo navegador (Browser SSO), o serviço de tokens de segurança WS-Trust (STS), a troca de uma asserção SAML ou de um JWT por um token de acesso OAuth (OAuth Assertion Grant), kits de integração com adaptadores e o mapeamento de identidades entre domínios. Como hub, o PingFederate pode ligar o login de vários IdPs a vários SPs."], ["Os fluxos iniciados pelo SP e pelo IdP", "No fluxo iniciado pelo IdP, a pessoa já se autenticou no IdP, este recupera, se for o caso, atributos de um repositório de usuários, gera a asserção e o navegador envia um formulário automático ao SP. No fluxo iniciado pelo SP, a pessoa chega ao aplicativo, que a redireciona ao IdP. A documentação também descreve a descoberta de IdP, que identifica dinamicamente de qual IdP é a pessoa quando o fluxo começa no SP, e o logout único (SLO)."], ["Por que existem vários protocolos", "SAML é muito usado em aplicações web corporativas. OAuth 2.0 e OpenID Connect atendem aplicativos modernos e APIs: o primeiro delega acesso, o segundo acrescenta a identidade do usuário. O WS-Federation e o WS-Trust aparecem em ambientes mais antigos. Um administrador de PingFederate precisa conhecer o protocolo exigido pelo parceiro antes de desenhar a conexão."]],
  mec: { t: "Como é um login federado, do começo ao fim", p: [["A pessoa pede o aplicativo", "O SP percebe que não há sessão."], ["Redirecionamento ao IdP", "O SP envia a pessoa ao IdP, com um pedido de autenticação."], ["Autenticação", "O IdP verifica a pessoa, com senha, MFA ou outro método."], ["Emissão da asserção", "O IdP gera uma asserção assinada, com os atributos acordados."], ["Validação e acesso", "O SP valida a assinatura, cria a sessão e libera o acesso."]] },
  caso: { t: "Caso (fictício): o aplicativo que pedia outro login", p: ["Uma empresa adotou um aplicativo de RH de um fornecedor. Os funcionários precisavam criar mais uma conta e uma senha para usá-lo, o que gerou chamados de redefinição.", "A equipe configurou uma conexão SAML entre o PingFederate e o fornecedor. Depois do ajuste, a pessoa entrava com o login da empresa, e o RH deixou de gerir senhas de outro sistema. Os chamados sobre esse aplicativo caíram."], l: "A federação elimina senhas duplicadas e centraliza a política de autenticação." },
  av: [["Estar dentro da rede não é prova", "Federação não significa confiar sem verificar: o SP valida assinatura, emissor, destinatário e validade da asserção. A confiança é técnica, e se baseia em certificados e metadados trocados de antemão."]],
  mitos: [["SSO significa uma senha única para tudo.", "O SP nunca vê a senha: ele confia em uma asserção ou token emitido pelo IdP."], ["SAML e OAuth são intercambiáveis.", "O SAML afirma quem é a pessoa; o OAuth delega acesso a recursos; o OpenID Connect traz a identidade ao OAuth."], ["O PingFederate só serve para SAML.", "Também atua com OAuth, OpenID Connect, WS-Trust e outros padrões."]],
  ref: [R("pf101", "Visão geral do PingFederate."), R("pfKey", "Conceitos-chave: Browser SSO, STS, OAuth Assertion Grant, adaptadores."), R("saml", "SAML 2.0."), R("rfc6749", "OAuth 2.0."), R("oidc", "OpenID Connect."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["O aplicativo recebe uma mensagem assinada do IdP.", "É uma asserção, validada com o certificado do IdP", "É uma senha", "É um log", "A assinatura permite confiar no emissor."], ["O PingFederate liga vários IdPs a vários SPs.", "Atua como hub de federação", "Atua como diretório", "Atua como firewall", "É o papel de hub."], ["A pessoa chega ao aplicativo e é enviada ao login da empresa.", "É um fluxo iniciado pelo SP", "É um fluxo iniciado pelo IdP", "É um logout único", "O SP inicia o redirecionamento."]]
};
DEEP["ping-pf-2"] = {
  ctx: ["A instalação do PingFederate parece simples, mas decisões tomadas no começo afetam tudo depois: o modo de operação (isolado ou em cluster), o endereço-base, a licença e as portas que precisam ser liberadas. Este módulo mostra o que configurar e onde.", NOTA_PING],
  teo: [["Modos de operação em run.properties", "Grande parte do comportamento padrão do console administrativo e do servidor de execução é controlada pelo arquivo run.properties, em <pf_install>/pingfederate/bin. A propriedade pf.operational.mode define o modo: STANDALONE (padrão), em que o servidor é, ao mesmo tempo, console e engine; CLUSTERED_CONSOLE, em que o servidor faz parte de um cluster e opera só o console; e CLUSTERED_ENGINE, em que faz parte de um cluster e opera só o runtime. Em um cluster, apenas um nó pode rodar o console."], ["Console, runtime e propriedades por nó", "O console é onde você configura; o runtime atende os logins, por exemplo na porta 9031, que aparece em exemplos da documentação. Um ponto importante: as propriedades do servidor de execução precisam ser configuradas manualmente em cada nó de engine, porque o run.properties não é copiado do console para as engines automaticamente. Antes de editar, faça uma cópia do arquivo."], ["Licença e replicação da configuração", "A licença é carregada no console e, desde a versão 8.2, é transmitida às engines pela tela de replicação de configuração. Em um ambiente em cluster, quando o PingFederate detecta uma mudança, o console pede que a configuração seja replicada para todas as engines. Sem essa etapa, as engines continuam usando a configuração antiga."], ["Requisitos de portas e comunicação", "A documentação de requisitos de porta lista o acesso do navegador ao console, as chamadas à API administrativa, as requisições de entrada ao runtime, o tráfego de cluster (por padrão, TCP, com portas usadas para comunicação entre nós e para detecção de falhas), a comunicação com o PingOne e o envio de notificações por SMTP. Conhecer essa lista evita bloqueios de firewall que parecem falhas do produto."]],
  mec: { t: "Como instalar e deixar pronto para criar conexões", p: [["Escolher o modo", "Isolado para laboratório; cluster com console e engines para produção."], ["Instalar e ajustar o run.properties", "Configure o modo, o índice do nó e as portas, com cópia de segurança."], ["Carregar a licença", "Carregue no console e replique às engines."], ["Definir o endereço-base e os certificados", "Defina a base URL usada pelas mensagens aos parceiros."], ["Liberar as portas", "Confirme console, runtime, cluster, SMTP e comunicação externa."]] },
  caso: { t: "Caso (fictício): a engine que não sabia da mudança", p: ["Uma equipe criou uma conexão nova no console e testou com sucesso. Em produção, parte dos logins continuava falhando: apenas metade dos usuários, de forma aleatória.", "O motivo era que a configuração não tinha sido replicada para todas as engines: o console avisara, mas o aviso foi ignorado. Depois de replicar, o comportamento ficou uniforme, e a equipe incluiu a replicação no procedimento de mudança."], l: "No cluster, uma mudança só vale quando é replicada para as engines." },
  av: [["Dados por nó", "Propriedades como o endereço de escuta e o diretório de logs (por padrão, <pf_install>/pingfederate/log) são configuradas por nó. Documente os valores de cada um."]],
  mitos: [["O run.properties é copiado sozinho do console para as engines.", "Precisa ser configurado manualmente em cada engine."], ["Mudou no console, valeu para todos.", "No cluster, é preciso replicar a configuração para as engines."], ["Em um cluster, qualquer nó pode ter o console.", "Apenas um nó pode rodar o console."]],
  ref: [R("pfProps", "run.properties: console, runtime, logs e HSM."), R("pfCluster", "Modos STANDALONE, CLUSTERED_CONSOLE e CLUSTERED_ENGINE."), R("pfPorts", "Requisitos de portas."), R("pf101", "Visão geral."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Um servidor só opera o console em um cluster.", "É o modo CLUSTERED_CONSOLE", "É o modo STANDALONE", "É o modo CLUSTERED_ENGINE", "Esse modo só opera o console."], ["A licença precisa chegar às engines.", "Use a tela de replicação de configuração", "Copie por e-mail", "Reinstale", "A replicação leva a licença às engines."], ["Parte dos logins falha de forma aleatória após uma mudança.", "A configuração talvez não tenha sido replicada a todas as engines", "O certificado expirou sempre", "O diretório está lento", "É um sintoma clássico."]]
};
DEEP["ping-pf-3"] = {
  ctx: ["Uma conexão SSO é o acordo técnico entre o PingFederate e um parceiro: protocolo, endereços, certificados e atributos. É onde a maioria dos erros de integração aparece, e a confusão entre conexão de IdP e conexão de SP é a mais comum.", NOTA_PING],
  teo: [["Conexão de SP e conexão de IdP", "No PingFederate, a conexão de SP é aquela em que o servidor atua como IdP e envia asserções ao parceiro (o parceiro é o SP). A conexão de IdP é aquela em que o servidor atua como SP e recebe asserções de um parceiro (o parceiro é o IdP). O nome refere-se ao parceiro, e não ao papel do PingFederate. Quem vê o rótulo pela primeira vez costuma trocá-los, e a consequência é configurar o lado errado da integração."], ["Contrato de atributos e mapeamento", "O contrato de atributos define quais dados a asserção leva (e-mail, nome, grupos), e o mapeamento define de onde vem cada valor: do login, de um diretório ou de um banco. A boa prática é enviar só o necessário, o que reduz exposição de dados e problemas de compatibilidade com o parceiro. A documentação da integração com o PingOne mostra que, quando o contrato de atributos é estendido, a mudança é propagada à conexão gerenciada."], ["Metadados, certificados e assinaturas", "Os parceiros trocam metadados, arquivos que descrevem endereços e chaves, para configurar a conexão com menos erro. Os certificados assinam as mensagens, e o receptor confere a assinatura. Como certificados expiram, a troca precisa ser combinada com o parceiro. A documentação do PingOne for Enterprise ainda cita que o PingFederate baixa automaticamente novos certificados de assinatura e atualiza a conexão, o que ilustra a importância de manter essa relação atualizada."], ["Mapeamento de identidade e atributos de usuário", "O PingFederate permite mapear identidades entre domínios no Browser SSO e no WS-Trust STS. Na prática, é comum o parceiro esperar um identificador diferente do que a empresa usa (e-mail em vez de matrícula, por exemplo), e o mapeamento resolve a diferença. Atributos extras podem vir de repositórios de dados configurados no servidor."]],
  mec: { t: "Como criar uma conexão com um parceiro", p: [["Descobrir o papel e o protocolo", "Defina se o PingFederate é IdP ou SP e qual protocolo o parceiro exige."], ["Importar os metadados", "Use os metadados do parceiro para endereços e chaves."], ["Definir o contrato de atributos", "Liste os atributos acordados e o identificador de usuário."], ["Mapear a origem dos valores", "Indique de onde vem cada atributo."], ["Testar o login nos dois sentidos", "Teste o fluxo iniciado pelo IdP e pelo SP."]] },
  caso: { t: "Caso (fictício): o identificador que o parceiro não reconhecia", p: ["O parceiro recusava todos os logins vindos da empresa. A equipe conferiu certificados e endereços, que estavam corretos.", "O problema era o identificador: o parceiro esperava o e-mail, mas a asserção levava a matrícula. Ajustado o contrato e o mapeamento, os logins passaram a funcionar. A equipe adicionou o item ao checklist de novas conexões."], l: "Antes de culpar certificados, confira o identificador do usuário na asserção." },
  av: [["SLO e descoberta de IdP", "O logout único e a descoberta de IdP complementam o SSO, mas exigem suporte do parceiro. Verifique antes de prometer esses recursos."]],
  mitos: [["Conexão de SP significa que o PingFederate é o SP.", "Significa que o parceiro é o SP, e o PingFederate age como IdP."], ["Quanto mais atributos, melhor a integração.", "Envie só o necessário, para reduzir exposição e erros."], ["Certificados não precisam ser acompanhados.", "Eles expiram, e a troca precisa ser combinada com o parceiro."]],
  ref: [R("pfKey", "Browser SSO, STS e mapeamento de identidade."), R("pf101", "Visão geral das conexões."), R("saml", "Asserções, perfis e metadados no SAML 2.0."), R("pingCert", "Guia de certificação da Ping."), R("lgpd", "Minimização no tratamento de dados pessoais.")],
  cp: [["O parceiro é o aplicativo que recebe o login.", "Você cria uma conexão de SP", "Você cria uma conexão de IdP", "Você cria um backend", "O PingFederate age como IdP."], ["O parceiro espera o e-mail e recebe a matrícula.", "Ajuste o contrato de atributos e o mapeamento", "Troque o certificado", "Reinstale o servidor", "É erro de atributo, e não de assinatura."], ["Quer acelerar a configuração.", "Importe os metadados do parceiro", "Digite tudo à mão", "Peça um e-mail", "Metadados trazem endereços e chaves."]]
};
DEEP["ping-pf-4"] = {
  ctx: ["Quando o PingFederate atua como servidor de autorização, ele emite tokens para aplicativos que acessam APIs ou querem saber quem é a pessoa. Para isso, é preciso entender os quatro papéis do OAuth, os fluxos mais comuns e o que o OpenID Connect acrescenta.", NOTA_PING],
  teo: [["O PingFederate como servidor de autorização", "A documentação explica que, com OAuth 2.0 e OpenID Connect 1.0, o PingFederate pode ser configurado como servidor de autorização. Isso significa que ele autentica a pessoa, obtém o consentimento quando cabe e emite os tokens ao aplicativo cliente. Também existe a concessão por asserção (OAuth Assertion Grant), em que uma asserção SAML ou um JWT são trocados por um token de acesso."], ["Os quatro papéis e o fluxo de código de autorização", "A RFC 6749 define o dono do recurso (a pessoa), o servidor de recursos (a API), o cliente (o aplicativo) e o servidor de autorização. No fluxo de código de autorização, o cliente leva a pessoa ao servidor de autorização, que a autentica e pede consentimento; o servidor devolve um código, que o cliente troca por um token de acesso e, se previsto, por um refresh token e um ID token. A RFC 7636 (PKCE) acrescenta uma proteção para clientes públicos, como aplicativos móveis: o cliente prova que é o mesmo que iniciou o pedido."], ["Escopos, consentimento e tokens", "Os escopos limitam o que o token permite. O consentimento é o momento em que a pessoa autoriza o acesso, e deve mostrar de forma clara o que está sendo concedido. Os tokens têm validade curta, e o refresh token permite obter novos sem nova autenticação. O OpenID Connect acrescenta o ID token, um documento assinado com informações como o emissor, o identificador do usuário e a validade."], ["Cadastro de clientes: o que configurar", "Cada aplicativo cliente é cadastrado com um identificador, as concessões permitidas, os endereços de retorno e o método de autenticação no endpoint de tokens. Boas práticas: permitir apenas as concessões necessárias, restringir redirect URIs e usar PKCE em clientes públicos."]],
  mec: { t: "Como o fluxo de código de autorização acontece", p: [["O cliente redireciona a pessoa", "O pedido leva o client ID, o escopo e o redirect URI."], ["A pessoa se autentica e consente", "O servidor de autorização verifica a identidade e as permissões."], ["O servidor devolve um código", "O código é enviado ao redirect URI registrado."], ["O cliente troca o código por tokens", "A troca ocorre no endpoint de tokens, com a autenticação do cliente."], ["O cliente chama a API", "Usa o token de acesso dentro do escopo concedido."]] },
  caso: { t: "Caso (fictício): o redirect URI com curinga", p: ["Uma equipe registrou, para facilitar testes, um redirect URI com curinga muito amplo. Um aplicativo malicioso poderia receber o código de autorização se induzisse a pessoa a iniciar o fluxo.", "Em uma revisão, a equipe trocou o curinga por endereços exatos, passou a exigir PKCE e documentou a regra de revisão de clientes."], l: "Redirect URIs precisam ser restritos. Eles são o ponto em que os tokens saem do servidor." },
  av: [["OAuth autoriza, OIDC autentica", "O OAuth foi desenhado para autorização. A identidade do usuário vem do OpenID Connect. Confundir os dois leva a decisões de segurança fracas."]],
  mitos: [["O token de acesso diz quem é a pessoa.", "Quem informa a identidade é o ID token do OpenID Connect."], ["Redirect URIs amplos são um conforto sem risco.", "Podem permitir o desvio do código de autorização."], ["PKCE só serve para clientes móveis.", "Protege clientes públicos em geral, e é recomendável em fluxos de código."]],
  ref: [R("pf101", "Servidor de autorização e OAuth Assertion Grant."), R("pfKey", "Conceitos de OAuth no PingFederate."), R("rfc6749", "Papéis e fluxos do OAuth 2.0."), R("rfc7636", "Proteção PKCE."), R("oidc", "ID token e claims."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Um aplicativo móvel usa o fluxo de código.", "PKCE protege contra interceptação do código", "O segredo fica no aplicativo", "Não há risco", "PKCE vincula o código ao cliente."], ["Você precisa saber quem é a pessoa.", "Use o OpenID Connect e o ID token", "Use só o token de acesso", "Use o refresh token", "O ID token traz a identidade."], ["Um redirect URI muito amplo.", "É um risco de desvio do código", "É uma boa prática", "Melhora o desempenho", "Restrinja aos endereços exatos."]]
};
DEEP["ping-pf-5"] = {
  ctx: ["Antes de emitir uma asserção ou um token, o PingFederate precisa saber quem é a pessoa. Isso envolve adaptadores, validadores de credencial, repositórios de dados e as políticas que decidem quando exigir mais verificação.", NOTA_PING],
  teo: [["Adaptadores e kits de integração", "Os adaptadores são componentes que se encaixam no servidor para autenticar a pessoa ou integrar com sistemas locais. A documentação explica que o PingFederate traz kits de integração, incluídos e disponíveis à parte, com adaptadores e agentes. Um adaptador de IdP, por exemplo, apresenta um formulário de login; outros integram com sistemas de acesso web."], ["Políticas de autenticação", "As políticas de autenticação decidem qual adaptador usar e em qual ordem, e podem exigir etapas adicionais conforme o contexto: um segundo fator para certos aplicativos, ou autenticação mais forte quando o risco é maior. É o ponto em que a segurança da empresa se traduz em regras. Políticas claras são mais fáceis de testar e de explicar à auditoria."], ["Validadores de credencial e repositórios de dados", "O validador de credenciais de senha confere usuário e senha em um repositório, como um diretório LDAP. Os repositórios de dados (data stores) conectam o PingFederate a diretórios e bancos de onde ele lê atributos. A documentação de integração com o PingDirectory mostra, por exemplo, que a conta de serviço usada na conexão precisa de instruções de controle de acesso específicas no diretório para as funções de perfil local, como autenticação e redefinição de senha."], ["Integração com PingOne MFA", "Há um adaptador de MFA do PingOne para o PingFederate. Ele precisa de dados como o ambiente, a população em que usuários novos são criados, a aplicação OIDC e as políticas de MFA para autenticação e registro de dispositivos, e a política deve ser do tipo somente MFA. Isso mostra como as peças de produtos diferentes se conectam por configuração."]],
  mec: { t: "Como montar uma autenticação com segundo fator", p: [["Escolher o adaptador", "Defina como a pessoa será autenticada."], ["Conectar o repositório de dados", "Configure a data store e a conta de serviço com permissões mínimas."], ["Criar a política de autenticação", "Defina a ordem dos adaptadores e as condições."], ["Adicionar o segundo fator", "Inclua o adaptador de MFA onde o risco justificar."], ["Testar cada caminho", "Teste usuário com e sem dispositivo, e falhas do repositório."]] },
  caso: { t: "Caso (fictício): o login que falhava só de manhã", p: ["Alguns usuários não conseguiam entrar logo no começo do expediente, mas funcionava depois. O console não mostrava erro de configuração.", "A causa era a conexão com o diretório: a conta de serviço da data store tinha a senha expirada, e a política de rotação a vencia de madrugada. Após atualizar a credencial e criar um alerta de vencimento, o problema não voltou."], l: "Falhas intermitentes de login costumam ter origem em credenciais de repositórios de dados." },
  av: [["Conta de serviço com privilégio mínimo", "A conta que o PingFederate usa para ler o diretório deve ter apenas as permissões de que precisa, e deve ter dono e rotação planejada."]],
  mitos: [["O adaptador faz tudo, e a política não importa.", "A política decide qual adaptador usar e em que condições."], ["A data store só precisa funcionar na instalação.", "Credenciais e conexão precisam de acompanhamento contínuo."], ["MFA é uma configuração do adaptador de senha.", "É uma etapa na política, com seu próprio adaptador e política no PingOne."]],
  ref: [R("pfKey", "Adaptadores e kits de integração."), R("pf101", "Visão geral."), R("pdAdm", "Contas e controle de acesso no PingDirectory."), R("p1Sign", "Políticas de sign-on e MFA do PingOne."), R("nist63", "Níveis de garantia de autenticação."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["O segundo fator só vale para certos aplicativos.", "A política de autenticação define isso", "O adaptador define sozinho", "O diretório define", "A política decide quando."], ["O login falha de forma intermitente.", "Verifique a credencial e a conexão da data store", "Troque o certificado", "Reinstale", "É uma causa comum."], ["A conta de serviço lê o diretório.", "Dê só as permissões necessárias", "Use o administrador", "Use o root", "Menor privilégio."]]
};
DEEP["ping-pf-6"] = {
  ctx: ["Operar o PingFederate é manter o serviço disponível, seguro e fácil de diagnosticar. Isso envolve cluster, certificados, logs e backup de configuração.", NOTA_PING],
  teo: [["Cluster: console, engines e comunicação", "Em um cluster, um nó roda o console (CLUSTERED_CONSOLE) e os demais, o runtime (CLUSTERED_ENGINE). Cada nó tem um índice único, e a comunicação entre eles usa, por padrão, TCP, com portas para tráfego entre nós e para detecção de falhas, com a opção de usar UDP com multicast. Há senha de cluster para impedir que nós não autorizados entrem, e o tráfego entre nós é criptografado com chave derivada dessa senha. A configuração é feita no console e replicada às engines."], ["Certificados e HSM", "Certificados e chaves assinam e protegem mensagens, e expiram. O PingFederate permite o modo híbrido de HSM, que ajuda a mover o armazenamento de chaves e certificados do repositório local para um módulo de segurança de hardware ao longo do tempo, sem uma nova instalação. Acompanhe datas de vencimento, combine as trocas com os parceiros e documente quem é dono de cada certificado."], ["Logs e diagnóstico", "O diretório de logs padrão é <pf_install>/pingfederate/log, configurável. O server.log registra o funcionamento geral e erros, e o audit.log registra eventos de autenticação. A propriedade de detalhamento de eventos pode ser ajustada para investigações. Como nas demais plataformas, use níveis detalhados pelo tempo necessário."], ["Backup e mudanças de configuração", "Antes de mudanças grandes, exporte a configuração e guarde-a. Antes de editar o run.properties, faça uma cópia. Em clusters, lembre que mudanças no console só valem depois de replicadas às engines. Mantenha um registro de quem mudou o quê."]],
  mec: { t: "Rotina operacional", p: [["Monitorar o estado", "Verifique nós, filas e erros nos logs."], ["Acompanhar certificados", "Mantenha um calendário de vencimentos."], ["Planejar mudanças", "Exporte a configuração e teste fora de produção."], ["Replicar", "Replique a configuração às engines e confirme."], ["Registrar", "Documente a mudança e o resultado."]] },
  caso: { t: "Caso (fictício): o certificado que venceu no feriado", p: ["O certificado de assinatura de uma conexão importante venceu em um feriado. O parceiro passou a recusar todos os logins, e ninguém da equipe estava de plantão.", "No pós-incidente, a equipe criou um calendário de vencimentos com avisos 60 e 30 dias antes, definiu um responsável por certificado e passou a combinar as trocas com os parceiros com antecedência."], l: "Certificados vencem. O que evita o incidente é o calendário e o dono." },
  av: [["Replicação e consistência", "Se as engines divergem, os usuários têm experiências diferentes. Verifique a replicação depois de cada mudança relevante."]],
  mitos: [["O cluster elimina a necessidade de backup.", "Ele dá disponibilidade, e o backup protege a configuração."], ["Qualquer nó do cluster pode ser o console.", "Apenas um nó roda o console."], ["Logs detalhados devem ficar sempre ligados.", "Pesam e geram ruído; use pelo tempo necessário."]],
  ref: [R("pfCluster", "Cluster, índices de nó, autenticação e criptografia entre nós."), R("pfProps", "run.properties, logs e HSM."), R("pfPorts", "Portas do cluster."), R("pf101", "Visão geral."), R("nist207", "Seção 3.4, ambiente e componentes de rede."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Um cluster com console e engines.", "Só um nó roda o console", "Todos rodam o console", "Nenhum roda o console", "É a regra do cluster."], ["Quer evitar incidentes por certificado vencido.", "Mantenha calendário e dono para cada certificado", "Aumente os logs", "Troque o adaptador", "Planejar a troca evita o incidente."], ["O audit.log registra...", "Eventos de autenticação", "Erros de instalação", "Dados do diretório", "É o registro de eventos de login."]]
};
DEEP["ping-pd-1"] = {
  ctx: ["O PingDirectory é um servidor de diretório LDAP. Para entendê-lo, é preciso conhecer a linguagem dos diretórios: árvore, entrada, DN, atributo, classe de objeto e operações. Quem domina esse vocabulário lê qualquer documentação de diretório.", NOTA_PING],
  teo: [["A árvore de informação do diretório", "Os dados do diretório se organizam em árvore (DIT). Cada nó é uma entrada, com atributos como nome, e-mail e telefone. O DN (distinguished name) é o endereço completo da entrada, que combina o nome da própria entrada e o caminho até a raiz, como uid=ana,ou=Pessoas,dc=empresa,dc=com. O protocolo LDAP, especificado na RFC 4511, define como clientes e servidores conversam sobre essa árvore."], ["Schema, classes de objeto e atributos", "O schema define quais atributos existem e quais classes de objeto uma entrada pode ter. A classe de objeto diz quais atributos são obrigatórios e quais são opcionais. É o schema que impede, por exemplo, uma entrada de pessoa sem sobrenome obrigatório."], ["Operações LDAP", "As operações básicas são bind (autenticar), search (buscar), add (criar), modify (alterar), delete (remover), além de comparar e renomear. Uma busca tem base, escopo e filtro, como (mail=ana@empresa.com). Com mecanismos como o SASL, o bind pode usar diferentes métodos de autenticação."], ["Backends e bases", "Os dados ficam em backends, cada um responsável por uma ou mais bases (base DNs). Na documentação de índices, o PingDirectory armazena arquivos de índice separadamente para cada base, criados quando a base é inicializada ou quando um backend local é criado. Isso explica por que índices e backends andam juntos nas decisões de projeto."]],
  mec: { t: "Como uma busca LDAP é respondida", p: [["Bind", "O cliente se autentica no servidor."], ["Pedido de busca", "O cliente envia base, escopo e filtro."], ["Uso do índice", "O servidor usa um índice, se houver, para achar as entradas."], ["Controle de acesso", "As regras de acesso filtram o que o cliente pode ver."], ["Resposta", "O servidor devolve as entradas e atributos permitidos."]] },
  caso: { t: "Caso (fictício): a busca que devolvia nada", p: ["Um aplicativo pesquisava pessoas por e-mail e nunca encontrava ninguém. O diretório estava saudável e as entradas existiam.", "A equipe percebeu que a busca usava como base o ramo errado da árvore: as pessoas estavam em ou=Pessoas, e a busca olhava ou=Parceiros. Ajustada a base, os resultados apareceram."], l: "Na maioria das buscas sem resultado, a base ou o filtro estão errados." },
  av: [["DN e identificadores estáveis", "O DN muda quando a entrada é movida ou renomeada. Para referências duradouras, use um atributo estável, como um identificador único."]],
  mitos: [["O DN é só um nome.", "É o endereço completo da entrada na árvore."], ["Toda entrada pode ter qualquer atributo.", "O schema e as classes de objeto definem o que é permitido."], ["LDAP é um produto.", "É um protocolo padronizado, e o PingDirectory é um servidor que o implementa."]],
  ref: [R("rfc4511", "LDAP: o protocolo."), R("pdCfg", "Ferramenta dsconfig."), R("pdAdm", "Contas de administrador."), R("pdIdxOv", "Índices por base DN."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Uma busca retorna vazio.", "Confira a base e o filtro", "Reinstale o servidor", "Troque o schema", "São as causas mais comuns."], ["O endereço completo de uma entrada.", "É o DN", "É o filtro", "É o schema", "O DN identifica a entrada."], ["Quem define atributos obrigatórios?", "A classe de objeto, no schema", "O cliente", "O firewall", "O schema define."]]
};
DEEP["ping-pd-2"] = {
  ctx: ["Instalar o PingDirectory e configurá-lo com as ferramentas certas é o que separa um ambiente reproduzível de um artesanal. O dsconfig é a ferramenta central, e a instalação pode ser interativa ou por parâmetros.", NOTA_PING],
  teo: [["Modos de instalação", "A documentação descreve a instalação em modo interativo, respondendo a perguntas, e em modo não interativo, com todos os parâmetros informados, o que é mais adequado a automação. Há instruções para ativar criptografia durante a instalação, o que garante que dados dos backends locais, do changelog e do banco de replicação sejam criptografados. Dados existentes antes da ativação precisam ser exportados e reimportados para serem criptografados."], ["A ferramenta dsconfig", "O dsconfig tem três modos: interativo (menus), não interativo (um comando por vez) e em lote, que lê vários comandos de um arquivo e reduz conexões e invocações da JVM. Em geral, convém manter o servidor em execução ao configurar, para receber retorno sobre a validade da configuração. Usar o --help mostra subcomandos relacionados a backends, índices, replicação, topologia e autenticação."], ["Configuração como código", "Como o dsconfig aceita comandos em lote, é possível guardar a configuração em arquivos versionados e reaplicá-la em novos servidores. Isso reduz diferenças entre ambientes e facilita a auditoria de mudanças."], ["Decisões iniciais", "Antes de instalar, revise as considerações de pré-instalação, o dimensionamento, a criptografia, as políticas de senha e a conta de administração. Algumas escolhas, como a criptografia de dados, são mais fáceis de fazer no começo do que depois."]],
  mec: { t: "Como instalar de forma repetível", p: [["Revisar os pré-requisitos", "Leia as considerações de pré-instalação."], ["Instalar sem interação", "Use parâmetros e guarde o comando."], ["Ativar a criptografia desde o início", "Decida antes de carregar dados."], ["Aplicar a configuração em lote", "Use arquivos do dsconfig versionados."], ["Validar", "Confira a configuração e os acessos."]] },
  caso: { t: "Caso (fictício): vinte servidores iguais", p: ["Uma empresa precisava instalar vinte servidores iguais em regiões diferentes. A primeira tentativa, feita à mão, gerou diferenças sutis de configuração que causaram comportamentos distintos entre regiões.", "A equipe passou a instalar de forma não interativa e a aplicar a configuração por arquivos em lote versionados. As diferenças desapareceram, e as mudanças passaram a ser revisadas como código."], l: "Instalação e configuração repetíveis evitam diferenças difíceis de rastrear." },
  av: [["Criptografia dos dados", "Ativar a criptografia na instalação protege backends, changelog e replicação. Para dados já existentes, planeje exportar e importar de novo."]],
  mitos: [["O modo interativo é o mais seguro.", "O não interativo é mais repetível e evita erros de digitação."], ["Dá para criptografar dados antigos só mudando uma opção.", "É preciso exportar e reimportar os dados existentes."], ["O dsconfig só funciona com o servidor parado.", "Em geral, convém mantê-lo em execução para validar a configuração."]],
  ref: [R("pdInst", "Instalação em modo interativo e não interativo."), R("pdCfg", "Modos do dsconfig."), R("pdTools", "Ferramentas de linha de comando."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Vinte instalações iguais.", "O modo não interativo, com parâmetros", "O interativo em cada servidor", "Instalar à mão", "É repetível."], ["Dez mudanças de configuração em uma vez.", "O dsconfig em lote", "O dsconfig interativo", "Reiniciar", "O lote lê comandos de um arquivo."], ["Dados antigos precisam ser criptografados.", "Exporte e reimporte", "Basta reiniciar", "Não há como", "Dados anteriores não são criptografados automaticamente."]]
};
DEEP["ping-pd-3"] = {
  ctx: ["Backends e índices determinam quão rápido o diretório responde. Um índice bem escolhido faz uma busca levar milissegundos; a falta dele pode fazer o servidor varrer milhões de entradas.", NOTA_PING],
  teo: [["Para que servem os índices", "A documentação explica que o PingDirectory usa índices para melhorar o desempenho das buscas e manter taxas consistentes independentemente do número de objetos na árvore. Os índices são associados a atributos e guardados em arquivos próprios, gerenciados separadamente para cada base DN. O servidor os cria automaticamente ao inicializar uma base ou ao criar um backend local, e os atualiza nas operações de modificação. Se a criptografia estiver ativa, os índices também são criptografados."], ["Índices padrão, críticos e tipos", "Há índices padrão do sistema e índices padrão do backend local, como cn, givenName, sn, mail, uid, member e objectClass. Três índices internos são críticos e não devem ser removidos: aci, ds-entry-unique-id e objectClass. Há também índices VLV (para paginação de resultados) e filtrados (que indexam um atributo apenas para entradas que atendem a um filtro). Não se devem usar índices de igualdade e substring em atributos com dados binários."], ["Buscas sem índice e como controlá-las", "Uma busca que não pode usar índice é cara. A documentação recomenda que somente usuários com o privilégio de busca sem índice possam fazê-la, e que as políticas de conexão de cliente mantenham a permissão de buscas sem índice desligada onde elas nunca deveriam ser necessárias. Há uma opção intermediária: permitir buscas sem índice apenas quando o cliente envia um controle específico. Também é possível limitar o número de buscas sem índice simultâneas."], ["Limite de entradas por índice e manutenção", "O PingDirectory define um limite de entradas por chave de índice: acima dele, a chave deixa de ser útil para a busca. Ferramentas como a verificação de índices conferem se eles estão consistentes com os dados. O dsconfig permite listar, criar e modificar índices, e o conjunto deve refletir as buscas reais dos aplicativos."]],
  mec: { t: "Como decidir que índice criar", p: [["Levantar as buscas reais", "Veja os filtros que os aplicativos usam com frequência."], ["Comparar com os índices existentes", "Liste os índices do backend."], ["Criar o índice necessário", "Escolha o tipo (igualdade, substring) para o atributo."], ["Verificar a consistência", "Use a verificação de índices depois de mudanças grandes."], ["Controlar buscas sem índice", "Restrinja privilégios e políticas de conexão."]] },
  caso: { t: "Caso (fictício): a busca por matrícula", p: ["Um aplicativo de RH pesquisava pessoas por um atributo de matrícula, e as respostas demoravam segundos, com pico de CPU no servidor. O atributo não tinha índice.", "A equipe criou um índice de igualdade para o atributo. As buscas passaram a levar milissegundos. Em seguida, restringiu as buscas sem índice e criou um alerta para seu uso."], l: "Indexe os atributos usados em buscas frequentes, e controle o que não é indexado." },
  av: [["Remover índices com cuidado", "Os índices críticos nunca devem ser removidos. Antes de remover qualquer outro, confirme que nenhuma busca depende dele."]],
  mitos: [["Mais índices sempre melhoram o desempenho.", "Índices custam espaço e tempo de escrita. Indexe o que é buscado."], ["Qualquer cliente pode fazer buscas sem índice.", "Elas exigem privilégio e dependem das políticas de conexão."], ["Todos os índices podem ser removidos se não forem usados.", "Há índices internos críticos que não devem ser removidos."]],
  ref: [R("pdIdx", "Dicas sobre índices e buscas sem índice."), R("pdIdxOv", "Visão geral dos tipos de índice."), R("pdIdxMgr", "Gerenciamento de índices com dsconfig."), R("pdTools", "Ferramentas, incluindo verify-index."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Buscas por matrícula demoram.", "Crie um índice para o atributo", "Reinstale", "Apague entradas", "O índice evita a varredura."], ["Quais índices nunca devem ser removidos?", "aci, ds-entry-unique-id e objectClass", "Qualquer um", "Os de e-mail", "Esses são críticos."], ["Uma busca sem índice é cara.", "Restrinja quem pode fazê-la", "Libere para todos", "Desligue o servidor", "Exige privilégio."]]
};
DEEP["ping-pd-4"] = {
  ctx: ["A segurança do diretório se resolve em camadas: quem é o administrador, quem pode ver e alterar o quê, como as senhas são protegidas e como as conexões são criptografadas.", NOTA_PING],
  teo: [["Três classes de administrador", "A documentação descreve o root user, os administradores e os administradores globais. O root user é armazenado na configuração do servidor, ignora a avaliação de controle de acesso e tem acesso total, por meio de privilégios; por isso, a prática normal é criar administradores comuns. Os administradores têm acesso limitado pelas ACIs e ficam em um backend, replicados entre servidores. Os administradores globais ficam em um ramo da topologia, sempre espelhado entre os servidores, e servem para administrar a topologia."], ["Instruções de controle de acesso (ACIs)", "As ACIs dizem quem pode ler, buscar, alterar ou apagar quais entradas e atributos. As notas de versão citam regras que consideram, por exemplo, se a conexão é segura (LDAPS ou StartTLS) ou se atende a critérios de conexão, e alvos que consideram critérios de requisição. Muitas ACIs podem prejudicar o desempenho, o que aconselha manter um conjunto enxuto e bem documentado."], ["Políticas de senha e métodos seguros", "As políticas de senha definem validade, complexidade, bloqueio e armazenamento. A documentação de instalação menciona validadores de senha, como o de dicionário, que consome muita memória, e a possibilidade de ajustá-los na política. As senhas devem ser armazenadas com esquemas de hash adequados e transmitidas apenas por conexões protegidas."], ["Segurança das conexões e políticas de conexão", "As conexões devem usar LDAPS ou StartTLS. As políticas de conexão de cliente permitem restringir o acesso por endereço IP e por manipuladores de conexão, e definir permissões como a de buscas sem índice. Em conjunto, ACIs, privilégios e políticas de conexão formam o controle de acesso do diretório."]],
  mec: { t: "Como proteger o diretório em camadas", p: [["Limitar os administradores", "Use administradores com privilégios mínimos; reserve o root."], ["Escrever ACIs enxutas", "Conceda só o necessário e documente."], ["Definir políticas de senha", "Validade, complexidade e bloqueio."], ["Exigir TLS", "Use LDAPS ou StartTLS."], ["Restringir conexões", "Limite por endereço e por política de conexão."]] },
  caso: { t: "Caso (fictício): o aplicativo com o root", p: ["Um aplicativo foi configurado para se conectar ao diretório com a conta root, por praticidade. Quando o aplicativo foi comprometido, o atacante conseguiu ler e alterar todo o diretório, porque o root ignora as ACIs.", "A equipe criou uma conta de serviço com ACIs mínimas para o aplicativo, retirou o root de todas as integrações e passou a monitorar o seu uso."], l: "O root não deve ser usado por aplicativos. Contas de serviço com ACIs mínimas limitam o dano." },
  av: [["Contas de serviço de integrações", "Integrações, como a do PingFederate, usam uma conta de serviço que precisa de ACIs específicas para as funções que utiliza, e nenhuma além delas."]],
  mitos: [["O root user também respeita as ACIs.", "Ele ignora a avaliação de controle de acesso."], ["Mais ACIs significam mais segurança.", "Muitas regras prejudicam o desempenho e a manutenção."], ["A senha trafega protegida por padrão.", "Use LDAPS ou StartTLS."]],
  ref: [R("pdAdm", "Classes de administrador."), R("pdCfg", "Políticas e conexões via dsconfig."), R("pdInst", "Validadores de senha e criptografia na instalação."), R("saltzer", "Privilégio mínimo."), R("nist63", "Autenticação e senhas."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Uma conta ignora as ACIs.", "O root user", "Um administrador comum", "Um usuário final", "Ele é avaliado por privilégios."], ["Um aplicativo precisa ler o diretório.", "Use uma conta de serviço com ACIs mínimas", "Use o root", "Use anônimo", "Menor privilégio."], ["As senhas trafegam em texto claro.", "Use LDAPS ou StartTLS", "Aumente o log", "Crie índices", "Proteja a conexão."]]
};
DEEP["ping-pd-5"] = {
  ctx: ["Replicação é o que torna o diretório resistente: vários servidores com os mesmos dados e a mesma configuração. Para administrá-la, é preciso entender topologia, ferramenta e os cuidados ao incluir novos servidores.", NOTA_PING],
  teo: [["Por que replicar e como habilitar", "A replicação mantém os mesmos dados em vários servidores, o que dá alta disponibilidade, distribui a carga e aproxima os dados de quem os usa. A documentação das ferramentas informa que a dsreplication gerencia a replicação entre duas ou mais instâncias e que é preciso habilitá-la primeiro, com o subcomando enable. Se um dos dois servidores já faz parte de uma topologia, ele deve ser informado como o primeiro."], ["Topologia e registro", "A topologia registra os componentes e as relações entre os servidores. O registro da topologia guarda informações como o identificador do servidor de replicação e do domínio de replicação, e as mudanças feitas nele em um servidor são espelhadas automaticamente nos demais. O dsconfig, a API de configuração ou o console podem alterá-lo."], ["Administração da topologia", "Os administradores globais ficam em um ramo sempre espelhado entre os servidores e servem para administrar a topologia, o que permite aplicar mudanças de configuração a todos de uma vez. Isso torna esses administradores especialmente sensíveis: tratar a conta como privilegiada, com dono e monitoramento, é boa prática."], ["Cuidados operacionais", "Replicação não é backup: um erro replicado se propaga a todos. Mantenha backups independentes e teste restaurações. Observe a latência de replicação e planeje a manutenção de forma escalonada, para que sempre haja servidores disponíveis."]],
  mec: { t: "Como incluir um servidor na topologia", p: [["Planejar o desenho", "Defina quais servidores e domínios."], ["Habilitar a replicação", "Use a dsreplication com o subcomando enable."], ["Informar o servidor existente primeiro", "Se um já participa de topologia, ele entra como o primeiro."], ["Inicializar os dados", "Garanta que o novo servidor tenha os dados atuais."], ["Monitorar", "Acompanhe a latência e o estado da topologia."]] },
  caso: { t: "Caso (fictício): o erro que se replicou", p: ["Um script apagou, por engano, um ramo da árvore em um servidor. Em segundos, a exclusão foi replicada a todos os demais.", "A empresa tinha backups independentes e restaurou o ramo. Depois do incidente, passou a restringir quem pode executar exclusões em massa e a manter backups com frequência compatível com o risco."], l: "A replicação protege contra falhas de servidor, e não contra erros humanos." },
  av: [["Disponibilidade versus recuperação", "A replicação garante disponibilidade. A recuperação de erros e desastres depende de backups e de planos testados."]],
  mitos: [["A replicação substitui o backup.", "Erros se replicam. O backup é independente."], ["Qualquer ordem serve ao incluir um servidor.", "O servidor já em topologia deve ser informado como o primeiro."], ["Os administradores globais são iguais aos demais.", "Eles administram a topologia e são espelhados entre servidores."]],
  ref: [R("pdTools", "dsreplication e subcomando enable."), R("pdAdm", "Administradores globais."), R("pdCfg", "dsconfig e topologia."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Um servidor apaga um ramo por engano.", "A exclusão se replica aos demais", "A replicação impede a exclusão", "Nada acontece", "Replicação não é backup."], ["Qual ferramenta gerencia a replicação?", "dsreplication", "dsconfig list", "verify-index", "É a ferramenta indicada."], ["Um dos servidores já está em topologia.", "Ele deve ser informado como o primeiro", "A ordem não importa", "Apague a topologia", "É a regra da documentação."]]
};
DEEP["ping-pd-6"] = {
  ctx: ["Operar o PingDirectory é conhecer as ferramentas, fazer backups, ler logs e diagnosticar com método. A boa operação transforma incidentes em eventos previsíveis.", NOTA_PING],
  teo: [["Ferramentas de linha de comando", "A documentação lista ferramentas para backup e restauração, importação e exportação, listagem de DNs, identificação de conflitos de atributos únicos, verificação de índices e replicação. Conhecer o --help de cada uma economiza tempo, e o dsconfig --help-subcommands mostra os grupos de comandos. Algumas ferramentas exigem a capacidade de fazer buscas sem índice, o que reforça o cuidado com privilégios."], ["Backup e restauração", "Faça backups periódicos dos backends, guarde as cópias fora do servidor e teste a restauração. Um backup nunca restaurado é uma hipótese. Se a criptografia estiver ativa, planeje o acesso às chaves necessárias para restaurar."], ["Logs e métricas", "Os logs mostram operações, erros e tempos de resposta. Acompanhe indicadores como tempo de resposta por tipo de operação, número de buscas sem índice e latência de replicação. Alertas sobre desvios permitem agir antes de usuários reclamarem."], ["Diagnóstico estruturado", "Se a busca está lenta, verifique índices e buscas sem índice. Se o acesso é negado, olhe as ACIs, os privilégios e a conta usada. Se há falha de conexão, revise rede, certificados e TLS. Mudanças recentes, como novos aplicativos ou índices removidos, estão entre as causas mais comuns."]],
  mec: { t: "Roteiro de diagnóstico", p: [["Descrever o sintoma", "O que acontece, com quem e desde quando."], ["Olhar logs e métricas", "Busque erros, lentidão e buscas sem índice."], ["Formular hipóteses", "Índice, ACI, rede, TLS, mudança recente."], ["Testar uma hipótese por vez", "Altere uma coisa e meça."], ["Registrar a causa", "Documente e prevenha a repetição."]] },
  caso: { t: "Caso (fictício): o backup que nunca foi restaurado", p: ["Após uma falha de disco, a equipe tentou restaurar o último backup e descobriu que ele estava incompleto: o job de backup falhava silenciosamente havia semanas.", "Depois do incidente, passaram a restaurar um backup em ambiente de teste todo mês e a monitorar o resultado do job. O próximo evento foi resolvido em minutos."], l: "Um backup só vale quando a restauração foi testada." },
  av: [["Buscas sem índice como indicador", "Um aumento de buscas sem índice indica aplicativos novos ou índices ausentes. Monitore esse número."]],
  mitos: [["Backup feito é backup garantido.", "Só a restauração testada garante."], ["Falha de ACL aparece como erro de rede.", "Acesso negado costuma apontar para ACIs, privilégios ou conta usada."], ["O diagnóstico começa mudando configurações.", "Começa pelo sintoma e pelas evidências."]],
  ref: [R("pdTools", "Ferramentas de linha de comando."), R("pdIdx", "Buscas sem índice."), R("pdCfg", "dsconfig."), R("pdInst", "Instalação e criptografia."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Um backup nunca foi restaurado.", "Não se sabe se funciona", "Está garantido", "É inútil", "Teste a restauração."], ["O acesso é negado a uma conta.", "Verifique ACIs, privilégios e a conta usada", "Reinstale", "Crie índices", "É a causa típica."], ["Um aplicativo novo tornou tudo lento.", "Verifique buscas sem índice", "Troque o root", "Apague logs", "Provável falta de índice."]]
};
DEEP["ping-p1-1"] = {
  ctx: ["O PingOne é a plataforma de identidade em nuvem da Ping. Em vez de instalar servidores, você configura um ambiente pelo console e pelas APIs. A unidade básica é o ambiente: um espaço isolado, com seus usuários, aplicativos e políticas.", NOTA_PING],
  teo: [["Ambientes: isolamento e ciclo de vida", "Um ambiente é um espaço isolado, com usuários, aplicativos e configurações próprios. Ter ambientes separados para desenvolvimento, teste e produção permite mexer em um sem afetar o outro. A API de gerenciamento de ambientes mostra que os recursos centrais, como populações, políticas de senha e políticas de sign-on, pertencem ao ambiente. O identificador do ambiente (environment ID) e a região aparecem nas integrações com outros produtos."], ["Serviço em nuvem e responsabilidade", "Em um serviço em nuvem, o fornecedor opera a infraestrutura, mas a configuração de identidade continua sendo responsabilidade do cliente: quem são os usuários, quais aplicativos existem, quais políticas valem e quem administra. A integração com o PingFederate, por exemplo, exige informar ambiente, população, aplicação e políticas."], ["Console e APIs", "Tudo o que se faz no console pode ser automatizado pelas APIs da plataforma, o que permite criar ambientes iguais e aplicar mudanças em lote. É um caminho para tratar a configuração como código e evitar diferenças entre ambientes."], ["Administração e menor privilégio", "Os papéis administrativos limitam o que cada administrador pode fazer em cada ambiente. Em um serviço em nuvem, esse controle é ainda mais importante, porque o acesso administrativo pode ser feito de qualquer lugar."]],
  mec: { t: "Como começar um ambiente", p: [["Criar ambientes separados", "Teste e produção, no mínimo."], ["Criar populações", "Antes de criar usuários."], ["Cadastrar aplicações", "Registre os aplicativos que usarão o PingOne."], ["Definir políticas", "Senha e sign-on para cada público."], ["Atribuir papéis administrativos", "Com menor privilégio."]] },
  caso: { t: "Caso (fictício): a mudança testada em produção", p: ["Uma equipe alterou uma política de sign-on diretamente no ambiente de produção para testar. Por engano, exigiu MFA de usuários sem dispositivo, e centenas de pessoas ficaram sem acesso por uma hora.", "A empresa passou a testar mudanças em um ambiente separado, a exigir revisão antes de promover e a usar as APIs para aplicar a mesma configuração em produção."], l: "Ambientes separados permitem testar sem afetar os usuários reais." },
  av: [["Regiões e conformidade", "A escolha da região do ambiente pode ter implicações de conformidade e de latência. Registre a decisão."]],
  mitos: [["Um único ambiente basta.", "Ambientes separados protegem a produção de mudanças em teste."], ["Em nuvem, a configuração é responsabilidade do fornecedor.", "A configuração de identidade continua sendo do cliente."], ["As APIs só servem para desenvolvedores.", "Servem para automatizar e padronizar a administração."]],
  ref: [R("p1Env", "Gerenciamento de ambientes e populações."), R("p1Sign", "Políticas de sign-on."), R("pingCert", "Guia de certificação da Ping."), R("nist207", "Princípios de menor privilégio.")],
  cp: [["Quer testar sem afetar os usuários.", "Use um ambiente separado", "Teste em produção", "Teste de madrugada", "Ambientes são isolados."], ["O PingOne é entregue como...", "Serviço em nuvem", "Software local", "Hardware", "É nuvem."], ["Quer criar ambientes iguais.", "Use as APIs", "Clique um a um", "Copie por e-mail", "As APIs automatizam."]]
};
DEEP["ping-p1-2"] = {
  ctx: ["As populações organizam os usuários do ambiente. Elas permitem aplicar regras diferentes a públicos diferentes, como senha, MFA e políticas de sign-on.", NOTA_PING],
  teo: [["O que é uma população", "A documentação da API explica que uma população define um conjunto de usuários, semelhante a uma unidade organizacional. É preciso criar ao menos uma população antes de criar usuários. Um usuário não pode pertencer a mais de uma população ao mesmo tempo, mas pode ser movido de uma para outra. As populações simplificam a gestão: por exemplo, é possível criar uma população para um tipo de usuário e aplicar a ela uma política de senha."], ["Regras por população", "As condições das políticas de sign-on podem usar a população do usuário. Assim, é possível exigir MFA a cada login para uma população e dispensá-lo para outra se o último login foi recente. Isso permite ajustar segurança e comodidade para cada público, como funcionários, clientes e parceiros."], ["Usuários, atributos e grupos", "Os usuários têm atributos, como nome e e-mail. Grupos reúnem usuários para facilitar regras e permissões. Atributos limpos e consistentes simplificam as políticas, e a qualidade dos dados de origem continua sendo determinante para o resultado."], ["Desenho de populações", "Evite populações demais. Cada uma é um ponto de configuração a manter. Use-as para separar públicos com necessidades de segurança realmente diferentes e use grupos para variações menores dentro de um mesmo público."]],
  mec: { t: "Como desenhar populações", p: [["Listar os públicos", "Funcionários, clientes, parceiros."], ["Decidir diferenças de política", "Senha, MFA, sessão."], ["Criar as populações", "Uma por público com regras diferentes."], ["Aplicar políticas", "Associe políticas de senha e sign-on."], ["Migrar usuários", "Mova usuários quando mudarem de público."]] },
  caso: { t: "Caso (fictício): clientes com as regras dos funcionários", p: ["Uma empresa colocou clientes e funcionários na mesma população. As regras rígidas de senha e MFA dos funcionários passaram a valer para os clientes, e a taxa de abandono do cadastro subiu.", "A empresa criou uma população específica para clientes, com regras mais leves e MFA conforme o risco, e manteve a rígida para funcionários. O abandono caiu."], l: "Públicos diferentes pedem regras diferentes, e a população é o instrumento para isso." },
  av: [["Mover usuários entre populações", "Ao mover um usuário, as políticas da nova população passam a valer. Considere o efeito sobre sessões e sobre MFA já registrado."]],
  mitos: [["Um usuário pode estar em várias populações.", "Só em uma por vez, mas pode ser movido."], ["Grupos e populações são a mesma coisa.", "A população define o conjunto base do usuário; grupos agrupam usuários para regras."], ["É possível criar usuários sem população.", "É preciso criar ao menos uma população antes."]],
  ref: [R("p1Env", "Populações e gerenciamento de ambientes."), R("p1Sign", "Condições por população."), R("p1SignApi", "Variáveis de condição, incluindo a população."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Clientes e funcionários com regras diferentes.", "Populações distintas", "Um único grupo", "Dois ambientes", "Populações separam públicos."], ["Um usuário muda de público.", "Mova-o para outra população", "Duplique o usuário", "Apague o ambiente", "Usuários podem ser movidos."], ["Antes de criar usuários.", "Crie ao menos uma população", "Crie uma política", "Crie um grupo", "É um pré-requisito."]]
};
DEEP["ping-p1-3"] = {
  ctx: ["Cadastrar uma aplicação no PingOne é dizer a ele como um aplicativo vai pedir logins e tokens. A configuração correta dos redirect URIs, das concessões e da autenticação do cliente é o que protege os tokens.", NOTA_PING],
  teo: [["Concessões e proteção do código", "Em aplicações OIDC, é possível escolher as concessões: código de autorização, implícita, credenciais de cliente, CIBA, refresh token e troca de tokens. Aplicações de código de autorização podem ter a proteção PKCE aplicada de forma obrigatória. Para usar refresh tokens, o escopo offline_access permite ao aplicativo pedir o refresh token por requisição, e a duração de rolagem do refresh token limita por quanto tempo ele pode ser usado após a última autenticação."], ["Redirect URIs e padrões", "O redirect URI é o endereço para onde o PingOne envia a resposta OIDC depois da autenticação. A plataforma permite padrões com curinga para flexibilidade, mas padrões amplos reduzem a proteção. Registre endereços exatos sempre que possível, e revise-os periodicamente."], ["Autenticação do cliente no endpoint de tokens", "O método de autenticação no endpoint de tokens pode ser nenhum, segredo do cliente (por cabeçalho Basic, por corpo da requisição ou por JWT) ou JWT com chave privada. Neste último caso, é obrigatório fornecer o conjunto de chaves (JWKS), por URL ou diretamente. Métodos baseados em chaves privadas são mais robustos que segredos compartilhados."], ["Requisições de autorização protegidas", "Existe a opção de exigir que o aplicativo envie suas requisições de autorização diretamente ao PingOne, sem passar pelo navegador, o que protege informações sensíveis dos dispositivos dos usuários. Também há aplicações SAML, configuradas por troca de metadados e certificados, para aplicativos que não falam OIDC."]],
  mec: { t: "Como cadastrar uma aplicação OIDC", p: [["Escolher o tipo", "Web, nativa ou de página única."], ["Definir concessões", "Apenas as necessárias."], ["Registrar redirect URIs", "Endereços exatos, evitando curingas amplos."], ["Escolher a autenticação do cliente", "Prefira chave privada quando possível."], ["Associar a política de sign-on", "Defina o fluxo de login."]] },
  caso: { t: "Caso (fictício): o segredo no código", p: ["Um time de desenvolvimento colocou o segredo do cliente em um repositório de código público. Alguém o encontrou e passou a pedir tokens se passando pelo aplicativo.", "A equipe rotacionou o segredo, migrou a aplicação para autenticação por JWT com chave privada e adotou um cofre para guardar segredos."], l: "Segredos não pertencem a repositórios. Prefira métodos baseados em chave privada." },
  av: [["Aplicações SAML", "Para aplicativos que só falam SAML, configure endereços e certificados trocando metadados. O PingOne atua como provedor de identidade."]],
  mitos: [["O redirect URI pode ser qualquer endereço.", "Ele limita para onde as respostas são enviadas e deve ser restrito."], ["PKCE vale para qualquer concessão.", "A obrigatoriedade no PingOne aplica-se a aplicações de código de autorização."], ["Segredo compartilhado é tão seguro quanto chave privada.", "Métodos baseados em chave privada são mais robustos."]],
  ref: [R("p1Oidc", "Concessões, redirect URIs e métodos de autenticação do cliente."), R("p1Sign", "Associação de política de sign-on."), R("rfc6749", "OAuth 2.0."), R("rfc7636", "PKCE."), R("oidc", "OpenID Connect."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Um aplicativo quer um refresh token.", "Peça o escopo offline_access", "Não é possível", "Use o implícito", "O escopo habilita o refresh token."], ["O segredo vazou.", "Rotacione e prefira chave privada", "Ignore", "Aumente o log", "Reduz o risco."], ["Quer protegê-lo de curingas amplos.", "Registre redirect URIs exatos", "Use um curinga", "Libere tudo", "Restrinja os endereços."]]
};
DEEP["ping-p1-4"] = {
  ctx: ["A autenticação multifator reduz muito o risco de contas roubadas. No PingOne, ela é uma etapa da política de sign-on, e a política de MFA define os métodos permitidos. A arte está em equilibrar segurança e atrito.", NOTA_PING],
  teo: [["Fatores e níveis de garantia", "Um fator pode ser algo que a pessoa sabe (senha), algo que ela tem (um aparelho) ou algo que ela é (biometria). O NIST, na série SP 800-63, descreve níveis de garantia do autenticador (AAL): níveis mais altos exigem mais de um fator e métodos mais resistentes a fraudes. MFA só é MFA quando combina fatores de tipos diferentes."], ["Política de MFA e etapa no sign-on", "A política de MFA define quais métodos de autenticação são permitidos, e a etapa de MFA é adicionada na política de sign-on, escolhendo a política de MFA adequada. A política de sign-on dita como a identidade do usuário será verificada durante o login, e pode também ser configurada para autorização de dispositivo."], ["Condições: população, recência e dispositivo", "Para certas populações, as condições podem exigir MFA em todo login; para outras, dispensar se o último login com MFA foi dentro de um limite de tempo. Se não há condições, o usuário precisa autenticar toda vez que acessa o aplicativo. Se o usuário não tem dispositivo compatível, a etapa de MFA pode ser ignorada, conforme a configuração, o que exige decidir conscientemente se isso é aceitável."], ["Registro de dispositivos e recuperação", "Antes de usar MFA, a pessoa precisa registrar um dispositivo. Pense no fluxo de registro, no que acontece quando a pessoa perde o dispositivo e em como evitar que o processo de recuperação vire a porta dos fundos para atacantes. A política de registro pode ter requisitos diferentes da política de autenticação."]],
  mec: { t: "Como implantar MFA com poucos atritos", p: [["Escolher os métodos", "Aplicativo autenticador, SMS, chave de segurança."], ["Criar a política de MFA", "Defina os métodos permitidos."], ["Adicionar à política de sign-on", "Inclua a etapa de MFA com condições."], ["Planejar o registro e a recuperação", "Defina como registrar e recuperar."], ["Medir e ajustar", "Acompanhe falhas e abandono."]] },
  caso: { t: "Caso (fictício): MFA que todo mundo desativou", p: ["Uma empresa exigiu MFA em todo login, de todos os usuários, sem exceção. As reclamações cresceram, e vários gestores pediram para desativar a política.", "A equipe adotou condições: MFA obrigatório para populações de maior risco e dispensado se o último MFA fora recente. A segurança foi mantida onde importava, e a adesão melhorou."], l: "MFA precisa de condições bem desenhadas. Segurança que ninguém suporta é desativada." },
  av: [["Fatores resistentes a phishing", "Métodos baseados em chaves criptográficas do dispositivo, como WebAuthn e FIDO2, resistem melhor a phishing do que códigos digitados."]],
  mitos: [["Duas senhas são MFA.", "MFA exige fatores de tipos diferentes."], ["Se o usuário não tem dispositivo, sempre bloqueia.", "A etapa pode ser pulada, conforme a configuração."], ["MFA em todo login é sempre a melhor escolha.", "Condições equilibram segurança e atrito."]],
  ref: [R("p1Sign", "Política de sign-on com MFA, condições e usuários sem dispositivo."), R("p1SignApi", "Condições de política."), R("nist63", "Níveis de garantia do autenticador."), R("webauthn", "Autenticação por chaves do dispositivo."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Senha e segunda senha.", "Não é MFA, é o mesmo tipo de fator", "É MFA", "É MFA forte", "São fatores do mesmo tipo."], ["Dispensar MFA se o último foi recente.", "É uma condição de tempo na política", "É um backup", "É um índice", "Há condição de recência."], ["Quem perde o dispositivo.", "Precisa de um processo de recuperação seguro", "Fica sem acesso para sempre", "Usa a senha do vizinho", "A recuperação precisa ser desenhada."]]
};
DEEP["ping-p1-5"] = {
  ctx: ["A política de sign-on é o roteiro do login: um conjunto ordenado de ações, cada uma com condições. Entender a ordem de avaliação e o vocabulário de condições é o que permite escrever políticas previsíveis.", NOTA_PING],
  teo: [["Ordem de avaliação", "O PingOne avalia primeiro a política que está no topo da lista; se os requisitos não são atendidos, passa à próxima. O fluxo é configurado por aplicação, por meio de uma política de sign-on, e se nenhuma for associada, vale a política padrão do ambiente. Por isso, regras mais específicas devem vir antes das mais gerais, e a ordem deve ser testada."], ["Ações e condições", "Uma política suporta no máximo vinte ações. Cada ação pode ter condições que usam dados do contexto, como a população do usuário e o horário da última autenticação com MFA. A linguagem de condições combina regras lógicas e regras de dados, com variáveis como ${user.population.id}. Há ainda uma ação que redireciona a pessoa a um provedor de identidade externo para autenticar."], ["Risco e decisões adaptativas", "As condições também podem usar a pontuação de risco da tentativa de login. A documentação dá o exemplo de que, com risco de 80 ou menos, não é exigido MFA. Isso permite políticas adaptativas, que exigem mais verificação quando o contexto é suspeito e menos quando é normal."], ["Testar e documentar", "Políticas de sign-on afetam todos os logins, então testar é obrigatório. Simule usuários de cada população, com e sem dispositivo, com risco baixo e alto. Documente a ordem, a intenção de cada ação e o dono da política."]],
  mec: { t: "Como construir uma política de sign-on", p: [["Escrever as regras em português", "Descreva o que deve acontecer em cada situação."], ["Ordenar do específico ao geral", "Coloque as exceções antes da regra padrão."], ["Definir as condições", "População, recência de MFA e risco."], ["Testar cenários", "Usuários com e sem dispositivo, risco baixo e alto."], ["Documentar e revisar", "Registre o objetivo e o dono."]] },
  caso: { t: "Caso (fictício): a regra geral na frente", p: ["Uma equipe colocou, no topo da lista, uma política geral que exigia apenas senha. As políticas mais rígidas, para administradores, estavam abaixo e nunca eram avaliadas, porque a primeira já era atendida.", "Ao descobrir o problema, a equipe reordenou: primeiro as regras para administradores, depois as demais. A MFA passou a ser exigida de quem devia."], l: "A primeira política atendida vale. Ordene do específico ao geral." },
  av: [["Limites e variáveis", "O limite de vinte ações por política e o conjunto de variáveis disponíveis exigem planejamento. Se a política ficar complexa, considere dividi-la."]],
  mitos: [["Todas as políticas são avaliadas e combinadas.", "A primeira cujos requisitos são atendidos vale."], ["Sem política associada, o login não funciona.", "Vale a política padrão do ambiente."], ["Risco baixo significa nenhuma verificação.", "Depende da política; o exemplo da documentação dispensa o MFA nesse caso."]],
  ref: [R("p1Sign", "Ordem de avaliação e política padrão."), R("p1SignApi", "Ações, condições, variáveis e limite de ações."), R("nist207", "Seção 3.3, algoritmos de confiança e contexto."), R("pingCert", "Guia de certificação da Ping.")],
  cp: [["Duas políticas se aplicam ao usuário.", "Vale a primeira da lista atendida", "Vale a mais nova", "Valem as duas", "A avaliação segue a ordem."], ["Quantas ações cabem em uma política?", "Até vinte", "Até duas", "Ilimitadas", "O limite é 20."], ["Nenhuma política foi associada à aplicação.", "Vale a política padrão do ambiente", "O login falha", "O ambiente é apagado", "O padrão do ambiente é usado."]]
};
DEEP["ping-p1-6"] = {
  ctx: ["Administrar o PingOne é decidir quem pode fazer o quê, automatizar por APIs e integrá-lo a outros produtos, como o PingFederate. O fio condutor é o menor privilégio, aplicado a pessoas e a integrações.", NOTA_PING],
  teo: [["Papéis administrativos e menor privilégio", "Nem todo administrador precisa de todos os poderes. Os papéis administrativos limitam o que cada pessoa pode fazer em cada ambiente. Aplique o princípio do privilégio mínimo, de Saltzer e Schroeder, e revise periodicamente quem tem papéis elevados, como faria com qualquer acesso sensível."], ["APIs e automação", "As APIs de plataforma permitem gerenciar ambientes, populações, usuários, políticas de senha e de sign-on. Usar APIs permite criar ambientes iguais, versionar a configuração e aplicar mudanças em lote. As credenciais usadas pela automação são identidades de máquina e devem ter escopo mínimo, dono e rotação."], ["Integração com o PingFederate", "O adaptador de MFA do PingOne, usado no PingFederate, precisa do ambiente, da população em que usuários novos são provisionados, da aplicação OIDC e das políticas de MFA para autenticação e registro. A documentação indica que as políticas de autenticação usadas devem ser do tipo somente MFA e que o adaptador mapeia o valor à propriedade acr_values do pedido OIDC. É um exemplo de como configurações de dois produtos devem ser consistentes."], ["Monitoramento e auditoria", "Registre as mudanças administrativas e os eventos de autenticação, e envie-os ao sistema de monitoramento da empresa. Isso permite investigar incidentes e comprovar controles à auditoria."]],
  mec: { t: "Como administrar com segurança", p: [["Definir papéis", "Atribua o menor papel que resolve a tarefa."], ["Automatizar com APIs", "Use credenciais próprias e de escopo mínimo."], ["Padronizar ambientes", "Aplique a mesma configuração por API."], ["Integrar com cuidado", "Confirme ambiente, população, aplicação e política em cada integração."], ["Auditar", "Revise papéis e mudanças periodicamente."]] },

function constel(small) {

    ms.forEach((m, j) => { const r = k === 1 ? 175 : 205 - j * (90 / (k - 1)); pos[m.id] = [cx + Math.cos(ang) * r * 1.25, cy + Math.sin(ang) * r * 0.98]; });
    const rl = k === 1 ? 175 + 40 : 250; lab.push([cx + Math.cos(ang) * rl * 1.25, cy + Math.sin(ang) * rl * 0.98 + 4, Math.abs(Math.cos(ang)) < 0.3 ? "middle" : Math.cos(ang) > 0 ? "start" : "end", clip(a.nome, 20)]);

    const x1 = A[0] + dx / L * ra, y1 = A[1] + dy / L * ra, x2 = B[0] - dx / L * rb, y2 = B[1] - dy / L * rb;
    return `<path class="lin ${P(a).concl ? "on" : ""}" d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
  }).join("");

    const [x, y] = pos[m.id], st = nodeState(m), p = modPct(m), c = 2 * Math.PI * (rn + 4);

    const arc = st === "going" ? `<circle class="arc" r="${rn + 4}" stroke-dasharray="${c}" stroke-dashoffset="${(c * (1 - Math.max(p, 12) / 100)).toFixed(1)}" transform="rotate(-90)"/>` : "";

      : `<g class="no st-${st} ${ui.sel === m.id ? "sel" : ""} ${ign}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" data-act="selmod" data-id="${m.id}" aria-label="Módulo ${m.n}, ${esc(m.t)}, ${stl}"><circle class="halo" r="${rn + 9}"/><circle class="b" r="${rn}"/>${arc}<text y="5">${pad2(m.n)}</text></g>`;
  }).join("");
  const ready = concluidos() === MODULES.length;
  const root = `<g class="root-no ${ready ? "ready" : ""}" transform="translate(${cx} ${cy})" ${small ? "" : `tabindex="0" role="button" data-act="nav" data-to="#/simulados" aria-label="Prova: abrir simulados"`} style="cursor:${small ? "default" : "pointer"}"><circle r="${rr}"/><text y="5">Prova</text></g>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Constelação da trilha">${labels}${lines}${root}${nodes}</svg>`;

      const prompt = `Você ajuda a manter um portal de estudos para certificações de segurança de identidade (trilha: ${t.nome}). Recebeu o texto abaixo, que pode estar em inglês. Faça: (1) detecte o idioma; (2) escreva UMA seção de aula em português do Brasil, em linguagem simples, como se o leitor fosse leigo, com no máximo 220 palavras e uma analogia curta, preservando em inglês os termos técnicos globais de IAM; (3) proponha um título curto em português; (4) escolha até 3 módulos da lista que este conteúdo atualizaria, com uma frase de motivo cada (ou lista vazia). Responda SOMENTE com JSON no formato {"idioma":"...","titulo":"...","texto":"...","modulos":[{"id":"...","motivo":"..."}]}.\n\nMÓDULOS:\n${lista}\n\nTEXTO:\n<<<\n${it.texto.slice(0, 24000)}\n>>>`;

    }
    await passo(2, 700);
    if (!prop) prop = { idioma: it.idioma, titulo: clip((it.texto.split("\n").find(l => l.trim()) || it.nome).trim(), 80), texto: it.texto.slice(0, 6000), modulos: cruzarLocal(it.texto + " " + it.nome, t.id), ia: false };

function buscar(q) {
  const res = $("#q-res"); if (!res) return; q = q.trim().toLowerCase();
  if (q.length < 2) { res.classList.remove("on"); res.innerHTML = ""; return; }
  const out = [];
  ALLMODS.forEach(m => { if (m.t.toLowerCase().includes(q) || m.rs.toLowerCase().includes(q)) out.push({ t: `${trById(m.trilha).nome} · módulo ${m.n}: ${m.t}`, s: axById2(trById(m.trilha), m.d), to: "#/modulo/" + m.id }); m.termos.forEach(t => { if (t[0].toLowerCase().includes(q)) out.push({ t: t[0], s: `Termo em ${trById(m.trilha).nome}, módulo ${m.n}`, to: "#/modulo/" + m.id }); }); });
  res.innerHTML = out.slice(0, 7).map(x => `<button data-act="nav" data-to="${x.to}"><div>${esc(x.t)}</div><div class="lbl">${esc(x.s)}</div></button>`).join("") || `<div class="lbl" style="padding:8px 10px">Nada encontrado para essa busca.</div>`;
  res.classList.add("on");
}

/* ===== Eventos e inicialização ===== */
function afterRender(r) {
  if (r.name === "prova" && S.prova) { timerId = setInterval(tickProva, 1000); tickProva(); }
  const dz = $("#dz"); if (dz) { ["dragover", "dragenter"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("drag"); })); ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove("drag"))); dz.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) escolherArquivo(f); }); }
  if (r.name === "conteudos" && ui.audioUrl) { const au = $("#au"); if (au && !au.src) au.src = ui.audioUrl; }
}
function escolherArquivo(f) { ui.arq = f; ui.transc = ""; if (ui.audioUrl) URL.revokeObjectURL(ui.audioUrl); ui.audioUrl = AUDIO.includes(extDe(f.name)) ? URL.createObjectURL(f) : ""; render(true); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!e.target.closest(".menu") && !e.target.closest("[data-act='menu']")) { const m = $("#menu"); if (m) m.classList.remove("on"); }
  if (!e.target.closest(".search")) { const s = $("#q-res"); if (s) s.classList.remove("on"); }
  if (t && A[t.dataset.act]) A[t.dataset.act](t, e);
});
document.addEventListener("keydown", e => {
  if (S.sessao && parse().name === "modulo" && !e.target.matches("input,textarea,select") && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const m = modById(parse().arg); if (m && m.deep && !ui.unica) { e.preventDefault(); A[e.key === "ArrowRight" ? "etapa-prox" : "etapa-ant"](); return; } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act][tabindex],[role='button'][data-act]") && !e.target.matches("button,a,input,select,textarea")) { e.preventDefault(); e.target.click(); }
  if (e.target.id === "q" && e.key === "Enter") { const b = $("#q-res button"); if (b) b.click(); }
  if (S.sessao && parse().name === "trilhas" && ui.vista === "const" && e.target.classList && e.target.classList.contains("no") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const ns = $$(".no[data-id]"), i = ns.indexOf(e.target), n = ns[(i + (e.key === "ArrowRight" ? 1 : -1) + ns.length) % ns.length]; if (n) n.focus(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "file") { if (t.files[0]) escolherArquivo(t.files[0]); return; }
  const k = t.dataset && t.dataset.actChange; if (k && A[k]) A[k](t, e);
});
document.addEventListener("input", e => { const t = e.target; if (t.id === "q") { buscar(t.value); return; } const k = t.dataset && t.dataset.actInput; if (k && A[k]) A[k](t, e); });
document.addEventListener("submit", e => { if (e.target.id === "f-login") { e.preventDefault(); entrar($("#em").value); } if (e.target.id === "f-criar") { e.preventDefault(); A["acesso-enviar"](); } });
/* ---- janela explicativa dos termos ---- */
let popEl = null, popHide = 0, popFor = null;
function mostrarPop(el) {
  clearTimeout(popHide); if (popFor && popFor !== el) popFor.classList.remove("on");
  if (!popEl) { popEl = document.createElement("div"); popEl.id = "pop"; popEl.setAttribute("role", "tooltip"); document.body.appendChild(popEl); }
  popFor = el; el.classList.add("on"); popEl.innerHTML = `<strong>${esc(el.dataset.t)}</strong><span>${esc(el.dataset.def)}</span>`;
  const r = el.getBoundingClientRect(), w = Math.min(330, innerWidth - 16); popEl.style.visibility = "hidden"; popEl.classList.add("on");
  const h = popEl.offsetHeight; let left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)), top = r.bottom + 8;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 8);
  popEl.style.left = left + "px"; popEl.style.top = top + "px"; popEl.style.visibility = "visible"; el.setAttribute("aria-describedby", "pop");
}
function esconderPop(ms = 120) { clearTimeout(popHide); popHide = setTimeout(() => { if (popEl) popEl.classList.remove("on"); if (popFor) { popFor.classList.remove("on"); popFor.removeAttribute("aria-describedby"); } popFor = null; }, ms); }
document.addEventListener("mouseover", e => { const t = e.target.closest && e.target.closest(".termo"); if (t) mostrarPop(t); });
document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest(".termo")) esconderPop(); });
document.addEventListener("focusin", e => { const t = e.target.closest && e.target.closest(".termo"); if (t) mostrarPop(t); });
document.addEventListener("focusout", e => { if (e.target.closest && e.target.closest(".termo")) esconderPop(0); });
document.addEventListener("click", e => { const t = e.target.closest && e.target.closest(".termo"); if (t) { if (popFor === t && popEl && popEl.classList.contains("on") && e.detail === 0) esconderPop(0); else mostrarPop(t); } else esconderPop(0); });
document.addEventListener("keydown", e => { if (e.key === "Escape") esconderPop(0); });
window.addEventListener("scroll", () => esconderPop(0), { passive: true });
let mvT = 0;
document.addEventListener("mousemove", e => { if (reduce() || mvT) return; mvT = requestAnimationFrame(() => { mvT = 0; const t = $("#tex"); if (t) { t.style.setProperty("--px", ((e.clientX / innerWidth - 0.5) * -16).toFixed(1) + "px"); t.style.setProperty("--py", ((e.clientY / innerHeight - 0.5) * -16).toFixed(1) + "px"); } }); });
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(texture, 150); });
window.addEventListener("hashchange", route);

/* ---- plataforma: banco compartilhado e identidade ---- */
let rT = 0; function agendarRender() { clearTimeout(rT); rT = setTimeout(() => { if (document.querySelector(".modal-bg") || document.querySelector("input:focus,textarea:focus")) { agendarRender(); return; } checarSessao(); render(true); }, 450); }
function checarSessao() { if (MODE.plat && S.sessao) { const u = S.users[S.sessao.uid]; if (!u || u.status === "desativado") { S.sessao = null; curLayer = null; if (parse().name !== "login") location.hash = "#/login"; } } else if (MODE.plat && !S.sessao && MODE.me && S.users[MODE.me.id] && S.users[MODE.me.id].status !== "desativado") { iniciarSessao(MODE.me.id); curLayer = null; } }
function subColl(nome, alvo) { return new Promise(res => { let first = true; const un = MODE.db.collection(nome).onSnapshot(snap => { snap.docChanges().forEach(ch => { if (ch.type === "removed") delete S[alvo][ch.doc.id]; else S[alvo][ch.doc.id] = JSON.parse(JSON.stringify(ch.doc.data())); }); if (first) { first = false; res(); } else agendarRender(); }, () => { if (first) { first = false; res(); } }); MODE.subs.push(un); }); }
async function iniciarPlataforma() {
  const lim = (p, ms) => Promise.race([Promise.resolve(p), new Promise(r => setTimeout(() => r(null), ms))]);
  if (!window.claude || !window.claude.use) return;
  const [db, user, sample] = await Promise.all([lim(window.claude.use("db"), 9000), lim(window.claude.use("user"), 9000), lim(window.claude.use("sample"), 9000)]);
  MODE.db = db; MODE.user = user; MODE.sample = sample;
  if (!db || !user) return;
  const me = await user.me(); if (!me || !me.id) return;
  MODE.me = me; MODE.plat = true; NM[me.id] = { name: me.name, email: me.email, avatar: me.avatarUrl };
  S = emptyState();
  await Promise.all([subColl("usuarios", "users"), subColl("conteudo", "conteudo"), subColl("materiais", "materiais"), subColl("revisao", "revisao"), subColl("perguntas", "perguntas"), subColl("acessos", "acessos")]);
  if (me.isOwner || me.canEdit) await subColl("solicitacoes", "solic");
  else await new Promise(res => { let first = true; const un = db.doc("solicitacoes/" + me.id).onSnapshot(s => { if (s.exists) S.solic[me.id] = JSON.parse(JSON.stringify(s.data())); else delete S.solic[me.id]; if (first) { first = false; res(); } else agendarRender(); }, () => { if (first) { first = false; res(); } }); MODE.subs.push(un); });
  await new Promise(res => { let first = true; const un = db.doc("config/main").onSnapshot(s => { if (s.exists) S.cfg = Object.assign({ soAprovado: false }, JSON.parse(JSON.stringify(s.data()))); if (first) { first = false; res(); } else agendarRender(); }, () => { if (first) { first = false; res(); } }); MODE.subs.push(un); });
  try { const p = await db.doc(`data/users/${me.id}/prog`).get(); if (p.exists) S.dados[me.id] = JSON.parse(JSON.stringify(p.data())); } catch (e) { /* sem dados */ }
  try { const p = await db.doc(`data/users/${me.id}/prova`).get(); if (p.exists) S.prova = JSON.parse(JSON.stringify(p.data())).prova || null; } catch (e) { /* sem prova */ }
  if (S.users[me.id] && S.users[me.id].status !== "desativado") { S.sessao = { uid: me.id, perfil: "aluno" }; iniciarSessao(me.id); }
}
async function boot() {
  MODE.booting = true; texture(); render();
  try { await iniciarPlataforma(); } catch (e) { MODE.plat = false; }
  if (!MODE.plat) { S = emptyState(); loadLocal(); if (!MODE.sample) { try { MODE.sample = null; } catch (e) { /* ok */ } } }
  MODE.booting = false;
  Object.values(S.materiais).filter(i => i.estado === "processando" && i.autor === myId()).forEach(i => processar(i.id));
  if (!location.hash || location.hash === "#/login") location.hash = S.sessao ? homeHash() : "#/login";
  route();
}
boot();
