DEEP["sp-admin-1"] = {
  ctx: ["O administrador do ISC usa a plataforma todos os dias, e quase sempre pelos mesmos cinco recursos: a pesquisa para achar respostas, os relatórios para entregá-las, os workflows e event triggers para automatizar, a API para integrar e os níveis de usuário para decidir quem pode fazer o quê. Este módulo mostra como esses recursos se encaixam e onde estão os riscos de cada um.", "Duas ideias atravessam tudo: o menor privilégio, ao dar permissões, e a rastreabilidade, ao automatizar. O que não deixa rastro, não se defende na auditoria."],
  teo: [["Autenticação na API: OAuth 2.0 com tokens JWT", "A documentação da SailPoint afirma que o modelo de autenticação e autorização do ISC é totalmente compatível com OAuth 2.0, e que os tokens de acesso usam o padrão JSON Web Token (JWT). Na prática, quem chama a API pede um token ao endpoint de tokens do tenant e depois o envia em cada chamada. O fluxo mais usado em integrações é o de credenciais de cliente (client credentials), em que a aplicação obtém um token sem a participação direta de uma pessoa.", "A diferença importante está na origem das credenciais. Um token pessoal de acesso (PAT) é associado a um usuário do ISC e herda o nível de usuário dele (por exemplo, Admin ou Helpdesk) como base de acesso, e por isso tem contexto de usuário. Já um cliente OAuth não é associado a nenhum usuário, e o token tem apenas contexto de API. Existe ainda o fluxo de código de autorização, para chamar a API em nome da pessoa que está usando uma aplicação. Os PATs recebem implicitamente a concessão de credenciais de cliente."],
    ["Níveis de usuário: permissões acumulativas", "Os níveis de usuário são conjuntos de permissões que administradores concedem a outros usuários. Entre os níveis estão Admin (ORG_ADMIN), Cert Admin, Helpdesk, Report Admin, Role Admin e Sub-Admin, Source Admin e Sub-Admin. O acesso do usuário é acumulativo entre todos os níveis concedidos.", "A documentação recomenda não combinar o Org Admin com outros níveis elevados, porque a sobreposição pode, sem querer, reduzir direitos. Há também uma configuração, desligada por padrão, que permite a Role Admins e Source Admins gerenciar os direitos de nível de usuário. A própria SailPoint avisa que isso introduz risco adicional ao estender o poder de elevar privilégios. É um exemplo prático de privilégio mínimo: a pergunta certa não é quem pode ajudar, mas quem precisa dessa permissão."],
    ["Workflows e event triggers: reagir e agir", "Um event trigger avisa um serviço quando algo acontece no ISC, e a lista é extensa: conclusão de agregação, conta correlacionada, conta descorrelacionada, conta criada, atualizada ou excluída em uma source, source atualizada, identidade excluída, entre outros. Os eventos da lista de gatilhos da API são do tipo fire and forget: o ISC dispara o aviso e não espera a resposta para continuar.", "Um workflow combina um gatilho, ações e o fim. Os gatilhos podem ser eventos internos, como o término de uma agregação ou a mudança de status de uma campanha de certificação (por exemplo, de STAGED a ACTIVE e COMPLETED), ou externos, que exigem um token de acesso gerado no próprio gatilho para o sistema externo conseguir iniciar o fluxo. Nas ações, há desde enviar e-mails até criar campanhas de certificação e definir aprovações, com tipo único ou por quórum."],
    ["Pesquisa, relatórios e campos pesquisáveis", "A pesquisa no ISC trabalha sobre campos de identidades, contas, direitos de acesso e eventos. Entre os campos de identidade estão atributos como o identificador na fonte autoritativa, a fonte autoritativa da identidade e o estado do ciclo de vida (cloudLifecycleState). Isso permite perguntas como quem está em determinado estado ou quais identidades vêm de determinada fonte.", "Uma pesquisa que você vai repetir pode virar um relatório agendado. O cuidado é o de sempre: a pesquisa mostra o que o ISC já carregou. Por isso, a validade de um relatório depende de a agregação estar em dia."]],
  mec: { t: "Como automatizar um evento com segurança", p: [["Escolher o evento", "Defina qual acontecimento deve disparar a ação, como a conclusão de uma agregação ou a criação de uma conta em uma source."], ["Usar a identidade certa", "Para uma integração, prefira um cliente OAuth com escopo mínimo, em vez do token pessoal de um administrador, e dê a ele um dono."], ["Montar o workflow", "Escolha o gatilho, as ações e o final. Comece com ações simples e testáveis, como enviar uma notificação."], ["Testar em ambiente separado", "Execute o fluxo com poucos casos e confira o resultado nos registros de execução."], ["Registrar e monitorar", "Documente o objetivo, o dono e a data de revisão do fluxo, e monitore falhas de execução."]] },
  caso: { t: "Caso (fictício): o token pessoal que virou ponto único de falha", p: ["Uma equipe de TI criou um token pessoal de acesso, ligado ao usuário de uma administradora, para uma rotina que lia relatórios do ISC todas as noites. Funcionou por um ano, até a administradora mudar de área e perder o nível de usuário. A rotina parou sem aviso, e o relatório que alimentava a auditoria ficou três dias em branco.", "A equipe percebeu que o token herdava o nível de usuário da pessoa e, portanto, dependia da situação dela. Passou a usar um cliente OAuth com o escopo mínimo necessário, registrou um dono para a integração, configurou um evento de falha com notificação e incluiu a revisão da credencial em seu calendário."], l: "Integrações devem usar credenciais próprias, com dono e escopo mínimo, e não o acesso pessoal de alguém." },
  av: [["Backup e restauração de configurações", "Antes de mudanças grandes, exporte as configurações que o ISC permite exportar e mantenha o arquivo versionado. Isso permite comparar o que mudou e restaurar um estado conhecido. Teste a restauração em um ambiente separado, porque um backup não testado é uma hipótese, e não uma garantia."], ["Autenticação dos usuários no tenant", "Além da API, as pessoas precisam entrar no próprio ISC. As opções de autenticação do tenant devem seguir a política da organização, em geral com login único e MFA para os níveis administrativos. Reveja quem tem nível elevado com a mesma frequência com que revisa acessos a sistemas críticos."]],
  mitos: [["Um token pessoal é a melhor opção para qualquer integração.", "O token pessoal herda o nível de usuário da pessoa e depende da situação dela. Integrações duradouras costumam usar clientes OAuth com escopo mínimo e dono."], ["Dar o nível de administrador resolve qualquer permissão que faltar.", "Os níveis são acumulativos e o Org Admin tem direitos amplos. Conceda o nível mais específico possível."], ["O evento dispara e o ISC espera o resultado.", "Os eventos listados na API são do tipo fire and forget: o ISC avisa e segue, sem esperar a resposta."]],
  ref: [R("apiAuth", "Fluxos de autenticação e geração de tokens."), R("apiAuthRef", "Detalhes de client credentials e PAT."), R("userLevels", "Conceito e riscos de ampliar a gestão de níveis."), R("userMatrix", "Matriz de acesso por nível de usuário."), R("wfTriggers", "Gatilhos de workflow, internos e externos."), R("triggersApi", "Lista de event triggers."), R("searchFields", "Campos pesquisáveis."), R("gAdm", "Domínio 1 do blueprint."), R("rfc6749", "Seção 4.4, concessão de credenciais de cliente.")],
  cp: [["Uma rotina de integração precisa de uma credencial duradoura, sem depender de uma pessoa.", "Um cliente OAuth com escopo mínimo e um dono", "O token pessoal de um administrador", "A senha do administrador", "O cliente OAuth não é associado a um usuário e pode ter escopo restrito."], ["Uma pessoa recebeu três níveis de usuário.", "Os acessos se acumulam entre os níveis", "Vale só o maior nível", "Vale só o primeiro", "O acesso é acumulativo."], ["O ISC dispara um evento fire and forget.", "Ele avisa e segue, sem esperar a resposta", "Ele pausa até receber a resposta", "Ele repete até obter sucesso", "Esse tipo não aguarda retorno."]]
};
DEEP["sp-admin-2"] = {
  ctx: ["Boa parte dos sistemas de uma empresa fica dentro da rede interna, sem exposição à internet: diretórios, bancos de dados, aplicações legadas. Para o ISC, que vive na nuvem, alcançar esses sistemas exige uma ponte segura. Essa ponte é o virtual appliance (VA).", "Entender o VA é entender uma regra de ouro da segurança de rede: quem precisa de acesso deve iniciar a conexão, e não o contrário. É isso que torna o VA seguro e também explica boa parte dos problemas de diagnóstico."],
  teo: [["Conexões somente de saída", "A documentação oficial explica que o VA é entregue como uma imagem de disco virtual, é implantado na sua infraestrutura e gerenciado pela SailPoint, que mantém, corrige e atualiza o software. A SailPoint não se conecta diretamente ao VA: é cada VA que faz, de forma contínua, chamadas somente de saída para o ambiente em nuvem.", "Com essas chamadas, o VA consulta a fila do cluster para saber quais ações foram solicitadas (como agregação de dados e provisionamento de acessos), instala correções e atualiza imagens. Essa arquitetura reduz a superfície de ataque, porque a empresa não precisa abrir portas de entrada para a internet; basta liberar a saída para os endereços necessários."], ["Clusters e alta disponibilidade", "Os VAs trabalham em grupos chamados clusters. A SailPoint recomenda fortemente pelo menos dois VAs por cluster, para ter alta disponibilidade e balanceamento de carga. O painel de clusters mostra um aviso quando há apenas um VA, justamente porque um único VA é um ponto único de falha.", "Existem variações de rede: o VA com proxy HTTP, que se conecta por um serviço de proxy pré-configurado, e o VA com túnel de rede, recomendado quando o firewall exige adicionar o tráfego de saída a uma lista de permissão, mas não aceita entradas por nome de domínio."], ["Quem faz o quê: responsabilidade compartilhada", "A SailPoint mantém o software do VA. A sua organização precisa providenciar o hardware ou hipervisor que hospeda a imagem, garantir a conectividade com a nuvem e monitorar a saúde do VA. É uma divisão clássica de responsabilidade compartilhada: o fornecedor cuida do produto, e o cliente, do ambiente em que ele roda.", "A recomendação de tirar um instantâneo (snapshot) do VA depois de configurado, e apagá-lo quando o VA já estiver integrado ao cluster, é um bom hábito operacional: permite voltar a um estado conhecido durante a integração."], ["Monitoramento e observabilidade", "No ISC, as páginas de clusters de VA mostram cartões com o estado e as mensagens de alerta de cada cluster, e a página de detalhes permite ver cada VA e seus componentes. É possível receber e-mails quando um VA fica indisponível ou um cluster tem alerta de saúde. Entre os avisos documentados estão o de apenas um VA no cluster e o de erro de rede, quando o cluster não alcança os endpoints necessários.", "A SailPoint também suporta exportar métricas e registros do VA para ferramentas de monitoramento de terceiros, o que permite integrar o VA ao painel de operações da empresa."]],
  mec: { t: "Como diagnosticar um cluster com problema", p: [["Ver o estado no ISC", "Abra a página de clusters de VA e leia o status e os alertas de cada cartão."], ["Separar o escopo", "Se todas as sources do cluster falham, a causa provável é do VA ou da rede. Se só uma falha, olhe a source."], ["Conferir a saída de rede", "Verifique se o VA alcança os endpoints exigidos e se houve mudança recente em firewall, proxy ou DNS."], ["Checar horário e recursos", "Problemas de sincronização de horário e de recursos do hospedeiro também deixam o VA em estado não saudável."], ["Reiniciar com critério e documentar", "Se necessário, reinicie o cluster de forma controlada e registre causa, ação e resultado."]] },
  caso: { t: "Caso (fictício): a mudança de firewall de sexta-feira", p: ["Na segunda-feira, as sources de três sistemas internos amanheceram com erro. A equipe de identidade suspeitou das credenciais, mas o painel de clusters indicava erro de rede no cluster que atendia as três.", "Investigando, descobriu que a equipe de redes tinha trocado uma regra de firewall na sexta e bloqueado a saída do VA para um dos endereços exigidos. Com a regra corrigida, o cluster voltou ao estado saudável. A equipe adicionou o VA ao calendário de mudanças de rede e passou a monitorar o cluster com alertas por e-mail."], l: "Falhas simultâneas no mesmo cluster apontam para uma causa comum, e a rede é a suspeita número um." },
  av: [["Considerações de implantação", "Posicione o VA em uma rede que alcance as sources e libere a saída para a nuvem. Use, quando for o caso, proxy HTTP ou túnel de rede, conforme as exigências do seu firewall. Registre o responsável pelo ciclo de vida do VA, para que mudanças de rede e de infraestrutura considerem esse componente."], ["Atualizações e snapshots", "As atualizações do software são feitas pela SailPoint. Cabe à organização manter o hospedeiro saudável e planejar janelas para mudanças na infraestrutura. Antes de mudanças de rede, faça um teste de conectividade do VA depois delas."]],
  mitos: [["O VA precisa de portas de entrada abertas na internet.", "Segundo a documentação, o VA faz chamadas somente de saída, e a SailPoint não se conecta diretamente a ele."], ["Um VA é suficiente se o ambiente for pequeno.", "A SailPoint recomenda pelo menos dois por cluster, e o ISC alerta quando há apenas um."], ["A SailPoint cuida de tudo no VA.", "Ela mantém o software, mas a organização cuida do hospedeiro, da conectividade e do monitoramento."]],
  ref: [R("vaIndex", "Visão geral: imagem, conexões de saída e responsabilidades."), R("vaManage", "Monitoramento, alertas e reinício de clusters."), R("vaReady", "Recomendação de dois VAs por cluster e variações de proxy e túnel."), R("gAdm", "Domínio 2 do blueprint."), R("nist207", "Seção 3.4.1, requisitos de rede.")],
  cp: [["A SailPoint precisa alcançar o VA para pedir ações.", "Falso: o VA consulta a fila por conexões de saída", "Verdadeiro: a SailPoint entra na rede", "Verdadeiro: pela VPN do cliente", "O VA inicia as chamadas, e a SailPoint não se conecta a ele."], ["Um cluster tem um único VA.", "O ISC mostra um alerta, pois é um ponto único de falha", "Isso é o recomendado", "Não há risco", "A recomendação é ter ao menos dois."], ["As três sources de um cluster falham ao mesmo tempo.", "A causa provável é comum, como o VA ou a rede", "Cada source tem um problema diferente", "É erro de role", "Falha simultânea sugere causa compartilhada."]]
};
DEEP["sp-admin-3"] = {
  ctx: ["Identity profile e lifecycle state são o coração da modelagem de identidades no ISC. O primeiro responde à pergunta de onde vêm os dados de cada pessoa e como eles viram atributos de identidade. O segundo responde em que fase a pessoa está e o que isso muda nos acessos.", "Quase todo comportamento surpreendente do ISC (alguém que perdeu ou ganhou acesso sem pedir) pode ser explicado por um mapeamento ou por uma transição de estado."],
  teo: [["Identity profile: fonte, mapeamentos e prioridade", "Segundo a documentação, os atributos de identidade podem ser mapeados a partir de atributos de conta de qualquer source e podem ser diferentes em cada identity profile. Se uma pessoa pode existir em mais de uma fonte autoritativa, é importante definir a ordem de prioridade dos profiles: a identidade é associada ao profile de maior prioridade em cuja fonte autoritativa ela tenha uma conta.", "O ISC também registra as exceções de identidade (identity exceptions): ocorrem quando a conta na fonte autoritativa não tem valores para um ou mais atributos obrigatórios. É um indicador direto da qualidade dos dados de origem, e vale acompanhar na tela de identity profiles."], ["Lifecycle states: o que muda quando a pessoa muda de fase", "Em cada identity profile, você define os estados de ciclo de vida das pessoas que ele cobre. Em cada estado, é possível habilitar ou desabilitar contas nas sources, conceder access profiles e definir outras ações. Há um ponto central e frequentemente esquecido: os access profiles concedidos em um estado anterior são revogados automaticamente quando a identidade muda para um novo estado. Para manter o acesso ao longo de vários estados, é preciso conceder os access profiles em cada um deles.", "O ISC avalia os estados durante os refreshes agendados para verificar se as identidades têm os acessos definidos para aquele estado, e a recalculação ocorre no processamento de identidades, orientado a eventos e agendado."], ["Como o estado é atribuído: manual ou automático", "O estado pode ser alterado manualmente por um administrador, ou calculado automaticamente a partir do atributo de identidade Lifecycle State (cloudLifecycleState), que você mapeia por profile a um atributo de uma source. A documentação adverte que a definição manual vale enquanto o valor de origem não mudar: quando ele muda, o campo volta a ser calculado automaticamente.", "Se o valor da origem não corresponde a nenhum dos estados definidos no profile, a identidade fica com a situação de estado inválido. É um bom exemplo de por que o mapeamento precisa de pré-visualização e de testes antes de aplicar as mudanças."], ["Joiner, mover e leaver como modelo", "Os estados de ciclo de vida traduzem o modelo clássico de entrada, mudança e saída. A maior parte do acúmulo indevido de acessos ocorre nas mudanças de função, e a regra de revogar os acessos do estado anterior ajuda a combater isso, desde que os acessos da nova fase tenham sido modelados. O desligamento deve ser tratado como evento crítico: desabilitar contas, remover acessos e preservar evidências."]],
  mec: { t: "Como montar um ciclo de vida", p: [["Definir os estados", "Liste as fases reais, como pré-contratação, ativo, afastado e desligado, e decida o que cada uma deve permitir."], ["Mapear o atributo de estado", "Aponte o Lifecycle State a um atributo confiável da fonte, e use transform se o valor precisar ser traduzido."], ["Definir ações por estado", "Escolha quais contas habilitar ou desabilitar e quais access profiles conceder em cada estado."], ["Pré-visualizar", "Teste o mapeamento com algumas identidades antes de aplicar as mudanças ao profile."], ["Aplicar e acompanhar", "Aplique as mudanças e acompanhe exceções de identidade e identidades com estado inválido."]] },
  caso: { t: "Caso (fictício): o acesso que sumiu na promoção", p: ["Uma analista foi promovida a coordenadora, e o RH atualizou o cargo. Dois dias depois, ela perdeu o acesso a um sistema de relatórios que usava todos os dias, e o gestor abriu um chamado.", "A equipe verificou que a promoção levou a identidade a um novo estado de ciclo de vida, e o access profile do sistema de relatórios estava concedido só no estado anterior. Como os access profiles do estado anterior são revogados ao mudar de estado, o acesso foi retirado. A solução foi conceder o access profile também no novo estado e revisar os demais estados com a mesma lacuna."], l: "Ao mudar de estado, os acessos do estado anterior saem. Modele os acessos de cada fase explicitamente." },
  av: [["Prioridade de profiles e identidades híbridas", "Quando há fontes distintas para públicos diferentes (funcionários e terceiros), a prioridade entre profiles decide qual mapeamento alimenta os atributos de quem aparece nos dois. Documente a regra e teste casos de borda, como uma pessoa que passa de terceiro a funcionário."], ["O estado como atributo pesquisável", "O estado de ciclo de vida é um atributo pesquisável das identidades. Isso permite responder rapidamente quantas identidades estão em cada estado e achar inconsistências, como pessoas desligadas ainda ativas em sources críticas."]],
  mitos: [["Mudar o estado manualmente é definitivo.", "A definição manual vale enquanto o valor de origem não mudar. Depois, o estado volta a ser calculado."], ["Os acessos de um estado acompanham a pessoa para os próximos.", "Os access profiles do estado anterior são revogados na mudança. Os acessos devem ser concedidos em cada estado em que forem necessários."], ["Identity profile é só uma tela de mapeamento.", "Ele define fonte, prioridade, atributos, estados e ações. É o núcleo da modelagem de identidades."]],
  ref: [R("idProfiles", "Mapeamentos, prioridade e exceções de identidade."), R("lifecycle", "Atribuição manual e automática, e estado inválido."), R("searchFields", "O atributo cloudLifecycleState e outros campos pesquisáveis."), R("gAdm", "Domínio 3 do blueprint."), R("nist63", "Conceitos de identidade digital.")],
  cp: [["Uma pessoa existe em duas fontes autoritativas, em profiles distintos.", "A prioridade dos profiles define qual vale", "Vale o profile mais antigo", "Vale o primeiro em ordem alfabética", "A identidade é associada ao profile de maior prioridade."], ["Uma identidade muda de estado.", "Os access profiles do estado anterior são revogados", "Todos os acessos permanecem", "Só os de TI são revogados", "Para manter o acesso, é preciso concedê-lo no novo estado."], ["O valor de origem do estado não corresponde a nenhum estado do profile.", "A identidade fica com estado inválido", "O ISC cria o estado sozinho", "A identidade é excluída", "É preciso ajustar o mapeamento ou os estados."]]
};
DEEP["sp-admin-4"] = {
  ctx: ["Provisionar é a ponta que toca os sistemas: criar contas, conceder e retirar direitos. É também onde os erros se tornam visíveis, porque uma falha aparece como alguém sem acesso ou com acesso indevido. Dominar o provisionamento é saber o que o ISC faz sozinho, o que depende de conexão e o que cai nas mãos de pessoas.", "A diferença entre sources com conexão direta e sources sem ela, em especial, decide se o acesso aparece sozinho ou depende de uma tarefa manual."],
  teo: [["Política de criação de conta e plano de provisionamento", "Quando um acesso é concedido em uma source onde a pessoa ainda não tem conta, o ISC inclui automaticamente a criação da conta. A política de criação de conta funciona como instrução ou modelo do que incluir: quais atributos vão na conta e como são preenchidos, por exemplo por um gerador que cria o valor durante o provisionamento. A SailPoint pré-define essa política para muitos tipos de source, e ela pode ser editada. A documentação recomenda verificar mudanças grandes antes de implantar, porque falhas na política podem fazer o provisionamento falhar.", "No IdentityIQ, o fluxo é descrito de forma parecida: o pedido vira um plano de provisionamento, que o provisioning broker avalia e divide, às vezes, em planos parciais, um por aplicação. Cada plano segue para o tratador adequado, que pode ser um conector de leitura e escrita ou um item de trabalho manual."], ["Conexão direta versus tarefa manual", "Segundo o ISC, a conexão de cada source define se o provisionamento disparado por estados de ciclo de vida é automático ou manual. Em sources com conexão direta, o provisionamento é automático. Em sources por arquivo (flat file), o ISC cria uma tarefa de provisionamento com os valores da nova conta, atribui ao dono da source e envia uma notificação para que ele crie a conta manualmente. Tarefas manuais que envolvem direitos de acesso são atribuídas ao dono do entitlement, com o dono da source como alternativa.", "Também é possível desabilitar o provisionamento automático em uma source removendo o recurso de provisionamento da lista de funcionalidades dela, o que passa a gerar itens manuais."], ["Integração com sistemas de chamados", "Para sistemas desconectados, uma alternativa à tarefa manual é a integração com um sistema de chamados (service desk): o ISC gera um ticket com o plano de provisionamento. Um cuidado vindo da prática: valores da política de atualização que não voltam na leitura da conta podem ser reenviados como eventos de provisionamento a cada refresh, o que pode gerar tentativas repetidas e tickets redundantes."], ["Várias contas e erros recuperáveis", "Quando uma identidade pode ter mais de uma conta na mesma source, é possível configurar os access profiles para determinar qual conta recebe o acesso no provisionamento automático. O ISC também reconhece, em mensagens de erro dos conectores, alguns erros como passíveis de nova tentativa, como falhas de conexão e de rota de rede. Isso ajuda a distinguir uma falha transitória, que tende a se resolver sozinha, de uma falha de configuração, que exige correção."]],
  mec: { t: "Do pedido ao acesso: o caminho do provisionamento", p: [["Disparar", "Um evento inicia: pedido aprovado, role atribuída, mudança de estado ou remoção."], ["Montar o plano", "O ISC compara o estado desejado com o atual e monta o plano de mudanças."], ["Escolher o canal", "Conexão direta aplica a mudança; ticket gera um chamado; manual gera tarefa para o dono."], ["Aplicar e confirmar", "O conector escreve no destino. A confirmação vem da própria operação ou de uma agregação posterior."], ["Acompanhar", "Veja o resultado na atividade de provisionamento e trate falhas, distinguindo as transitórias das de configuração."]] },
  caso: { t: "Caso (fictício): o acesso que dependia de uma tarefa esquecida", p: ["Uma empresa conectou um sistema legado por arquivo e passou a prometer aos usuários que o acesso seria concedido automaticamente após a aprovação. Em duas semanas, vários pedidos aprovados não resultaram em acesso, e as pessoas reclamaram.", "A análise mostrou que a source por arquivo não provisiona sozinha: o ISC criava uma tarefa manual para o dono da source, que não recebia o aviso por estar em um endereço de e-mail antigo. A equipe corrigiu o dono, passou a acompanhar as tarefas pendentes e ajustou a comunicação com os usuários sobre o prazo desse sistema."], l: "Antes de prometer acesso automático, confirme se a source suporta provisionamento." },
  av: [["Como testar uma mudança de política", "Teste com identidades de teste e casos de borda (quem já tem conta, quem tem duas contas, quem muda de estado). Compare o plano de provisionamento com o esperado antes de aplicar a todos."], ["Onde investigar", "Use a atividade de provisionamento para ver os eventos de uma pessoa e de uma source. Ative o log do conector no nível necessário, pelo tempo necessário, e lembre que logs detalhados pesam."]],
  mitos: [["Toda source provisiona automaticamente.", "Só as com conexão direta e suporte do conector. Fontes por arquivo geram tarefas manuais."], ["Se o provisionamento falhou, a configuração está errada.", "Alguns erros, como falhas transitórias de rede, são recuperáveis e podem ser tentados de novo."], ["A política de criação de conta pode ser alterada sem teste.", "A documentação recomenda verificar mudanças grandes antes de implantar."]],
  ref: [R("provIndex", "Conexão direta, tarefas manuais, múltiplas contas e erros recuperáveis."), R("createProfile", "Política de criação de conta."), R("lifecycle", "Provisionamento disparado por estados."), R("gAdm", "Domínio 4 do blueprint."), R("rfc6749", "Conceito de autorização e tokens usados pelos conectores.")],
  cp: [["Um sistema só é lido por arquivo.", "O provisionamento gera uma tarefa manual para o dono", "O acesso é concedido sozinho", "O ISC cria um VA", "Sem conexão direta, o ISC cria tarefa manual."], ["Uma falha de conexão momentânea ocorre no provisionamento.", "Pode ser um erro recuperável, passível de nova tentativa", "É sempre erro de política", "Apaga a conta", "O ISC reconhece alguns erros como retentáveis."], ["A pessoa já tem conta e precisa de um novo acesso.", "O ISC só inclui o direito, sem recriar a conta", "O ISC apaga a conta antiga", "Pede uma nova conta sempre", "A criação só entra quando não há conta."]]
};
DEEP["sp-admin-5"] = {
  ctx: ["Gestão de acesso é a camada que dá nome e ordem ao que as pessoas podem fazer: direitos de acesso, pacotes, roles e os níveis de usuário do próprio ISC. Bem feita, ela torna pedidos, certificações e auditorias muito mais simples. Mal feita, vira um labirinto de exceções.", "Dois temas merecem atenção especial: como a atribuição automática de roles funciona, inclusive quando retira o acesso, e como os níveis de usuário concedem poder dentro do ISC."],
  teo: [["Entitlement, access profile e role: três níveis", "A documentação descreve os direitos de acesso em três níveis. O entitlement é o nível mais granular. O access profile é o seguinte e, em geral, agrupa entitlements. A role é o nível mais amplo e, em geral, agrupa access profiles. Um exemplo usado pela SailPoint: em uma source de diretório, há entitlements como Employees e Developers; um access profile pode agrupar os de desenvolvedores, e uma role pode juntar esse access profile a outro, de uma source de código, formando o acesso completo de um perfil de desenvolvedor.", "Esse desenho é uma aplicação direta do modelo RBAC: a pessoa recebe papéis, e os papéis carregam permissões."], ["Atribuição automática de roles: critérios e remoção", "Você pode configurar critérios para conceder uma role a quem deve tê-la. O ISC também provisiona os entitlements dos access profiles da role nas contas da pessoa. Há dois tipos de critério: padrão, que usa atributos de conta, entitlements ou atributos de identidade; e lista de identidades, em que você indica as pessoas. Um ponto crítico: quando a pessoa deixa de atender aos critérios, por mudança dos critérios ou dos dados, o ISC remove a role e seus access profiles.", "Por isso a qualidade dos dados é decisiva: um atributo errado pode retirar acessos. Só atributos de tipo texto e booleano são suportados nos critérios, e alguns atributos, como descrição e identificadores de conta, não podem ser usados."], ["Como as certificações enxergam esses acessos", "A forma como o acesso foi concedido determina como ele aparece nas certificações. Roles atribuídas automaticamente só podem ser reconhecidas (acknowledged), pois o modelo de roles controla a atribuição. Access profiles obtidos por pedidos ou detectados a partir de entitlements existentes podem ser certificados. Os concedidos por uma role ou por um estado de ciclo de vida não aparecem individualmente, pois ficam encapsulados.", "Isso tem uma consequência prática: um bom modelo de roles reduz o volume de itens a revisar, mas também muda onde a revisão acontece, concentrando-a na role."], ["Níveis de usuário: poder dentro do ISC", "Os níveis de usuário são permissões do próprio ISC, e, em geral, os usuários não podem conceder níveis a si mesmos: só administradores. O acesso é acumulativo, e a documentação recomenda não combinar o Org Admin com outros níveis elevados. O Helpdesk pode processar identidades, mas não define manualmente o estado de ciclo de vida; sub-admins só acessam certas páginas se forem membros do grupo de governança da source associada.", "Tratar os níveis de usuário como acessos sensíveis, sujeitos a revisão, é uma boa prática: quem administra o sistema de governança também precisa ser governado."]],
  mec: { t: "Como atribuir uma role automaticamente com segurança", p: [["Definir o critério", "Escolha o critério padrão ou a lista de identidades e use atributos confiáveis e do tipo suportado."], ["Montar os access profiles", "Reúna os entitlements por source e agrupe os access profiles na role."], ["Simular e conferir", "Veja quem entraria e quem sairia da role antes de ativar. Compare com a expectativa do dono do negócio."], ["Ativar e monitorar", "Acompanhe as primeiras atribuições e o provisionamento resultante."], ["Revisar ao longo do tempo", "Reveja os critérios quando a organização mudar, porque mudar o critério também remove acessos."]] },
  caso: { t: "Caso (fictício): a role que retirou o acesso de 200 pessoas", p: ["Uma equipe ajustou o critério de uma role de analistas para usar o atributo de cargo, e atualizou o texto de um cargo no RH, de 'Analista Sr' para 'Analista Sênior'. O critério continuava procurando o valor antigo.", "Ao rodar o processamento, duzentas pessoas deixaram de atender ao critério e perderam a role, e com ela os access profiles. O ISC retirou os acessos conforme documentado. A equipe restaurou o critério, corrigiu os valores e passou a simular o resultado antes de ativar qualquer mudança."], l: "Mudar critério ou dado pode retirar acessos. Simule antes de ativar." },
  av: [["Roles comuns e especializadas na prática", "Roles amplas tendem a atender muita gente, e as especializadas, a casos pontuais. Separar as duas evita acessos desnecessários. Documente o dono e o objetivo de cada role, para facilitar revisões."], ["Quando há várias contas na mesma source", "Se a identidade tem várias contas em uma source, é possível configurar os access profiles para determinar qual conta recebe os entitlements quando a role é atribuída."]],
  mitos: [["Role atribuída automaticamente pode ser revogada em uma certificação.", "Roles de atribuição automática só podem ser reconhecidas, porque o modelo de roles controla a atribuição."], ["Mudar o critério de uma role não afeta quem já a tem.", "Quem deixar de atender ao critério perde a role e seus access profiles."], ["O nível Org Admin combinado com outros níveis dá ainda mais controle.", "A documentação recomenda não combinar, pois a sobreposição pode reduzir direitos sem querer."]],
  ref: [R("roleAssign", "Critérios, remoção automática e limites de atributos."), R("understandCerts", "Como roles, access profiles e entitlements aparecem nas certificações."), R("userLevels", "Concessão e riscos dos níveis de usuário."), R("userMatrix", "Matriz de acesso."), R("rbac", "O modelo RBAC do NIST."), R("gAdm", "Domínio 5 do blueprint.")],
  cp: [["Uma pessoa deixa de atender ao critério de uma role.", "O ISC remove a role e seus access profiles", "A role permanece", "A conta é apagada", "A remoção é automática."], ["Uma role atribuída por critérios aparece em uma certificação.", "Ela só pode ser reconhecida", "Ela pode ser revogada normalmente", "Ela some da certificação", "O modelo controla a atribuição."], ["Um usuário quer se dar nível de administrador.", "Em geral, só administradores concedem níveis", "Ele mesmo pode conceder", "O Helpdesk concede", "Usuários não concedem níveis a si mesmos."]]
};
DEEP["sp-admin-6"] = {
  ctx: ["A governança cuida de duas perguntas que a auditoria faz sempre: quem aprovou este acesso e quando ele foi revisado. No ISC, a primeira é respondida pelo fluxo de pedidos e aprovações; a segunda, pelas certificações; e ambas se apoiam em políticas e em reatribuição de trabalho.", "Este módulo mostra como cada peça funciona e onde estão as armadilhas, como aprovadores ausentes e revisores que revisam o próprio acesso."],
  teo: [["Pedidos e aprovações: quem pode aprovar", "Para access profiles e entitlements, os administradores podem exigir aprovação do dono do access profile, do dono da aplicação, do dono da source, do gestor do solicitante ou de um grupo de governança. Para roles, podem exigir o dono da role, o gestor ou um grupo de governança. Em grupos de governança, basta uma pessoa do grupo aprovar. Quando há donos adicionais e o dono principal é o primeiro revisor, os adicionais só veem o pedido depois da aprovação do principal.", "Nos workflows, a política de aprovação pode ser única, com um revisor, ou por quórum, com vários revisores e um percentual mínimo de aprovações, e as aprovações em sequência exigem que cada uma termine antes da seguinte."], ["Acompanhamento e reatribuição de trabalho", "A administração de aprovações mostra o status de cada pedido (pendente, provisionamento parcial, falho, erro, cancelado, negado e concluído) e permite ações como ver detalhes, reatribuir, lembrar o usuário e cancelar. A reatribuição de trabalho cobre revisões de pedidos, certificações e tarefas manuais de provisionamento.", "Há proteções contra conflito de interesses: a prevenção de autoaprovação impede reatribuir a revisão para quem pediu ou para quem receberá o acesso. Na certificação, a prevenção de autocertificação separa os acessos do novo revisor em outra certificação, que vai automaticamente ao gestor, ao dono da campanha ou a um administrador."], ["O ciclo de uma certificação", "Segundo a documentação, um administrador de certificações define os requisitos da campanha por uma consulta de pesquisa ou por um filtro, gera e inicia a campanha. Os revisores analisam as certificações, aprovam ou revogam acessos e fazem o Sign Off. O ISC remedia os acessos revogados, e um administrador conclui a campanha. Quando todos assinam, a campanha termina ou, se houve revogações, passa à fase de remediação, que se encerra quando os pedidos de remoção são concluídos.", "Os gatilhos de workflow mostram os estados da campanha, entre eles STAGED, ACTIVE e COMPLETED, o que permite automatizar avisos."], ["Quais acessos entram nas certificações", "Nem todo acesso é certificável: parte é controlada automaticamente pelo modelo de acesso. As campanhas por dono de source incluem apenas itens concedidos sem o uso de role ou de estado de ciclo de vida. Os tipos de campanha incluem gerente (cada gestor revê os acessos de sua equipe), dono de source (certifica os acessos de uma ou mais sources) e indivíduo ou grupo de governança, entre outros. Por isso é importante escolher o tipo conforme o objetivo da revisão."]],
  mec: { t: "Como conduzir uma campanha com qualidade", p: [["Escolher tipo e escopo", "Defina o que será revisado e por quem, mantendo volumes que as pessoas consigam analisar."], ["Pré-visualizar", "Confira revisores, itens e prazos antes de iniciar."], ["Acompanhar e cobrar", "Veja o andamento e use lembretes e reatribuições para destravar pendências."], ["Garantir a assinatura", "Confirme que todos os revisores fizeram o Sign Off."], ["Remediar e concluir", "Acompanhe a remoção dos acessos revogados e conclua a campanha, guardando a evidência."]] },
  caso: { t: "Caso (fictício): o gestor que certificava o próprio acesso", p: ["Em uma campanha por gerente, uma gestora foi, por reatribuição, designada como revisora de uma equipe em que ela mesma tinha acessos. Na prática, ela estaria aprovando o próprio acesso.", "Como a prevenção de autocertificação estava ativa, o ISC separou os acessos dela em uma certificação distinta e a enviou ao gerente dela. A equipe de governança aproveitou para documentar a regra nos procedimentos e incluí-la na explicação aos auditores."], l: "Aprovar o próprio acesso é um conflito de interesses, e o produto traz proteções que devem ficar ligadas." },
  av: [["Evidência para a auditoria", "Guarde o escopo, a configuração, as decisões item a item, os Sign Offs e as remediações. Registre exceções com justificativa e prazo. O conjunto, e não apenas o resultado, é a evidência."], ["Políticas SoD e políticas gerais", "A SoD usa duas listas de acessos conflitantes. A política geral nasce de uma pesquisa e sinaliza condições inaceitáveis. Use as duas de forma complementar: uma para combinações perigosas e outra para anomalias de dados."]],
  mitos: [["Qualquer aprovador de um grupo precisa aprovar.", "Em grupos de governança, basta uma pessoa do grupo aprovar."], ["Todo acesso aparece nas certificações.", "Parte é controlada automaticamente pelo modelo de acesso, e os acessos concedidos por roles ou estados ficam encapsulados."], ["Dá para reatribuir uma revisão de pedido para um grupo de governança.", "A documentação indica que a reatribuição é feita no nível de indivíduo, e não para um grupo."]],
  ref: [R("cfgApRoles", "Opções de aprovadores para roles e access profiles."), R("approvalsAdmin", "Status de pedidos e reatribuição."), R("workReassign", "Prevenção de autoaprovação e autocertificação."), R("certsIndex", "Fluxo da certificação."), R("understandCerts", "O que entra nas certificações."), R("sod", "Separation of Duties no ISC."), R("pol", "Gerenciamento de políticas SoD."), R("gAdm", "Domínio 6 do blueprint."), R("sox", "Seção 404, controles internos.")],
  cp: [["O aprovador de um pedido está ausente.", "Reatribuir o trabalho a outra pessoa, no nível individual", "Cancelar o pedido sempre", "Aprovar no lugar dele sem registro", "A reatribuição existe para isso."], ["Houve revogações em uma campanha.", "A campanha vai para a fase de remediação", "A campanha é apagada", "A campanha reinicia", "A remediação remove os acessos."], ["Um gestor revisa o próprio acesso.", "A prevenção de autocertificação separa e reencaminha", "É permitido por padrão", "O ISC aprova sozinho", "O produto protege contra conflito de interesses."]]
};
DEEP["sp-admin-7"] = {
  ctx: ["Tudo no ISC começa em uma source. A qualidade dos dados que chegam por ela determina a qualidade de identidades, roles, certificações e relatórios. Por isso, entender agregação, correlação e exclusão de contas é o conteúdo mais valioso para quem administra o dia a dia.", "Duas ideias valem ouro: a agregação otimizada não reavalia o que não mudou, e a exclusão de contas tem uma trava de segurança."],
  teo: [["Agregação otimizada e não otimizada", "A documentação descreve dois modos de agregação de contas. Na otimizada, que é o padrão, o ISC recupera todos os registros da source e avalia o que mudou. Na não otimizada, ele examina cada conta e cada atributo e recalcula a correlação de contas e de gestores, mesmo para contas sem mudanças.", "A consequência prática é conhecida pela comunidade: uma conta não correlacionada pode continuar sem correlação, mesmo depois de a lógica de correlação ser corrigida, porque a agregação otimizada não reavalia a correlação das contas sem mudança de dados. Rodando uma agregação não otimizada, a correlação é reavaliada. Para recarregar as contas de uma source depois de uma mudança de correlação, execute uma agregação completa e não otimizada."], ["Correlação: como contas encontram suas identidades", "A configuração de correlação compara valores de atributos de conta com valores de atributos de identidade relacionados. Se o ISC não consegue casar, a conta é considerada não correlacionada e não é atribuída a identidades. A recomendação é configurar a correlação antes de agregar as contas pela primeira vez.", "Contas não correlacionadas aparecem com uma indicação própria, e uma identidade-sombra é criada para elas, mas ainda sem vínculo com uma identidade autoritativa. Uma conta não correlacionada precisa ser correlacionada antes de poder ser governada."], ["Resolver contas sem dono", "Há dois caminhos. A correlação manual cria um vínculo permanente da conta com a identidade, e é recomendada se a organização tem poucas contas não correlacionadas. Se há muitas, a recomendação é revisar a configuração de correlação, pois o problema é sistêmico. Existe também um relatório que lista as contas não correlacionadas por source.", "A agregação não otimizada não remove a correlação manual. Esse cuidado evita perder o trabalho de quem já corrigiu casos à mão."], ["Exclusão de contas e a trava de segurança", "Opcionalmente, é possível habilitar a exclusão de contas, para que contas não detectadas em uma agregação sejam removidas do ISC. Para evitar acidentes, existe um limite: um percentual máximo de contas que pode ser excluído em uma agregação. Se a agregação excluísse mais do que o limite, ela é cancelada. Em sources pequenas, o valor é arredondado para ao menos uma conta.", "Isso protege contra o caso clássico em que uma falha de conexão devolve uma lista vazia, e o ISC concluiria que todas as contas foram apagadas. Remover manualmente uma conta do ISC é possível, mas ela volta na próxima agregação completa, se ainda existir na fonte."]],
  mec: { t: "Como colocar uma source em produção", p: [["Configurar a correlação antes da primeira carga", "Defina quais atributos de conta casam com quais atributos de identidade."], ["Agregar e conferir", "Execute a agregação de contas e de entitlements e confira o resultado."], ["Tratar não correlacionadas", "Veja a lista de contas sem identidade e decida: ajustar a regra ou corrigir manualmente."], ["Definir a exclusão com trava", "Habilite a exclusão de contas com um limite percentual conservador."], ["Agendar e monitorar", "Agende agregações e monitore falhas e variações grandes de volume."]] },
  caso: { t: "Caso (fictício): a lista vazia que quase apagou tudo", p: ["Uma source com 4.000 contas passou por uma queda de rede durante a agregação, e o conector devolveu uma lista vazia. Sem proteção, o ISC entenderia que todas as contas tinham sido excluídas na fonte.", "A empresa tinha configurado o limite de exclusão em 10%. Como a agregação excluiria muito mais que isso, o ISC a cancelou, e nenhuma conta foi apagada. A equipe corrigiu a conexão, executou a agregação de novo e adicionou um alerta para cancelamentos por limite de exclusão."], l: "O limite de exclusão é uma trava de segurança contra falhas de conexão. Configure-o." },
  av: [["Agregação de entitlements e dados complementares", "A agregação de entitlements traz os direitos de acesso e seus detalhes. Contas sem os entitlements agregados ficam sem contexto para pedidos e certificações. Agende as duas agregações de forma coordenada."], ["Onde ver o histórico e os erros", "O histórico de agregações de cada source mostra o resultado de cada execução. Os erros de conexão e de importação, como falha na importação de arquivo de contas não correlacionadas, aparecem nos registros da source."]],
  mitos: [["Corrigi a regra de correlação, então as contas se correlacionam sozinhas.", "A agregação otimizada não reavalia contas sem mudança. É preciso uma agregação não otimizada."], ["Quanto mais contas não correlacionadas, mais usar a correlação manual.", "A correlação manual serve para poucos casos. Muitos casos indicam revisar a configuração."], ["A exclusão de contas é perigosa e deve ficar sempre desligada.", "Pode ser útil e segura quando há um limite de exclusão que cancela agregações suspeitas."]],
  ref: [R("loadingData", "Agregação otimizada e não otimizada, exclusão de contas."), R("correlation", "Configuração de correlação e resolução de contas sem dono."), R("accountsDoc", "Gerenciamento de contas."), R("triggersApi", "Eventos de conta e de agregação."), R("src", "Configuração de sources."), R("api", "API de sources."), R("gAdm", "Domínio 7 do blueprint.")],
  cp: [["A lógica de correlação foi corrigida, mas as contas continuam sem dono.", "Execute uma agregação não otimizada", "Aguarde a próxima agregação otimizada", "Exclua a source", "A otimizada não reavalia contas sem mudança."], ["Uma agregação excluiria bem mais contas que o limite definido.", "Ela é cancelada", "Ela exclui as contas mesmo assim", "Ela duplica as contas", "É a trava de segurança."], ["A organização tem centenas de contas não correlacionadas.", "Revisar a configuração de correlação", "Correlacionar uma a uma", "Ignorar", "O problema é sistêmico."]]
};
DEEP["sp-admin-8"] = {
  ctx: ["Os conhecimentos gerais são os que sustentam todo o resto: o que é IGA, por que existe a conformidade, qual a diferença entre autenticar e autorizar e como a federação e os métodos de autenticação funcionam. Quem domina esses conceitos entende por que o ISC faz o que faz, e consegue explicar isso a quem não é técnico.", "Também é o módulo em que mais se confundem termos parecidos, como autenticação e autorização, SAML e OAuth, ou MFA e senha forte."],
  teo: [["IGA: o que une administrar e governar", "IGA (Identity Governance and Administration) reúne duas atividades. A administração cria, altera e remove contas e acessos, o que o ISC faz por provisionamento. A governança decide e comprova: quem deve ter acesso, quem aprovou e se continua fazendo sentido, o que o ISC faz por pedidos, aprovações, certificações e políticas. Uma plataforma que só administra resolve o cadastro, mas não responde à auditoria.", "A literatura de segurança chama de AAA o conjunto das perguntas básicas: autenticação, autorização e auditoria (accounting). O IGA é, em grande parte, a resposta organizada às duas últimas."], ["Conformidade: obrigação e prova", "Conformidade é cumprir regras internas e externas, e poder provar. Normas e leis típicas incluem a Sarbanes-Oxley (controles internos sobre relatórios financeiros), a LGPD (proteção de dados pessoais contra acessos não autorizados, art. 46) e a ISO/IEC 27001 (que traz, no Anexo A, controles de gestão de identidades e de direitos de acesso).", "A consequência para a administração do ISC é que tudo o que se faz precisa deixar evidência: aprovações, revisões, exceções e remoções. Se não há registro, para a auditoria é como se não tivesse acontecido."], ["Autenticação, autorização e os níveis de garantia", "Autenticar é provar quem você é. Autorizar é decidir o que você pode fazer. O NIST, na série SP 800-63, descreve níveis de garantia do autenticador (AAL), de 1 a 3: quanto maior o nível, mais forte e resistente a fraudes deve ser o método. A partir do nível 2, exige-se autenticação com mais de um fator.", "Os fatores se agrupam em algo que você sabe (senha), algo que você tem (um aparelho ou chave) e algo que você é (biometria). O MFA combina fatores de tipos diferentes, e isso é mais forte do que duas senhas, que são o mesmo tipo de fator."], ["Federação: confiar no login de outro", "Na federação, uma organização aceita a autenticação feita por outra. O SAML 2.0, da OASIS, faz isso por asserções assinadas, trocadas entre o provedor de identidade e o provedor de serviço. O OAuth 2.0 e o OpenID Connect fazem isso, de forma mais moderna, com tokens. Em ambos, a confiança é preparada de antemão, com a troca de metadados e certificados.", "Para o administrador do ISC, isso se traduz na configuração de login único para as pessoas que entram no próprio ISC, e nas integrações com aplicativos que usam esses padrões."]],
  mec: { t: "Como explicar IGA a um não técnico", p: [["Comece pela pergunta de negócio", "Quem tem acesso a quê, e isso ainda faz sentido?"], ["Mostre as duas metades", "Administrar é dar e tirar acessos. Governar é decidir e comprovar."], ["Dê um exemplo concreto", "Uma pessoa que muda de área e perde os acessos antigos, com registro."], ["Ligue à obrigação", "Mostre qual lei ou norma exige a prova, como LGPD, SOX ou ISO 27001."], ["Termine em ação", "Diga o que a plataforma faz hoje e o que falta fazer."]] },
  caso: { t: "Caso (fictício): a senha forte que não era MFA", p: ["Uma gestora afirmou que a empresa já tinha autenticação multifator, porque exigia uma senha longa e outra senha de confirmação para sistemas críticos. A auditoria questionou: as duas eram o mesmo tipo de fator, algo que a pessoa sabe.", "Depois da discussão, a empresa passou a exigir, nos sistemas críticos, a senha mais um aplicativo de aprovação no celular, ou seja, algo que a pessoa sabe e algo que ela tem. O risco de um vazamento de senha deixou de bastar para entrar."], l: "MFA exige fatores de tipos diferentes. Duas senhas continuam sendo um fator só." },
  av: [["Padrões e onde os encontrar", "O NIST SP 800-63 trata de identidade digital, o SAML 2.0 de federação por asserções, a RFC 6749 do OAuth 2.0 e o OpenID Connect Core da camada de identidade. Conhecer os documentos originais ajuda a entender o que o produto implementa e a tirar dúvidas de projeto."], ["Autenticação sem senha", "Padrões como FIDO2 e WebAuthn, do W3C, permitem autenticar com chaves criptográficas do dispositivo, reduzindo o risco de phishing. Isso muda o método de autenticação, mas não elimina a necessidade de governar o que a identidade pode acessar."]],
  mitos: [["IGA é apenas criar e apagar contas.", "Isso é administração. A governança inclui decidir, revisar e comprovar."], ["Senha forte equivale a MFA.", "MFA exige mais de um tipo de fator, como algo que se sabe e algo que se tem."], ["Estar autenticado significa ter permissão para tudo.", "Autenticar prova quem é a pessoa. A autorização define o que ela pode fazer."]],
  ref: [R("nist63", "Níveis de garantia de identidade, de autenticador e de federação."), R("saml", "Federação por asserções."), R("rfc6749", "OAuth 2.0."), R("oidc", "OpenID Connect."), R("iso27001", "Controles de acesso e identidade."), R("lgpd", "Art. 46."), R("sox", "Controles internos."), R("webauthn", "Autenticação sem senha."), R("gAdm", "Domínio 8 do blueprint.")],
  cp: [["Uma empresa usa senha e uma segunda senha como 'MFA'.", "É o mesmo tipo de fator, então não é MFA", "É MFA, pois são dois itens", "É MFA forte", "MFA combina fatores de tipos diferentes."], ["Alguém acaba de entrar com sucesso em um sistema.", "A autorização ainda define o que ele pode fazer", "Ele pode tudo", "A autenticação decide as permissões", "Entrar não concede permissões por si."], ["Duas organizações confiam no login uma da outra.", "É federação", "É agregação", "É provisionamento", "Federação é confiar na autenticação de outro."]]
};

DEEP["sp-eng-1"] = {
  ctx: ["O engenheiro desenha o modelo de identidades antes de qualquer carga: quais fontes definem as pessoas, quantos identity profiles existem, quais atributos são obrigatórios e como o ciclo de vida reage a cada fase. Um desenho ruim aqui se paga em cada módulo seguinte.", "O raciocínio é sempre o mesmo: partir do que o negócio precisa distinguir (funcionário, terceiro, estagiário) e descer até o menor conjunto de atributos que torna cada identidade identificável e governável."],
  teo: [["Prioridade e quantidade de identity profiles", "A documentação de criação de identity profiles explica que atributos de identidade podem ser mapeados a partir de qualquer source e podem diferir em cada profile. Se uma pessoa pode existir em mais de uma fonte autoritativa, a ordem de prioridade dos profiles precisa estar correta, porque a identidade fica com o profile de maior prioridade em cuja fonte ela tem conta.", "O desenho típico usa um profile por público com ciclo de vida e fonte próprios: funcionários vêm do RH; terceiros, de um cadastro de fornecedores. Evite profiles demais: cada um traz mapeamentos, estados e testes para manter."], ["Atributos mínimos e identity exceptions", "Alguns atributos exigem mapeamento em cada profile e não podem ser nulos para nenhuma identidade, e o nome de usuário (User Name) precisa ser único entre todas as identidades de qualquer profile. Quando a conta na fonte autoritativa não tem valores para atributos obrigatórios, o ISC registra uma identity exception.", "Isso torna as exceções um termômetro direto da qualidade do RH: antes de culpar o ISC, cheque se o cadastro de origem preenche matrícula, nome, e-mail e datas."], ["Transforms para calcular o estado do ciclo de vida", "A documentação mostra que transforms simples podem ser combinados em transforms complexos, e dá exatamente este exemplo: calcular automaticamente o estado de ciclo de vida de uma identidade com base no atributo de data de início. É a forma de traduzir dados de RH (data de admissão, data de desligamento, status) em estados como pré-contratação, ativo e desligado sem recorrer a código.", "Os estados podem ser atribuídos manualmente por um administrador ou calculados pelo mapeamento de cloudLifecycleState. Sempre use a pré-visualização do mapeamento em algumas identidades antes de aplicar."], ["Joiner, mover e leaver como requisitos de projeto", "Para entradas e saídas, defina os estados (pré-contratação, ativo, afastado, desligado, pós-desligamento), as ações de acesso de cada um e o que acontece nas mudanças. Lembre que os access profiles de um estado anterior são revogados na mudança, o que protege contra acúmulo, mas exige modelar os acessos de cada fase. A saída é o evento mais sensível: planeje desabilitar contas, remover acessos e manter evidências."]],
  mec: { t: "Roteiro para implantar o modelo a partir do RH", p: [["Levantar públicos e fontes", "Liste os públicos de identidade e a fonte de cada um."], ["Definir profiles e prioridade", "Crie um profile por público e ordene a prioridade onde houver sobreposição."], ["Mapear o mínimo", "Mapeie identificador, nome, e-mail, gestor, departamento e datas, e acompanhe identity exceptions."], ["Calcular o ciclo de vida", "Use transforms para derivar estados dos dados de RH e valide com pré-visualização."], ["Ligar o gestor e testar", "Configure a correlação de gestor e teste casos de entrada, mudança e saída."]] },
  caso: { t: "Caso (fictício): terceiros que viraram funcionários", p: ["Uma empresa tinha um profile de funcionários (RH) e outro de terceiros (cadastro de fornecedores), com prioridade para o RH. Quando um terceiro foi contratado, passou a existir nas duas fontes.", "Graças à prioridade, a identidade passou a usar o mapeamento do profile do RH, sem duplicar a pessoa. A equipe, porém, notou identity exceptions: o RH ainda não preenchera o gestor dos recém-contratados. Eles ajustaram o processo de cadastro e adicionaram um alerta para exceções acima de um limite."], l: "A prioridade resolve o conflito entre fontes, mas a qualidade do dado de origem continua sendo responsabilidade do projeto." },
  av: [["Quando usar regra em um atributo", "Regras de atributo de identidade são o último recurso: exigem código e revisão da SailPoint. Primeiro tente transforms, que qualquer administrador pode criar e editar por API."]],
  mitos: [["Um profile cobre todos os públicos.", "Públicos com fontes e ciclos diferentes costumam pedir profiles distintos, com prioridade."], ["Atributo nulo é aceitável se a pessoa for nova.", "Atributos obrigatórios não podem ser nulos, e a ausência gera identity exception."], ["O estado de ciclo de vida só se altera manualmente.", "Ele pode ser calculado por mapeamento e transforms."]],
  ref: [R("idProfiles", "Prioridade, atributos obrigatórios e exceções."), R("lifecycle", "Estados, atribuição automática e manual."), R("transformsDoc", "Transforms simples e complexos."), R("gEng", "Domínio 1 do blueprint."), R("nist63", "Conceitos de identidade digital.")],
  cp: [["A mesma pessoa aparece em duas fontes autoritativas.", "A prioridade dos profiles define o mapeamento usado", "O ISC cria duas identidades", "O ISC apaga a mais antiga", "A identidade fica com o profile de maior prioridade."], ["Uma conta de RH vem sem o atributo obrigatório.", "O ISC registra uma identity exception", "O ISC preenche sozinho", "O ISC ignora", "É sinal de problema de dado de origem."], ["Você precisa derivar o estado a partir da data de admissão.", "Um transform, sem código", "Uma campanha", "Um VA", "Transforms combinados resolvem esse caso."]]
};
DEEP["sp-eng-2"] = {
  ctx: ["Provisionar bem é comparar o estado desejado com o estado real e aplicar apenas a diferença, de forma repetível. É um conceito antigo de gestão de configuração: a mesma instrução, aplicada duas vezes, deve levar ao mesmo resultado.", "Este módulo trata de prever o resultado de um provisionamento, projetar políticas, lidar com várias contas e testar sem surpresas."],
  teo: [["Estado desejado e estado real", "Quando um acesso é concedido em uma source onde a pessoa não tem conta, o ISC inclui a criação da conta no provisionamento. Se a conta já existe, só o direito entra. Esse comportamento é idempotente por desenho: pedir o que já existe não deve criar duplicata.", "A documentação da política de atualização traz uma consequência importante: valores já presentes na conta são removidos do plano final enviado ao conector, e valores que não voltam na leitura da conta podem ser reenviados como eventos de provisionamento a cada refresh de identidade, gerando tentativas repetidas ou tickets redundantes em integrações de chamados."], ["Políticas de criação e de atualização", "A política de criação de conta funciona como modelo: define atributos e como são preenchidos (valores estáticos, mapeamentos ou geradores). A de atualização só é recomendada para casos em que informação que não é de provisionamento precisa entrar no plano. Mudanças grandes na política devem ser verificadas antes da implantação.", "Regras do tipo before provisioning são um último recurso, porque exigem revisão da SailPoint."], ["Várias contas e papéis atribuídos", "Se a identidade pode ter mais de uma conta na mesma source, os access profiles podem indicar qual conta recebe o acesso. No caso de roles de atribuição automática, o ISC provisiona os entitlements dos access profiles da role e, quando a pessoa deixa de atender aos critérios, remove a role e seus access profiles, o que significa que desatribuir também é uma operação de provisionamento a ser testada."], ["Falhas transitórias e permanentes", "O ISC reconhece algumas mensagens de erro dos conectores como recuperáveis, como falhas de conexão e de rota de rede. Boas práticas de teste incluem simular as duas famílias: a transitória, que se resolve com nova tentativa, e a permanente, como atributo obrigatório ausente, que exige corrigir a política ou o dado."]],
  mec: { t: "Como testar uma mudança de provisionamento", p: [["Escolher identidades de teste", "Inclua quem não tem conta, quem já tem, quem tem duas contas e quem muda de estado."], ["Prever o resultado", "Escreva o plano esperado antes de executar."], ["Executar em ambiente separado", "Aplique a mudança em um tenant de teste ou em poucos casos."], ["Comparar", "Confira atividade de provisionamento e estado final na source."], ["Documentar e promover", "Registre o resultado e só então aplique em produção."]] },
  caso: { t: "Caso (fictício): os tickets repetidos", p: ["Uma empresa integrou uma source a um sistema de chamados. Toda noite, o ISC abria novos tickets para pessoas que já tinham recebido o acesso.", "A causa estava na política de atualização: um atributo era enviado em cada refresh porque o valor não era devolvido na leitura da conta. A equipe removeu o atributo da política, já que não era informação de provisionamento, e os tickets duplicados pararam."], l: "Atributos da política de atualização que não voltam na leitura podem ser reenviados repetidamente." },
  av: [["Documentar o contrato do conector", "Cada conector suporta certos atributos e operações. Registre, para cada source, o que é lido, o que é escrito e o que depende de tarefa manual."]],
  mitos: [["Pedir um acesso que já existe cria duplicata.", "O ISC trata a concessão de forma idempotente: o direito existente não é duplicado."], ["Todo erro de provisionamento exige correção de política.", "Alguns são transitórios e passíveis de nova tentativa."], ["A política de atualização deve conter todos os atributos.", "Ela é recomendada para informações que não são de provisionamento."]],
  ref: [R("provIndex", "Conexão direta, tarefas manuais, múltiplas contas e erros recuperáveis."), R("createProfile", "Política de criação de conta."), R("roleAssign", "Atribuição e remoção automática de roles."), R("lifecycle", "Provisionamento por estados."), R("gEng", "Domínio 2 do blueprint.")],
  cp: [["A pessoa já tem a conta e recebe um novo direito.", "Só o direito entra, sem recriar a conta", "A conta é recriada", "A conta é apagada", "A criação só entra quando não há conta."], ["Uma falha de rota de rede ocorre no provisionamento.", "Pode ser recuperável com nova tentativa", "É sempre erro de política", "Apaga a identidade", "O ISC reconhece alguns erros como retentáveis."], ["A pessoa deixa de atender ao critério de uma role.", "A role e seus access profiles são removidos", "Nada acontece", "A role é duplicada", "Desatribuir também provisiona."]]
