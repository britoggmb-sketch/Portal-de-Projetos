DEEP["sp-eng-3"] = {
  ctx: ["Dois recursos fazem a gestão de acesso funcionar no mundo real: lembretes e escalonamentos, que impedem que pedidos fiquem parados, e segmentos, que controlam quais itens de acesso cada público vê para pedir. Ambos são fáceis de configurar e fáceis de configurar mal.", "O ponto de partida é um fato pouco conhecido: por padrão, nenhum lembrete ou escalonamento é enviado."],
  teo: [["Lembretes e escalonamentos: a hierarquia de configuração", "A documentação oficial afirma que, por padrão, nenhum lembrete ou escalonamento é enviado. A configuração segue uma ordem: se existe configuração por item de acesso, ela se aplica; se não existe, vale a configuração de aprovação de pedidos; se nenhuma das duas existe, vale a global. Mudanças só afetam pedidos criados depois delas.", "Os parâmetros incluem quantos dias depois do pedido começam os lembretes, a frequência, quantos dias depois começam os escalonamentos e a frequência dos escalonamentos, tanto para aprovação quanto para revogação."], ["O padrão de escalonamento e o aprovador de reserva", "No escalonamento, o pedido passa a um aprovador de reserva (fallback), e a documentação adverte para um risco: se esse aprovador for a mesma pessoa que fez o pedido, ela pode acabar revisando o próprio pedido. O item é atribuído à identidade indicada mesmo que ela esteja desabilitada ou incompleta, o que é outro motivo para escolher bem quem é a reserva.", "O desenho de um padrão de escalonamento é, portanto, uma decisão de controle, e não só de conveniência."], ["Segmentos de pedido de acesso", "Segmentos limitam itens de acesso específicos a um conjunto de pessoas. Um segmento representa identidades agrupadas por atributos de identidade, e os itens de acesso adicionados a ele ficam visíveis, na Central de Pedidos, apenas para quem pertence ao segmento. Quem está em um segmento vê os itens dele e os que não pertencem a segmento algum.", "Casos de uso típicos são acessos específicos de um país ou unidade, e catálogos por tipo de público. Limites documentados: uma identidade pode estar em até 100 segmentos, e um item pode ser adicionado a até 100. Cada atributo aceita um valor por segmento: para uma comparação do tipo OU, crie dois segmentos."], ["Testar a gestão de acesso", "Teste os lembretes em um pedido real de teste, conferindo quando as mensagens chegam. Teste os segmentos entrando, ou simulando, a visão de uma pessoa de cada público e conferindo o que aparece. Teste o escalonamento com um aprovador ausente e confirme quem recebe o pedido."]],
  mec: { t: "Como configurar lembretes, escalonamento e segmentos", p: [["Definir prazos realistas", "Escolha o início e a frequência dos lembretes e o prazo do escalonamento conforme a urgência dos acessos."], ["Escolher a reserva", "Defina o aprovador de reserva com cuidado, evitando que o solicitante revise o próprio pedido."], ["Aplicar por item quando necessário", "Use configuração por item de acesso para acessos críticos."], ["Montar segmentos por atributo", "Agrupe identidades por atributos e adicione os itens que só aquele público deve ver."], ["Validar com a visão do público", "Confira o que cada grupo vê na Central de Pedidos."]] },
  caso: { t: "Caso (fictício): o catálogo que mostrava tudo a todos", p: ["Em uma empresa com operações em três países, a Central de Pedidos mostrava acessos de todos os países a qualquer pessoa. Colaboradores pediam, por engano, acessos que não eram da sua operação, e os aprovadores precisavam recusá-los.", "A equipe criou um segmento por país, com base no atributo de país, e moveu os itens específicos para os segmentos. Os pedidos equivocados caíram, e o tempo dos aprovadores foi para o que realmente importava."], l: "Segmentos reduzem erros de pedido ao mostrar a cada público apenas os itens que fazem sentido para ele." },
  av: [["Quando não usar segmentos", "Segmentos controlam o que aparece para pedir. Eles não substituem a aprovação nem a separação de funções: um item visível ainda passa pela política de aprovação."]],
  mitos: [["Por padrão, o ISC envia lembretes de aprovações pendentes.", "Por padrão, nenhum lembrete ou escalonamento é enviado."], ["Segmentos controlam o que administradores podem ver.", "Segmentos de pedido de acesso controlam quais itens cada público vê para pedir."], ["Mudar a configuração de lembretes atualiza os pedidos em andamento.", "As mudanças só afetam pedidos criados depois."]],
  ref: [R("remindersDoc", "Hierarquia de configuração e padrão de escalonamento."), R("segmentsDoc", "Criação, regras e limites dos segmentos."), R("cfgApRoles", "Parâmetros de lembretes em roles e access profiles."), R("gEng", "Domínio 3 do blueprint."), R("saltzer", "Aceitabilidade psicológica e separação de privilégio.")],
  cp: [["Um administrador novo assume que lembretes já são enviados.", "Por padrão, nenhum é enviado", "Sempre são enviados", "São enviados só às segundas", "É preciso configurar."], ["Um acesso deve aparecer só para pessoas de um país.", "Um segmento por atributo de país", "Um flat file", "Uma política SoD", "Segmentos limitam o que cada público vê para pedir."], ["O aprovador de reserva é o próprio solicitante.", "Ele pode acabar revisando o próprio pedido", "Isso é recomendado", "O pedido some", "A documentação alerta para esse risco."]]
};
DEEP["sp-eng-4"] = {
  ctx: ["O VA é um componente de infraestrutura, e o engenheiro responde por onde ele fica, quantos existem, como se conectam e como se observa a saúde. Decisões ruins aqui só aparecem quando há falhas.", "Para conhecer o básico, comece pelo módulo equivalente do Administrator. Aqui o foco é implantação, alta disponibilidade e operação."],
  teo: [["Arquitetura: conexões de saída e fila de ações", "O VA é uma imagem de disco virtual, implantada na sua infraestrutura e gerenciada pela SailPoint. A SailPoint não se conecta ao VA: cada VA faz chamadas contínuas somente de saída para consultar a fila do cluster (agregações, provisionamento), instalar correções e atualizar imagens. É um padrão de conectividade híbrida em que a conexão parte de dentro, o que reduz a superfície de ataque."], ["Alta disponibilidade e recuperação de desastres", "A SailPoint recomenda fortemente pelo menos dois VAs por cluster, para alta disponibilidade e balanceamento de carga. Distribuir VAs em locais diferentes melhora a recuperação de desastres, ao custo de mais gestão. O painel alerta quando há apenas um VA no cluster.", "Vale distinguir alta disponibilidade (continuar funcionando quando um componente falha) de recuperação de desastres (retomar após perda de um local inteiro): a primeira se resolve com VAs redundantes; a segunda exige planejar o que acontece se um datacenter inteiro ficar indisponível."], ["Variações de rede e segurança de credenciais", "Há o VA com proxy HTTP, que usa um serviço de proxy pré-configurado, e o VA com túnel de rede, recomendado quando o firewall exige permitir o tráfego de saída por lista, mas não aceita entradas por nome de domínio. A SailPoint descreve ainda uma proteção chamada criptografia de conhecimento zero (Zero Knowledge Encryption): as credenciais são criptografadas no VA de modo que a própria SailPoint não consegue decifrá-las."], ["Operação: monitorar, registrar e reiniciar", "O ISC mostra o estado de cada cluster e de cada VA, envia e-mails de alerta e permite reiniciar o cluster. A SailPoint suporta exportar métricas e registros para ferramentas de monitoramento de terceiros. Antes de configurar, a recomendação é tirar um instantâneo do VA, e removê-lo quando o VA estiver integrado ao cluster."]],
  mec: { t: "Como implantar um cluster de VAs", p: [["Dimensionar e escolher o local", "Defina a quantidade (no mínimo dois) e posicione na rede que alcança as sources."], ["Liberar a saída de rede", "Garanta saída para os endpoints exigidos, DNS e horário sincronizado; escolha proxy ou túnel quando preciso."], ["Implantar e configurar", "Implante a imagem, configure e tire um instantâneo antes de integrar."], ["Integrar ao cluster e testar", "Verifique que o VA aparece saudável e teste a conectividade com uma source."], ["Monitorar", "Ative alertas por e-mail e integre métricas ao monitoramento da empresa."]] },
  caso: { t: "Caso (fictício): dois VAs, um só datacenter", p: ["Uma empresa implantou dois VAs, mas no mesmo servidor físico, achando que isso bastava para alta disponibilidade. Em uma manutenção do servidor, os dois ficaram indisponíveis, e todas as agregações pararam.", "A equipe moveu um dos VAs para outro hospedeiro e passou a incluir o VA nos planos de manutenção. Aprendeu que redundância de máquina virtual não é redundância de infraestrutura."], l: "Alta disponibilidade exige falhas independentes, e não apenas mais de uma máquina virtual." },
  av: [["Observabilidade", "Exportar métricas e registros do VA para a ferramenta de monitoramento da empresa permite criar alertas próprios e correlacionar falhas do VA com mudanças de rede."]],
  mitos: [["A SailPoint se conecta ao VA para dar comandos.", "O VA é quem faz chamadas de saída e consulta a fila do cluster."], ["Dois VAs na mesma máquina física são alta disponibilidade.", "Falhas do hospedeiro afetam os dois."], ["Instalar programas extras no VA é aceitável.", "O VA é um appliance gerenciado pela SailPoint. Consulte a documentação antes de qualquer mudança."]],
  ref: [R("vaIndex", "Imagem, conexões de saída e responsabilidades."), R("vaManage", "Monitoramento, alertas e reinício."), R("vaReady", "Dois VAs por cluster, proxy e túnel."), R("trust", "Criptografia de conhecimento zero e hospedagem."), R("nist207", "Seção 3.4.1, requisitos de rede."), R("gEng", "Domínio 4 do blueprint.")],
  cp: [["A empresa não quer abrir portas de entrada.", "O VA usa só conexões de saída", "O VA exige portas de entrada", "A SailPoint entra por VPN", "O desenho é somente de saída."], ["Dois VAs no mesmo hospedeiro.", "Ainda há ponto único de falha no hospedeiro", "É HA completa", "Não há risco", "Falhas do hospedeiro afetam ambos."], ["Um firewall não aceita regras por nome de domínio.", "Um VA com túnel de rede pode ajudar", "Remover o firewall", "Usar flat file", "Essa é a variação recomendada."]]
};
DEEP["sp-eng-5"] = {
  ctx: ["Escolher e configurar a source certa decide a qualidade de tudo o que vem depois. O engenheiro precisa saber o que cada tipo de conexão permite, como controlar o que sobe para a nuvem e como o fluxo de agregação se comporta quando algo falha.", "Aqui o foco são decisões de projeto: tipo de conector, correlação, exclusão e exposição de dados."],
  teo: [["Tipos de conexão e o que cada um permite", "Em sources com conexão direta, o provisionamento é automático. Em sources por arquivo, o ISC cria tarefas manuais para o dono da source, e o provisionamento por mudanças de estado fica manual. Também é possível desabilitar o provisionamento automático de uma source, removendo o recurso de provisionamento da lista de funcionalidades dela. Para sistemas desconectados, a integração com service desk gera tickets com o plano de provisionamento."], ["Fluxo de agregação e correlação", "A agregação otimizada, que é o padrão, recupera todos os registros e avalia mudanças. A não otimizada examina tudo e recalcula a correlação de contas e de gestores. A configuração de correlação deve ser feita antes da primeira agregação. Se a lógica de correlação mudar, é preciso uma agregação não otimizada para reavaliar contas que não tiveram mudança de dados.", "O fluxo recomendado é: criar a source e testar a conexão, definir o schema, configurar a correlação, agregar contas, agregar entitlements e agendar."], ["O que sobe para a nuvem", "O schema define quais atributos de conta a source traz. Trazer só o necessário reduz a exposição de dados pessoais, o ruído nas análises e o custo de manutenção, e é coerente com o princípio da minimização, presente em leis como a LGPD. Em fontes sensíveis, documente quais atributos sobem, para quê e por quanto tempo."], ["Exclusão de contas com trava", "Ao habilitar a exclusão de contas não detectadas, configure o limite percentual de exclusões por agregação. Se a agregação excluísse mais do que o limite, ela é cancelada. É uma proteção contra falhas de conexão que devolvem lista vazia. Em sources pequenas, o valor mínimo é uma conta."]],
  mec: { t: "Fluxo recomendado para uma source nova", p: [["Escolher o conector", "Prefira o conector nativo; use arquivo ou conector genérico quando não houver."], ["Criar e testar a conexão", "Valide credenciais, rede e permissões da conta de serviço."], ["Definir schema e correlação", "Selecione só os atributos necessários e configure a correlação antes da primeira carga."], ["Agregar e conferir", "Agregue contas e entitlements e trate as contas não correlacionadas."], ["Agendar com a trava", "Agende, configure o limite de exclusão e monitore falhas."]] },
  caso: { t: "Caso (fictício): a correlação que parecia quebrada", p: ["Após corrigir a regra de correlação de um diretório, a equipe ainda via 600 contas sem dono. Parecia que a correção não funcionara.", "Na verdade, a agregação otimizada não reavaliava a correlação das contas que não tinham mudado. Rodando uma agregação não otimizada, as contas foram correlacionadas. A equipe documentou o passo no procedimento de mudança de correlação."], l: "Após mudar a lógica de correlação, execute uma agregação não otimizada." },
  av: [["Integração com service desk", "Quando a source não tem conexão direta, o ISC pode gerar tickets. Avalie o risco de tickets repetidos causados por atributos reenviados."]],
  mitos: [["Todos os atributos devem ser trazidos por precaução.", "Traga só o necessário. Menos dados significam menos exposição."], ["Corrigir a regra de correlação reprocessa tudo sozinho.", "A agregação otimizada não reavalia o que não mudou."], ["A exclusão de contas deve ficar sempre ligada, sem limite.", "O limite evita exclusões em massa por falhas de conexão."]],
  ref: [R("loadingData", "Agregação otimizada e exclusão de contas."), R("correlation", "Configuração de correlação."), R("provIndex", "Conexão direta, tarefas manuais e service desk."), R("src", "Configuração de sources."), R("api", "API de sources."), R("lgpd", "Princípios de segurança no art. 46."), R("gEng", "Domínio 5 do blueprint.")],
  cp: [["A source é lida por arquivo.", "O provisionamento gera tarefas manuais", "O provisionamento é automático", "O ISC cria um VA", "Sem conexão direta, é manual."], ["Mudou a regra de correlação.", "Execute uma agregação não otimizada", "Aguarde a otimizada", "Apague a source", "A otimizada não reavalia o que não mudou."], ["Uma falha de conexão devolve lista vazia.", "O limite de exclusão cancela a agregação", "Todas as contas são apagadas", "O ISC duplica contas", "É a trava de segurança."]]
};
DEEP["sp-eng-6"] = {
  ctx: ["Os conhecimentos gerais do Engineer são os mesmos do Administrator, com dois acréscimos: a arquitetura de microsserviços e o uso de APIs REST. São conceitos que explicam como o ISC é construído e como se integra a ele.", "Quem entende essas bases consegue ler a documentação de qualquer produto de identidade."],
  teo: [["IGA, autenticação e autorização", "IGA reúne administração (criar e retirar acessos) e governança (decidir e comprovar). Autenticar é provar quem é; autorizar é decidir o que pode fazer. O NIST descreve níveis de garantia do autenticador, e níveis mais altos exigem mais de um fator. Federação é confiar na autenticação feita por outro, por padrões como SAML e OpenID Connect."], ["Microsserviços e multi-tenant", "A SailPoint descreve o ISC como uma plataforma multi-tenant e de microsserviços. Em microsserviços, a aplicação é dividida em serviços pequenos e independentes, que podem ser atualizados e escalados por conta própria. A SailPoint argumenta que, nessa arquitetura, problemas de código tendem a ser menores e mais isolados, e novas versões chegam de forma contínua, sem o ciclo de atualizações do cliente.", "O custo é a complexidade de operação: muitos serviços exigem monitoramento e contratos de interface bem definidos."], ["APIs REST: verbos, tokens e códigos", "Uma API REST expõe recursos por endereços (URLs) e usa verbos: GET lê, POST cria, PUT e PATCH alteram, DELETE remove. Os dados costumam vir em JSON. A autenticação da API do ISC é compatível com OAuth 2.0, com tokens JWT: o cliente pede um token ao endpoint de tokens do tenant, com credenciais de cliente ou de token pessoal, e o envia em cada chamada.", "O código de resposta importa: 2xx indica sucesso; 4xx, erro do cliente (como credencial inválida ou permissão insuficiente); 5xx, erro do servidor."]],
  mec: { t: "Como fazer uma chamada de API segura", p: [["Escolher a credencial", "Prefira um cliente OAuth com escopo mínimo para integrações."], ["Obter o token", "Solicite o token ao endpoint do tenant com credenciais de cliente."], ["Chamar com o verbo certo", "Use GET para ler e POST para criar, e envie o token no cabeçalho."], ["Ler o código de resposta", "Trate 4xx e 5xx de forma diferente."], ["Registrar e rotacionar", "Registre o uso e rotacione as credenciais."]] },
  caso: { t: "Caso (fictício): o 401 que parecia falha de rede", p: ["Uma integração começou a receber erro 401 e a equipe suspeitou da rede. O código, porém, indicava um problema de autenticação: o segredo do cliente OAuth tinha sido rotacionado sem atualizar a integração.", "Como a equipe sabia ler os códigos de resposta, foi direto à credencial, e a integração voltou em minutos."], l: "Códigos 4xx apontam para o cliente: credenciais, permissões ou formato do pedido." },
  av: [["SAML, OAuth e OpenID Connect", "SAML usa asserções assinadas e é comum em aplicações web corporativas. OAuth delega acesso a APIs, e o OpenID Connect acrescenta a identidade. Conhecer a diferença evita configurar o protocolo errado."]],
  mitos: [["PUT e POST são o mesmo verbo.", "POST cria; PUT e PATCH alteram o que já existe."], ["Microsserviços eliminam falhas.", "Eles isolam falhas, mas exigem boa observabilidade."], ["Um erro 4xx indica falha do servidor.", "Indica erro do cliente: pedido, credencial ou permissão."]],
  ref: [R("apiAuth", "Fluxos de autenticação da API."), R("apiAuthRef", "OAuth 2.0 e JWT."), R("archBlog", "Multi-tenant e microsserviços."), R("rfc6749", "OAuth 2.0."), R("oidc", "OpenID Connect."), R("saml", "SAML 2.0."), R("nist63", "Níveis de garantia."), R("gEng", "Domínio 6 do blueprint.")],
  cp: [["Uma chamada retorna 401.", "Provável problema de autenticação do cliente", "Falha do servidor", "Excesso de roles", "4xx aponta para o cliente."], ["Você precisa criar um recurso.", "POST", "GET", "DELETE", "POST cria."], ["Uma plataforma é dividida em serviços pequenos.", "Cada um pode ser atualizado e escalado sozinho", "Tudo precisa ser atualizado junto", "Não há isolamento", "É a vantagem dos microsserviços."]]
};
DEEP["sp-eng-7"] = {
  ctx: ["A plataforma é onde o engenheiro testa, integra, monitora e dá acesso. Cinco temas concentram a cobrança: testes, autenticação no gateway da API, modelo de pesquisa, e-mails e workflows.", "O fio condutor é o menor privilégio: dar a cada pessoa ou integração só o acesso que a tarefa exige."],
  teo: [["Gateway da API e tipos de token", "As chamadas à API passam por um gateway que valida o token. Os tokens são JWT. O token pessoal (PAT) é associado a um usuário e herda o nível de usuário dele (Admin, Helpdesk e assim por diante) como base de acesso; endpoints que exigem permissões de usuário exigem PAT. Já o cliente OAuth, com credenciais de cliente, não tem usuário associado e opera só com contexto de API. O fluxo de código de autorização serve para chamar a API em nome de uma pessoa."], ["Dar o acesso certo para uma tarefa", "Os níveis de usuário (Admin, Cert Admin, Helpdesk, Report Admin, Role Admin e Sub-Admin, Source Admin e Sub-Admin) são acumulativos. Para uma tarefa específica, escolha o nível mais restrito que a resolve: quem só emite relatórios não precisa de Admin. Evite combinar o Org Admin com outros níveis, e trate a permissão de gerenciar níveis como altamente sensível."], ["Workflows: ordem correta e gatilhos", "Um workflow começa com um gatilho, executa ações em sequência e termina. Os gatilhos podem ser eventos internos, como conclusão de agregação, conta correlacionada ou mudança de status de campanha, ou externos, que exigem um token gerado no gatilho. As ações incluem enviar e-mails, definir aprovações (únicas ou por quórum) e criar campanhas. A ordem lógica importa: dados de uma ação podem alimentar a seguinte."], ["Pesquisa, e-mails e monitoramento", "O modelo de pesquisa expõe campos de identidade, como o estado de ciclo de vida e a fonte autoritativa. Os e-mails precisam de remetente e modelos adequados, e o monitoramento deve alertar falhas e atrasos. Registros de atividade mostram quem fez o quê, e são o primeiro lugar para olhar em um incidente."]],
  mec: { t: "Como conceder acesso mínimo a uma integração", p: [["Descrever a tarefa", "Liste o que a integração precisa ler ou alterar."], ["Escolher o tipo de credencial", "Cliente OAuth para integrações sem usuário; PAT só quando for preciso o contexto de usuário."], ["Limitar os escopos", "Conceda apenas os escopos necessários."], ["Testar em ambiente separado", "Confirme que a integração faz só o que deve."], ["Documentar e revisar", "Registre o dono e a data de revisão da credencial."]] },
  caso: { t: "Caso (fictício): o token que fazia mais do que devia", p: ["Uma integração de relatórios usava um PAT de uma administradora com nível de Admin. Embora lesse apenas relatórios, o token herdava permissões amplas.", "Quando a equipe de segurança auditou, trocou o PAT por um cliente OAuth com escopo restrito. A integração continuou funcionando, e o risco caiu."], l: "Integrações de leitura devem ter credenciais de leitura." },
  av: [["Workflows e rastreabilidade", "Registre o dono e o objetivo de cada workflow, e monitore falhas. O que automatiza deve deixar rastro."]],
  mitos: [["O PAT é neutro: não depende de quem o criou.", "O PAT é associado a um usuário e herda o nível dele."], ["Mais níveis dão mais controle.", "Os níveis são acumulativos, e o excesso aumenta o risco."], ["Workflows não precisam de dono.", "Sem dono, falhas e mudanças ficam sem responsável."]],
  ref: [R("apiAuth", "Tipos de token e fluxos."), R("apiAuthRef", "Contexto de usuário e de API."), R("userLevels", "Níveis de usuário."), R("userMatrix", "Matriz de acesso."), R("wfTriggers", "Gatilhos de workflow."), R("searchFields", "Campos pesquisáveis."), R("gEng", "Domínio 7 do blueprint.")],
  cp: [["Uma integração só lê relatórios.", "Prefira um cliente OAuth com escopo restrito", "Use o PAT de um administrador", "Use a senha do Org Admin", "Menor privilégio."], ["Um PAT é criado por uma pessoa com nível Helpdesk.", "Herda o nível de usuário dela", "Tem sempre nível Admin", "Não tem nível", "É associado ao usuário."], ["O gatilho é externo.", "Exige um token gerado no gatilho", "Dispensa autenticação", "Usa a senha do usuário", "É assim que o sistema externo se autentica."]]
};
DEEP["sp-eng-8"] = {
  ctx: ["Uma certificação bem-sucedida começa muito antes do lançamento: com dados corretos de gestor, donos de source definidos e uma escolha clara do tipo de campanha. É o trabalho do engenheiro preparar o terreno para que o negócio consiga decidir bem.", "Este módulo mostra como as regras do produto afetam o que aparece nas campanhas, quem pode aprovar e como evitar conflitos de interesse."],
  teo: [["O que aparece (e o que não aparece) nas certificações", "A documentação explica que nem todo acesso é certificável. Roles de atribuição automática só podem ser reconhecidas. Access profiles obtidos por pedidos ou detectados nos entitlements existentes podem ser certificados; os concedidos por role ou por estado de ciclo de vida não aparecem individualmente. Entitlements só são certificados individualmente se não estiverem encapsulados em access profiles ou roles. As campanhas por dono de source incluem só itens concedidos sem role ou estado.", "Por isso, a escolha do tipo de campanha deve combinar com o que se quer revisar: quem revisa roles é diferente de quem revisa entitlements soltos."], ["Dados de apoio e preparação", "Nas certificações, por padrão, aparecem e-mail, estado de ciclo de vida e gestor da identidade, e é possível adicionar até cinco atributos. Gestores corretos, donos de source e nomes claros de acessos são pré-requisitos: sem isso, itens ficam sem revisor ou com descrições incompreensíveis."], ["Aprovadores e conflito de interesses", "As opções de aprovação incluem dono do item, dono da aplicação ou da source, gestor, grupo de governança e identidades específicas, com tipo único ou por quórum. A reatribuição de trabalho tem proteções: a prevenção de autoaprovação e a prevenção de autocertificação, que separa os acessos do revisor em outra certificação encaminhada ao gestor, ao dono da campanha ou a um administrador. Reatribuições manuais que incluam acessos do novo revisor são bloqueadas."], ["Separação de funções: quando aplicar", "Aplique SoD quando a combinação de dois acessos cria risco de fraude ou erro, como cadastrar e aprovar o mesmo pagamento. A política usa duas listas de acessos conflitantes. Quando o conflito é inevitável, defina um controle compensatório e registre a exceção."]],
  mec: { t: "Como preparar uma certificação", p: [["Definir o objetivo", "Escolha o tipo de campanha conforme o que precisa ser revisado."], ["Limpar os dados", "Corrija gestores, donos de source e descrições de acesso."], ["Configurar revisores e prazos", "Defina revisores, lembretes e escalonamentos."], ["Pré-visualizar", "Confira itens, revisores e conflitos de interesse."], ["Lançar e acompanhar", "Acompanhe o andamento, a assinatura e a remediação."]] },
  caso: { t: "Caso (fictício): a campanha sem revisor", p: ["Uma campanha por gerente gerou 120 itens sem revisor, porque o atributo de gestor estava vazio para pessoas recém-contratadas.", "A equipe cancelou o lançamento antes de começar, corrigiu a correlação de gestores e só então lançou a campanha. O tempo gasto na preparação evitou semanas de retrabalho."], l: "Itens sem revisor quase sempre apontam para dados de gestor incompletos." },
  av: [["Evidência", "Guarde configuração, escopo, decisões, Sign Offs e remediações, e registre exceções com justificativa."]],
  mitos: [["Todo acesso aparece nas certificações.", "Parte fica encapsulada em roles e estados, e roles automáticas só podem ser reconhecidas."], ["Qualquer pessoa pode receber a reatribuição.", "A reatribuição manual é bloqueada se a certificação tiver acessos do novo revisor."], ["SoD substitui a certificação.", "SoD previne combinações; a certificação revisa o que existe."]],
  ref: [R("understandCerts", "O que aparece nas certificações."), R("certsIndex", "Fluxo da certificação."), R("workReassign", "Prevenção de autoaprovação e autocertificação."), R("cfgApRoles", "Opções de aprovadores."), R("sod", "Separation of Duties."), R("pol", "Políticas SoD."), R("gEng", "Domínio 8 do blueprint.")],
  cp: [["Uma role é atribuída automaticamente.", "Na certificação só pode ser reconhecida", "Pode ser revogada normalmente", "Some da campanha", "O modelo controla a atribuição."], ["Um revisor receberia certificação com acessos dele mesmo.", "O produto separa em outra certificação", "Permite aprovar o próprio acesso", "Apaga a campanha", "A prevenção de autocertificação protege."], ["Itens sem revisor.", "Verifique os dados de gestor e dono", "Lance assim mesmo", "Troque o VA", "É causa comum."]]
};
DEEP["sp-eng-9"] = {
  ctx: ["Arquitetura é o que responde às perguntas de segurança do cliente: onde ficam os dados, quem pode ver, como são protegidos. O engenheiro precisa saber explicar o modelo multi-tenant, a criptografia e as redundâncias, e reconhecer endereços válidos para não cair em golpes.", "As fontes oficiais usadas aqui são publicações da SailPoint sobre arquitetura e o Trust Center."],
  teo: [["Multi-tenant e isolamento lógico", "Em um modelo multi-tenant, vários clientes usam a mesma infraestrutura, mas os dados de cada um são separados logicamente. A SailPoint descreve que identificadores de tenant são usados em cargas de trabalho, controles de acesso e esquemas de particionamento, tanto em bancos separados fisicamente quanto em bancos compartilhados, e que, em bancos de um único tenant, há usuário e senha de esquema próprios e criptografia transparente de dados. O objetivo é garantir que usuários só acessem registros do próprio tenant."], ["Criptografia em trânsito e em repouso", "O Trust Center da SailPoint afirma que o ISC criptografa dados em trânsito e em repouso, e descreve a criptografia de conhecimento zero (Zero Knowledge Encryption), em que credenciais são criptografadas no dispositivo e transmitidas por um canal com camada extra de criptografia. O serviço é hospedado na AWS, e a SailPoint declara certificação ISO 27001. Para o cliente, a lição é que a plataforma protege os dados, mas a configuração (acessos, credenciais, VAs) continua sendo responsabilidade compartilhada."], ["Redundâncias e continuidade", "Os componentes da plataforma são projetados com redundância, de modo que a falha de um não derrube o serviço, e a SailPoint divulga alta disponibilidade como característica do modelo multi-tenant versionless. Na parte do cliente, a redundância dos VAs é responsabilidade da organização."], ["Endereços válidos", "Os endereços do ISC seguem padrões por tenant. A API usa o formato https://{tenant}.api.identitynow.com, e o login usa https://{tenant}.login.sailpoint.com, como mostram as páginas de autenticação. Ao receber um link que se diz do ISC, confira o domínio exato antes de clicar ou de digitar credenciais, pois endereços falsos com nomes parecidos são técnica comum de phishing."]],
  mec: { t: "Como responder a um questionário de segurança", p: [["Identificar a pergunta", "Separe o que é responsabilidade do fornecedor e o que é do cliente."], ["Buscar a fonte oficial", "Consulte o Trust Center e a documentação."], ["Responder com precisão", "Cite o que a fonte afirma, sem extrapolar."], ["Indicar controles do cliente", "Liste VAs, credenciais e níveis de usuário."], ["Registrar a versão da fonte", "Anote data e endereço da fonte consultada."]] },
  caso: { t: "Caso (fictício): o e-mail com link quase igual", p: ["Um administrador recebeu um e-mail pedindo para reautenticar no ISC, com um endereço que continha o nome do tenant, mas com um domínio diferente. Ao conferir o domínio exato, percebeu que não pertencia à SailPoint.", "Ele reportou o e-mail e a equipe reforçou o treinamento. Nenhuma credencial foi digitada."], l: "Confira o domínio exato antes de digitar credenciais." },
  av: [["Limites do que a fonte afirma", "Textos de marketing e blogs descrevem a arquitetura em alto nível. Para obrigações contratuais, consulte os documentos formais do fornecedor."]],
  mitos: [["Multi-tenant significa dados misturados.", "Significa infraestrutura compartilhada com isolamento lógico por tenant."], ["Se o fornecedor criptografa, o cliente não tem responsabilidade.", "Credenciais, acessos e VAs seguem sendo do cliente."], ["Um link com o nome do tenant é necessariamente legítimo.", "O domínio exato é que importa."]],
  ref: [R("archBlog", "Isolamento de tenants e criptografia."), R("trust", "Criptografia, hospedagem e certificações."), R("apiAuth", "Formato dos endereços do tenant."), R("iso27001", "Norma de segurança da informação."), R("nist207", "Seção 3.4, ambiente e componentes."), R("gEng", "Domínio 9 do blueprint.")],
  cp: [["Vários clientes na mesma infraestrutura.", "Os dados ficam isolados logicamente por tenant", "Os dados se misturam", "Todos veem tudo", "É o modelo multi-tenant."], ["Um e-mail traz um link parecido com o do ISC.", "Confira o domínio exato", "Clique e digite a senha", "Encaminhe a todos", "Phishing explora nomes parecidos."], ["Quem opera a redundância dos VAs?", "A organização cliente", "A SailPoint sempre", "Ninguém", "VAs ficam na infraestrutura do cliente."]]
};
DEEP["sp-eng-10"] = {
  ctx: ["Transforms e regras resolvem o mesmo problema: calcular valores de atributos. A diferença está em quem pode criar, quão fácil é testar e quanto custa manter. Escolher bem é uma das habilidades mais valorizadas de um engenheiro de ISC.", "Um princípio guia a decisão: use a ferramenta menos poderosa que resolve o problema."],
  teo: [["Transforms: declarativos e administrados por API", "A documentação descreve transforms como configurações em JSON, editáveis pelas APIs de transforms do ISC. Qualquer administrador pode ver, criar, editar e excluir transforms diretamente por API, sem envolvimento da SailPoint. A estrutura básica tem nome, tipo e atributos, e a entrada pode vir de um atributo de identidade ou de conta (implícita ou explícita). Transforms simples podem ser combinados em complexos. Um transform usado em um mapeamento de identity profile não pode ser excluído enquanto estiver em uso."], ["Regras: código, revisão e poder", "As regras são implementadas com código, em geral BeanShell, uma sintaxe parecida com Java. Elas precisam seguir as diretrizes de regras da SailPoint e ser revisadas e instaladas no tenant pela SailPoint. Em compensação, podem fazer coisas que os transforms não fazem. Para calcular atributos de identidade, existe a regra de atributo de identidade (Identity Attribute rule), usada no mapeamento por fonte de dados complexa, e que recebe um contexto próprio (como log, idn, identity e oldValue), e não variáveis de um transform."], ["Regras embutidas e o utilitário da SailPoint", "Vários transforms prontos, como obter o final de uma string, gerar uma string aleatória ou obter um atributo de identidade de referência (inclusive o do gestor), são implementados por uma regra pré-existente da SailPoint, a Cloud Services Deployment Utility. Para o engenheiro, isso significa que muitas necessidades que parecem exigir código já têm um transform pronto."], ["Boas práticas de escolha e teste", "Prefira transforms. Use um bom editor de JSON, teste no mapeamento do identity profile com uma pré-visualização, versione os transforms e documente o propósito. Em regras, trate valores nulos e vazios, registre erros de forma útil e submeta cedo para revisão, porque o prazo de revisão entra no cronograma."]],
  mec: { t: "Como escolher entre transform e regra", p: [["Descrever a necessidade", "Escreva o resultado esperado e os dados de entrada."], ["Procurar um transform pronto", "Veja se há operação nativa ou combinação de transforms."], ["Prototipar e testar", "Teste com pré-visualização em algumas identidades."], ["Avaliar regra só se necessário", "Se o transform não bastar, avalie a regra, considerando a revisão."], ["Documentar e versionar", "Registre propósito, entradas e responsável."]] },
  caso: { t: "Caso (fictício): a regra que virou transform", p: ["Uma equipe estava prestes a pedir uma regra para montar o e-mail de cada pessoa a partir do nome e do sobrenome, com minúsculas e sem acentos.", "Um colega mostrou que uma combinação de transforms (juntar, converter para minúsculas e tratar caracteres) resolvia tudo. A equipe evitou a revisão da regra, entregou antes do prazo e reduziu o custo de manutenção."], l: "Antes de escrever regra, procure um transform." },
  av: [["Testes de transforms", "A própria documentação traz instruções para testar transforms no mapeamento de identity profiles. Teste casos de borda, como valores vazios e caracteres especiais."]],
  mitos: [["Regras são sempre melhores porque são mais poderosas.", "Mais poder significa mais custo de revisão, teste e manutenção."], ["Transforms exigem envolvimento da SailPoint.", "Administradores criam e editam por API sem envolvimento da SailPoint."], ["Um transform em uso pode ser excluído sem problemas.", "Excluir um transform em uso em um mapeamento gera erro."]],
  ref: [R("transformsDoc", "Transforms versus regras e boas práticas."), R("idProfiles", "Mapeamentos e pré-visualização."), R("gEng", "Domínio 10 do blueprint.")],
  cp: [["Você precisa deixar o e-mail em minúsculas.", "Um transform", "Uma regra", "Um VA", "Resolve com configuração simples."], ["Quem cria e edita transforms?", "Qualquer administrador, por API", "Só a SailPoint", "Só o Helpdesk", "Sem envolvimento da SailPoint."], ["Uma regra de atributo recebe um contexto próprio.", "Não recebe variáveis do transform", "Recebe tudo do transform", "Recebe só o oldValue", "O contexto é de regra, e não de transform."]]
};

DEEP["sp-iiq-1"] = {
  ctx: ["O IdentityIQ (IIQ) é a plataforma de governança de identidades que a própria empresa instala e administra. Por isso, quem trabalha com ele precisa entender, além das funções, o vocabulário de objetos, tarefas, workflows e regras com que ele organiza o trabalho.", "Este módulo apresenta esse vocabulário e mostra como as peças se encaixam, para que os próximos módulos fiquem mais fáceis."],
  teo: [["Objetos e o modelo de negócio", "O IIQ guarda a informação em objetos: applications (os sistemas conectados), identidades (as pessoas, com seus Identity Cubes), roles, políticas, certificações, tarefas e workflows, entre outros. Cada um tem uma função no modelo. Entender qual objeto responde a qual pergunta (quem é a pessoa? o que ela tem? o que ela deveria ter?) é o primeiro passo para configurar bem."], ["Tarefas: trabalho agendado ou sob demanda", "As tarefas (tasks) executam trabalhos específicos, sozinhas, por agendamento ou sob demanda. A documentação lista tarefas predefinidas, como Refresh Identity Cube (atualiza os cubes de todas as pessoas), Refresh Entitlement Correlation (varre os direitos e atualiza atribuições de roles), Refresh Groups (atualiza índices de grupos), Refresh Role Indexes (necessário antes de pesquisar roles) e Remove Orphan Role Requests (remove pedidos de roles que já não existem). Conhecer o nome e a função de cada tarefa ajuda a diagnosticar por que algo não foi atualizado."], ["Workflows e regras", "Um workflow é um processo com etapas e decisões, como aprovar um pedido ou notificar um dono. As regras (rules) são trechos de código, tipicamente em BeanShell, que personalizam o comportamento em pontos específicos do processo, como na agregação, na correlação ou no refresh. A diferença é de escala: tarefa é um trabalho; workflow é um processo; regra é um ajuste fino. O custo de regras é manutenção e teste, então elas devem ser usadas com moderação."], ["Componentes e responsabilidade", "Como o IIQ é instalado na empresa, ela opera a infraestrutura, o banco de dados e as atualizações. Esse é o ponto em que ele se diferencia de uma solução entregue como serviço, em que o fornecedor cuida da plataforma. A contrapartida é mais controle sobre a implantação e a personalização."]],
  mec: { t: "Como decidir entre tarefa, workflow e regra", p: [["Descrever a necessidade", "O que precisa acontecer, quando e com que dados?"], ["Verificar se é trabalho recorrente", "Se sim, provavelmente é uma tarefa agendada."], ["Verificar se há etapas e decisões", "Se há aprovações ou ramificações, use um workflow."], ["Avaliar a configuração padrão", "Tente resolver com configuração antes de escrever regra."], ["Usar regra só se necessário", "Documente, teste e versione."]] },
  caso: { t: "Caso (fictício): a role que não aparecia na pesquisa", p: ["Uma equipe criou novas roles, mas a pesquisa de roles não as encontrava. Todos suspeitaram de erro de cadastro.", "A causa era operacional: a documentação indica que a tarefa Refresh Role Indexes precisa rodar antes de pesquisar roles. Depois de executar a tarefa, as roles apareceram. A equipe a incluiu no procedimento de criação de roles."], l: "Muitos comportamentos estranhos se explicam por tarefas que ainda não rodaram." },
  av: [["Tarefas e agendamento", "Defina horários que respeitem janelas de manutenção dos sistemas e evitem concorrência entre tarefas pesadas, como refresh e agregações."]],
  mitos: [["Workflow e tarefa são a mesma coisa.", "Tarefa é um trabalho; workflow é um processo com etapas e decisões."], ["Regras resolvem melhor qualquer ajuste.", "Regras exigem manutenção e teste, e devem ser usadas com moderação."], ["O IIQ se atualiza sozinho.", "Como é instalado na empresa, ela opera a infraestrutura e as atualizações."]],
  ref: [R("iiqTasks", "Tarefas predefinidas e suas funções."), R("iiqProv", "Fluxo de provisionamento."), R("gIiq", "Domínio 1 do blueprint."), R("docs", "Documentação SailPoint.")],
  cp: [["Roles novas não aparecem na pesquisa.", "Rode a tarefa Refresh Role Indexes", "Reinstale o IIQ", "Apague as roles", "A tarefa cria os índices necessários."], ["Um processo exige três aprovações em sequência.", "Um workflow", "Uma tarefa de agregação", "Um schema", "Workflows têm etapas e decisões."], ["Quem opera a infraestrutura do IIQ?", "A própria empresa", "A SailPoint sempre", "Ninguém", "O IIQ é instalado pelo cliente."]]
};
DEEP["sp-iiq-2"] = {
  ctx: ["Uma application é o jeito do IIQ conhecer um sistema. Ela diz como falar com ele (conector), quais atributos ele expõe (schemas), como ligar suas contas às pessoas (correlação) e como carregar os dados (agregação).", "A qualidade de tudo o que o IIQ faz depende da qualidade dessa configuração inicial."],
  teo: [["Conector, schemas e atributos", "A application usa um conector adequado ao tipo de sistema, e algumas configurações dependem da escolha do conector. O schema de conta lista os atributos de cada conta e o de grupo, os atributos dos grupos (que costumam representar os direitos de acesso). Atributos têm propriedades, como se é obrigatório, se identifica a conta ou se é tratado como entitlement. Atributos marcados como entitlement são os que o IIQ trata como direitos de acesso."], ["Agregação: opções e otimização", "A tarefa de agregação carrega contas e grupos. Entre as opções documentadas estão a agregação delta, que lê só as contas que mudaram desde a última carga; a detecção de contas excluídas, com um número máximo de contas excluídas (se for ultrapassado, nenhuma conta é excluída); a opção de desabilitar a otimização de contas sem mudança, que força a leitura de todas; e a promoção de atributos gerenciados, em que valores de entitlements encontrados são promovidos ao catálogo.", "A trava da detecção de exclusões é o mesmo princípio de segurança que existe em outros produtos: um número anormal de contas ausentes sugere falha de leitura, e não exclusão real."], ["Correlação e contas sem dono", "A correlação associa cada conta a uma identidade e usa regras e atributos. Contas que não encontram a identidade ficam não correlacionadas. A tela de correlação de identidades permite a correlação manual: você seleciona contas não correlacionadas de uma application e uma identidade-alvo para mesclá-las. Cada Identity Cube é associado a uma fonte autoritativa, o que o torna a representação única da pessoa e de suas contas."], ["Rapid Setup", "O Rapid Setup é um conjunto de configurações guiadas que acelera a configuração inicial de applications e identidades. Em tarefas de refresh, algumas opções são habilitadas por eventos do Rapid Setup, o que mostra que ele envolve comportamentos específicos no processamento. Consulte a documentação da versão instalada para o conjunto exato."]],
  mec: { t: "Como colocar uma application em funcionamento", p: [["Criar a application", "Escolha o conector e informe os dados de conexão."], ["Definir os schemas", "Ajuste os schemas de conta e de grupo e marque os atributos que são entitlements."], ["Configurar a correlação", "Defina como as contas encontram as identidades."], ["Executar a agregação", "Carregue contas e grupos e confira o resultado."], ["Tratar as não correlacionadas", "Corrija a regra ou use a correlação manual para poucos casos."]] },
  caso: { t: "Caso (fictício): a agregação que não apagou nada", p: ["Uma application sofreu uma queda de rede durante a agregação e o conector devolveu poucos registros. Sem proteção, o IIQ poderia ter removido milhares de contas.", "A empresa tinha configurado o número máximo de contas excluídas. Como a quantidade detectada ultrapassou o limite, nenhuma conta foi removida. A equipe repetiu a agregação depois de restabelecer a rede."], l: "O limite de exclusões protege contra leituras incompletas." },
  av: [["Agregação delta", "A agregação delta reduz o tempo de carga em sistemas grandes. Mantenha também agregações completas periódicas para reconciliar diferenças."]],
  mitos: [["A agregação só traz contas.", "Há também a agregação de grupos, que traz os direitos de acesso."], ["Contas sem identidade devem ser sempre corrigidas à mão.", "A correlação manual serve a poucos casos. Muitos casos pedem revisar a regra."], ["Todo atributo do schema é um direito de acesso.", "Só os atributos marcados como entitlement."]],
  ref: [R("iiqAgg", "Opções de agregação, delta e detecção de exclusões."), R("iiqCorrel", "Correlação manual de identidades."), R("iiqTasks", "Tarefas predefinidas."), R("gIiq", "Domínio 2 do blueprint.")],
  cp: [["Uma agregação detecta mais exclusões que o limite.", "Nenhuma conta é excluída", "Todas são excluídas", "A application é apagada", "É a trava de segurança."], ["Você quer ler só o que mudou desde a última carga.", "A agregação delta", "A agregação completa", "O Identity Refresh", "A delta lê só mudanças."], ["Algumas contas ficaram sem identidade.", "São não correlacionadas", "São roles", "São workflows", "Faltou a correlação."]]
};
DEEP["sp-iiq-3"] = {
  ctx: ["O Identity Cube é o coração do IIQ: um registro consolidado de cada pessoa, com seus atributos, contas, direitos, roles e histórico. A tarefa que o mantém atualizado é o Identity Refresh, e conhecer suas opções é o que separa quem apenas executa de quem diagnostica.", "Aqui você aprende o que há dentro do cubo, como atributos de identidade e de conta se relacionam e quando cada opção de refresh faz sentido."],
  teo: [["O que o Identity Cube guarda", "O Identity Cube reúne informações sobre os direitos, a atividade e o contexto de negócio de uma pessoa. Como cada cubo é associado a uma fonte autoritativa, ele é a representação única da identidade e de suas contas (os links) nos sistemas. Por isso, a correlação é tão importante: uma conta fora do cubo não é governada."], ["Atributo de identidade e atributo de conta", "O atributo de conta existe em um sistema específico (o departamento no RH, por exemplo). O atributo de identidade é o valor consolidado no cubo, que pode ser calculado a partir de uma ou mais contas. A confusão entre os dois é a causa clássica de erros de mapeamento: alterar o valor no sistema de origem não altera o cubo até a próxima agregação e refresh."], ["Identity Refresh: opções que importam", "A documentação lista opções como: atualizar os entitlements de todos os links (que consome muitos recursos, pois atualiza todos os valores de todos os links), provisionar atribuições detectadas desde a última execução, atualizar as pontuações de risco e atualizar links de aplicações lógicas. Há também a atualização de papéis atribuídos e detectados, que reavalia a lógica de atribuição das business roles automáticas e compara os perfis das IT roles com os entitlements encontrados nos links. Essa opção é necessária para que conectores diretos automatizem o provisionamento de business roles atribuídas automaticamente."], ["Refresh delta e grupos", "No refresh delta, só as identidades marcadas como precisando de atualização (needsRefresh) pela agregação são processadas, e a tarefa zera a marca ao processar. É uma otimização importante em ambientes grandes, mas atenção: identidades alteradas manualmente podem não ser pegas por opções baseadas em datas. As populações e os grupos de identidades têm seus índices atualizados por uma tarefa própria, a Refresh Groups."]],
  mec: { t: "Como escolher as opções do refresh", p: [["Definir o objetivo", "Quer recalcular roles, atualizar atributos, provisionar ou atualizar risco?"], ["Escolher o escopo", "Todas as identidades ou só as alteradas (delta)."], ["Habilitar só o necessário", "Opções pesadas, como atualizar todos os links, devem ser usadas com parcimônia."], ["Agendar com cuidado", "Evite rodar junto com agregações pesadas."], ["Conferir o resultado", "Veja as identidades afetadas e as ações geradas."]] },
  caso: { t: "Caso (fictício): a role que não provisionava", p: ["Uma empresa configurou a atribuição automática de uma business role e esperava que as contas fossem criadas sozinhas. As pessoas recebiam a role, mas o acesso não chegava aos sistemas.", "A tarefa de refresh não tinha a opção de provisionar atribuições habilitada. Depois de ajustá-la, o IIQ passou a provisionar as atribuições detectadas. A equipe documentou o conjunto de opções de cada tarefa."], l: "Conhecer as opções de cada tarefa evita atribuições que nunca chegam ao destino." },
  av: [["Populações e grupos", "Populações agrupam identidades por critério e são úteis para aplicar regras, políticas e campanhas. Mantenha critérios claros e revise-os com o negócio."]],
  mitos: [["Mudar o dado no sistema de origem atualiza o cubo na hora.", "O cubo só reflete a mudança após agregação e refresh."], ["O refresh completo é sempre a melhor opção.", "É pesado, e o refresh delta costuma bastar no dia a dia."], ["Atributo de conta e de identidade são o mesmo.", "O primeiro vive no sistema; o segundo é o valor consolidado no cubo."]],
  ref: [R("iiqRefresh", "Opções do Identity Refresh e refresh delta."), R("refreshWiki", "Explicação das opções de refresh de papéis."), R("iiqCorrel", "Identity Cubes e correlação."), R("iiqTasks", "Tarefas predefinidas."), R("gIiq", "Domínio 3 do blueprint.")],
  cp: [["Alguém muda o departamento diretamente no sistema de origem.", "O cubo só reflete depois de agregação e refresh", "O cubo muda na hora", "O cubo nunca muda", "O cubo depende dessas tarefas."], ["Você quer reprocessar só quem mudou.", "O refresh delta", "O refresh de todos os links", "Apagar as identidades", "A delta usa a marca needsRefresh."], ["O IIQ precisa provisionar roles automáticas.", "Habilite a atualização de papéis e a provisão de atribuições", "Não há como", "Use só o workflow", "Essas opções são necessárias."]]
};
DEEP["sp-iiq-4"] = {
  ctx: ["Modelar acesso no IIQ é organizar o que as pessoas podem ter: o catálogo de entitlements, que descreve cada direito, e as roles, que os reúnem em funções de negócio e pacotes técnicos.", "A distinção entre business roles e IT roles é central e aparece em várias perguntas do exame."],
  teo: [["Catálogo de entitlements", "Quando a agregação traz grupos e permissões, eles entram no catálogo como atributos gerenciados. A opção de promover atributos gerenciados faz com que valores de entitlements encontrados na agregação entrem no catálogo automaticamente. No catálogo, você enriquece cada item com nome claro, descrição e dono, o que é vital para que quem aprova entenda o que está aprovando."], ["Business roles e IT roles", "A business role descreve uma função, como Analista Financeiro, e é o que o negócio entende. A IT role agrupa permissões técnicas de sistemas por meio de perfis, que definem entitlements. Uma business role pode exigir IT roles. A atribuição de business roles pode ser manual, automática por regras ou pedida, e a detecção funciona comparando os perfis de IT roles com os entitlements encontrados nas contas da pessoa."], ["Como a pessoa obtém roles", "O refresh de papéis atribuídos e detectados reavalia a lógica de atribuição das business roles automáticas e reavalia as IT roles detectadas. Isso explica por que uma pessoa pode ter uma role atribuída, uma role detectada (porque já tem os entitlements exigidos) ou as duas. As tarefas Refresh Role Indexes e Refresh Role-Entitlement Associations mantêm os índices e as associações entre roles e entitlements."], ["Boas práticas do modelo", "Evite roles demais. Dê dono e descrição a cada role. Separe, na medida do possível, a função de negócio das permissões técnicas, para que mudanças técnicas não obriguem a rever o modelo de negócio. E use os dados reais de acesso, com ferramentas de análise, para validar o modelo."]],
  mec: { t: "Como construir o modelo de roles", p: [["Enriquecer o catálogo", "Dê nome, descrição e dono aos entitlements mais importantes."], ["Criar as IT roles", "Agrupe permissões técnicas por sistema ou função técnica."], ["Criar as business roles", "Descreva funções do negócio e associe IT roles."], ["Definir a atribuição", "Escolha manual, automática ou por pedido."], ["Rodar as tarefas de apoio", "Atualize índices, associações e refresh de papéis."]] },
  caso: { t: "Caso (fictício): GRP_FIN_01", p: ["Os aprovadores recusavam pedidos porque não entendiam o que significava o acesso GRP_FIN_01. A taxa de pedidos negados chegou a 40%.", "A equipe enriqueceu o catálogo: nome claro, descrição e dono para os 30 entitlements mais pedidos. A taxa de recusas por incompreensão caiu, e os aprovadores passaram a decidir mais rápido."], l: "Um catálogo bem descrito é a base de pedidos e aprovações de qualidade." },
  av: [["Roles detectadas", "A role detectada mostra que a pessoa já tem o que a role exige. Isso ajuda a achar acessos que existem sem terem sido pedidos e a comparar com o modelo."]],
  mitos: [["Business role e IT role são a mesma coisa.", "A primeira descreve a função; a segunda agrupa permissões técnicas."], ["Toda role é atribuída por alguém.", "Roles podem ser atribuídas, pedidas ou detectadas."], ["O catálogo se descreve sozinho.", "A agregação o preenche com valores técnicos, e as descrições precisam ser trabalhadas."]],
  ref: [R("iiqAgg", "Promoção de atributos gerenciados."), R("refreshWiki", "Reavaliação de roles atribuídas e detectadas."), R("iiqTasks", "Tarefas de índices e associações de roles."), R("rbac", "O modelo RBAC do NIST."), R("gIiq", "Domínio 4 do blueprint.")],
  cp: [["Uma pessoa tem os entitlements que a role exige, sem a role.", "A role é detectada", "A role é atribuída", "A role foi apagada", "A detecção compara perfis e entitlements."], ["'Analista Financeiro' é uma função de negócio.", "É uma business role", "É uma IT role", "É um entitlement", "Business roles descrevem funções."], ["Aprovadores não entendem um nome técnico.", "Enriqueça o catálogo com descrição e dono", "Crie mais roles", "Apague o item", "O catálogo resolve a compreensão."]]
};
DEEP["sp-iiq-5"] = {
  ctx: ["Governança, no IIQ, é o ciclo de revisar o que existe e impedir o que não deve existir. As certificações fazem a primeira parte, e as políticas, a segunda.", "O diferencial do IIQ é o detalhamento das fases e das decisões que o revisor pode tomar."],
  teo: [["Decisões de revisão", "Em uma revisão de acesso, o revisor pode aprovar, revogar ou editar o acesso, permitir uma exceção, delegar ou reatribuir. A reatribuição pode ser feita item a item ou em massa: por exemplo, quem é aprovador de uma application com milhares de identidades pode reatribuir por departamento ou por gestor. Também é possível encaminhar automaticamente todos os itens de revisão a um usuário configurado nas preferências."], ["Fases e o período de contestação", "Uma certificação passa por fases. Em certificações com revogação, o processo pode incluir períodos de contestação e de revogação. A fase de contestação é o período em que a pessoa de quem o acesso será removido pode contestar a revogação. Só depois seguem a revogação e o fim."], ["Lembretes e escalonamentos de revogação", "Quando a revogação é feita por itens de trabalho manuais atribuídos ao revogador ou ao dono da application, o IIQ pode enviar lembretes por e-mail e escalonar ao nível seguinte, como o gestor. Os lembretes podem ser enviados uma vez ou em intervalos, a partir de certo número de dias antes do fim do período de revogação. Não se aplicam quando a revogação é processada automaticamente. Os gatilhos, modelos de e-mail e regras de escalonamento fazem parte da configuração da certificação."], ["Políticas e detecção", "As políticas definem condições proibidas, como a separação de funções. A detecção ocorre quando as identidades são reavaliadas pelas tarefas, e as violações podem ser corrigidas, delegadas ou aceitas com uma exceção justificada e registrada. A autocertificação aparece como somente leitura ao revisor, como proteção contra aprovar o próprio acesso."]],
  mec: { t: "Como conduzir uma certificação no IIQ", p: [["Escolher o tipo e o gatilho", "Agendada, manual ou por evento."], ["Configurar fases e regras", "Defina contestação, revogação, lembretes e escalonamentos."], ["Acompanhar as decisões", "Veja o andamento e reatribua o que for preciso."], ["Tratar contestações", "Resolva as contestações dentro do período."], ["Remediar e concluir", "Confirme a remoção dos acessos revogados."]] },
  caso: { t: "Caso (fictício): a revogação que ninguém executava", p: ["Uma certificação revogou 80 acessos de um sistema sem conector. A revogação era manual, e os itens de trabalho ficaram parados com o dono da application.", "Depois de analisar, a equipe configurou lembretes e um escalonamento ao gestor do dono. Em duas semanas, todas as revogações foram executadas, e a empresa passou a monitorar os itens manuais pendentes."], l: "Revogações manuais precisam de lembretes e escalonamento para acontecer." },
  av: [["Exceções", "Permitir uma exceção é uma decisão formal: registre justificativa, responsável e prazo, e reveja a exceção periodicamente."]],
  mitos: [["Toda revogação é executada sozinha.", "Quando é manual, depende de itens de trabalho e de lembretes."], ["A fase de contestação é opcional para o revisor.", "É um período em que a pessoa afetada pode contestar a revogação."], ["Exceção é o mesmo que aprovação.", "É a aceitação formal de uma violação, com justificativa e registro."]],
  ref: [R("iiqCert", "Decisões de revisão e reatribuição."), R("iiqEscal", "Lembretes e escalonamentos de revogação."), R("sox", "Controles internos."), R("iso27001", "Revisão de direitos de acesso."), R("gIiq", "Domínio 5 do blueprint.")],
  cp: [["Uma pessoa quer contestar uma revogação.", "Ela usa o período de contestação", "Não há como", "Pede um novo IIQ", "A contestação existe para isso."], ["A revogação é manual e está parada.", "Lembretes e escalonamento ajudam", "Apagar a certificação", "Reiniciar o IIQ", "Aplicam-se a itens manuais."], ["Uma violação é aceita.", "É uma exceção, com justificativa e registro", "É uma aprovação sem registro", "É uma revogação", "Exceções são formais."]]
};
DEEP["sp-iiq-6"] = {
  ctx: ["Pedidos de usuários são a porta do autosserviço: a pessoa pede acesso, contas e mudanças, e o IIQ cuida de aprovar e aplicar. O controle de quem pode pedir o quê, e para quem, é feito pelos QuickLinks e suas populações.", "A experiência do usuário e o controle de acesso se encontram aqui."],
  teo: [["QuickLinks e populações", "Um QuickLink é uma ação disponível no portal, como solicitar acesso, gerenciar contas ou senhas. Cada QuickLink tem populações que definem quem pode usá-lo e para quem: apenas para si mesmo, para a equipe ou para qualquer pessoa. Isso permite que um gestor peça acesso para a sua equipe sem poder pedir para toda a empresa."], ["Tipos de pedido e o plano gerado", "Os pedidos de conta incluem criar, alterar, bloquear, desbloquear e excluir, além de redefinir senha. Quando alguém submete um pedido do Lifecycle Manager, como pedir uma business role ou desbloquear uma conta, o IIQ busca na política de provisionamento a lista de atributos necessários e inclui esses atributos e valores no plano de provisionamento."], ["O processo do pedido", "O fluxo típico é: a pessoa escolhe o item, justifica, o pedido passa pelas aprovações configuradas e, se aprovado, o IIQ provisiona. O autosserviço também abrange criar e editar identidades, conforme as permissões da população. Boas configurações equilibram facilidade (poucos cliques) e controle (aprovações onde há risco)."], ["Políticas de provisionamento como formulários", "As políticas de provisionamento são implementadas como formulários, que definem quais atributos entram nos pedidos e como os valores são fornecidos: manualmente por um usuário, por valor estático ou calculado por script ou regra. Para alguns conectores, a política de criação de conta já vem pré-definida e pode ser modificada."]],
  mec: { t: "Como liberar um autosserviço seguro", p: [["Escolher os QuickLinks", "Defina quais ações estarão disponíveis."], ["Definir as populações", "Estabeleça quem usa cada ação e para quem."], ["Configurar as políticas", "Defina os atributos exigidos nos formulários."], ["Configurar as aprovações", "Exija aprovação onde o risco justifica."], ["Testar com perfis reais", "Teste como um colaborador, um gestor e um administrador."]] },
  caso: { t: "Caso (fictício): o gestor que via demais", p: ["Gestores conseguiam pedir acesso para qualquer pessoa da empresa, e não só para a própria equipe, porque a população do QuickLink era muito ampla.", "A equipe estreitou a população para 'minha equipe' e manteve uma população separada, mais ampla, apenas para o time de suporte. Os pedidos indevidos cessaram."], l: "A população do QuickLink é o controle de escopo do autosserviço." },
  av: [["Pedidos para outras pessoas", "Pedidos feitos em nome de terceiros devem ser auditáveis: registre quem pediu, para quem e por quê."]],
  mitos: [["Todo usuário pode pedir para qualquer pessoa.", "A população do QuickLink define quem pode pedir para quem."], ["A política de provisionamento só serve para administradores.", "Ela define os atributos exigidos nos pedidos dos usuários."], ["Autosserviço dispensa aprovação.", "Aprovações são configuradas conforme o risco."]],
  ref: [R("iiqProvPol", "Políticas de provisionamento como formulários."), R("iiqProv", "Fluxo do pedido ao provisionamento."), R("saltzer", "Aceitabilidade psicológica."), R("gIiq", "Domínio 6 do blueprint.")],
  cp: [["Gestores devem pedir só para a equipe.", "A população do QuickLink controla isso", "O schema controla isso", "O refresh controla isso", "A população define quem pede para quem."], ["Um pedido do Lifecycle Manager precisa de atributos.", "A política de provisionamento fornece a lista", "O VA fornece", "O workflow não precisa", "A política define os atributos."], ["Qual é um tipo de pedido de conta?", "Criar, alterar, bloquear ou excluir", "Apenas criar", "Apenas excluir", "Há vários tipos."]]
};
DEEP["sp-iiq-7"] = {
  ctx: ["O provisionamento é a ponta final: transformar uma decisão em uma mudança no sistema. No IIQ, esse caminho é descrito com precisão em um fluxo de plano, broker e tratadores.", "Conhecer esse fluxo ajuda a achar, em cada falha, em qual etapa as coisas pararam."],
  teo: [["O fluxo do plano de provisionamento", "A documentação descreve a sequência: o pedido é feito por uma de várias ações; ele vira um plano de provisionamento; o provisioning broker avalia e compila o plano, dividindo-o, com frequência, em planos parciais, um por application; cada plano parcial vai ao tratador adequado; e as ações são confirmadas e marcadas no Identity Cube, conforme os mecanismos envolvidos."], ["Tratadores: conector ou item de trabalho", "Para conectores de leitura e escrita ou configurações de integração, a mudança é gravada no sistema de destino. Para itens de trabalho (work items), é criado um item atribuído a uma pessoa, que precisa processar manualmente o pedido no sistema. A tabela de transações de provisionamento, no console de administração, permite ver o status de todas as transações: conectores, itens manuais e operações do IIQ."], ["Políticas de provisionamento e criação de conta", "Quando um novo acesso é concedido em uma application onde a pessoa ainda não tem conta, o IIQ inclui a criação da conta no provisionamento. Para aplicações de conexão direta, a conta é criada automaticamente a partir da configuração. Se não for de conexão direta, o IIQ cria e atribui uma tarefa de provisionamento ao dono da application, com os valores a serem usados na criação manual. A SailPoint recomenda definir um perfil de criação específico para a empresa e verificar grandes mudanças antes de implantar."], ["Lifecycle Events e sincronização de atributos", "Os eventos de ciclo de vida (lifecycle events) reagem a mudanças na identidade, como entrada, mudança de área e saída, e disparam ações. A sincronização de atributos replica nas contas as mudanças de atributos da identidade, como um novo departamento. As opções de refresh, como provisionar atribuições detectadas, são o que faz parte desses processos acontecer."]],
  mec: { t: "Do pedido ao acesso no IIQ", p: [["Receber o pedido", "Pedido, certificação, atribuição de role ou evento de ciclo de vida."], ["Montar o plano", "O IIQ cria o plano de provisionamento."], ["Dividir por application", "O broker compila e particiona o plano."], ["Executar", "Conector grava no destino; item de trabalho vai para uma pessoa."], ["Confirmar", "O resultado é marcado no cubo e consultado nas transações."]] },
  caso: { t: "Caso (fictício): a conta que só existia no papel", p: ["Uma pessoa recebeu um acesso aprovado, mas a conta não existia no sistema. A equipe viu, na tabela de transações, que a transação estava em um item de trabalho pendente.", "A application não era de conexão direta, então o IIQ criara uma tarefa para o dono, que estava de férias. Depois de reatribuir, a conta foi criada. A equipe passou a revisar semanalmente os itens manuais pendentes."], l: "Itens de trabalho manuais são o ponto em que o provisionamento mais costuma travar." },
  av: [["Verificar mudanças grandes", "Alterações em políticas de provisionamento podem causar falhas. Teste com poucas identidades antes de aplicar a todas."]],
  mitos: [["Todo provisionamento é automático.", "Aplicações sem conexão direta geram itens de trabalho manuais."], ["O plano vai inteiro a um único conector.", "O broker o divide em planos parciais por application."], ["Se o pedido foi aprovado, o acesso já existe.", "É preciso que o provisionamento seja executado e confirmado."]],
  ref: [R("iiqProv", "Fluxo do plano, broker e tratadores."), R("iiqProvPol", "Políticas de provisionamento."), R("refreshWiki", "Opção de provisionar atribuições."), R("iiqTasks", "Tarefas relacionadas."), R("gIiq", "Domínio 7 do blueprint.")],
  cp: [["Um plano atinge três applications.", "O broker o divide em planos parciais", "Vai a um único conector", "É descartado", "Cada application recebe o seu."], ["A application não é de conexão direta.", "O IIQ cria um item de trabalho manual", "O IIQ cria a conta sozinho", "O IIQ ignora", "A criação é manual."], ["Onde ver o status de todas as transações?", "Na tabela de transações de provisionamento", "No schema", "No catálogo", "Ela cobre conectores e itens manuais."]]
};
